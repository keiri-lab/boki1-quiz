  {
    id: 229,
    category: "商業簿記",
    topics: ["金銭債権・デリバティブ"],
    level: "hard",
    question: "当期末（3月31日）に、貸付金{L}千円（約定利子率年5％、利払日は毎年3月31日）について当期分の利息を受け取った後、債務者の経営悪化により条件緩和を行った。緩和後の条件は、利率を年{c}％に引き下げ、元本は2年後の3月31日に一括返済とするものである。\nキャッシュ・フロー見積法（当初の約定利子率で割り引く）により、当期末の貸倒見積高を求めなさい。また、翌期末に予定どおり利息を受け取った場合（見積りの変更なし）の、翌期末の貸倒引当金の残高を求めなさい。年5％の現価係数は1年0.9524、2年0.9070とし、千円未満は四捨五入する。",
    options: ["当期末{A}千円、翌期末{A1}千円","当期末{w2}千円、翌期末{A1}千円","当期末{A}千円、翌期末{A}千円","当期末0千円、翌期末0千円"],
    answer: 1,
    input: [{"label":"当期末の貸倒見積高","value":"{A}","unit":"千円"},{"label":"翌期末の貸倒引当金","value":"{A1}","unit":"千円"}],
    explanation: "【結論】当期末の貸倒見積高 {A}千円、翌期末の貸倒引当金 {A1}千円\n【なぜ】ひとことで：元本が全部戻ってきても、利息が減れば損をしている。その損を「受け取るお金の今の価値」で測る。\n・たとえ：年5％の約束で貸したのに、2％に下げてあげたら、本来もらえた利息を失っています。元本が戻るから損はない、とは言えません。\n・だから：これから受け取るお金（利息と元本）を、当初の約束の利率5％で今の価値に直します。帳簿の金額との差が、貸倒見積高です。\n・翌期：受け取りが1年近づくと、今の価値は増えます。その分だけ、貸倒引当金は小さくなります。\n図：帯｜貸付金の帳簿価額：受け取るお金の今の価値={PV:raw}@c、貸倒見積高={A:raw}@d\n【手順】\n・受け取るCF：1年後{I}千円（利息）、2年後{L + I}千円（元本＋利息）\n・現在価値＝{I}×0.9524＋{L + I}×0.9070＝{I * 0.9524 + (L + I) * 0.907:f2} → {PV}千円\n・当期末の貸倒見積高＝{L}－{PV}＝{A}千円\n・翌期末：残りは1年後の{L + I}千円だけ → 現在価値＝{L + I}×0.9524＝{(L + I) * 0.9524:f2} → {PV1}千円 → 貸倒引当金＝{L}－{PV1}＝{A1}千円\n時の経過で現在価値が増える分（{dif}千円）は、翌期に貸倒引当金の戻入（または受取利息）として処理します。\n【つまずき】{w2}千円は、1年後の利息まで2年の係数で割り引いた誤りです。「元本が全額戻るから貸倒れはない（0千円）」とするのも誤りで、利率の引下げによる損失を貸倒見積高に含めるのがこの方法の特徴です。\n【実務】診療報酬以外の貸付金・未収金で、分割返済に条件を緩めたときの評価で効きます。根拠：金融商品に関する会計基準（企業会計基準第10号）。",
    vary: {"vars":{"L":[10000,2000,50000,1000],"c":[2,1,3,1]},"calc":{"I":"L * c / 100","PV":"round(L * c / 100 * 0.9524 + (L + L * c / 100) * 0.907)","A":"L - PV","PV1":"round((L + L * c / 100) * 0.9524)","A1":"L - PV1","w2":"L - round((2 * L * c / 100 + L) * 0.907)","dif":"A - A1"},"when":"A1 > 0 && w2 != A && A1 != A && abs(L * c / 100 * 0.9524 + (L + L * c / 100) * 0.907 - floor(L * c / 100 * 0.9524 + (L + L * c / 100) * 0.907) - 0.5) > 0.01 && abs((L + L * c / 100) * 0.9524 - floor((L + L * c / 100) * 0.9524) - 0.5) > 0.01"},
  },

    input: [{"label":"償却額（有価証券利息）","value":"{am}","unit":"千円"},{"label":"その他有価証券評価差額金","value":"{abs(dm)}","unit":"千円","choice":["貸方（評価差益）","借方（評価差損）"],"choiceAnswer":"{if(dm > 0, 1, 2)}"}],
    explanation: "【結論】償却額 {am}千円、評価差額金 {abs(dm)}千円の{?dm > 0|貸方（評価差益）|借方（評価差損）}\n【なぜ】ひとことで：その他有価証券の債券は「まず償却原価法で利息を計上」し、その後「償却した後の金額」と時価を比べる。順番を逆にしない。\n・償却原価法：額面より安く買った差額は利息の一部なので、持っている月数に応じて利息にし、帳簿の金額を上げます。\n・時価評価：その他有価証券なので、期末は時価にします。比べる相手は、償却で上げた後の帳簿の金額です。\n・困ること：取得価額と時価を直接比べると、利息として計上した分を、評価差額にもう一度数えてしまいます。\n図：帯｜{?dm > 0|期末の時価：取得価額={Pr:raw}@b、償却額（利息）={am:raw}@c、評価差益={dm:raw}@a|償却後の帳簿価額：期末の時価={MV:raw}@b、評価差損={-dm:raw}@d}｜注：評価差額は、償却した後の帳簿価額{AC}千円と時価の差\n【手順】\n・償却額＝({F}－{Pr})×{mo}か月/60か月＝{am}千円\n・償却後の帳簿価額＝{Pr}＋{am}＝{AC}千円\n・評価差額＝時価{MV}－{AC}＝{dm:▲}千円 → {?dm > 0|貸方（評価差益）|借方（評価差損）}\n【つまずき】{abs(wD)}千円は、時価と取得価額{Pr}千円を比べた誤りで、償却額を二重に数えることになります。月割を忘れて12か月分償却すると、償却額は{am12}千円になります。\n【実務】余裕資金で保有する債券（国債・地方債など）の決算処理で効きます。根拠：金融商品に関する会計基準（企業会計基準第10号）、金融商品会計に関する実務指針。",
    vary: {"vars":{"F":[10000,5000,50000,1000],"dP":[300,100,1000,50],"M":[10,4,12,1],"dm":[70,-300,300,10]},"calc":{"Pr":"F - dP","mo":"16 - M","am":"dP * (16 - M) / 60","AC":"F - dP + dP * (16 - M) / 60","MV":"F - dP + dP * (16 - M) / 60 + dm","wD":"dm + dP * (16 - M) / 60","am12":"dP * 12 / 60"},"when":"isInt(am) && isInt(am12) && am > 0 && dm != 0 && wD != 0 && am12 != am && dm + am - am12 != 0 && abs(dm) * 20 <= F && abs(wD) != abs(dm)"},
  },

    explanation: "【結論】有価証券利息 {int}円、為替{?g > 0|差益|差損} {abs(g)}円\n【なぜ】ひとことで：外貨建ての債券は「利息」と「為替の動き」を分けて計算する。利息は期中平均の相場、残高は決算日の相場で円にし、残った差が為替差損益。\n・利息（償却額）：額面との差はドルで1年かけて少しずつ増える利息なので、期中平均の相場で円にします。\n・期末残高：満期保有目的の債券はお金で返ってくる資産なので、決算日の相場で円にします。\n・為替差損益：円で積み上げた帳簿の金額（取得時の円＋利息の円）と、期末の円の金額との差です。\n【手順】\n・償却額＝({F}－{P})÷{n}年＝{am}ドル → 有価証券利息＝{am}ドル×@{AR}円＝{int}円\n・期末の貸借対照表価額＝({P}＋{am})ドル×@{CR}円＝{BS}円\n・換算前の円の帳簿価額＝{P}ドル×@{HR}円＋{int}円＝{base}円\n・為替差損益＝{BS}－{base}＝{g:▲}円（為替{?g > 0|差益|差損}）\n【つまずき】有価証券利息を決算日の相場で換算すると、利息は{w1i}円、為替差損益は{abs(w1g)}円になります（償却額を期中平均相場で換算する点が抜けています）。{abs(w3g)}円は、償却額まで取得時の相場で換算したとみなして差額を取った誤りです。\n【実務】外貨建の資金運用や、海外の医療機器メーカーとの取引で、換算差額と利息を分けて把握する場面で効きます。根拠：外貨建取引等会計処理基準、金融商品会計に関する実務指針。",
    vary: {"vars":{"F":[10000,5000,50000,1000],"dP":[400,100,2000,100],"n":[4,2,5,1],"HR":[110,100,150,1],"dA":[2,-8,8,1],"dC":[5,-15,15,1]},"calc":{"P":"F - dP","am":"dP / n","AR":"HR + dA","CR":"HR + dC","int":"dP / n * (HR + dA)","BS":"(F - dP + dP / n) * (HR + dC)","base":"(F - dP) * HR + dP / n * (HR + dA)","g":"(F - dP + dP / n) * (HR + dC) - (F - dP) * HR - dP / n * (HR + dA)","w1i":"dP / n * (HR + dC)","w1g":"dC * (F - dP)","w3g":"dC * (F - dP + dP / n)"},"when":"isInt(am) && dC != 0 && dA != 0 && (dA > 0) == (dC > 0) && abs(dA) < abs(dC) && g != 0 && w1g != g && w3g != g && w1g != w3g"},

    explanation: "【結論】問1（借）退職給付費用 {cost}／（貸）退職給付引当金 {cost}　問2（借）退職給付引当金 {Cn}／（貸）現金預金 {Cn}　問3 退職給付引当金 {B1}千円\n【なぜ】ひとことで：退職給付引当金は「費用で増え、掛金の拠出で減る」箱。掛金を払っても費用にはならない（引当金を減らすだけ）。\n・費用で増える：退職給付費用＝勤務費用＋利息費用－期待運用収益＋差異の費用処理額。\n・掛金で減る：会社が年金基金にお金を出すと、約束（債務）に対して積み立てが進むので、会社が抱える不足（引当金）が減ります。\n・期首の箱の中身：個別では未認識の差異を出さないので、期首の引当金＝債務－年金資産－未認識の不利差異＝{B0}千円です。\n図：T｜退職給付引当金｜借：掛金の拠出={Cn:raw}、期末残高={B1:raw}｜貸：期首残高={B0:raw}、退職給付費用={cost:raw}\n【手順】\n・利息費用＝{PBO}×{d}％＝{ic}千円、期待運用収益＝{A}×{e}％＝{er}千円、差異の費用処理額＝{U}÷10年＝{am}千円\n・問1：退職給付費用＝{SC}＋{ic}－{er}＋{am}＝{cost}千円\n・問2：拠出額{Cn}千円で引当金を減らす\n・問3：期首{B0}＋{cost}－{Cn}＝{B1}千円\n【つまずき】{w1}千円は差異の費用処理を忘れた誤り、期首の引当金を{PBO - A}千円（未認識の差異を引かない）にするのは連結の「退職給付に係る負債」の考え方です。掛金を「退職給付費用」で処理しないこと（費用の二重計上になります）。\n【実務】病院の決算で、年金数理人の計算結果から退職給付費用と引当金を組み立てる場面そのものです。根拠：退職給付に関する会計基準（企業会計基準第26号）。",
    vary: {"vars":{"PBO":[50000,20000,100000,1000],"A":[30000,10000,90000,1000],"U":[2000,500,5000,500],"SC":[3000,1000,8000,100],"d":[1,0.5,2,0.5],"e":[2,1,4,0.5],"Cn":[2500,500,6000,100]},"calc":{"ic":"PBO * d / 100","er":"A * e / 100","am":"U / 10","cost":"SC + PBO * d / 100 - A * e / 100 + U / 10","B0":"PBO - A - U","B1":"PBO - A - U + SC + PBO * d / 100 - A * e / 100 + U / 10 - Cn","w1":"SC + PBO * d / 100 - A * e / 100","wB":"PBO - A + SC + PBO * d / 100 - A * e / 100 + U / 10 - Cn","wC2":"SC + PBO * d / 100 - A * e / 100 + U"},"when":"isInt(ic) && isInt(er) && isInt(am) && A < PBO && U * 4 < PBO - A && w1 > 0 && B1 > 0 && Cn <= cost * 2"},
  },
  {
    id: 233,
    category: "会計学",
    topics: ["純資産・株式"],
    level: "hard",
    question: "株主総会で、その他利益剰余金（繰越利益剰余金）を財源とする配当{D1}千円と、その他資本剰余金を財源とする配当{D2}千円を決議した。決議時の資本金は{C}千円、資本準備金は{Rc}千円、利益準備金は{Rl}千円である。会社法の規定による準備金の積立てを含めて、決議時の仕訳をしなさい。",
    options: ["利益準備金{rl}千円、資本準備金{rc}千円","利益準備金{wl}千円、資本準備金{wc}千円","利益準備金{req}千円、資本準備金0千円","利益準備金{rc}千円、資本準備金{rl}千円"],
    answer: 1,
    journal: {"accounts":["繰越利益剰余金","その他資本剰余金","未払配当金","利益準備金","資本準備金","資本金"],"entries":[{"label":"配当の決議","dr":[["繰越利益剰余金","{D1 + rl}"],["その他資本剰余金","{D2 + rc}"]],"cr":[["未払配当金","{D1 + D2}"],["利益準備金","{rl}"],["資本準備金","{rc}"]]}]},
    explanation: "【結論】（借）繰越利益剰余金 {D1 + rl}・その他資本剰余金 {D2 + rc}／（貸）未払配当金 {D1 + D2}・利益準備金 {rl}・資本準備金 {rc}\n【なぜ】ひとことで：配当で会社のお金が外に出るので、債権者を守るため、配当の10分の1を「準備金」として社内に残しておく。ただし、準備金が資本金の4分の1までたまったら、それ以上は要らない。\n・たとえ：借金の返済を待ってもらっている人から見ると、株主にお金を配りすぎる会社は心配です。そこで「配当するなら少しは取っておく」という決まりがあります。\n・上限：資本準備金＋利益準備金が資本金の4分の1（{C / 4}千円）に達するまでです。今の残りの枠は{room}千円しかないので、10分の1（{ten}千円）より少なくなります。\n・振り分け：利益から配当した分は利益準備金に、資本から配当した分は資本準備金に、配当額の割合で振り分けます。準備金を積むと、その分だけ財源の剰余金も減ります。\n【手順】\n・積立限度＝{C}×1/4－({Rc}＋{Rl})＝{room}千円\n・配当額の10分の1＝({D1}＋{D2})×1/10＝{ten}千円 → 小さい方の{req}千円を積み立てる\n・利益準備金＝{req}×{D1}/({D1}＋{D2})＝{rl}千円、資本準備金＝{req}×{D2}/({D1}＋{D2})＝{rc}千円\n・繰越利益剰余金の減少＝{D1}＋{rl}＝{D1 + rl}千円、その他資本剰余金の減少＝{D2}＋{rc}＝{D2 + rc}千円\n【つまずき】利益準備金{wl}千円・資本準備金{wc}千円は、資本金の4分の1の上限を考えなかった誤りです。準備金の分だけ、借方の剰余金も増える（配当額だけではない）ことに注意します。\n【実務】決算後の配当案と、純資産の部の内訳（準備金の積立）を決める場面で効きます。根拠：会社法第445条第4項、会社計算規則第22条。",
    vary: {"vars":{"C":[100000,50000,300000,10000],"Rc":[15000,5000,40000,1000],"Rl":[8800,1000,30000,100],"D1":[12000,2000,40000,1000],"D2":[3000,1000,20000,1000]},"calc":{"room":"C / 4 - Rc - Rl","ten":"(D1 + D2) / 10","req":"min((D1 + D2) / 10, C / 4 - Rc - Rl)","rl":"min((D1 + D2) / 10, C / 4 - Rc - Rl) * D1 / (D1 + D2)","rc":"min((D1 + D2) / 10, C / 4 - Rc - Rl) * D2 / (D1 + D2)","wl":"D1 / 10","wc":"D2 / 10"},"when":"isInt(C / 4) && room > 0 && room < ten && isInt(ten) && isInt(rl) && isInt(rc) && isInt(wl) && isInt(wc) && rl != rc && rc > 0"},
  },
  {
    id: 234,
    category: "商業簿記",
    topics: ["連結・持分法・本支店","税効果会計"],
    level: "hard",
    question: "P社は前期末にS社の発行済株式の{p}％を{cost}千円で取得し、S社を子会社とした。前期末のS社の資本金は{Sc}千円、利益剰余金は{Sr}千円であり、S社の土地に{Lv}千円の評価益があった（時価評価にともなう税効果を認識する。法定実効税率30％）。のれんは発生の翌期から10年で均等償却する。当期のS社の当期純利益は{NI}千円、配当金は{Dv}千円である。当期の連結財務諸表における、のれん償却額と、当期末の非支配株主持分を求めなさい。",
    options: ["のれん償却額{am}千円、非支配株主持分{NCI}千円","のれん償却額{wAm}千円、非支配株主持分{wN1}千円","のれん償却額{am}千円、非支配株主持分{wN2}千円","のれん償却額{am}千円、非支配株主持分{wN3}千円"],
    answer: 1,
    input: [{"label":"のれん償却額","value":"{am}","unit":"千円"},{"label":"期末の非支配株主持分","value":"{NCI}","unit":"千円"}],
    explanation: "【結論】のれん償却額 {am}千円、期末の非支配株主持分 {NCI}千円\n【なぜ】ひとことで：子会社の資本は「支配を手に入れた日の時価（税金分を除く）」で数え直し、その後の利益と配当で増減させる。非支配株主持分は、その資本の非支配株主の割合。\n・時価評価：土地の値上がり分{Lv}千円のうち、将来の税金（30％）を除いた{Lnet}千円だけが、子会社の資本の増加です。\n・のれん：払った額と、時価の資本のうち親会社の持分との差。翌期から10年で償却します。\n・非支配株主持分：子会社の資本は、その後の利益で増え、配当で減ります。当期末の資本に、非支配株主の割合を掛けます。\n図：帯｜S社の時価の資本（支配獲得時）：資本金={Sc:raw}@b、利益剰余金={Sr:raw}@b、評価差額（税効果後）={Lnet:raw}@a\n【手順】\n・評価差額（税効果後）＝{Lv}×(1－30％)＝{Lnet}千円\n・支配獲得時の資本＝{Sc}＋{Sr}＋{Lnet}＝{NA0}千円\n・のれん＝{cost}－{NA0}×{p}％＝{gw}千円 → 償却額＝{gw}÷10年＝{am}千円\n・期末の非支配株主持分＝({NA0}＋{NI}－{Dv})×{100 - p}％＝{NCI}千円\n【つまずき】評価差額の税効果を忘れると、のれん償却額{wAm}千円・非支配株主持分{wN1}千円になります。{wN2}千円は配当による減少を忘れた誤り、{wN3}千円は支配獲得時のままにした誤りです。\n【実務】医療法人グループや関連会社を含む決算で、子会社の資本を時価で取り込む場面の基本形です。根拠：連結財務諸表に関する会計基準（企業会計基準第22号）、企業結合に関する会計基準（企業会計基準第21号）。",
    vary: {"vars":{"Sc":[50000,20000,100000,1000],"Sr":[20000,5000,60000,1000],"Lv":[5000,1000,10000,1000],"p":[70,60,90,10],"gw":[8550,1000,20000,10],"NI":[8000,2000,20000,1000],"Dv":[3000,1000,8000,1000]},"calc":{"Lnet":"Lv * 7 / 10","NA0":"Sc + Sr + Lv * 7 / 10","cost":"(Sc + Sr + Lv * 7 / 10) * p / 100 + gw","am":"gw / 10","NCI":"(Sc + Sr + Lv * 7 / 10 + NI - Dv) * (100 - p) / 100","wAm":"(gw + Lv * 3 / 10 * p / 100) / 10","wN1":"(Sc + Sr + Lv + NI - Dv) * (100 - p) / 100","wN2":"(Sc + Sr + Lv * 7 / 10 + NI) * (100 - p) / 100","wN3":"(Sc + Sr + Lv * 7 / 10) * (100 - p) / 100"},"when":"isInt(Lnet) && isInt(cost) && isInt(am) && isInt(NCI) && isInt(wAm) && isInt(wN1) && isInt(wN2) && isInt(wN3) && Dv < NI && gw * 5 <= cost"},
  },
  {
    id: 235,
    category: "会計学",
    topics: ["税効果会計"],
    level: "hard",
    question: "当社の将来減算一時差異は次のとおりである（単位：千円）。\n・貸倒引当金の損金算入限度超過額：期首{a0}、期末{a1}\n・減価償却の償却限度超過額：期首{b0}、期末{b1}\n・その他有価証券の評価差損（全部純資産直入法）：期首なし、期末{s}\n法定実効税率は{t}％（前期から変更なし）、繰延税金資産の回収可能性に問題はない。\n問1 期末のその他有価証券の時価評価の仕訳（税効果を含む）をしなさい（勘定は投資有価証券を使う）。\n問2 当期の法人税等調整額を求めなさい。\n問3 当期末の繰延税金資産を求めなさい。",
    options: ["法人税等調整額{abs(adj)}千円（{?adj > 0|法人税等を減らす（貸方）|法人税等を増やす（借方）}）、繰延税金資産{DTA}千円","法人税等調整額{abs(wAdj)}千円（{?wAdj > 0|法人税等を減らす（貸方）|法人税等を増やす（借方）}）、繰延税金資産{DTA}千円","法人税等調整額{abs(adj)}千円（{?adj > 0|法人税等を減らす（貸方）|法人税等を増やす（借方）}）、繰延税金資産{wDTA}千円","法人税等調整額{abs(adj)}千円（{?adj > 0|法人税等を増やす（借方）|法人税等を減らす（貸方）}）、繰延税金資産{DTA}千円"],
    answer: 1,
    journal: {"accounts":["投資有価証券","その他有価証券評価差額金","繰延税金資産","繰延税金負債","法人税等調整額","投資有価証券評価損"],"entries":[{"label":"問1 その他有価証券の時価評価","dr":[["繰延税金資産","{s * t / 100}"],["その他有価証券評価差額金","{s * (100 - t) / 100}"]],"cr":[["投資有価証券","{s}"]]}]},
    input: [{"label":"問2 法人税等調整額","value":"{abs(adj)}","unit":"千円","choice":["法人税等を減らす（貸方）","法人税等を増やす（借方）"],"choiceAnswer":"{if(adj > 0, 1, 2)}"},{"label":"問3 期末の繰延税金資産","value":"{DTA}","unit":"千円"}],
    explanation: "【結論】問1（借）繰延税金資産 {s * t / 100}・その他有価証券評価差額金 {s * (100 - t) / 100}／（貸）投資有価証券 {s}　問2 法人税等調整額 {abs(adj)}千円（{?adj > 0|法人税等を減らす（貸方）|法人税等を増やす（借方）}）　問3 繰延税金資産 {DTA}千円\n【なぜ】ひとことで：一時差異が「損益を通って生じたか」「純資産に直接入れたか」で、税効果の相手の勘定が変わる。繰延税金資産の残高には、どちらも入る。\n・損益を通ったもの（貸倒引当金・減価償却）：会計の費用と税金の費用のずれなので、相手は法人税等調整額（税金の費用）です。\n・純資産に直接入れたもの（その他有価証券の評価差損）：そもそも損益に出ていないので、税金の費用を動かすと、損益計算書がずれます。だから、相手は評価差額金そのもの（評価差損を税金の分だけ小さくする）です。\n・だから：法人税等調整額は損益を通ったものの増減だけから計算し、期末の繰延税金資産は全部を合計します。\n図：帯｜期末の一時差異：貸倒引当金={a1:raw}@a、減価償却={b1:raw}@a、評価差損={s:raw}@b｜注：オレンジは損益を通る（相手は法人税等調整額）、灰色は純資産直入（相手は評価差額金）\n【手順】\n・問1：評価差損{s}のうち、税率{t}％分{s * t / 100}は繰延税金資産、残り{s * (100 - t) / 100}がその他有価証券評価差額金（借方）\n・損益を通った一時差異の増減＝({a1}＋{b1})－({a0}＋{b0})＝{da + db:▲}千円\n・問2：法人税等調整額＝{da + db:▲}×{t}％＝{abs(adj)}千円 → {?adj > 0|繰延税金資産が増えたので、法人税等を減らす（貸方）|繰延税金資産が減ったので、法人税等を増やす（借方）}\n・問3：期末の繰延税金資産＝({a1}＋{b1}＋{s})×{t}％＝{DTA}千円\n【つまずき】{abs(wAdj)}千円は、その他有価証券の評価差損まで法人税等調整額に含めた誤り、{wDTA}千円は評価差損に係る繰延税金資産を貸借対照表に含めなかった誤りです。\n【実務】決算で税効果のワークシートを作るとき、「損益を通じるもの」と「純資産直入のもの」を列で分ける理由がこれです。根拠：税効果会計に係る会計基準。",
    vary: {"vars":{"a0":[1000,200,5000,100],"b0":[2000,500,8000,100],"da":[500,-1000,1000,100],"db":[800,-1500,1500,100],"s":[600,100,3000,100],"t":[30,25,40,5]},"calc":{"a1":"a0 + da","b1":"b0 + db","adj":"(da + db) * t / 100","DTA":"(a0 + da + b0 + db + s) * t / 100","wAdj":"(da + db + s) * t / 100","wDTA":"(a0 + da + b0 + db) * t / 100"},"when":"a1 > 0 && b1 > 0 && da != 0 && db != 0 && da + db != 0 && isInt(adj) && isInt(DTA) && isInt(wAdj) && isInt(wDTA) && wAdj != 0 && abs(wAdj) != abs(adj)"},

    explanation: "【結論】小計 {sub}千円、営業活動によるキャッシュ・フロー {op}千円\n【なぜ】ひとことで：「小計」は本業のお金の動き。利息と固定資産の売却は本業とは別に書くので、小計の前でいったん利益から外し、小計の下で「実際にやりとりした額」を書き直す。\n・お金が動かない損益（減価償却費・引当金の増減）は戻します。\n・固定資産売却損益：売却のお金は投資活動に書くので、営業活動からは外します。\n・利息：損益計算書の金額（発生額）を外し、小計の下に実際の受取額・支払額を書きます。発生額と実際の額は、未収・未払の分だけ違います。\n図：区分｜小計より上：利益の調整、売上債権・棚卸資産・仕入債務の増減｜小計より下：*利息及び配当金の受取額、*利息の支払額、法人税等の支払額\n【手順】\n・小計＝{P}＋{D}{?dA > 0|＋|－}{abs(dA)}－{I}＋{J}{?G > 0|－|＋}{abs(G)}{?dR > 0|－|＋}{abs(dR)}{?dS > 0|－|＋}{abs(dS)}{?dP > 0|＋|－}{abs(dP)}＝{sub}千円\n・営業活動によるCF＝{sub}＋受取{Ir}－支払{Jp}－法人税等{T}＝{op}千円\n【つまずき】{wSub}千円は、受取利息・支払利息を小計の前で戻さなかった誤りです（そのまま受取額・支払額を加減すると、利息を二重に数えて{wSub + Ir - Jp - T}千円になります）。営業CFで損益計算書の{I}・{J}を使うと{op - xI + xJ}千円になりますが、記載するのは実際の受取額・支払額です。{sub - T}千円は、利息の受取・支払を記載し忘れた誤りです。\n【実務】病院のキャッシュ・フロー計算書（間接法）を作る手順そのものです。根拠：連結キャッシュ・フロー計算書等の作成基準。",

    explanation: "【結論】棚卸減耗損 {loss}円、商品評価損 {ev}円\n【なぜ】ひとことで：売価還元低価法では「値下げを反映した原価率」と「反映しない原価率」の2つを使い分ける。\n・数の不足（棚卸減耗）：帳簿の売価{E}円と実地の売価{Ea}円の差を、原価法の原価率で原価に直します（値下がりとは関係ない、単なる数の不足だからです）。\n・値下がり（商品評価損）：実際にある商品（売価{Ea}円）について、2つの原価率の差を掛けます。\n・だから：貸借対照表の商品は、実地の売価×低価法の原価率になります。\n図：帯｜期末商品（原価法の原価率で評価）：貸借対照表の商品={bs:raw}@c、商品評価損={ev:raw}@d、棚卸減耗損={loss:raw}@d\n【手順】\n・売価還元原価法の原価率＝({Bc}＋{Pc})÷({Bs}＋{Pc}＋{M}＋{U}－{Uc}－{D}＋{Dc})＝{r1}\n・低価法の原価率＝({Bc}＋{Pc})÷({Bs}＋{Pc}＋{M}＋{U}－{Uc})＝{r2}\n・棚卸減耗損＝({E}－{Ea})×{r1}＝{loss}円\n・商品評価損＝{Ea}×({r1}－{r2})＝{ev}円（貸借対照表の商品は{Ea}×{r2}＝{bs}円）\n【つまずき】{wloss}円は減耗損に低価法の原価率を使った誤り、{wev}円は評価損に帳簿上の売価{E}円を使った誤りです。減耗した商品は実在しないので、評価損は実地の売価に掛けます。\n【実務】売店や薬局部門など、品目の多い小売型の在庫を売価で管理している部署の決算で効きます。根拠：棚卸資産の評価に関する会計基準（企業会計基準第9号）第13項。",
    vary: {"vars":{"j":[1,1,3,1],"E":[160000,60000,300000,1000],"dE":[8000,1000,20000,1000]},"calc":{"Bc":"if(j == 1, 110000, if(j == 2, 96000, 140000))","Bs":"if(j == 1, 200000, if(j == 2, 150000, 200000))","Pc":"if(j == 1, 490000, if(j == 2, 480000, 700000))","M":"if(j == 1, 290000, if(j == 2, 235000, 270000))","U":"if(j == 1, 30000, if(j == 2, 40000, 50000))","Uc":"if(j == 1, 10000, if(j == 2, 5000, 20000))","D":"if(j == 1, 50000, if(j == 2, 120000, 90000))","Dc":"if(j == 1, 10000, if(j == 2, 20000, 10000))","S0":"Bs + Pc + M + U - Uc","nd":"D - Dc","r1":"(Bc + Pc) / (Bs + Pc + M + U - Uc - D + Dc)","r2":"(Bc + Pc) / (Bs + Pc + M + U - Uc)","Ea":"E - dE","loss":"dE * (Bc + Pc) / (Bs + Pc + M + U - Uc - D + Dc)","ev":"(E - dE) * (Bc + Pc) / (Bs + Pc + M + U - Uc - D + Dc) - (E - dE) * (Bc + Pc) / (Bs + Pc + M + U - Uc)","wloss":"dE * (Bc + Pc) / (Bs + Pc + M + U - Uc)","wev":"E * (Bc + Pc) / (Bs + Pc + M + U - Uc - D + Dc) - E * (Bc + Pc) / (Bs + Pc + M + U - Uc)","bs":"(E - dE) * (Bc + Pc) / (Bs + Pc + M + U - Uc)"},"when":"isInt(loss) && isInt(ev) && isInt(wloss) && isInt(wev) && isInt(bs) && E * 3 < S0 - nd && dE * 10 <= E"},

    explanation: "【結論】問1（借）{?v > 0|材料|材料消費価格差異} {abs(v)}／（貸）{?v > 0|材料消費価格差異|材料} {abs(v)}　問2（借）製造間接費 {loss}／（貸）材料 {loss}\n【なぜ】ひとことで：材料勘定の中身は「実際の単価」で記録されている。消費は予定価格で出したので、実際との差を差異として調整し、目減りも実際の単価で計算する。\n・先入先出法：月初の材料（@{c0}円）から先に使ったとみなします。だから、月末に残っているのは当月に買った材料（@{c1}円）です。\n・棚卸減耗費：月末に残っている材料の目減りなので、当月購入の単価@{c1}円で計算します（予定価格ではありません）。正常な範囲内なので製造間接費です。\n図：T｜材料｜借：月初={Q0 * c0:raw}、当月購入={Q1 * c1:raw}｜貸：予定消費額={pre:raw}、月末（帳簿）={Qb * c1:raw}｜差：消費価格差異\n【手順】\n・予定消費額＝{Q2}kg×@{p}円＝{pre}円\n・実際消費額＝{Q0}kg×@{c0}円＋{Q2 - Q0}kg×@{c1}円＝{fifo}円\n・問1：材料消費価格差異＝{pre}－{fifo}＝{v:▲}円（{?v > 0|有利差異|不利差異}）\n・問2：帳簿上の月末数量＝{Q0}＋{Q1}－{Q2}＝{Qb}kg、減耗{s}kg×@{c1}円＝{loss}円\n【つまずき】{abs(wv)}円は平均法（@{avg}円）で計算した誤り、棚卸減耗費{wloss}円は予定価格で計算した誤りです。材料勘定の残高は実際の単価で記録されているので、減耗も実際の単価で計算します。\n【実務】診療材料・医薬品を予定価格で払い出している場合の、月次の差異把握と棚卸差の処理で効きます。根拠：原価計算基準 十一。",
    vary: {"vars":{"p":[500,300,1000,10],"d0":[-20,-80,80,10],"d1":[20,-80,80,10],"Q0":[200,100,500,50],"Q1":[800,400,2000,100],"Q2":[700,300,2000,50],"s":[10,2,30,1]},"calc":{"c0":"p + d0","c1":"p + d1","Qb":"Q0 + Q1 - Q2","Qa":"Q0 + Q1 - Q2 - s","fifo":"Q0 * c0 + (Q2 - Q0) * c1","pre":"Q2 * p","v":"Q2 * p - Q0 * c0 - (Q2 - Q0) * c1","loss":"s * c1","avg":"(Q0 * c0 + Q1 * c1) / (Q0 + Q1)","wv":"Q2 * p - Q2 * (Q0 * c0 + Q1 * c1) / (Q0 + Q1)","wloss":"s * p"},"when":"Q2 > Q0 && s * 20 <= Qb && d0 != d1 && d1 != 0 && v != 0 && isInt(avg) && wv != v && wv != 0"},

    vary: {"vars":{"P0":[520000,200000,900000,20000],"R0":[250000,100000,500000,10000]},"calc":{"P":"(20 * P0 + 4 * R0) / 19","R":"R0 + (20 * P0 + 4 * R0) / 19 / 4","A":"(20 * P0 + 4 * R0) / 19 * 9 / 20 + (R0 + (20 * P0 + 4 * R0) / 19 / 4) / 2","B":"((20 * P0 + 4 * R0) / 19 + R0 + (20 * P0 + 4 * R0) / 19 / 4) * 3 / 10","dA":"P0 * 45 / 75 + R0 * 50 / 80","dB":"P0 * 30 / 75 + R0 * 30 / 80","sA":"P0 * 45 / 100 + R0 * 50 / 100 + R0 * 20 / 100 * 45 / 75 + P0 * 25 / 100 * 50 / 80","sB":"P0 * 30 / 100 + R0 * 30 / 100 + R0 * 20 / 100 * 30 / 75 + P0 * 25 / 100 * 30 / 80","nA":"P0 * 45 / 100 + R0 * 50 / 100","nB":"P0 * 30 / 100 + R0 * 30 / 100"},"when":"isInt(P) && isInt(R) && isInt(A) && isInt(B) && isInt(dA) && isInt(dB) && isInt(sA) && isInt(sB) && isInt(nA) && isInt(nB)"},

    explanation: "【結論】問1（借）製品 {FG}／（貸）仕掛品 {FG}　問2 月末仕掛品原価 {EW}円\n【なぜ】ひとことで：まず「減損の原価を誰が負担するか」を決め、次に先入先出法で月末仕掛品を評価する。\n・負担：減損は工程の50％で発生し、月末仕掛品は{Ep}％まで進んでいます。発生点を通過しているので、完成品と月末仕掛品の両方が負担します。\n・度外視法（両者負担）：減損の数量を分母から除くだけで、減損の原価が良品全体に広がります。\n・先入先出法：月末仕掛品は今月投入分だけでできているので、今月の原価と今月の換算量で評価します。\n図：区分｜完成品のみ負担：月末仕掛品が発生点を通過していない、発生点が終点｜両者負担：*月末仕掛品が発生点を通過している｜注：月末仕掛品の進捗度と、仕損・減損の発生点を比べて決める\n【手順】\n・材料費：当月投入分を (完成品のうち当月着手分{F - B}個＋月末{E}個) で按分 → 月末＝{M}×{E}/{F - B + E}＝{Em}円\n・加工費：当月の完成品換算量＝{F}－{B}×{Bp}％＋{E}×{Ep}％＝{eqk}個 → 月末＝{K}×{E * Ep / 100}/{eqk}＝{Ek}円\n・問2：月末仕掛品原価＝{Em}＋{Ek}＝{EW}円\n・問1：完成品原価＝月初{Bm + Bk}＋当月{M + K}－月末{EW}＝{FG}円\n【つまずき】月末仕掛品原価{wEW}円は、完成品だけに負担させた（減損を分母に入れた）誤りです。{aEW}円は平均法で計算した場合の金額です。月初仕掛品原価を完成品原価に含め忘れると、完成品原価が{FG - Bm - Bk}円になります。\n【実務】製造工程の歩留まりロスを製品原価にどう含めるかの判断で、院内製剤や給食の原価計算にも応用できます。根拠：原価計算基準 二七。",

    explanation: "【結論】{?d > 0|自製|購入}が年間{abs(d)}円有利\n【なぜ】ひとことで：自製と購入で「変わるもの」だけを比べる。自製をやめても消えない固定費の配賦額は入れず、自製を選ぶとあきらめる賃貸収入（機会原価）は入れる。\n・自製で増えるもの：変動製造原価、専用の検査装置の賃借料。\n・自製であきらめるもの：購入にすれば空くスペースの賃貸収入{L}円。お金は出ていきませんが、自製のコストです。\n・固定製造間接費の配賦額@{f}円：工場全体の費用で、自製をやめても総額は変わりません。\n図：帯｜自製：変動製造原価={v * Q:raw}@b、検査装置={R:raw}@a、賃貸収入をあきらめる={L:raw}@d｜購入：購入代価={buy:raw}@b\n【手順】\n・自製の関連原価＝変動費{v}×{Q}＋検査装置{R}＋機会原価（賃貸収入）{L}＝{mk}円\n・購入原価＝{p}×{Q}＝{buy}円\n・差額＝{buy}－{mk}＝{d:▲}円 → {?d > 0|自製が有利|購入が有利}\n【つまずき】賃貸収入（機会原価）を忘れると、{?wd > 0|自製が有利|購入が有利}（{abs(wd)}円）と結論が逆になります。固定費の配賦額@{f}円まで含めると、差額は{abs(fd)}円になります。\n【実務】検査・洗浄・給食などの業務を院内で続けるか外部委託するかの判断で、空いた場所や人員の使い道（機会原価）まで含めて比べる場面で効きます。",

    input: [{"label":"セールス・ミックス差異","value":"{abs(mix)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(mix > 0, 1, 2)}"},{"label":"総販売数量差異","value":"{abs(vol)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(vol > 0, 1, 2)}"}],
    explanation: "【結論】セールス・ミックス差異 {abs(mix)}円（{?mix > 0|有利差異|不利差異}）、総販売数量差異 {abs(vol)}円（{?vol > 0|有利差異|不利差異}）\n【なぜ】ひとことで：数量の違いを「売れた製品の組み合わせが変わった影響」と「全体の数量が変わった影響」に分ける。間に「全体の数量は実際、組み合わせは予算どおり」という仮の数量を置く。\n・総販売数量差異：予算の組み合わせのまま、全体の数量だけが変わったとしたら、いくら違ったか。\n・セールス・ミックス差異：全体の数量は実際のまま、組み合わせが予算と違ったことで、いくら違ったか。高い製品の割合が増えれば有利になります。\n・どちらも予算の販売価格を掛けます（価格の違いは、販売価格差異で別に測るため）。\n【手順】\n・予算の構成比＝A{qA}：B{qB}、実際の総数量＝{AT}個\n・予算構成比による実際数量：A＝{AT}×{qA}/{QT}＝{eA}個、B＝{AT}×{qB}/{QT}＝{eB}個\n・セールス・ミックス差異＝({aA}－{eA})×{pA}＋({aB}－{eB})×{pB}＝{mix:▲}円\n・総販売数量差異＝({eA}－{qA})×{pA}＋({eB}－{qB})×{pB}＝{vol:▲}円\n（2つの合計＝販売数量差異{tot:▲}円）\n【つまずき】2つの差異を取り違えないよう、「構成比が変わった影響」と「総量が変わった影響」の順に分けます。{abs(tot)}円は分解する前の販売数量差異そのものです。\n【実務】外来・入院などの患者構成の変化と、患者数そのものの増減を分けて収益の増減を説明する場面で効きます。",
    vary: {"vars":{"pA":[1000,500,3000,100],"pB":[2000,500,5000,100],"qA":[600,200,2000,10],"qB":[400,200,2000,10],"xA":[-40,-200,200,10],"xB":[80,-200,200,10]},"calc":{"aA":"qA + xA","aB":"qB + xB","QT":"qA + qB","AT":"qA + qB + xA + xB","eA":"(qA + qB + xA + xB) * qA / (qA + qB)","eB":"(qA + qB + xA + xB) * qB / (qA + qB)","mix":"(qA + xA - (qA + qB + xA + xB) * qA / (qA + qB)) * pA + (qB + xB - (qA + qB + xA + xB) * qB / (qA + qB)) * pB","vol":"((qA + qB + xA + xB) * qA / (qA + qB) - qA) * pA + ((qA + qB + xA + xB) * qB / (qA + qB) - qB) * pB","tot":"xA * pA + xB * pB"},"when":"isInt(eA) && isInt(eB) && mix != 0 && vol != 0 && xA != 0 && xB != 0 && pA != pB && abs(mix) != abs(vol) && abs(tot) != abs(mix) && qA != qB && abs(xA) * 3 <= qA && abs(xB) * 3 <= qB"},

  {
    id: 246,
    category: "原価計算",
    topics: ["戦略的原価管理"],
    level: "hard",
    question: "製造間接費（段取費{S}円、検査費{Iq}円）を、これまで直接作業時間を基準に製品に配賦していたが、活動基準原価計算（ABC）に切り替えることを検討している。\n・段取回数：製品A{sa}回、製品B{sb}回\n・検査時間：製品A{ia}時間、製品B{ib}時間\n・直接作業時間：製品A{ha}時間、製品B{hb}時間\nABCによる製品Bへの製造間接費の配賦額と、従来の方法と比べた差額を求めなさい。",
    options: ["製品B{abcB}円、{?d > 0|ABCの方が多い|ABCの方が少ない}（差額{abs(d)}円）","製品B{abcA}円、{?d > 0|ABCの方が少ない|ABCの方が多い}（差額{abs(d)}円）","製品B{abcB}円、{?d > 0|ABCの方が少ない|ABCの方が多い}（差額{abs(d)}円）","製品B{oneB}円、{?oneB > trB|ABCの方が多い|ABCの方が少ない}（差額{abs(oneB - trB)}円）"],
    answer: 1,
    input: [{"label":"ABCによる製品Bへの配賦額","value":"{abcB}","unit":"円"},{"label":"従来の方法との差額","value":"{abs(d)}","unit":"円","choice":["ABCの方が多い","ABCの方が少ない"],"choiceAnswer":"{if(d > 0, 1, 2)}"}],
    explanation: "【結論】ABCによる製品Bへの配賦額 {abcB}円、従来の方法との差額 {abs(d)}円（{?d > 0|ABCの方が多い|ABCの方が少ない}）\n【なぜ】ひとことで：従来の方法は、製造間接費を全部「作業時間」で配っていた。ABCは、段取費は段取回数、検査費は検査時間と、費用が発生する原因に合わせて配る。\n・従来の方法の弱点：作業時間が少なくても、段取りや検査に手間のかかる製品（少量多品種）に、費用が十分に配られません。\n・ABCに切り替えると、手間のかかる製品の原価は上がり、手間のかからない製品の原価は下がります。\n図：帯｜ABCによる製品B：段取費={sB:raw}@a、検査費={iB:raw}@b｜従来の方法による製品B：作業時間で配賦={trB:raw}@d\n【手順】\n・段取費（製品B）＝{S}×{sb}/({sa}＋{sb})＝{sB}円\n・検査費（製品B）＝{Iq}×{ib}/({ia}＋{ib})＝{iB}円 → ABCによる配賦額＝{abcB}円\n・従来の方法（製品B）＝{S + Iq}×{hb}/({ha}＋{hb})＝{trB}円\n・差額＝{abcB}－{trB}＝{d:▲}円（{?d > 0|ABCの方が多い。従来の方法では製品Bの原価が過小だった|ABCの方が少ない。従来の方法では製品Bの原価が過大だった}）\n【つまずき】{oneB}円は、間接費の全額を段取回数だけで配賦した誤りです。活動ごとにドライバーを使い分けるのがABCです。\n【実務】手術・検査などの間接部門費を、診療科へ「件数」や「時間」など活動の実態に合わせて配る場面で効きます。",
    vary: {"vars":{"S":[600000,200000,2000000,10000],"sa":[20,5,60,5],"sb":[60,5,60,5],"Iq":[400000,100000,1500000,10000],"ia":[300,50,800,50],"ib":[200,50,800,50],"ha":[3000,500,6000,500],"hb":[1000,500,6000,500]},"calc":{"sB":"S * sb / (sa + sb)","iB":"Iq * ib / (ia + ib)","abcB":"S * sb / (sa + sb) + Iq * ib / (ia + ib)","trB":"(S + Iq) * hb / (ha + hb)","d":"S * sb / (sa + sb) + Iq * ib / (ia + ib) - (S + Iq) * hb / (ha + hb)","abcA":"S + Iq - S * sb / (sa + sb) - Iq * ib / (ia + ib)","oneB":"(S + Iq) * sb / (sa + sb)"},"when":"isInt(sB) && isInt(iB) && isInt(trB) && isInt(oneB) && d != 0 && abs(d) * 10 >= trB && sa != sb && ha != hb && abcA != abcB && oneB != abcB && (sb > sa) != (hb > ha) && ha * 4 >= hb && hb * 4 >= ha && sa * 5 >= sb && sb * 5 >= sa && ia * 4 >= ib && ib * 4 >= ia"},
  },
  {
    id: 247,
    category: "商業簿記",
    topics: ["連結・持分法・本支店","税効果会計"],
    level: "hard",
    question: "子会社S社（P社の持分比率{p}％）はP社に対する売掛金を有しており、残高は期首{R0}千円、期末{R1}千円である（P社は同額を買掛金に計上）。S社はこの売掛金に{r}％の貸倒引当金を差額補充法で設定している。法定実効税率は{t}％で、税効果会計を適用する。連結上、期末に計上する繰延税金負債と、非支配株主に帰属する当期純利益の増減額を求めなさい。",
    options: ["繰延税金負債{dtl}千円、非支配株主{abs(nci)}千円の{?R1 - R0 > 0|増加|減少}","繰延税金負債{abs(xdtl)}千円、非支配株主{abs(nci)}千円の{?R1 - R0 > 0|増加|減少}","繰延税金負債{dtl}千円、非支配株主{abs(wnci)}千円の{?R1 - R0 > 0|増加|減少}","繰延税金負債{dtl}千円、非支配株主{abs(nci)}千円の{?R1 - R0 > 0|減少|増加}"],
    answer: 1,
    input: [{"label":"期末の繰延税金負債","value":"{dtl}","unit":"千円"},{"label":"非支配株主に帰属する当期純利益","value":"{abs(nci)}","unit":"千円","choice":["増加","減少"],"choiceAnswer":"{if(R1 > R0, 1, 2)}"}],
    explanation: "【結論】繰延税金負債 {dtl}千円、非支配株主に帰属する当期純利益 {abs(nci)}千円の{?R1 - R0 > 0|増加|減少}\n【なぜ】ひとことで：グループ内の売掛金は連結では消える。消えた売掛金に付けた貸倒引当金も不要なので取り消す。すると連結の利益が増えるので、その税金の分を繰延税金負債にする。\n・たとえ：家族に貸したお金に「返ってこないかも」と備える必要はありません。グループの中の債権に付けた引当金も同じです。\n・税金：S社は個別で引当金を費用にしています（税金の計算でも費用になったと考えます）。連結で取り消すと、連結の利益は税金の計算より大きくなるので、将来の税金を繰延税金負債にします。残高は、期末の引当金の全額に対して計上します。\n・非支配株主：引当金を付けたのはS社なので、当期の利益の増減（税効果後）を非支配株主にも負担させます。\n【手順】\n・期首（開始仕訳）：引当金{a0}千円を減額（利益剰余金・非支配株主持分で処理済み）\n・当期：引当金の増加分{a1 - a0:▲}千円の繰入を取り消す → S社の利益{?R1 > R0|増加|減少}\n・期末の繰延税金負債＝{a1}×{t}％＝{dtl}千円\n・非支配株主＝{a1 - a0:▲}×(1－{t}％)×{100 - p}％＝{nci:▲}千円\n【つまずき】{abs(xdtl)}千円は当期の増減分だけに税効果を考えた誤りで、残高は期末の引当金全体に対して計上します。{abs(wnci)}千円は税効果を考えずに按分した誤りです。\n【実務】グループ内の未収金・未払金を相殺するとき、引当金と税効果まで連動して修正する場面で効きます。根拠：連結財務諸表に関する会計基準、税効果会計に係る会計基準。",
    vary: {"vars":{"R0":[20000,5000,80000,1000],"R1":[30000,5000,80000,1000],"r":[2,1,5,0.5],"t":[30,25,35,5],"p":[80,60,90,10]},"calc":{"a0":"R0 * r / 100","a1":"R1 * r / 100","dtl":"R1 * r / 100 * t / 100","nci":"(R1 - R0) * r / 100 * (100 - t) / 100 * (100 - p) / 100","wnci":"(R1 - R0) * r / 100 * (100 - p) / 100","xdtl":"(R1 - R0) * r / 100 * t / 100"},"when":"isInt(a0) && isInt(a1) && isInt(dtl) && isInt(nci) && isInt(wnci) && isInt(xdtl) && R1 != R0 && dtl != abs(xdtl)"},
  },
  {
    id: 248,
    category: "商業簿記",
    topics: ["連結・持分法・本支店","税効果会計"],
    level: "hard",
    question: "P社（決算日3月31日）は、当期の{M}月1日に子会社S社へ機械装置（P社の帳簿価額{C}千円）を{P}千円で売却した。S社はこれを耐用年数{N}年・残存価額ゼロの定額法（月割）で償却している。法定実効税率は{t}％である。次の連結修正仕訳をしなさい。\n① 未実現利益（固定資産売却益）の消去\n② 減価償却費の修正\n③ 期末の未実現利益に係る税効果",
    options: ["減価償却費の減額{am}千円、繰延税金資産{dta}千円","減価償却費の減額{fam}千円、繰延税金資産{fdta}千円","減価償却費の減額0千円、繰延税金資産{wdta}千円","減価償却費の減額{am}千円、繰延税金資産{U}千円"],

    explanation: "【結論】①（借）固定資産売却益 {G}／（貸）機械装置 {G}　②（借）減価償却累計額 {am}／（貸）減価償却費 {am}　③（借）繰延税金資産 {dta}／（貸）法人税等調整額 {dta}\n【なぜ】ひとことで：グループ内で機械を売っても、グループ全体では機械を動かしただけ。売却益を消し、機械の値段も元の帳簿の金額に戻す。\n・売却益：P社がS社に{G}千円の利益を付けて売っても、グループの外には売れていないので、売却益を消し、機械装置も同じ額だけ減らします。\n・減価償却：S社は利益の上乗せされた値段で償却しているので、上乗せ分（{G}千円）に対応する償却費が多すぎます。多すぎる分を減らします。この減らした分だけ、売却益は使用を通じて実現したと考えます。\n・税金：まだ実現していない残り（{U}千円）には、P社が払った税金の分の繰延税金資産を計上します。\n図：帯｜未実現利益（売却益）：当期に実現（償却費の減額）={am:raw}@c、期末に残る未実現利益={U:raw}@d｜注：期末に残る分×税率＝繰延税金資産\n【手順】\n・未実現利益（売却益）＝{P}－{C}＝{G}千円を消去\n・減価償却費の減額＝{G}÷{N}年×{mo}/12＝{am}千円（この分は当期に実現）\n・期末の未実現利益＝{G}－{am}＝{U}千円 → 繰延税金資産＝{U}×{t}％＝{dta}千円\n【つまずき】月割を忘れると減額{fam}千円、減価償却による実現を考えないと繰延税金資産{wdta}千円になります。{U}千円は未実現利益そのものです。\n【実務】グループ内で医療機器や車両を移管したときの、連結上の取得原価と償却費の修正で効きます。根拠：連結財務諸表に関する会計基準、税効果会計に係る会計基準。",

    question: "P社はA社株式の30％（個別上の取得原価{C1}千円、持分法による評価額{Ec}千円）を保有し、持分法を適用していた。当期末にA社株式の50％を{C2}千円で追加取得し、A社を子会社とした（合計80％）。支配獲得日における従来保有分（30％）の時価は{Fp}千円、A社の時価純資産は{NA}千円である。連結財務諸表に計上する段階取得に係る損益と、のれんを求めなさい。",
    options: ["段階取得に係る{?dF > 0|差益|差損}{abs(dF)}千円、のれん{gw}千円","段階取得に係る{?wg > 0|差益|差損}{abs(wg)}千円、のれん{gw}千円","段階取得に係る損益なし、のれん{xgw}千円","段階取得に係る{?dF > 0|差益|差損}{abs(dF)}千円、のれん{ygw}千円"],
    answer: 1,
    input: [{"label":"段階取得に係る損益","value":"{abs(dF)}","unit":"千円","choice":["差益","差損"],"choiceAnswer":"{if(dF > 0, 1, 2)}"},{"label":"のれん","value":"{gw}","unit":"千円"}],
    explanation: "【結論】段階取得に係る{?dF > 0|差益|差損} {abs(dF)}千円、のれん {gw}千円\n【なぜ】ひとことで：関連会社を子会社にした日に、前から持っていた30％も「その日に買い直した」と考えて時価に直す。比べる相手は、持分法で積み上げた金額。\n・たとえ：持分法では、関連会社がもうけるたびに、その持分を株の金額に足してきました（持分法による評価額{Ec}千円）。その分はすでに連結の利益として計上済みです。\n・困ること：個別の取得原価{C1}千円と時価を比べると、持分法で計上済みの利益を、もう一度利益として数えてしまいます。\n・だから：段階取得に係る損益＝時価{Fp}千円－持分法による評価額{Ec}千円。のれんは、時価に直した取得原価の合計と、時価純資産の80％との差です。\n【手順】\n・段階取得に係る損益＝時価{Fp}－持分法による評価額{Ec}＝{dF:▲}千円（{?dF > 0|差益|差損}）\n・取得原価の合計＝{Fp}＋{C2}＝{Fp + C2}千円 → のれん＝{Fp + C2}－{NA}×80％＝{gw}千円\n【つまずき】個別上の取得原価{C1}千円と比べると{wg:▲}千円になります。従来分を持分法による評価額のまま足すとのれんは{xgw}千円、個別上の取得原価のまま足すと{ygw}千円です。\n【実務】関連会社への出資比率を上げて子会社化したときの、連結の損益と、のれんの算定で効きます。根拠：企業結合に関する会計基準、連結財務諸表に関する会計基準。",
    vary: {"vars":{"C1":[30000,10000,80000,1000],"k":[3000,-3000,8000,500],"dF":[3000,-3000,8000,500],"C2":[60000,20000,150000,1000],"NA":[110000,40000,250000,1000]},"calc":{"Ec":"C1 + k","Fp":"C1 + k + dF","gw":"C1 + k + dF + C2 - NA * 80 / 100","wg":"dF + k","xgw":"C1 + k + C2 - NA * 80 / 100","ygw":"C1 + C2 - NA * 80 / 100"},"when":"dF != 0 && k != 0 && isInt(NA * 80 / 100) && gw > 0 && xgw > 0 && ygw > 0 && wg != dF && wg != 0 && gw * 5 <= C1 + C2 && abs(dF) * 5 <= C1 && abs(k) * 5 <= C1 && xgw != ygw"},
  },

    question: "連結損益計算書の当期純利益は{NIc}千円（うち非支配株主に帰属する当期純利益{NIn}千円）である。当期のその他の包括利益の発生額は次のとおり（税効果前の金額）。\n・P社：その他有価証券評価差額金の増減{X1:±}千円\n・S社（P社の持分比率{p}％）：その他有価証券評価差額金の増減{X2:±}千円\n・在外子会社S社の換算による為替換算調整勘定の増減{F:±}千円（税効果の対象外）\n法定実効税率は{t}％である。連結包括利益と、そのうち非支配株主に係る包括利益を求めなさい。",

    input: [{"label":"連結包括利益","value":"{CI}","unit":"千円"},{"label":"非支配株主に係る包括利益","value":"{nci}","unit":"千円"}],
    explanation: "【結論】連結包括利益 {CI}千円、非支配株主に係る包括利益 {nci}千円\n【なぜ】ひとことで：包括利益＝当期純利益＋その他の包括利益（税金の分を引いた後）。子会社で生じた分は、子会社の利益と同じく、非支配株主にも持分で分ける。\n・その他の包括利益：まだ実現していない評価差額や換算差額です。その他有価証券の評価差額は税効果を差し引き、為替換算調整勘定は（この問題では）税効果の対象外です。\n・非支配株主への配分：非支配株主はS社の株主なので、S社で生じたもの（S社の評価差額と、在外子会社S社の換算差額）だけを{100 - p}％分ける。P社自身の評価差額は分けません。\n・連結包括利益には、非支配株主に帰属する当期純利益も含めます（当期純利益{NIc}千円は非支配株主分を含む金額）。\n【手順】\n・その他の包括利益：P社{X1:±}×(1－{t}％)＝{o1:±}、S社{X2:±}×(1－{t}％)＝{o2:±}、為替換算調整勘定{F:±}（千円）\n・連結包括利益＝{NIc}＋({o1:▲})＋({o2:▲})＋({F:▲})＝{CI}千円\n・非支配株主に係る包括利益＝{NIn}＋(S社分({o2:▲})＋為替換算調整勘定({F:▲}))×{100 - p}％＝{nci}千円\n【つまずき】{wCI}千円は税効果を差し引き忘れた誤りです。非支配株主分を当期純利益だけとすると{NIn}千円、P社のその他の包括利益まで按分すると{xnci}千円になります。\n【実務】連結包括利益計算書を作成し、親会社株主と非支配株主への配分を開示する場面で効きます。根拠：包括利益の表示に関する会計基準（企業会計基準第25号）。",
    vary: {"vars":{"NIc":[50000,10000,150000,1000],"NIn":[4000,500,15000,100],"X1":[3000,-5000,8000,100],"X2":[2000,-5000,5000,100],"F":[1500,-3000,3000,100],"t":[30,25,35,5],"p":[80,60,90,10]},"calc":{"o1":"X1 * (100 - t) / 100","o2":"X2 * (100 - t) / 100","CI":"NIc + X1 * (100 - t) / 100 + X2 * (100 - t) / 100 + F","nci":"NIn + (X2 * (100 - t) / 100 + F) * (100 - p) / 100","wCI":"NIc + X1 + X2 + F","xnci":"NIn + (X1 * (100 - t) / 100 + X2 * (100 - t) / 100 + F) * (100 - p) / 100"},"when":"isInt(o1) && isInt(o2) && isInt(nci) && isInt(xnci) && NIn * 3 < NIc && X1 != 0 && X2 != 0 && F != 0 && nci > 0 && nci != NIn && xnci != nci && CI > 0"},
  },
  {
    id: 253,
    category: "会計学",
    topics: ["表示・会計方針・CF計算書","有価証券"],
    level: "hard",
    question: "前期にその他有価証券（取得原価{C}千円）を取得し、前期末の時価は{V0}千円であった（全部純資産直入法、法定実効税率{t}％）。当期中に全部を{Sp}千円で売却した。当期の包括利益計算書における、その他有価証券評価差額金の当期発生額と組替調整額（いずれも税効果控除後）を求めなさい。",
    options: ["当期発生額{occ:▲}千円、組替調整額{rec:▲}千円","当期発生額{dv1:▲}千円、組替調整額{-(dv0 + dv1):▲}千円","当期発生額▲{abs(net)}千円、組替調整額0千円","当期発生額{-occ:▲}千円、組替調整額{-rec:▲}千円"],
    answer: 1,
    input: [{"label":"当期発生額","value":"{occ}","unit":"千円","signed":true},{"label":"組替調整額","value":"{rec}","unit":"千円","signed":true}],
    explanation: "【結論】当期発生額 {occ:▲}千円、組替調整額 {rec:▲}千円\n【なぜ】ひとことで：売却益は「何年かかけて値上がりした分」の合計。値上がりした年ごとに、その他の包括利益ですでに数えているので、売った年に当期純利益で数えた分を、その他の包括利益から引き直す（組替調整）。\n・たとえ：前期に{dv0}千円値上がりした分は、前期の包括利益ですでに数えました。当期に売ると、売却益{gain}千円の中に、その分がもう一度入ってきます。\n・困ること：そのままだと、同じ値上がりを包括利益で2回数えてしまいます。\n・だから：当期の値動き（{dv1:±}千円）を「当期発生額」に入れ、当期純利益に入った売却益の全額を「組替調整額」でマイナスします（どちらも税効果を差し引く）。\n【手順】\n・当期発生額：期首から売却時までの時価の変動＝({Sp}－{V0})×(1－{t}％)＝{occ:±}千円\n・組替調整額：当期純利益に含まれた売却益({Sp}－{C}＝{gain}千円)×(1－{t}％)＝{rec:▲}千円\n・その他の包括利益（合計）＝({occ:▲})＋({rec:▲})＝{net:▲}千円（期首の評価差額金がなくなる）\n【つまずき】税効果前の{abs(dv1)}千円・{dv0 + dv1}千円は、税効果控除後を求める問題の答えにはなりません。差引きの{abs(net)}千円だけを当期発生額とすると、組替調整額が表示されません。\n【実務】保有株式を売却した期の、包括利益計算書の注記（組替調整額）を作成する場面で効きます。根拠：包括利益の表示に関する会計基準（企業会計基準第25号）。",
    vary: {"vars":{"C":[1000,300,5000,10],"dv0":[200,50,800,10],"dv1":[100,-300,500,10],"t":[30,25,35,5]},"calc":{"V0":"C + dv0","Sp":"C + dv0 + dv1","occ":"dv1 * (100 - t) / 100","rec":"-(dv0 + dv1) * (100 - t) / 100","net":"-dv0 * (100 - t) / 100","gain":"dv0 + dv1"},"when":"dv1 != 0 && dv0 + dv1 > 0 && isInt(occ) && isInt(rec) && isInt(net) && abs(dv1) != dv0 + dv1 && abs(occ) != abs(net)"},
  },
  {
    id: 254,
    category: "商業簿記",
    topics: ["外貨換算","連結・持分法・本支店"],
    level: "hard",
    question: "P社は前期末に在外子会社S社（P社の持分比率{p}％）の支配を獲得した。支配獲得時のS社の資本金は{Cd}千ドル、利益剰余金は{Rd}千ドルで、当時の為替相場は@{HR}円である（評価差額・のれんはない）。当期のS社の当期純利益は{Nd}千ドル（期中平均相場@{AR}円で換算）で、配当はない。決算日の為替相場は@{CR}円である。当期末にS社の換算で生じる為替換算調整勘定（総額）と、連結貸借対照表に計上する為替換算調整勘定（親会社持分）を求めなさい。",
    options: ["総額{abs(tr)}千円の{?tr > 0|貸方|借方}、連結貸借対照表{abs(par)}千円","総額{abs(tr)}千円の{?tr > 0|貸方|借方}、連結貸借対照表{abs(tr)}千円","総額{abs(wtr)}千円の{?wtr > 0|貸方|借方}、連結貸借対照表{abs(wtr * p / 100)}千円","総額{abs(tr)}千円の{?tr > 0|貸方|借方}、連結貸借対照表{abs(nc)}千円"],
    answer: 1,
    input: [{"label":"為替換算調整勘定（総額）","value":"{abs(tr)}","unit":"千円","choice":["貸方","借方"],"choiceAnswer":"{if(tr > 0, 1, 2)}"},{"label":"連結貸借対照表の為替換算調整勘定","value":"{abs(par)}","unit":"千円"}],
    explanation: "【結論】為替換算調整勘定（総額） {abs(tr)}千円の{?tr > 0|貸方|借方}、連結貸借対照表 {abs(par)}千円\n【なぜ】ひとことで：子会社の純資産は決算日の相場、その元になった資本や利益は発生した日の相場で円にする。そのずれが為替換算調整勘定で、持分の割合で親と非支配株主に分ける。\n・純資産（資産－負債）：今の価値を示すので、決算日の相場で換算します。\n・資本：支配獲得時の資本は支配獲得時の相場、その後の利益は期中平均の相場で換算します（積み上がったときの円の金額）。\n・差額：子会社全体の為替の含み損益です。非支配株主も子会社の株主なので、その持分（{100 - p}％）は非支配株主持分に含め、親会社の分だけを為替換算調整勘定として表示します。\n図：帯｜為替換算調整勘定（総額）：親会社の持分={abs(par):raw}@a、非支配株主の持分={abs(nc):raw}@d\n【手順】\n・資産－負債（純資産）＝({Cd}＋{Rd}＋{Nd})千ドル×@{CR}円＝{na}千円\n・資本の換算額＝({Cd}＋{Rd})×@{HR}円＋{Nd}×@{AR}円＝{eq}千円\n・為替換算調整勘定（総額）＝{na}－{eq}＝{tr:▲}千円\n・親会社持分＝{tr:▲}×{p}％＝{par:▲}千円（非支配株主持分へ{nc:▲}千円）\n【つまずき】総額をそのまま連結貸借対照表に計上するのは誤りです（非支配株主分は非支配株主持分に含めます）。{abs(wtr)}千円は、当期純利益も支配獲得時の相場で換算したとみなした誤りです。\n【実務】海外子会社を持つグループで、為替変動が純資産に与える影響を親会社と非支配株主に分けて示す場面で効きます。根拠：外貨建取引等会計処理基準。",
    vary: {"vars":{"Cd":[1000,300,5000,100],"Rd":[500,100,3000,100],"Nd":[200,50,800,10],"HR":[100,90,150,1],"dA":[4,-6,6,1],"dC":[8,-12,12,1],"p":[80,60,90,10]},"calc":{"AR":"HR + dA","CR":"HR + dC","na":"(Cd + Rd + Nd) * (HR + dC)","eq":"(Cd + Rd) * HR + Nd * (HR + dA)","tr":"(Cd + Rd + Nd) * (HR + dC) - (Cd + Rd) * HR - Nd * (HR + dA)","par":"((Cd + Rd + Nd) * (HR + dC) - (Cd + Rd) * HR - Nd * (HR + dA)) * p / 100","wtr":"(Cd + Rd + Nd) * dC","nc":"((Cd + Rd + Nd) * (HR + dC) - (Cd + Rd) * HR - Nd * (HR + dA)) * (100 - p) / 100"},"when":"dA != 0 && dC != 0 && (dA > 0) == (dC > 0) && abs(dA) < abs(dC) && tr != 0 && isInt(par) && isInt(wtr * p / 100) && wtr != tr && abs(par) != abs(nc)"},
  },
  {
    id: 255,
    category: "会計学",
    topics: ["社債・引当金・退職給付","連結・持分法・本支店"],
    level: "hard",
    question: "連結財務諸表を作成する。数理計算上の差異は、発生の翌期から{N}年で定額法により費用処理している。前期末に発生した不利差異{Uo}千円は、当期から費用処理を始めた。当期末に{?D > 0|不利差異|有利差異}{abs(D)}千円が新たに発生した（翌期から費用処理）。法定実効税率は{t}％である。連結包括利益計算書の「退職給付に係る調整額」（その他の包括利益、税効果控除後）と、期末の「退職給付に係る調整累計額」を求めなさい。",
    options: ["調整額{occ:▲}千円、調整累計額{acc:▲}千円","調整額{wocc:▲}千円、調整累計額{xacc:▲}千円","調整額{pocc:▲}千円、調整累計額{acc:▲}千円","調整額{-occ:▲}千円、調整累計額{-acc:▲}千円"],
    answer: 1,
    input: [{"label":"退職給付に係る調整額","value":"{occ}","unit":"千円","signed":true},{"label":"退職給付に係る調整累計額","value":"{acc}","unit":"千円","signed":true}],
    explanation: "【結論】退職給付に係る調整額 {occ:▲}千円、退職給付に係る調整累計額 {acc:▲}千円\n【なぜ】ひとことで：連結では、差異は発生した年に一度「その他の包括利益」に入れておき、何年かかけて費用にするたびに、その分を「その他の包括利益」から抜いて利益のほうへ移す（組替調整）。\n・発生：不利差異は債務が増える話なので、その他の包括利益のマイナス、有利差異はプラスです。\n・組替調整：過去に入れておいた不利差異のうち、当期に費用にした{a}千円は、今度は利益（退職給付費用）で計上されます。同じものを2回マイナスにしないよう、その他の包括利益ではプラスで戻します。\n・だから：当期の調整額＝当期発生額＋組替調整額（それぞれ税効果を差し引く）。累計額は、期末にまだ費用になっていない差異の残高（税効果後）です。\n【手順】\n・当期発生額＝{?D > 0|不利差異なので▲|有利差異なので＋}{abs(D)}千円\n・組替調整額＝前期末の不利差異{Uo}÷{N}年＝＋{a}千円\n・退職給付に係る調整額＝({-D:±}＋{a})×(1－{t}％)＝{occ:▲}千円\n・期末の未認識差異＝不利{Uo - a}千円{?D > 0|＋不利|－有利}{abs(D)}千円 → 調整累計額＝{acc:▲}千円（税効果後）\n【つまずき】組替調整額を忘れると、調整額{abs(wocc)}千円、調整累計額{abs(xacc)}千円になります。{abs(pocc)}千円は税効果を差し引き忘れた誤りです。\n【実務】連結包括利益計算書の「退職給付に係る調整額」と、その注記（組替調整額）を作る場面で効きます。根拠：退職給付に関する会計基準（企業会計基準第26号）、包括利益の表示に関する会計基準。",
    vary: {"vars":{"Uo":[2000,500,6000,100],"N":[10,5,15,1],"D":[1000,-3000,3000,100],"t":[30,25,35,5]},"calc":{"a":"Uo / N","occ":"(-D + Uo / N) * (100 - t) / 100","acc":"-(Uo - Uo / N + D) * (100 - t) / 100","wocc":"-D * (100 - t) / 100","xacc":"-(Uo + D) * (100 - t) / 100","pocc":"-D + Uo / N"},"when":"isInt(Uo / N) && D != 0 && occ != 0 && acc != 0 && isInt(occ) && isInt(acc) && isInt(wocc) && isInt(xacc) && wocc != occ && xacc != acc && Uo - Uo / N + D != 0 && pocc != occ"},
  },
  {

    question: "親会社の期末の年金資産は{A}千円、退職給付債務は{P}千円で、積立超過である。未認識数理計算上の差異は{?U > 0|不利差異|有利差異}{abs(U)}千円である（法定実効税率{t}％）。個別財務諸表の前払年金費用と、連結貸借対照表の退職給付に係る資産を求めなさい。",

    input: [{"label":"個別の前払年金費用","value":"{ind}","unit":"千円"},{"label":"連結の退職給付に係る資産","value":"{asset}","unit":"千円"}],
    explanation: "【結論】個別の前払年金費用 {ind}千円、連結の退職給付に係る資産 {asset}千円\n【なぜ】ひとことで：年金資産が債務より多い（積立超過）なら、その超過分は資産。連結は超過分そのまま、個別は未認識の差異の分だけずれる。\n・連結：未認識の差異も含めて、今の積立状況（年金資産{A}－債務{P}＝{asset}千円）をそのまま資産にします。\n・個別：未認識の差異は貸借対照表に出さないので、{?U > 0|まだ費用にしていない不利差異{abs(U)}千円の分だけ、資産が大きく|まだ利益にしていない有利差異{abs(U)}千円の分だけ、資産が小さく}なります。\n・名前も違います。個別は「前払年金費用」、連結は「退職給付に係る資産」です。\n【手順】\n・連結：退職給付に係る資産＝{A}－{P}＝{asset}千円\n・個別：前払年金費用＝{asset}{?U > 0|＋不利差異|－有利差異}{abs(U)}＝{ind}千円\n・差額{abs(U)}千円は、税効果を差し引いた{abs(adj)}千円を退職給付に係る調整累計額（{?U > 0|マイナス|プラス}）とします\n【つまずき】個別と連結を取り違えないようにします。未認識の差異が残るのは個別、残らないのが連結です。\n【実務】積立超過の企業年金を持つ法人で、個別と連結で資産の金額が違う理由を説明する場面で効きます。根拠：退職給付に関する会計基準（企業会計基準第26号）。",
    vary: {"vars":{"P":[40000,10000,120000,1000],"dA":[6000,1000,20000,1000],"U":[2000,-4000,4000,100],"t":[30,25,35,5]},"calc":{"A":"P + dA","asset":"dA","ind":"dA + U","adj":"-U * (100 - t) / 100"},"when":"U != 0 && dA + U > 0 && isInt(adj) && abs(U) * 2 < dA"},

    level: "hard",
    question: "連結財務諸表を作成する。当期首の退職給付債務は{P0}千円、年金資産は{A0}千円である。当期の勤務費用は{SC}千円、割引率は{d}％、長期期待運用収益率は{e}％で、年金資産の実際の運用収益は{R}千円であった。当期の掛金拠出額は{C}千円、年金基金からの退職給付の支払額は{B}千円である（退職給付債務に係る数理計算上の差異は生じていない）。期末の退職給付に係る負債と、当期に発生した数理計算上の差異を求めなさい。",
    options: ["退職給付に係る負債{liab}千円、差異{abs(dR)}千円の{?dR > 0|有利差異|不利差異}","退職給付に係る負債{wl}千円、差異{abs(dR)}千円の{?dR > 0|有利差異|不利差異}","退職給付に係る負債{xl}千円、差異{abs(dR)}千円の{?dR > 0|有利差異|不利差異}","退職給付に係る負債{liab}千円、差異{abs(dR)}千円の{?dR > 0|不利差異|有利差異}"],
    answer: 1,
    input: [{"label":"期末の退職給付に係る負債","value":"{liab}","unit":"千円"},{"label":"当期発生の数理計算上の差異","value":"{abs(dR)}","unit":"千円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(dR > 0, 1, 2)}"}],
    explanation: "【結論】退職給付に係る負債 {liab}千円、数理計算上の差異 {abs(dR)}千円（{?dR > 0|有利差異|不利差異}）\n【なぜ】ひとことで：債務と年金資産を、それぞれ期首から期末まで動かして、差を負債にする。年金資産が「期待どおり」に増えなかった分が、数理計算上の差異。\n・債務：勤務費用と利息費用で増え、退職金の支払いで減ります。\n・年金資産：実際の運用収益と掛金で増え、退職金の支払いで減ります（年金基金から払うので、債務と年金資産の両方が減ります）。\n・差異：運用が期待（{er}千円）より{?dR > 0|良かった（{R}千円）ので、有利差異|悪かった（{R}千円）ので、不利差異}です。連結では、この差異も含めた積立状況をそのまま負債にします。\n図：帯｜期末の退職給付債務：債務={P1:raw}@d｜期末の年金資産と不足：年金資産={A1:raw}@c、退職給付に係る負債={liab:raw}@a\n【手順】\n・期末の退職給付債務＝{P0}＋勤務費用{SC}＋利息費用{ic}－給付{B}＝{P1}千円\n・期末の年金資産＝{A0}＋実際の運用収益{R}＋掛金{C}－給付{B}＝{A1}千円\n・退職給付に係る負債＝{P1}－{A1}＝{liab}千円\n・数理計算上の差異＝実際{R}－期待{er}＝{dR:▲}千円（{?dR > 0|有利差異|不利差異}）\n【つまずき】{wl}千円は年金資産を期待運用収益で増やした（差異を反映しない）誤り、{xl}千円は年金基金からの給付で退職給付債務を減らし忘れた誤りです。\n【実務】年金数理人の報告書と年金基金の運用報告から、期末の負債と差異を確かめる場面で効きます。根拠：退職給付に関する会計基準（企業会計基準第26号）。",
    vary: {"vars":{"P0":[50000,20000,150000,1000],"A0":[30000,10000,120000,1000],"SC":[3000,1000,8000,100],"d":[1,0.5,2,0.5],"e":[2,1,4,0.5],"dR":[-400,-2000,2000,100],"C":[2500,500,6000,100],"B":[2000,500,6000,100]},"calc":{"ic":"P0 * d / 100","er":"A0 * e / 100","R":"A0 * e / 100 + dR","P1":"P0 + SC + P0 * d / 100 - B","A1":"A0 + A0 * e / 100 + dR + C - B","liab":"P0 + SC + P0 * d / 100 - B - (A0 + A0 * e / 100 + dR + C - B)","wl":"P0 + SC + P0 * d / 100 - B - (A0 + A0 * e / 100 + C - B)","xl":"P0 + SC + P0 * d / 100 - (A0 + A0 * e / 100 + dR + C - B)"},"when":"isInt(ic) && isInt(er) && dR != 0 && R > 0 && A0 < P0 && liab > 0 && B < A0 / 3 && wl != liab && xl != liab"},
  },
  {
    id: 258,
    category: "会計学",
    topics: ["表示・会計方針・CF計算書","連結・持分法・本支店"],
    level: "hard",
    question: "当期末にS社株式の{p}％を現金{C}千円で取得し、S社を子会社とした。取得時のS社の資産・負債を時価で評価した純資産は{NA}千円で、このうち現金及び現金同等物は{K}千円である。連結キャッシュ・フロー計算書の投資活動の区分に記載する「連結の範囲の変更を伴う子会社株式の取得による支出」と、のれんを求めなさい。",
    options: ["支出{out}千円、のれん{gw}千円","支出{C}千円、のれん{gw}千円","支出{wo}千円、のれん{gw}千円","支出{out}千円、のれん{C - NA}千円"],
    answer: 1,
    input: [{"label":"子会社株式の取得による支出","value":"{out}","unit":"千円"},{"label":"のれん","value":"{gw}","unit":"千円"}],
    explanation: "【結論】子会社株式の取得による支出 {out}千円、のれん {gw}千円\n【なぜ】ひとことで：子会社を買うと、その子会社の金庫に入っていた現金もグループのものになる。だから、グループから実際に出ていったお金は「払った額－子会社の現金」。\n・たとえ：財布ごと買ったら、財布に入っていたお金は戻ってきたのと同じです。\n・持分比率は関係ありません。連結では子会社の資産を全部（100％）取り込むので、現金も全額がグループの現金になります。\n・のれんは、払った額と、時価の純資産のうち自分の持分（{p}％）との差です。\n図：帯｜支払った現金：子会社の現金（グループに入る）={K:raw}@c、実質の支出={out:raw}@d\n【手順】\n・取得による支出＝{C}－{K}＝{out}千円（持分比率に関係なく、子会社の現金は全額が連結に入る）\n・のれん＝{C}－{NA}×{p}％＝{gw}千円\n【つまずき】支出{C}千円は子会社の現金を差し引き忘れた誤り、{wo}千円は子会社の現金を持分相当額だけ差し引いた誤りです。\n【実務】M&Aの年度の連結CF計算書で、取得対価と実際の資金流出の差を説明する場面で効きます。根拠：連結キャッシュ・フロー計算書等の作成基準。",
    vary: {"vars":{"C":[80000,20000,200000,1000],"p":[80,60,100,10],"K":[12000,2000,40000,1000],"NA":[90000,20000,200000,1000]},"calc":{"out":"C - K","gw":"C - NA * p / 100","wo":"C - K * p / 100"},"when":"K < C / 2 && gw > 0 && gw * 5 <= C && isInt(NA * p / 100) && isInt(K * p / 100) && p < 100"},
  },
  {
    id: 259,
    category: "会計学",
    topics: ["表示・会計方針・CF計算書","連結・持分法・本支店"],
    level: "hard",
    question: "当期の連結グループで、次の取引があった（すべて現金で決済。単位：千円）。\n・子会社S1社株式を非支配株主から追加取得（支払{A1}）\n・子会社S2社株式の一部を売却（受取{S1}。支配は継続）\n・非支配株主への配当金の支払{Dn}、子会社S3社の増資を非支配株主が引き受けた払込み{X}\n・子会社S4社株式のすべてを売却して連結の範囲から除外（受取{Z}。S4社が保有していた現金及び現金同等物は{K2}）\n連結キャッシュ・フロー計算書の財務活動によるキャッシュ・フローと、投資活動によるキャッシュ・フロー（上記の取引分）を求めなさい。",
    options: ["財務活動{fin:▲}千円、投資活動{inv}千円","財務活動{wfin:▲}千円、投資活動0千円","財務活動{X - Dn:▲}千円、投資活動{winv:▲}千円","財務活動{fin:▲}千円、投資活動{xinv}千円"],
    answer: 1,
    input: [{"label":"財務活動によるキャッシュ・フロー","value":"{fin}","unit":"千円","signed":true},{"label":"投資活動によるキャッシュ・フロー","value":"{inv}","unit":"千円"}],
    explanation: "【結論】財務活動によるキャッシュ・フロー {fin:▲}千円、投資活動によるキャッシュ・フロー {inv}千円\n【なぜ】ひとことで：子会社の株を売り買いしても「支配が続く」なら、グループの中の持ち分の付け替え（株主どうしの取引）なので財務活動。「支配を失う」なら、子会社という事業を手放すので投資活動。\n・追加取得・一部売却：グループは同じ顔ぶれのまま、非支配株主との間で持ち分が動くだけです。非支配株主も連結では株主として扱うので、資本の取引＝財務活動です。\n・支配を失う売却：子会社が連結から外れます。受け取った代金から、その子会社が持っていた現金（グループから出ていく）を差し引いて投資活動に書きます。\n図：区分｜財務活動：追加取得、一部売却（支配継続）、非支配株主への配当、非支配株主からの払込み｜投資活動：*支配を失う売却（子会社の現金を差し引く）\n【手順】\n・財務活動＝追加取得▲{A1}＋一部売却{S1}－非支配株主への配当{Dn}＋非支配株主からの払込み{X}＝{fin:▲}千円\n・投資活動＝S4社株式の売却{Z}－S4社の現金{K2}＝{inv}千円（連結の範囲の変更を伴う子会社株式の売却による収入）\n【つまずき】支配を失う売却まで財務活動に入れると{abs(wfin)}千円、非支配株主との取引を投資活動に入れると{abs(winv)}千円になります。{xinv}千円は子会社の現金を差し引き忘れた誤りです。\n【実務】グループ再編の年度に、資金の動きを「投資」と「財務」に正しく振り分ける場面で効きます。根拠：連結キャッシュ・フロー計算書等の作成基準。",
    vary: {"vars":{"A1":[5000,1000,20000,100],"S1":[3000,500,15000,100],"Dn":[800,100,3000,100],"X":[2000,0,8000,100],"Z":[9000,2000,30000,100],"K2":[1500,100,8000,100]},"calc":{"fin":"-A1 + S1 - Dn + X","inv":"Z - K2","wfin":"-A1 + S1 - Dn + X + Z - K2","winv":"S1 - A1 + Z - K2","xinv":"Z"},"when":"fin != 0 && X != Dn && K2 < Z && wfin != fin && winv != inv && winv != 0 && wfin != 0 && A1 != S1"},
  },
  {
    id: 260,
    category: "会計学",
    topics: ["表示・会計方針・CF計算書","外貨換算"],
    level: "hard",
    question: "在外子会社S社の現金及び現金同等物は、期首{Bd}千ドル（前期末の為替相場@{CR0}円で換算済み）である。当期のS社のキャッシュ・フロー（純増減）は{Nd:±}千ドルで、期中平均相場@{AR}円で換算する。決算日の為替相場は@{CR1}円である。連結キャッシュ・フロー計算書の「現金及び現金同等物に係る換算差額」と、期末の現金及び現金同等物（円）を求めなさい。",
    options: ["換算差額{diff:▲}千円、期末残高{end}千円","換算差額{wdiff:▲}千円、期末残高{end}千円","換算差額0千円、期末残高{xend}千円","換算差額{-diff:▲}千円、期末残高{end}千円"],
    answer: 1,
    input: [{"label":"現金及び現金同等物に係る換算差額","value":"{diff}","unit":"千円","signed":true},{"label":"期末の現金及び現金同等物","value":"{end}","unit":"千円"}],
    explanation: "【結論】現金及び現金同等物に係る換算差額 {diff:▲}千円、期末の現金及び現金同等物 {end}千円\n【なぜ】ひとことで：ドルの現金は、期首・期中の動き・期末で、それぞれ違う相場で円に直す。円に直した結果が合わない分は、為替の変動で増減した分なので、独立の区分に「換算差額」として書く。\n・期首残高：前期末の相場@{CR0}円（すでに換算済み）。\n・期中のお金の動き：期中に少しずつ起きるので、期中平均相場@{AR}円。\n・期末残高：決算日の相場@{CR1}円。\n・困ること：この差を営業・投資・財務のどこかに混ぜると、本業や投資でお金が増えたように見えてしまいます。\n【手順】\n・期首残高＝{Bd}千ドル×@{CR0}＝{beg}千円\n・当期のキャッシュ・フロー＝{Nd:±}千ドル×@{AR}＝{flow:±}千円\n・期末残高＝{ed}千ドル×@{CR1}＝{end}千円\n・換算差額＝{end}－{beg}－({flow:±})＝{diff:▲}千円\n【つまずき】{abs(wdiff)}千円は期首残高の換算替えだけを見た誤りで、当期のキャッシュ・フローを平均相場で換算した分の差が抜けています。\n【実務】海外子会社の現金が為替だけで増減した分を、営業・投資・財務と区別して説明する場面で効きます。根拠：連結キャッシュ・フロー計算書等の作成基準。",
    vary: {"vars":{"Bd":[100,20,500,10],"Nd":[50,-80,150,10],"CR0":[100,90,150,1],"dA":[4,-6,6,1],"dC":[8,-12,12,1]},"calc":{"AR":"CR0 + dA","CR1":"CR0 + dC","ed":"Bd + Nd","end":"(Bd + Nd) * (CR0 + dC)","beg":"Bd * CR0","flow":"Nd * (CR0 + dA)","diff":"(Bd + Nd) * (CR0 + dC) - Bd * CR0 - Nd * (CR0 + dA)","wdiff":"Bd * dC","xend":"Bd * CR0 + Nd * (CR0 + dA)"},"when":"Bd + Nd > 0 && dA != 0 && dC != 0 && (dA > 0) == (dC > 0) && abs(dA) < abs(dC) && diff != 0 && wdiff != diff && Nd != 0"},
  },
  {
    id: 261,
    category: "商業簿記",
    topics: ["連結・持分法・本支店","純資産・株式"],
    level: "hard",
    question: "P社は株式交換によりS社を完全子会社とした（P社が取得企業）。P社はS社の株主にP社株式{n}株（1株あたりの時価{pr}千円）を交付し、株式交換にあたって外部のアドバイザーに報酬{ex}千円を支払った。S社の資産・負債を時価で評価した純資産は{NA}千円である。P社の増加する株主資本は全額を資本金とし、報酬は現金で支払った。\n問1 P社の個別財務諸表における、株式交換時の仕訳をしなさい（報酬は子会社株式の取得原価に含める）。\n問2 連結財務諸表ののれんを求めなさい。",
    options: ["S社株式{ind}千円、のれん{gw}千円","S社株式{cost}千円、のれん{gw}千円","S社株式{ind}千円、のれん{wgw}千円","S社株式{cost}千円、のれん{wgw}千円"],
    answer: 1,
    journal: {"accounts":["子会社株式","資本金","資本準備金","現金","支払手数料","のれん"],"entries":[{"label":"問1 個別（株式交換時）","dr":[["子会社株式","{ind}"]],"cr":[["資本金","{cost}"],["現金","{ex}"]]}]},
    input: [{"label":"問2 連結ののれん","value":"{gw}","unit":"千円"}],
    explanation: "【結論】問1（借）子会社株式 {ind}／（貸）資本金 {cost}・現金 {ex}　問2 のれん {gw}千円\n【なぜ】ひとことで：同じアドバイザー報酬でも、個別では「株の値段の一部」、連結では「その期の費用」。だから、のれんは報酬を除いて計算する。\n・個別：P社にとっては「S社株式という資産を買った」取引なので、株を手に入れるための付随費用も、株の取得原価に含めます（普通の資産の買い方と同じ）。\n・連結：連結では「S社の事業そのものを買った」と考えます。報酬は事業の値段ではないので、取得関連費用として費用にします。\n・だから：のれん＝交付した株の時価{cost}千円－S社の時価純資産{NA}千円。連結修正で、個別で株に含めた報酬{ex}千円を費用に振り替えます。\n【手順】\n・個別：S社株式＝{n}株×{pr}千円＋報酬{ex}千円＝{ind}千円\n・連結：取得原価＝{cost}千円（報酬は費用）→ のれん＝{cost}－{NA}＝{gw}千円\n（連結修正では、個別で取得原価に含めた{ex}千円を費用に振り替えます）\n【つまずき】個別でも報酬を費用にすると{cost}千円、連結でも取得原価に含めるとのれんが{wgw}千円になります。\n【実務】株式交換による子会社化で、個別と連結で取得原価が違う理由を説明する場面で効きます。根拠：企業結合に関する会計基準（企業会計基準第21号）、企業結合会計基準及び事業分離等会計基準に関する適用指針。",
    vary: {"vars":{"n":[1000,300,5000,100],"pr":[50,20,150,1],"ex":[1500,300,5000,100],"NA":[40000,10000,200000,1000]},"calc":{"cost":"n * pr","ind":"n * pr + ex","gw":"n * pr - NA","wgw":"n * pr + ex - NA"},"when":"gw > 0 && gw * 4 <= n * pr"},

    answer: 1,
    input: [{"label":"支配獲得時の時価純資産","value":"{fair}","unit":"千円"},{"label":"負ののれん発生益","value":"{bad}","unit":"千円"}],
    explanation: "【結論】時価純資産 {fair}千円、負ののれん発生益 {bad}千円\n【なぜ】ひとことで：買った会社の資産は、帳簿に載っていない無形資産まで洗い出して時価で数える。それでも払った額のほうが安ければ、得をした分（負ののれん）は利益にする。\n・無形資産：特許権のように、会社から切り離して売れる無形資産は、S社の帳簿になくても、取得した資産として時価{Ia}千円で計上します。のれんと区別することで、何にいくら払ったかがはっきりします。\n・負ののれん：払った{C}千円が、時価の純資産{fair}千円より少ないなら、安く買えた（得をした）ことになります。資産・負債の評価に誤りがないか見直したうえで、その期の利益（負ののれん発生益）にします。\n図：帯｜S社の時価純資産：帳簿上の純資産={b:raw}@b、土地の評価益={L:raw}@a、特許権={Ia:raw}@a｜P社が払った額：取得原価={C:raw}@c｜注：払った額が時価純資産を{bad}千円下回る＝負ののれん発生益\n【手順】\n・時価純資産＝{b}＋土地の評価益{L}＋特許権{Ia}＝{fair}千円\n・取得原価{C}千円＜時価純資産{fair}千円 → 負ののれん発生益＝{bad}千円（特別利益）\n【つまずき】特許権を識別しないと時価純資産{b + L}千円、のれん{wg}千円となり、結論が逆になります。負ののれんを資産に計上して償却するのは、現行の基準では認められていません。\n【実務】病院や診療所の買収で、許認可・ブランドなどの無形資産を識別するかどうかが、のれんの金額を大きく左右する場面で効きます。根拠：企業結合に関する会計基準（企業会計基準第21号）。",
    vary: {"vars":{"b":[50000,20000,150000,1000],"L":[8000,2000,30000,1000],"Ia":[6000,2000,20000,1000],"dC":[-3000,-8000,-500,500]},"calc":{"fair":"b + L + Ia","C":"b + L + Ia + dC","bad":"-dC","wg":"dC + Ia"},"when":"Ia + dC > 0 && -dC * 10 <= b"},
  },
  {

    options: ["子会社株式の合計{tot}千円、のれん{gw}千円","子会社株式の合計{wtot}千円、のれん{gw}千円","子会社株式の合計{tot}千円、のれん{xgw}千円","子会社株式の合計{Ea + NAb}千円、のれん0千円"],
    answer: 1,
    input: [{"label":"子会社株式の合計","value":"{tot}","unit":"千円"},{"label":"連結ののれん","value":"{gw}","unit":"千円"}],
    explanation: "【結論】子会社株式の合計 {tot}千円、のれん {gw}千円\n【なぜ】ひとことで：株式移転では、取得する側（A社）は「経営が続いているだけ」なので帳簿の金額のまま、取得される側（B社）だけを時価で買ったと考える。\n・A社株式：A社の株主がそのままグループを支配し続けているので、A社は「買われた」わけではありません。H社が受け入れるA社株式は、A社の株主資本の帳簿の金額{Ea}千円です（時価{Fa}千円にしない）。\n・B社株式：B社は取得された側なので、取得の対価（時価）{V}千円で受け入れます。\n・のれん：B社の分だけ生じます（取得の対価－B社の時価純資産）。A社からはのれんは生じません。\n【手順】\n・A社株式＝A社の株主資本の帳簿価額{Ea}千円（時価{Fa}千円ではない）\n・B社株式＝取得の対価{V}千円\n・子会社株式の合計＝{Ea}＋{V}＝{tot}千円\n・のれん＝{V}－B社の時価純資産{NAb}＝{gw}千円（A社からはのれんは生じない）\n【つまずき】A社株式も時価で受け入れると合計{wtot}千円、A社の時価と帳簿価額の差までのれんにすると{xgw}千円になります。\n【実務】2つの法人が持株会社の下に経営統合するとき、どちらが取得企業かで資産の評価が変わる場面で効きます。根拠：企業結合に関する会計基準（企業会計基準第21号）、同適用指針。",
    vary: {"vars":{"Ea":[80000,20000,200000,1000],"dFa":[15000,2000,60000,1000],"V":[60000,10000,150000,1000],"dB":[8000,1000,30000,1000]},"calc":{"Fa":"Ea + dFa","NAb":"V - dB","tot":"Ea + V","gw":"dB","wtot":"Ea + dFa + V","xgw":"dB + dFa"},"when":"dB * 5 <= V && dFa * 4 <= Ea"},
  },

    question: "P社は、X事業（移転する資産の帳簿価額{At}千円、負債の帳簿価額{Lt}千円）を、資本関係のないQ社に移転し、対価として現金{K}千円を受け取った。Q社が受け入れたX事業の資産・負債の時価は、資産{Af}千円、負債{Lf}千円である。資産・負債は「諸資産」「諸負債」の勘定を使うこと。\n問1 分離元企業P社の個別財務諸表における仕訳をしなさい。\n問2 分離先企業Q社の仕訳をしなさい。",
    options: ["移転{?gl > 0|利益|損失}{abs(gl)}千円、のれん{gw}千円","移転損益なし（0千円）、のれん{gw}千円","移転{?gl > 0|利益|損失}{abs(gl)}千円、のれん{abs(K - (At - Lt))}千円","移転{?gl > 0|損失|利益}{abs(gl)}千円、のれん{gw}千円"],
    answer: 1,
    journal: {"accounts":["諸資産","諸負債","現金","のれん","移転利益","移転損失","子会社株式","その他資本剰余金"],"entries":[{"label":"問1 P社（分離元）","dr":[["諸負債","{Lt}"],["現金","{K}"]],"cr":[["諸資産","{At}"],["移転利益","{gl}"]]},{"label":"問2 Q社（分離先）","dr":[["諸資産","{Af}"],["のれん","{gw}"]],"cr":[["諸負債","{Lf}"],["現金","{K}"]]}]},
    explanation: "【結論】問1（借）諸負債 {Lt}・現金 {K}／（貸）諸資産 {At}・移転利益 {gl}　問2（借）諸資産 {Af}・のれん {gw}／（貸）諸負債 {Lf}・現金 {K}\n【なぜ】ひとことで：事業を「現金で売った」なら、ふつうの資産の売却と同じ。売った側は帳簿価額との差を利益にし、買った側は時価で受け入れて、払いすぎた分をのれんにする。\n・P社：現金を受け取った時点で、X事業とは縁が切れます（投資が清算された）。帳簿価額の純額{Eb}千円の事業を{K}千円で手放したので、差額{gl}千円が移転利益です。\n・Q社：事業を買ったので、資産・負債を時価で受け入れます。時価の純額{Af - Lf}千円より多く払った分が、のれんです。\n・P社は帳簿価額、Q社は時価。同じ事業でも、売り手と買い手で使う金額が違います。\n図：区分｜投資が続く（移転損益なし）：対価が子会社株式、対価が関連会社株式｜投資が清算される（移転損益あり）：対価が現金など、対価がその他有価証券になる株式｜注：受け取った対価で、事業への投資が「続いている」か「終わった」かを判断する\n【手順】\n・P社：移転した事業の株主資本相当額＝{At}－{Lt}＝{Eb}千円 → 移転利益＝{K}－{Eb}＝{gl}千円\n・Q社：時価純資産＝{Af}－{Lf}＝{Af - Lf}千円 → のれん＝{K}－{Af - Lf}＝{gw}千円\n【つまずき】移転損益を認識しないのは、対価が分離先の株式で、分離先が子会社・関連会社になる（投資が続く）場合です。Q社ののれんを、P社の帳簿価額との差（{K - Eb}千円）で計算しないこと。\n【実務】診療科・介護事業などを他法人に譲渡するときの、譲渡側の損益と譲受側ののれんの計算で効きます。根拠：事業分離等に関する会計基準（企業会計基準第7号）、企業結合に関する会計基準。",

    question: "P社は、自社のX事業（移転する資産・負債の帳簿価額による株主資本相当額{Eb}千円、X事業の時価{Ef}千円）をS社に移転し、対価としてS社株式を受け取った。この結果、P社はS社株式の{p}％を保有し、S社はP社の子会社となった。移転直前のS社の事業の時価（企業価値）は{Vs}千円、S社の資産・負債を時価で評価した純資産は{Ns}千円である。P社の個別財務諸表におけるS社株式の取得原価と、連結財務諸表ののれんを求めなさい。",
    options: ["S社株式{Eb}千円、のれん{gw}千円","S社株式{Ef}千円、のれん{gw}千円","S社株式{Eb}千円、のれん{wgw}千円","S社株式{Ef}千円、のれん{Ef - Eb}千円"],
    answer: 1,
    input: [{"label":"個別のS社株式の取得原価","value":"{Eb}","unit":"千円"},{"label":"連結ののれん","value":"{gw}","unit":"千円"}],
    explanation: "【結論】個別のS社株式の取得原価 {Eb}千円、連結ののれん {gw}千円\n【なぜ】ひとことで：事業を渡して、その会社を子会社にしたなら、P社は形を変えて同じ事業を持ち続けているだけ。だから個別では利益を出さず、渡した事業の帳簿価額をそのまま株の値段にする。\n・個別：X事業 → S社株式に形が変わっただけで、投資は続いています。移転損益はゼロ、S社株式＝{Eb}千円。\n・連結：P社は、S社がもともと持っていた事業の{p}％を、新しく手に入れたと考えます。その時価と、S社の時価純資産の{p}％との差がのれんです。\n図：区分｜投資が続く（移転損益なし）：対価が子会社株式、対価が関連会社株式｜投資が清算される（移転損益あり）：対価が現金など、対価がその他有価証券になる株式｜注：受け取った対価で、事業への投資が「続いている」か「終わった」かを判断する\n【手順】\n・個別：S社株式＝移転した事業の株主資本相当額{Eb}千円（移転損益なし）\n・連結：取得したS社の既存事業の時価＝{Vs}×{p}％＝{Vs * p / 100}千円、時価純資産の持分＝{Ns}×{p}％＝{Ns * p / 100}千円 → のれん＝{gw}千円\n（X事業のうちS社の他の株主に移転した{100 - p}％部分の時価と帳簿価額との差{dv}千円は、持分変動差額になります）\n【つまずき】個別でS社株式を時価{Ef}千円で受け入れるのは、投資が清算された場合の処理です。のれんを持分を掛けずに{wgw}千円とするのは誤りです。\n【実務】グループ再編で、事業を受け皿会社に移して子会社化するときの、個別と連結の処理の違いで効きます。根拠：事業分離等に関する会計基準（企業会計基準第7号）。",
    vary: {"vars":{"p":[70,60,90,10],"Vs":[60000,20000,150000,1000],"dN":[10000,1000,30000,1000],"kb":[60,30,80,5]},"calc":{"Ef":"Vs * p / (100 - p)","Eb":"Vs * p / (100 - p) * kb / 100","Ns":"Vs - dN","gw":"dN * p / 100","dv":"(Vs * p / (100 - p) - Vs * p / (100 - p) * kb / 100) * (100 - p) / 100","wgw":"dN"},"when":"isInt(Ef) && isInt(Eb) && isInt(gw) && isInt(dv) && dN * 4 <= Vs && gw != dv"},
  },

    explanation: "【結論】個別のA社株式の取得原価 {Eb}千円、のれん相当額 {gw}千円\n【なぜ】ひとことで：相手が関連会社になる場合も、子会社のときと同じく「投資は続いている」。個別では利益を出さず、渡した事業の帳簿価額を株の値段にする。\n・個別：A社株式＝移転した事業の株主資本相当額{Eb}千円（移転損益なし）。\n・持分法：P社は、A社がもともと持っていた事業の{o}％を手に入れたと考えます。その時価とA社の時価純資産の{o}％との差が、のれん相当額（投資差額）です。持分法では、のれんを独立の科目にせず、投資の金額の中に含めて扱います。\n図：区分｜投資が続く（移転損益なし）：対価が子会社株式、対価が関連会社株式｜投資が清算される（移転損益あり）：対価が現金など、対価がその他有価証券になる株式｜注：受け取った対価で、事業への投資が「続いている」か「終わった」かを判断する\n【手順】\n・個別：A社株式＝移転した事業の株主資本相当額{Eb}千円（移転損益なし）\n・持分法：取得したA社の既存事業の時価＝{Vs}×{o}％＝{Vs * o / 100}千円、時価純資産の持分＝{Ns}×{o}％＝{Ns * o / 100}千円 → のれん相当額＝{gw}千円\n【つまずき】個別でA社株式を時価{Ef}千円で受け入れるのは、投資が清算された場合の処理です。のれん相当額を持分を掛けずに{wgw}千円とするのは誤りです。\n【実務】事業を共同出資会社に出して関連会社とするときの、個別と持分法の処理で効きます。根拠：事業分離等に関する会計基準（企業会計基準第7号）、持分法に関する会計基準。",

function validateQuestions(list, knownCategories, knownTopics) {
  const valid = [];
  const problems = [];
  const warnings = [];
  if (!Array.isArray(list)) {
    problems.push({ label: "QUESTIONS", messages: ["問題データが配列（[ ... ]）になっていません"] });
    return { valid, problems, warnings, maxId: 0 };
  }

  const idCount = new Map();
  list.forEach((q) => {
    if (q && Number.isInteger(q.id)) idCount.set(q.id, (idCount.get(q.id) || 0) + 1);
  });

  let maxId = 0;
  list.forEach((orig, i) => {
    const label = orig && orig.id !== undefined ? "id=" + orig.id : i + 1 + "番目の問題";
    if (!orig || typeof orig !== "object") {
      problems.push({ label, messages: ["{ ... } の形式になっていません"] });
      return;
    }
    const msgs = [];
    // 数字が変わる問題は、基準の数字で作った問題を点検する
    let q = orig;
    if (orig.vary !== undefined) {
      const vm = varyProblems(orig);
      if (vm.length) { problems.push({ label, messages: vm }); return; }
      q = instantiate(orig, null);
    }

    if (!Number.isInteger(q.id) || q.id < 1) {
      msgs.push("id は1以上の整数にしてください");
    } else {
      maxId = Math.max(maxId, q.id);
      if (idCount.get(q.id) > 1) msgs.push("id が他の問題と重複しています");
    }

    if (!isText(q.category)) {
      msgs.push("category（区分）が空です");
    } else if (knownCategories && knownCategories.length && !knownCategories.includes(q.category)) {
      warnings.push(label + "：区分「" + q.category + "」は CONFIG.categoryColors にありません（表記ゆれの可能性）");
    }

    // 論点（topics）：CONFIG.topics を使っているときは、1つ以上、一覧にある名前で付ける
    if (knownTopics && knownTopics.length) {
      if (!Array.isArray(q.topics) || q.topics.length === 0) {
        warnings.push(label + "：論点（topics）がありません（論点別テストに出題されません）");
      } else {
        q.topics.filter((t) => !knownTopics.includes(t)).forEach((t) =>
          warnings.push(label + "：論点「" + t + "」は CONFIG.topics にありません（表記ゆれの可能性）"));
      }
    }

    if (!isText(q.question)) msgs.push("question（問題文）が空です");

    let optionsOk = false;
    if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 6) {
      msgs.push("options は2〜6個の配列にしてください（4択は4個、〇×は OX）");
    } else if (!q.options.every(isText)) {
      msgs.push("options に空の選択肢があります");
    } else if (new Set(q.options).size !== q.options.length) {
      msgs.push("options に同じ文言の選択肢があります");
    } else {
      optionsOk = true;
    }

    if (!Number.isInteger(q.answer)) {
      msgs.push("answer は整数（正解が何番目の選択肢か。1始まり）にしてください");
    } else if (optionsOk && (q.answer < 1 || q.answer > q.options.length)) {
      msgs.push("answer が範囲外です（1〜" + q.options.length + " の間）");
    }

    if (!isText(q.explanation)) msgs.push("explanation（解説）が空です");
    if (q.input !== undefined) inputProblems(q).forEach((m) => msgs.push(m));
    if (q.journal !== undefined) journalProblems(q).forEach((m) => msgs.push(m));
    diagramProblems(q).forEach((m) => msgs.push(m));
    if (q.alt !== undefined) {
      if (!Array.isArray(q.alt)) msgs.push("alt は配列（[ { question, answer, explanation }, … ]）にしてください");
      else q.alt.forEach((a, k) => {
        const at = "alt の" + (k + 1) + "番目：";
        if (!a || typeof a !== "object") { msgs.push(at + "{ … } の形式になっていません"); return; }
        if (!isText(a.question)) msgs.push(at + "question が空です");
        if (!isText(a.explanation)) msgs.push(at + "explanation が空です");
        if (!Number.isInteger(a.answer) || !Array.isArray(q.options) || a.answer < 1 || a.answer > q.options.length) msgs.push(at + "answer が範囲外です");
        if ([a.question, a.explanation].some((t) => typeof t === "string" && CROSS_REFERENCE.test(t))) warnings.push(label + "：" + at + "他の問題を参照しているようです");
      });
    }

    // 難しさの印（level）。今は "hard"（難問。画面に「難」の印）だけ
    if (q.level !== undefined && q.level !== "hard") {
      warnings.push(label + "：level には \"hard\"（難問）だけを書けます。書かなければふつうの問題です");
    }
    // 他のAIなどから貼り付けた問題の名残を検出（警告のみ。出題は続けます）
    const texts = [q.question, q.explanation].concat(Array.isArray(q.options) ? q.options : []);
    if (texts.some((t) => typeof t === "string" && CITATION_MARK.test(t))) {
      warnings.push(label + "：引用番号らしき [数字] が残っています（貼り付け元の名残では？）");
    }
    if ([q.question, q.explanation].some((t) => typeof t === "string" && OPTION_NUMBER_REF.test(t))) {
      warnings.push(label + "：解説などで選択肢を番号で指しています（「選択肢2は〜」など）。選択肢は毎回並べ替え、〇×に変えて出すこともあるので番号がずれます。選択肢の中身を「」で引用して書いてください");
    }
    if (texts.some((t) => typeof t === "string" && CROSS_REFERENCE.test(t))) {
      warnings.push(label + "：他の問題（問題番号やid）を参照しているようです（出題順がランダムで、問題番号も画面に出ないので成立しません。条件や説明をその問題の中に書いてください）");
    }

    if (msgs.length) problems.push({ label, messages: msgs });
    else valid.push(orig);
  });

  return { valid, problems, warnings, maxId };
}

// フィッシャー–イェーツのシャッフル（元の配列は変更しない）

}

// 一巡するまで同じ問題を出さない「山札」方式。
//   deck：{ order: [問題idの並び], pos: 次に配る位置 }（端末に保存しておく。無ければ null）

//   ・なくなった問題は山札から取り除く

    const removedBefore = deck.order.slice(0, pos).filter((id) => !valid.has(id)).length;
    pos = Math.max(0, Math.min(order.length, pos - removedBefore));
    const known = new Set(order);

  if (picked.length < size) picked.push(...stale.slice(0, size - picked.length));

// 1問ぶんの出題データを作る。order[表示位置] = 元の選択肢の番号（0始まり）

// ---------------------------------------------------------------------------
// 記述式（数値入力）の問題
//   input: [{ label?, value, unit?, tolerance?, choice?: [2つ], choiceAnswer?: 1|2, signed?: true }, ...]
//   signed: true … 符号付きで答える欄（正味現在価値・EVA・その他の包括利益など）。正解がマイナスなら「△」（−）を付けた入力だけが正解
//   選択肢 options と answer は、誤答パターンの判定と、正解値の照合（check_quiz.js）に使うため残す

// 記述式の設定の点検
function inputProblems(q) {
  const msgs = [];
  if (Array.isArray(q.input) && q.input.length === 0 && q.journal) return msgs; // 仕訳だけの問題
  if (!Array.isArray(q.input) || q.input.length < 1 || q.input.length > 3) {
    return ["input は1〜3個の配列にしてください"];
  }
  q.input.forEach((p, i) => {
    const at = q.input.length > 1 ? "input の" + (i + 1) + "番目：" : "input：";
    if (!p || typeof p !== "object") { msgs.push(at + "{ value: … } の形式になっていません"); return; }
    if (typeof p.value !== "number" || !Number.isFinite(p.value)) msgs.push(at + "value は数値にしてください");
    if (p.unit !== undefined && typeof p.unit !== "string") msgs.push(at + "unit は文字列にしてください");
    if (p.tolerance !== undefined && !(typeof p.tolerance === "number" && p.tolerance >= 0)) msgs.push(at + "tolerance は0以上の数値にしてください");
    if (p.signed !== undefined && p.signed !== true) msgs.push(at + "signed は true だけを書いてください（符号付きでない欄には書かない）");

}

// ---------------------------------------------------------------------------
// 仕訳問題（本試験の「指定勘定科目を使って仕訳しなさい」の形）
//   journal: {
//     accounts: ["材料", "材料副費", "買掛金", …],          // 指定勘定科目（選択肢。正解に使わないダミーも入れる。2〜14個）
//     entries: [{ label?: "①材料の購入", dr: [["材料", 金額], …], cr: [["買掛金", 金額], …] }, …]  // 仕訳1〜3本。借方・貸方とも1〜4行
//   }

    const at = "journal の" + (k + 1) + "本目の仕訳：";

      if (!Array.isArray(e[sd]) || e[sd].length < 1 || e[sd].length > 4) { msgs.push(at + nm + "（" + sd + "）は1〜4行にしてください"); return; }
      e[sd].forEach((row) => {

        if (Array.isArray(j.accounts) && !j.accounts.includes(row[0])) msgs.push(at + nm + "の「" + row[0] + "」が journal.accounts にありません");
        if (typeof row[1] !== "number" || !Number.isFinite(row[1]) || row[1] <= 0) msgs.push(at + nm + "の「" + row[0] + "」の金額はプラスの数値にしてください");

}

// ---------------------------------------------------------------------------
// 解説の図（解説の新しい型の中に「図：」で始まる1行で書く。区切りは全角の「｜」。数字は {式:raw} で埋め込める）
//   T勘定：図：T｜材料副費｜借：実際発生額={A:raw}｜貸：予定配賦額={pr:raw}｜差：材料副費差異へ｜注：説明
//          「差：」を書くと、借方・貸方の差額を少ない側に強調して描き、合計をそろえる
//   帯　　：図：帯｜材料の原価：購入代価={P:raw}@b、材料副費={pr:raw}@a｜（次の行）…｜注：説明
//          行ごとの長さは金額に比例（いちばん長い行が全幅）。@a＝オレンジ、@b＝灰、@c＝緑、@d＝赤（省略は灰）
//   区分　：図：区分｜個別BS 純資産の部：株主資本、*評価・換算差額等、新株予約権｜連結BS 純資産の部：…（* は強調）
//   時間軸：図：時間｜今=-{I:raw}｜1年後={c:raw}｜…（プラス＝入金の上向き矢印、マイナス＝支出の下向き矢印）
// ---------------------------------------------------------------------------
const DIAGRAM_LINE = /^図：(.*)$/;
function diagramNum(v) {
  if (typeof v === "number") return v;
  const t = String(v).replace(/[−▲△]/g, "-").replace(/,/g, "").trim();
  return t === "" ? NaN : Number(t);
}
// 図の指定を読む。おかしければ Error を投げる（問題データの点検で使う）
function parseDiagram(text) {
  const parts = String(text).split("｜").map((x) => x.trim());
  const kind = parts.shift();
  const d = {};
  const cap = parts.filter((x) => x.startsWith("注：")).map((x) => x.slice(2));
  if (cap.length) d.caption = cap[0];
  const body = parts.filter((x) => !x.startsWith("注："));
  const pair = (x, where) => {
    const k = x.lastIndexOf("=");
    if (k <= 0) throw new Error(where + "「" + x + "」は「名前=金額」にしてください");
    const l = x.slice(0, k).trim(), n = diagramNum(x.slice(k + 1));
    if (!isText(l)) throw new Error(where + "の名前が空です");
    if (!Number.isFinite(n)) throw new Error(where + "「" + l + "」の金額「" + x.slice(k + 1) + "」が数値ではありません");
    return { l, n };
  };
  if (kind === "T") {
    d.type = "T";
    d.title = body.shift();
    if (!isText(d.title)) throw new Error("T勘定の名前（図：T｜の次）が空です");
    d.dr = []; d.cr = [];
    body.forEach((x) => {
      if (x.startsWith("借：")) d.dr.push(pair(x.slice(2), "T勘定の借方"));
      else if (x.startsWith("貸：")) d.cr.push(pair(x.slice(2), "T勘定の貸方"));
      else if (x.startsWith("差：")) d.bal = x.slice(2);
      else throw new Error("T勘定の「" + x + "」は 借：・貸：・差：・注： のどれかで始めてください");
    });
    if (!d.dr.length || !d.cr.length || d.dr.length > 5 || d.cr.length > 5) throw new Error("T勘定は借方・貸方とも1〜5行にしてください");
  } else if (kind === "帯") {
    d.type = "bar";
    if (body.length < 1 || body.length > 4) throw new Error("帯は1〜4行にしてください");
    d.rows = body.map((x) => {
      const k = x.indexOf("：");
      if (k <= 0) throw new Error("帯の行「" + x + "」は「見出し：名前=金額、…」にしてください");
      const segs = x.slice(k + 1).split("、").map((g) => {
        const m = g.match(/^(.*?)(?:@([abcd]))?$/);
        const r = pair(m[1], "帯");
        if (r.n < 0) throw new Error("帯「" + r.l + "」の金額がマイナスです");
        return Object.assign(r, { c: m[2] || "b" });
      });
      if (segs.length > 5) throw new Error("帯の1行の区切りは5個までにしてください");
      return { label: x.slice(0, k), segs };
    });
  } else if (kind === "区分") {
    d.type = "box";
    if (body.length < 1 || body.length > 3) throw new Error("区分は1〜3列にしてください");
    d.cols = body.map((x) => {
      const k = x.indexOf("：");
      if (k <= 0) throw new Error("区分の列「" + x + "」は「見出し：箱、箱…」にしてください");
      const boxes = x.slice(k + 1).split("、").map((b) => b.trim()).filter(Boolean).map((b) => ({ l: b.replace(/^\*/, ""), hl: b.startsWith("*") }));
      if (boxes.length < 1 || boxes.length > 6) throw new Error("区分の箱は1〜6個にしてください");
      return { title: x.slice(0, k), boxes };
    });
  } else if (kind === "時間") {
    d.type = "time";
    if (body.length < 2 || body.length > 6) throw new Error("時間軸の点は2〜6個にしてください");
    d.points = body.map((x) => { const r = pair(x, "時間軸"); return { t: r.l, n: r.n }; });
  } else {
    throw new Error("図の種類は T・帯・区分・時間 のどれかにしてください（図：T｜… のように書く）");
  }
  return d;
}
function diagramProblems(q) {
  const msgs = [];
  String(q.explanation || "").split("\n").forEach((line) => {
    const m = line.match(DIAGRAM_LINE);
    if (!m) return;
    try { parseDiagram(m[1]); } catch (e) { msgs.push("解説の図：" + e.message); }
  });
  return msgs;
}

// 入力された文字列を数値にする（全角数字・カンマ・空白・単位の文字は無視）。数値として読めなければ null
function parseAnswerNumber(raw) {
  if (typeof raw !== "string") return null;
  let t = raw.replace(/[０-９．，－ー−△▲]/g, (c) => ({ "．": ".", "，": ",", "－": "-", "ー": "-", "−": "-", "△": "-", "▲": "-" }[c] || String.fromCharCode(c.charCodeAt(0) - 0xfee0)));
  t = t.replace(/[,\s]/g, "").replace(/[^0-9.\-+]/g, "");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

// 文章中の数値をすべて取り出す（"1,218,000円" → [1218000]、"約9.7％。…10％" → [9.7, 10]）
function numbersIn(text) {
  const out = [];
  String(text).replace(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/g, (m) => { out.push(Number(m.replace(/,/g, ""))); return m; });
  return out;
}

// 数値を、桁区切り付きの表示用文字列にする
// 記述式の入力欄で、入力中に3桁ごとのカンマを自動で入れる。
//   value：入力欄の文字列、caret：カーソル位置、prev：直前の文字列、backspace：BackSpaceで消したか
//   ・全角数字は半角に、数字・小数点・先頭のマイナス以外の文字（単位など）は取り除く
//   ・BackSpaceでカンマだけを消したときは、その左の数字を消す（カンマが戻ってきて消せない、を防ぐ）
//   ・カーソルは「左にある数字の個数」が変わらない位置に戻す
function formatAmountTyping(value, caret, prev, backspace) {
  const toHalf = (t) => t.replace(/[０-９．－ー−△▲]/g, (c) => ({ "．": ".", "－": "-", "ー": "-", "−": "-", "△": "-", "▲": "-" }[c] || String.fromCharCode(c.charCodeAt(0) - 0xfee0)));
  const sig = (t) => toHalf(t).replace(/[^0-9.\-]/g, "");
  let v = String(value);
  let pos = Math.max(0, Math.min(caret == null ? v.length : caret, v.length));
  if (backspace && prev != null && sig(v) === sig(prev) && v.length < String(prev).length) {
    // カンマだけが消えた → カーソルの左にある数字を1つ消す
    let i = pos - 1;
    while (i >= 0 && !/[0-9０-９]/.test(v[i])) i--;
    if (i >= 0) { v = v.slice(0, i) + v.slice(i + 1); pos = i; }
  }
  let keep = sig(v.slice(0, pos)).length; // カーソルの左にある有効な文字の数
  const raw = sig(v);
  const neg = raw.startsWith("-");
  let body = raw.replace(/-/g, "");
  const dot = body.indexOf(".");
  let intPart = dot === -1 ? body : body.slice(0, dot);
  const decPart = dot === -1 ? null : body.slice(dot + 1).replace(/\./g, "");
  const before = intPart.length;
  intPart = intPart.replace(/^0+(?=\d)/, ""); // 先頭の余分な0（007→7）
  keep -= Math.min(before - intPart.length, Math.max(0, keep - (neg ? 1 : 0)));
  const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const out = (neg ? "-" : "") + grouped + (decPart === null ? "" : "." + decPart);
  // 整形後の文字列で、有効な文字を keep 個数えた位置にカーソルを置く
  let c = 0, n = 0;
  while (c < out.length && n < keep) { if (out[c] !== ",") n++; c++; }
  return { value: out, caret: c };
}

function formatNumber(v) {
  const [i, d] = String(v).split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (d ? "." + d : "");
}
// 符号付きの欄の表示：マイナスは「△」を付ける（本試験の答案の書き方）
function formatAnswer(v, p) {
  return p && p.signed && v < 0 ? "△" + formatNumber(-v) : formatNumber(v);
}

// 向き（有利・不利、借方・貸方など）を2択で答える欄と、金額の大きさ（abs）を問う欄では、
// 「−12,345」のようにマイナスを付けて入力しても、大きさが合っていれば正解にする（向きは2択の方で採点する）。
// 符号付きの欄（signed）は、符号まで一致したときだけ正解
function numberMatches(n, p) {
  if (n === null) return false;
  const tol = (p.tolerance || 0) + 1e-9;
  if (Math.abs(n - p.value) <= tol) return true;
  return n < 0 && !p.signed && !!(p.choice || p.absOk) && Math.abs(-n - p.value) <= tol;
}

// 採点。responses: [{ raw: 入力文字列, choice: 選んだ番号(1|2|null) }, ...]
function gradeInput(q, responses, jres) {
  const parts = (q.input || []).map((p, i) => {
    const r = responses[i] || {};
    const n = parseAnswerNumber(r.raw);
    const numOk = numberMatches(n, p);
    const choiceOk = p.choice ? r.choice === p.choiceAnswer : true;
    return { n, numOk, choiceOk };
  });
  const jparts = q.journal ? gradeJournal(q, jres) : [];
  const correct = parts.every((x) => x.numOk && x.choiceOk) && jparts.every((x) => x.ok);
  // 誤答パターン：入力した数値が、誤答の選択肢に含まれる数値と一致するか（1つ目の入力欄で判定）
  let pattern = null;
  if (!correct && parts[0] && parts[0].n !== null && !parts[0].numOk && Array.isArray(q.options)) {
    pattern = q.options.find((o, i) => i !== q.answer - 1 && numbersIn(o).some((x) => Math.abs(x - Math.abs(parts[0].n)) < 1e-9)) || null;
  }
  const numbersRightChoiceWrong = !correct && jparts.every((x) => x.ok) && parts.every((x) => x.numOk) && parts.some((x) => !x.choiceOk);
  return { correct, parts, jparts, pattern, numbersRightChoiceWrong };
}

// 正解・回答を、表示用の文字列にする
function inputAnswerText(q) {
  return journalAnswerText(q).concat((q.input || []).map((p) => (p.label ? p.label + "：" : "") + formatAnswer(p.value, p) + (p.unit || "") + (p.choice ? "（" + p.choice[p.choiceAnswer - 1] + "）" : ""))).join("／");
}
function inputResponseText(q, responses, jres) {
  return journalResponseText(q, jres).concat((q.input || []).map((p, i) => {
    const r = responses[i] || {};
    const n = parseAnswerNumber(r.raw);
    const num = n === null ? "（未入力）" : formatAnswer(n, p) + (p.unit || "");
    return (p.label ? p.label + "：" : "") + num + (p.choice ? "（" + (r.choice ? p.choice[r.choice - 1] : "未選択") + "）" : "");
  })).join("／");
}

function calcScore(correct, total) {
  return total > 0 ? Math.round((correct * 100) / total) : 0;
}

// grades は min の大きい順に並べてある前提
function findGrade(grades, score) {
  return grades.find((g) => score >= g.min) || grades[grades.length - 1];
}

// ---------------------------------------------------------------------------
// 電卓のロジック（画面の電卓）。事務用の電卓と同じ「入力順に計算」方式です（2＋3×4＝20）。
// 内部は15桁で計算し、表示は12桁に丸めます（1÷3×3＝1 になる、一般的な電卓と同じ挙動）。
// キー名：0〜9 / 00 / . / + - * / / = / sqrt / back / C / GT / MC MR M+ M-
// ---------------------------------------------------------------------------
const CALC_DIGITS = 12; // 入力・表示できる最大桁数

// 浮動小数点のノイズ（0.1+0.2=0.30000000000000004 など）を除く
function calcClean(v) {
  return Number(v.toPrecision(15));
}

// 12桁に丸めたとき、桁あふれ（1兆以上）または数値でなくなるか
function calcOverflow(v) {
  return !Number.isFinite(v) || Math.abs(Number(v.toPrecision(CALC_DIGITS))) >= 1e12;
}

// 12桁に丸めた、指数表記なしの文字列
function calcPlain(v) {
  const r = Number(v.toPrecision(CALC_DIGITS));
  let s = String(r);
  if (/e/i.test(s)) {
    s = r.toFixed(CALC_DIGITS + 2);
    if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  }
  return s;
}

// 整数部を3桁区切りにする（"-1234567.89" → "-1,234,567.89"）
function calcGroup(str) {
  const m = str.match(/^(-?)(\d+)(\.\d*)?$/);
  if (!m) return str;
  return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (m[3] || "");
}

function createCalculator(options) {
  // GTに「+ −」の結果も加えるか。false なら「× ÷」の結果だけ（機種によって異なります）
  const gtIncludesAddSub = !(options && options.gtIncludesAddSub === false);
  // 税込・税抜キーの税率（既定10％）。CONFIG.calculator.taxRate で変更できる
  const taxRate = options && typeof options.taxRate === "number" && options.taxRate >= 0 ? options.taxRate : 0.1;
  const s = {
    entry: "0",       // 入力中の数字（文字列）。計算結果を表示しているときは null
    value: 0,         // 計算結果などの表示値（entry が null のとき）
    acc: null,        // 演算子の左側の数
    op: null,         // 待機中の演算子
    ready: false,     // 演算子の右側の数が用意できているか
    justEq: false,    // 直前の操作が「=」か
    lastOp: null,     // 「=」連打（同じ計算の繰り返し）用
    lastOperand: 0,
    memory: 0,
    gt: 0,
    showGT: false,    // 表示中の数がGTか
    error: false,
    ceDone: false,    // 直前の操作が C・CE の1回目（入力中の数字だけ消した状態）か
  };

  const current = () => {
    if (s.entry === null) return s.value;
    const n = Number(s.entry);
    return Number.isFinite(n) ? n : 0;
  };

  function calculate(a, op, b) {
    if (op === "+") return a + b;
    if (op === "-") return a - b;
    if (op === "*") return a * b;
    return b === 0 ? NaN : a / b; // 0で割るとエラー
  }

  function setResult(v) {
    if (calcOverflow(v)) { s.error = true; return false; }
    s.value = calcClean(v);
    s.entry = null;
    return true;
  }

  function addGT(op) {
    if (!gtIncludesAddSub && op !== "*" && op !== "/") return;
    const g = s.gt + s.value;
    if (calcOverflow(g)) { s.error = true; return; }
    s.gt = calcClean(g);
  }

  // 「=」のあとに数字を打ったら、新しい計算を始める
  function startFreshAfterEquals() {
    if (s.justEq) { s.acc = null; s.op = null; s.lastOp = null; s.justEq = false; }
  }

  function digit(d) {
    startFreshAfterEquals();
    let e = s.entry === null ? "" : s.entry;
    if (e === "0") e = "";
    if (e === "-0") e = "-";
    const room = CALC_DIGITS - e.replace(".", "").replace("-", "").length;
    let add = d;
    if ((e === "" || e === "-") && /^0+$/.test(add)) add = "0"; // 先頭の 0 / 00 は 0 ひとつ
    else add = add.slice(0, Math.max(0, room));   // 00 は入る分だけ
    e += add;
    s.entry = e === "" ? "0" : e;
    s.ready = true;
    s.showGT = false;
  }

  function dot() {
    startFreshAfterEquals();
    if (s.entry === null) s.entry = "0.";
    else if (!s.entry.includes(".") && s.entry.length < CALC_DIGITS) s.entry += ".";
    s.ready = true;
    s.showGT = false;
  }

  // 一桁取り消し（入力中の数字だけ。計算結果には効かない）
  function back() {
    if (s.entry === null) return;
    const e = s.entry.slice(0, -1);
    s.entry = e === "" || e === "-" ? "0" : e;
  }

  function operator(o) {
    const v = current();
    if (s.op !== null && !s.ready) { s.op = o; return; } // 演算子の打ち直し
    if (s.op !== null) {                                   // 連続計算：ここまでを計算して続ける
      if (!setResult(calculate(s.acc, s.op, v))) return;
      s.acc = s.value;
    } else {
      s.acc = v;
    }
    s.op = o;
    s.entry = null;
    s.value = s.acc;
    s.ready = false;
    s.justEq = false;
    s.showGT = false;
  }

  function equals() {
    if (s.op !== null) {
      const b = current(); // 2つ目の数が未入力なら、表示中の数を使う（5 × = → 25）
      if (!setResult(calculate(s.acc, s.op, b))) return;
      s.lastOp = s.op;
      s.lastOperand = b;
      s.op = null;
      s.acc = null;
      addGT(s.lastOp);
    } else if (s.justEq && s.lastOp !== null) {            // = の連打：直前の計算を繰り返す（1.05 × = = = で累乗）
      if (!setResult(calculate(current(), s.lastOp, s.lastOperand))) return;
      addGT(s.lastOp);
    } else {
      return;
    }
    s.justEq = true;
    s.ready = false;
    s.showGT = false;
  }

  function sqrt() {
    const v = current();
    if (v < 0) { s.error = true; return; }
    if (!setResult(Math.sqrt(v))) return;
    s.ready = true;
    s.justEq = false;
    s.showGT = false;
  }

  function memoryRecall() {
    s.entry = null;
    s.value = s.memory;
    s.ready = true;
    s.justEq = false;
    s.showGT = false;
  }

  // M+ / M-：計算の途中なら、いったん「=」相当で確定してからメモリーに加減する
  function memoryAdd(sign) {
    if (s.op !== null) {
      if (!setResult(calculate(s.acc, s.op, current()))) return;
      s.op = null;
      s.acc = null;
    }
    const v = current();
    const m = s.memory + sign * v;
    if (calcOverflow(m)) { s.error = true; return; }
    s.memory = calcClean(m);
    s.value = v;
    s.entry = null;
    s.ready = false;
    s.justEq = false;
    s.showGT = false;
    s.lastOp = null;
  }

  function grandTotal() {
    s.entry = null;
    s.value = s.gt;
    s.ready = true;
    s.justEq = false;
    s.showGT = true;
  }

  // C：入力中の数と計算途中をクリア（メモリーとGTは残す）。GTを表示しているときは、GTもクリア
  function clear() {
    if (s.showGT) s.gt = 0;
    s.entry = "0";
    s.value = 0;
    s.acc = null;
    s.op = null;
    s.ready = false;
    s.justEq = false;
    s.lastOp = null;
    s.showGT = false;
    s.error = false;
  }

  // C・CE：数字を入力している途中なら、1回目はその数字だけを消す（CE）。
  // それ以外のとき（または続けてもう1回押したとき）は、計算途中もクリアする（C。メモリーとGTは残す）
  function clearEntryOrAll() {
    if (!s.error && s.entry !== null && !s.ceDone) {
      s.entry = "0";
      s.ceDone = true;
      return;
    }
    clear();
  }

  function allClear() {
    clear();
    s.gt = 0;
  }

  // %：シャープ方式。200×10% → 20、200＋10% → 220（割増）、200−10% → 180（割引）、20÷50% → 40
  function percent() {
    const v = current();
    const op = s.op;
    let r;
    if (op === "*") r = (s.acc * v) / 100;
