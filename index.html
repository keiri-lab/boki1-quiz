    answer: 1,
    journal: {"accounts":["賃金","仕掛品","製造間接費","賃率差異","未払賃金","現金"],"entries":[{"label":"問1 予定消費額の計上","dr":[["仕掛品","{dl}"],["製造間接費","{R * (hi + hw)}"]],"cr":[["賃金","{pre}"]]},{"label":"賃率差異の計上","dr":[["{?dv > 0|賃金|賃率差異}","{abs(dv)}"]],"cr":[["{?dv > 0|賃率差異|賃金}","{abs(dv)}"]]}]},
    explanation: "【結論】問1（借）仕掛品 {dl}・製造間接費 {R * (hi + hw)}／（貸）賃金 {pre}　問2（借）{?dv > 0|賃金|賃率差異} {abs(dv)}／（貸）{?dv > 0|賃率差異|賃金} {abs(dv)}\n【なぜ】ひとことで：直接労務費になるのは「製品を作っていた時間」だけ。間接作業や手待ちの時間も給料は払うが、特定の製品には結び付かないので製造間接費。\n・予定賃率で計算する理由：実際の賃金は月末の締めまで確定しません。予定賃率を使えば、作業した時点で原価が決まります。\n・実際の消費額：当月に支払った額ではなく「当月に働いた分」です。支払額から前月分の未払を引き、当月分の未払を足します。\n・賃率差異：賃金勘定の借方（実際）と貸方（予定）の差です。{?dv > 0|予定のほうが多いので、賃金勘定の借方に入れて消し、有利差異|実際のほうが多いので、賃金勘定の貸方に入れて消し、不利差異}になります。\n図：T｜賃金｜借：当月支給額={W:raw}、当月末未払={cu:raw}｜貸：前月末未払={pr:raw}、予定消費額={pre:raw}｜差：賃率差異\n【手順】\n・直接労務費＝@{R}×直接作業{hd}時間＝{dl}円、間接労務費＝@{R}×(間接作業{hi}＋手待{hw})時間＝{R * (hi + hw)}円 → 予定消費額{pre}円（問1）\n・実際消費額＝{W}－{pr}＋{cu}＝{act}円\n・賃率差異＝{pre}－{act}＝{dv:▲}円（{?dv > 0|有利差異|不利差異}）（問2）\n【つまずき】手待時間まで直接労務費にすると{wdl}円になります。賃率差異を、支給額{W}円をそのまま実際消費額として計算すると{abs(wdv)}円になります。\n【実務】給与計算の締め日と月末がずれるときに、未払賃金を調整して当月の人件費を確定させる作業そのものです。根拠：原価計算基準 十二。",
    vary: {"vars":{"W":[1200000,500000,3000000,10000],"pr":[200000,50000,600000,10000],"cu":[250000,50000,600000,10000],"R":[1340,800,2000,10],"hd":[800,300,1500,10],"hi":[120,20,400,10],"hw":[10,5,50,5]},"calc":{"act":"W - pr + cu","pre":"R * (hd + hi + hw)","dv":"R * (hd + hi + hw) - (W - pr + cu)","dl":"R * hd","wdl":"R * (hd + hw)","wdv":"R * (hd + hi + hw) - W"},"when":"dv != 0 && abs(dv) * 20 <= W - pr + cu && wdv != dv && wdv != 0 && abs(wdv) != abs(dv) && pr != cu"},
  },
  {
    id: 61,
    category: "工業簿記",
    topics: ["個別原価計算・部門別計算"],
    question: "個別原価計算において、通常の生産活動では発生しない、異常な状態に基づいて発生した仕損（異常仕損）にかかる仕損費の、原則的な処理として正しいものはどれか。",
    options: ["原価性がないものとして、非原価項目（営業外費用又は特別損失）として処理する","正常仕損費と同様に、製造原価に算入する","製造間接費として、すべての指図書に配賦する","仕掛品原価に含めたまま、翌期に繰り越す"],
    answer: 1,
    explanation: "【結論】異常仕損費は、原価性がないため、非原価項目（営業外費用又は特別損失）として処理する。\n【なぜ】ひとことで：ふつうに作っていても避けられない仕損は「作るためのコスト」なので製品の原価に入れる。火災や事故のような異常な仕損は、作ることとは関係のない損なので原価に入れない。\n・正常仕損費：製造原価に入れます（その指図書に直接賦課するか、製造間接費として配賦する）。\n・異常仕損費：製品の原価に入れると、製品の値段が不当に高く計算されます。非原価項目にします。\n図：区分｜製造原価に入れる：*正常仕損費｜非原価項目：*異常仕損費（営業外費用・特別損失）\n【実務】根拠：原価計算基準 三五（仕損費の計算及び処理）、五（非原価項目）。",
  },
  {
    id: 62,
    category: "工業簿記",
    topics: ["個別原価計算・部門別計算"],
    question: "部門別計算における「単一基準配賦法」の説明として正しいものはどれか。",
    options: ["補助部門費を、固定費・変動費に区別せず、実際の用役消費量など単一の基準のみで製造部門へ配賦する方法","固定費は用役消費能力（最大消費量）、変動費は実際の用役消費量、と異なる基準を用いる方法","直接配賦法のみを指す用語である","相互配賦法のみを指す用語である"],
    answer: 1,
    explanation: "【結論】単一基準配賦法は、補助部門費を固定費・変動費に区別せず、単一の基準（実際の用役消費量など）で製造部門へ配賦する方法である。\n【なぜ】ひとことで：配賦の基準を「1つ」にするか「2つ（固定費と変動費で分ける）」にするかの違い。\n・単一基準配賦法：補助部門費をまとめて、実際の消費量などの1つの基準で配ります。簡単ですが、固定費まで使用量で配られます。\n・複数基準配賦法：変動費は実際消費量、固定費は消費能力で配ります。費用の発生原因に合っています。\n・別の切り口：直接配賦法・階梯式・相互配賦法は「補助部門どうしのやりとりをどう扱うか」の分類です。基準の数の分類とは別物です。\n図：区分｜基準の数による分類：単一基準配賦法、複数基準配賦法｜補助部門間のやりとりによる分類：直接配賦法、階梯式配賦法、相互配賦法\n【実務】根拠：原価計算基準 十八（部門費の第2次集計）。",
  },
  {
    id: 63,
    category: "工業簿記",
    topics: ["個別原価計算・部門別計算"],
    level: "hard",
    question: "補助部門費を階梯式配賦法により製造部門に配賦する。配賦の順序は、他の補助部門への用役の提供額が多い補助部門を先にする。第1次集計後の部門費は、動力部{P0}円、修繕部{R0}円である。用役の提供割合は次のとおり。\n・動力部 → 修繕部20％、製造部門A 50％、製造部門B 30％\n・修繕部 → 動力部25％、製造部門A 45％、製造部門B 30％\n補助部門費を製造部門に配賦する仕訳（第2次集計）を、1本にまとめて示しなさい。",
    options: ["製造部門A{A}円、製造部門B{B}円","製造部門A{wA}円、製造部門B{wB}円","製造部門A{dA}円、製造部門B{dB}円","製造部門A{nA}円、製造部門B{nB}円"],
    answer: 1,
    journal: {"accounts":["製造部門A費","製造部門B費","動力部費","修繕部費","製造間接費","仕掛品"],"entries":[{"label":"補助部門費の配賦","dr":[["製造部門A費","{A}"],["製造部門B費","{B}"]],"cr":[["動力部費","{P0}"],["修繕部費","{R0}"]]}]},
    explanation: "【結論】（借）製造部門A費 {A}・製造部門B費 {B}／（貸）動力部費 {P0}・修繕部費 {R0}\n【なぜ】ひとことで：階梯式配賦法は「たくさんサービスを提供している補助部門から先に配る。先に配った部門は、後の部門からは受け取らない」。補助部門間のやりとりを、一方通行だけ計算に入れる方法。\n・順序：他の補助部門へのサービスの金額が大きい部門を先にします。お互いのやりとりのうち、大きい方を計算に入れ、小さい方を捨てるためです。\n・先の部門：製造部門だけでなく、後の補助部門にも配ります。\n・後の部門：自分の部門費＋先の部門から受け取った分を、製造部門だけに配ります（先の部門には戻しません）。\n・仕訳：補助部門費の勘定を全部空にして、製造部門費に移します。だから貸方は第1次集計の部門費の全額、借方の合計も同じ額になります。\n図：区分｜直接配賦法：補助部門間のやりとりを無視｜階梯式配賦法：先の部門だけが後の部門に配る｜相互配賦法：*お互いのやりとりを計算に入れる（簡便法・連立方程式法）\n【手順】\n・他の補助部門への提供額：動力部→修繕部＝{P0}×20％＝{tp}円、修繕部→動力部＝{R0}×25％＝{tr}円 → {?pf == 1|動力部|修繕部}を先に配賦する\n{?pf == 1|・動力部：A＝{P0}×50％、B＝{P0}×30％、修繕部へ{tp}円 → 修繕部の合計{R0 + tp}円を、A：B＝45：30で配賦|・修繕部：A＝{R0}×45％、B＝{R0}×30％、動力部へ{tr}円 → 動力部の合計{P0 + tr}円を、A：B＝50：30で配賦}\n・製造部門A＝{A}円、製造部門B＝{B}円（合計{A + B}円＝{P0}＋{R0}）\n【つまずき】{wA}円・{wB}円は配賦の順序を逆にした誤り、{dA}円・{dB}円は直接配賦法の金額です。{nA}円・{nB}円は補助部門間の授受分を配賦しなかった誤りで、合計が部門費の総額と一致しません。\n【実務】病院の部門別計算で、中央材料室・情報システム部門など、他部門へのサービスが多い部門から順に配る場面で効きます。根拠：原価計算基準 十八。",
    vary: {"vars":{"P0":[600000,200000,1500000,10000],"R0":[400000,200000,1500000,10000]},"calc":{"pf":"if(P0 * 20 > R0 * 25, 1, 0)","A1":"P0 * 50 / 100 + (R0 + P0 * 20 / 100) * 45 / 75","B1":"P0 * 30 / 100 + (R0 + P0 * 20 / 100) * 30 / 75","A2":"R0 * 45 / 100 + (P0 + R0 * 25 / 100) * 50 / 80","B2":"R0 * 30 / 100 + (P0 + R0 * 25 / 100) * 30 / 80","A":"if(P0 * 20 > R0 * 25, P0 * 50 / 100 + (R0 + P0 * 20 / 100) * 45 / 75, R0 * 45 / 100 + (P0 + R0 * 25 / 100) * 50 / 80)","B":"if(P0 * 20 > R0 * 25, P0 * 30 / 100 + (R0 + P0 * 20 / 100) * 30 / 75, R0 * 30 / 100 + (P0 + R0 * 25 / 100) * 30 / 80)","wA":"if(P0 * 20 > R0 * 25, R0 * 45 / 100 + (P0 + R0 * 25 / 100) * 50 / 80, P0 * 50 / 100 + (R0 + P0 * 20 / 100) * 45 / 75)","wB":"if(P0 * 20 > R0 * 25, R0 * 30 / 100 + (P0 + R0 * 25 / 100) * 30 / 80, P0 * 30 / 100 + (R0 + P0 * 20 / 100) * 30 / 75)","dA":"P0 * 50 / 80 + R0 * 45 / 75","dB":"P0 * 30 / 80 + R0 * 30 / 75","nA":"P0 * 50 / 100 + R0 * 45 / 100","nB":"P0 * 30 / 100 + R0 * 30 / 100","tp":"P0 * 20 / 100","tr":"R0 * 25 / 100"},"when":"P0 * 20 != R0 * 25 && isInt(A1) && isInt(B1) && isInt(A2) && isInt(B2) && isInt(dA) && isInt(dB) && A != dA && wA != dA && abs(P0 * 20 - R0 * 25) * 5 <= P0 * 20"},
  },
  {
    id: 64,
    category: "工業簿記",
    topics: ["総合原価計算"],
    level: "hard",
    question: "単純総合原価計算（先入先出法）を行っている。材料は工程の始点で投入する。工程の終点で正常仕損が発生し、仕損費は完成品のみが負担する（仕損品の原価を区別して計算する方法）。仕損品の処分価値は合計{sv}円である。\n・月初仕掛品：{B}個（加工進捗度{Bp}％）、材料費{Bm}円、加工費{Bk}円\n・当月投入：{In}個、材料費{M}円、加工費{K}円\n・完成品{F}個、正常仕損{L}個、月末仕掛品{E}個（加工進捗度{Ep}％）\n\n問1 正常仕損費を求めなさい。\n問2 完成品と仕損品を仕掛品勘定から振り替える仕訳をしなさい（仕損品の処分価値は仕損品勘定に計上する）。",
    options: ["正常仕損費{sp}円、完成品原価{FG}円","正常仕損費{wsp}円、完成品原価{wFG}円","正常仕損費{sp}円、完成品原価{FG - sp}円","正常仕損費{sp}円、完成品原価{FG - Bm - Bk}円"],
    answer: 1,
    journal: {"accounts":["製品","仕損品","仕掛品","仕損費","売上原価"],"entries":[{"label":"問2 完成品・仕損品の振替","dr":[["製品","{FG}"],["仕損品","{sv}"]],"cr":[["仕掛品","{FG + sv}"]]}]},
    input: [{"label":"問1 正常仕損費","value":"{sp}","unit":"円"}],
    explanation: "【結論】問1 正常仕損費 {sp}円　問2（借）製品 {FG}・仕損品 {sv}／（貸）仕掛品 {FG + sv}\n【なぜ】ひとことで：正常な仕損は「良い製品を作るために避けられないコスト」なので、良い製品の原価に含める。売れる分（処分価値）は、仕損品という資産として残す。\n・負担するのは誰か：仕損は工程の終点で発生するので、まだ終点に届いていない月末仕掛品は負担しません。完成品だけが負担します。\n・仕損品の原価：仕損品も終点まで加工されたので、材料費・加工費とも1個分の原価がかかっています。そこから処分価値を差し引いた額が正常仕損費です。\n・仕訳：仕掛品勘定から、完成品（正常仕損費を含む）を製品へ、処分価値を仕損品へ振り替えます。\n図：区分｜完成品のみ負担：月末仕掛品が発生点を通過していない、発生点が終点｜両者負担：*月末仕掛品が発生点を通過している｜注：月末仕掛品の進捗度と、仕損・減損の発生点を比べて決める\n【手順】\n・材料費の単価＝{M}÷({F - B}＋{L}＋{E})個＝@{mu}円、加工費の単価＝{K}÷({F}－{B * Bp / 100}＋{L}＋{E * Ep / 100})個＝@{ku}円\n・月末仕掛品＝{E}×@{mu}＋{E * Ep / 100}×@{ku}＝{EW}円\n・正常仕損費＝{L}×(@{mu}＋@{ku})－処分価値{sv}＝{sp}円\n・完成品原価＝月初{Bm + Bk}＋当月着手完成分（材料{F - B}個・加工{F - B * Bp / 100}個）{mu * (F - B) + ku * (F - B * Bp / 100)}＋正常仕損費{sp}＝{FG}円\n【つまずき】処分価値を差し引かないと、仕損費{wsp}円・完成品原価{wFG}円になります。完成品原価{FG - sp}円は仕損費を加え忘れた誤りです。\n【実務】検査で不合格となった製品の処分価値を差し引いて、良品の原価に含める場面で効きます。根拠：原価計算基準 二七。",
    vary: {"vars":{"B":[200,100,400,50],"Bp":[40,20,80,10],"F":[1000,600,2000,50],"L":[50,10,100,10],"E":[250,50,400,50],"Ep":[60,20,80,10],"mu":[400,100,800,10],"ku":[300,100,800,10],"Bm":[80000,10000,300000,1000],"Bk":[24000,5000,200000,1000],"sv":[5000,1000,30000,1000]},"calc":{"In":"F + L + E - B","M":"mu * (F - B + L + E)","K":"ku * (F - B * Bp / 100 + L + E * Ep / 100)","EW":"mu * E + ku * E * Ep / 100","sp":"(mu + ku) * L - sv","FG":"Bm + Bk + mu * (F - B) + ku * (F - B * Bp / 100) + (mu + ku) * L - sv","wFG":"Bm + Bk + mu * (F - B) + ku * (F - B * Bp / 100) + (mu + ku) * L","wsp":"(mu + ku) * L"},"when":"B < F && isInt(B * Bp / 100) && isInt(E * Ep / 100) && sv * 2 < (mu + ku) * L && Bm * 10 >= mu * B * 7 && Bm * 10 <= mu * B * 13 && Bk * 10 >= ku * B * Bp / 100 * 7 && Bk * 10 <= ku * B * Bp / 100 * 13"},
  },
  {
    id: 65,
    category: "工業簿記",
    topics: ["総合原価計算"],
    question: "連産品A（生産量{qA}kg、分離点における市価@{pA}円/kg）と連産品B（生産量{qB}kg、分離点における市価@{pB}円/kg）が、同一工程から生産された。結合原価の総額{J}円を、正常市価基準（分離点市価を基準とする方法）により按分するとき、連産品Aに按分される結合原価はいくらか。",
    options: ["{ans}円","{byQ}円","{byQB}円","{VA - ans}円"],
    answer: 1,
    input: [{"value":"{ans}","unit":"円"}],
    explanation: "【結論】連産品Aに按分される結合原価 {ans}円\n【なぜ】ひとことで：同じ工程から同時にできる連産品は、どれにいくらかかったかを物理的に分けられない。だから「負担できる力（市価）」の大きさで分ける。\n・たとえ：1頭の牛から、高い部位と安い部位が取れます。重さで原価を分けると、安い部位が赤字になってしまいます。\n・正常市価基準：分離点での市価×生産量（市価の総額）の比で、結合原価を分けます。\n図：帯｜分離点の市価総額：A={VA:raw}@a、B={VB:raw}@b｜注：この比で結合原価{J}円を按分する\n【手順】\n・A市価総額＝{qA}kg×@{pA}円＝{VA}円\n・B市価総額＝{qB}kg×@{pB}円＝{VB}円\n・A按分額＝{J}円×({VA}円÷{T}円)＝{ans}円\n【つまずき】生産量の比（{qA}：{qB}）でそのまま按分すると{byQ}円になりますが、正常市価基準は「市価の総額」の比で按分する点に注意しましょう。{VA - ans}円は、按分額ではなく、Aの市価総額と按分額の差（Aの売上総利益に当たる額）を求めた誤りです。",
    vary: {"vars":{"qA":[300,100,500,50],"pA":[1000,500,2000,100],"qB":[200,100,500,50],"pB":[1500,500,2000,100],"J":[500000,200000,1000000,10000]},"calc":{"VA":"qA * pA","VB":"qB * pB","T":"qA * pA + qB * pB","ans":"J * qA * pA / (qA * pA + qB * pB)","byQ":"J * qA / (qA + qB)","byQB":"J * qB / (qA + qB)"},"when":"isInt(ans) && isInt(byQ) && isInt(byQB) && J < T"},
  },
  {
    id: 66,
    category: "工業簿記",
    topics: ["総合原価計算"],
    level: "hard",
    question: "同一の工程から、連産品X・Yと副産物Zが生産される。当月の連結原価は{J}円である。\n・副産物Z：見積売却価額{sz}円、見積販売費{cz}円\n・連産品X：最終の販売価額{Sx}円。分離後に追加加工費{Ax}円がかかる\n・連産品Y：販売価額{Sy}円（追加加工なし）\n副産物の評価額（見積売却価額－見積販売費）を連結原価から控除し、残りを分離点での見積正味実現可能価額の比で連産品に配分する。連産品Xの製造原価（追加加工費を含む）と、連産品Yへの連結原価の配分額を求めなさい。",
    options: ["連産品X{X}円、連産品Y{jy}円","連産品X{wjx + Ax}円、連産品Y{wjy}円","連産品X{njx + Ax}円、連産品Y{njy}円","連産品X{jx}円、連産品Y{jy}円"],
    answer: 1,
    input: [{"label":"連産品Xの製造原価","value":"{X}","unit":"円"},{"label":"連産品Yへの配分額","value":"{jy}","unit":"円"}],
    explanation: "【結論】連産品Xの製造原価 {X}円、連産品Yへの配分額 {jy}円\n【なぜ】ひとことで：副産物は「おまけ」なので、売れる見込み額を先に原価から差し引く。残りを、連産品が「分離した時点で持っている価値」の比で分ける。\n・副産物：主な製品ではないので、原価を細かく計算せず、見積売却価額から販売費を引いた額を評価額として、連結原価から控除します。\n・分離点での価値：Xは分離後に追加加工しないと売れないので、最終の販売価額から追加加工費を差し引きます。追加加工でつく価値まで含めると、Xに原価を配りすぎます。\n・Xの製造原価：配分された連結原価に、追加加工費を加えます。\n図：帯｜分離点での価値：X（{Sx}－{Ax}）={nx:raw}@a、Y={Sy:raw}@b｜注：副産物の評価額{Z}円を引いた{JJ}円を、この比で配分する\n【手順】\n・副産物の評価額＝{sz}－{cz}＝{Z}円 → 配分する連結原価＝{J}－{Z}＝{JJ}円\n・分離点での価値：X＝{Sx}－{Ax}＝{nx}円、Y＝{Sy}円\n・Xへの配分＝{JJ}×{nx}/({nx}＋{Sy})＝{jx}円（{a}：{b}の比） → Xの製造原価＝{jx}＋{Ax}＝{X}円\n・Yへの配分＝{JJ}×{Sy}/({nx}＋{Sy})＝{jy}円\n【つまずき】Yへの配分{wjy}円は最終の販売価額の比で配分した誤り、{njy}円は副産物の評価額を控除しなかった誤りです。Xの製造原価{jx}円は、追加加工費を加え忘れています。\n【実務】給食部門の仕込み（同じ食材から複数の料理と、売却できる端材ができる）など、共通の費用を製品に配る場面の考え方です。根拠：原価計算基準 二八・二九。",
    vary: {"vars":{"a":[3,1,5,1],"b":[2,1,5,1],"q":[192,50,600,1],"U":[200000,50000,500000,10000],"Ax":[200000,50000,800000,10000],"sz":[60000,10000,200000,1000],"cz":[10000,1000,50000,1000]},"calc":{"JJ":"(a + b) * q * 1000","J":"(a + b) * q * 1000 + sz - cz","Z":"sz - cz","nx":"a * U","Sx":"a * U + Ax","Sy":"b * U","jx":"q * 1000 * a","jy":"q * 1000 * b","X":"q * 1000 * a + Ax","wjx":"round((a + b) * q * 1000 * (a * U + Ax) / (a * U + Ax + b * U))","wjy":"(a + b) * q * 1000 - round((a + b) * q * 1000 * (a * U + Ax) / (a * U + Ax + b * U))","njx":"round(((a + b) * q * 1000 + sz - cz) * a / (a + b))","njy":"(a + b) * q * 1000 + sz - cz - round(((a + b) * q * 1000 + sz - cz) * a / (a + b))"},"when":"a != b && cz < sz && Ax * 2 < a * U + Ax && (sz - cz) * 10 <= J && q * 1000 < U && q * 2000 >= U && wjy != jy && njy != jy && wjx + Ax != X && njx + Ax != X"},
  },

    level: "hard",
    question: "製品X（限界利益率{mX}％）と製品Y（限界利益率{mY}％）を販売しており、固定費は年間{F}円である。現在の売上高の構成比はX{sX}％、Y{100 - sX}％である。来期は構成比がX{sX2}％、Y{100 - sX2}％に変わると見込まれる（限界利益率・固定費は変わらない）。現在の構成比での損益分岐点売上高と、来期の構成比での損益分岐点売上高を求めなさい。",
    options: ["現在{b1}円、来期{b2}円","現在{b1}円、来期{b1}円","現在{wb}円、来期{wb}円","現在{b2}円、来期{b1}円"],

    input: [{"label":"現在の損益分岐点売上高","value":"{b1}","unit":"円"},{"label":"来期の損益分岐点売上高","value":"{b2}","unit":"円"}],
    explanation: "【結論】現在の損益分岐点売上高 {b1}円、来期の損益分岐点売上高 {b2}円\n【なぜ】ひとことで：製品が複数あるときの損益分岐点は、売上高の構成比で重み付けした「平均の限界利益率」で固定費を割る。売れる製品の組み合わせが変われば、損益分岐点も動く。\n・限界利益率：売上高のうち、固定費の回収と利益に回せる割合です。\n・来期は、限界利益率の高い{?mX > mY|X|Y}の割合が{?w2 > w1|増える|減る}ので、平均の限界利益率が{?w2 > w1|上がり、損益分岐点は下がります|下がり、損益分岐点は上がります}。\n・単純平均にしないのは、売上の多い製品ほど全体の利益率に大きく影響するからです。\n【つまずき】構成比の変化を無視すると来期も{b1}円、限界利益率を単純平均（{(mX + mY) / 2}％）すると{wb}円になります。\n【実務】診療科ごとに利益率が違う病院で、患者構成の変化が損益分岐点を動かす理由を説明する場面で効きます。",
    vary: {"vars":{"mX":[40,20,60,5],"mY":[25,10,50,5],"sX":[60,30,70,10],"sX2":[40,20,80,10],"g":[1000,300,5000,100]},"calc":{"w1":"(mX * sX + mY * (100 - sX)) / 100","w2":"(mX * sX2 + mY * (100 - sX2)) / 100","F":"(mX * sX + mY * (100 - sX)) / 100 * (mX * sX2 + mY * (100 - sX2)) / 100 * g","b1":"100 * (mX * sX2 + mY * (100 - sX2)) / 100 * g","b2":"100 * (mX * sX + mY * (100 - sX)) / 100 * g","wb":"round(((mX * sX + mY * (100 - sX)) / 100 * (mX * sX2 + mY * (100 - sX2)) / 100 * g) * 100 / ((mX + mY) / 2))"},"when":"sX != sX2 && mX != mY && isInt(F) && isInt(b1) && isInt(b2) && wb != b1 && wb != b2"},

  {
    id: 70,
    category: "工業簿記",
    topics: ["直接原価計算・CVP分析"],
    level: "hard",
    question: "製品の資料は次のとおりである（棚卸資産の払出しは先入先出法。仕掛品はない）。\n・期首製品{Qb}個（全部原価計算では、1個あたり@{fb}円の固定製造間接費を含む）、当期生産{Qp}個、当期販売{Qs}個\n・販売価格@{p}円、変動費（製造・販売の合計）@{v}円（期首製品も同じ）\n・固定製造間接費{F}円（全部原価計算では当期の生産量に配賦）、固定販売費及び一般管理費{Fs}円\n直接原価計算による営業利益と、全部原価計算による営業利益を求めなさい。",
    options: ["直接原価計算{DC}円、全部原価計算{FC}円","直接原価計算{DC}円、全部原価計算{wFC}円","直接原価計算{DC}円、全部原価計算{xFC}円","直接原価計算{FC}円、全部原価計算{DC}円"],
    answer: 1,
    input: [{"label":"直接原価計算の営業利益","value":"{DC}","unit":"円"},{"label":"全部原価計算の営業利益","value":"{FC}","unit":"円"}],
    explanation: "【結論】直接原価計算の営業利益 {DC}円、全部原価計算の営業利益 {FC}円\n【なぜ】ひとことで：2つの方法の利益の差は、固定製造間接費が「在庫に入って期をまたいだ分」だけ。期末在庫に入った分は今期の費用にならず、期首在庫に入っていた分は今期の費用になる。\n・直接原価計算：固定製造間接費{F}円は、全額が当期の費用です。\n・全部原価計算：期末在庫に含まれる固定製造間接費は次期へ送られ（利益＋）、期首在庫に含まれていた前期の固定製造間接費は当期の費用になります（利益－）。\n・固定費調整：全部原価計算の利益＝直接原価計算の利益＋期末在庫の固定費－期首在庫の固定費。\n図：帯｜固定費調整：期末在庫の固定費（＋）={fe:raw}@a、期首在庫の固定費（－）={fbB:raw}@d\n【手順】\n・直接原価計算の営業利益＝({p}－{v})×{Qs}個－{F}－{Fs}＝{DC}円\n・当期の固定製造間接費の単価＝{F}÷{Qp}個＝@{fu}円\n・期末在庫＝{Qb}＋{Qp}－{Qs}＝{Qe}個（先入先出法なので当期生産分）→ 含まれる固定製造間接費＝{Qe}×@{fu}＝{fe}円\n・期首在庫に含まれる固定製造間接費＝{Qb}×@{fb}＝{fbB}円\n・全部原価計算の営業利益＝{DC}＋{fe}－{fbB}＝{FC}円\n【つまずき】{wFC}円は期首在庫の固定費を差し引き忘れた誤り、{xFC}円は調整の向きを逆にした誤りです。\n【実務】在庫を積み増した期に、全部原価計算の利益が直接原価計算より大きく見える理由を説明する場面で効きます。",
    vary: {"vars":{"Qb":[200,50,500,50],"fb":[500,300,900,10],"Qp":[1000,500,3000,50],"F":[600000,200000,2000000,10000],"Qs":[900,400,3200,50],"p":[3000,1500,6000,100],"v":[1200,500,3000,50],"Fs":[400000,100000,1500000,10000]},"calc":{"fu":"F / Qp","Qe":"Qb + Qp - Qs","fe":"(Qb + Qp - Qs) * F / Qp","fbB":"Qb * fb","DC":"Qs * (p - v) - F - Fs","FC":"Qs * (p - v) - F - Fs + (Qb + Qp - Qs) * F / Qp - Qb * fb","wFC":"Qs * (p - v) - F - Fs + (Qb + Qp - Qs) * F / Qp","xFC":"Qs * (p - v) - F - Fs - (Qb + Qp - Qs) * F / Qp + Qb * fb"},"when":"isInt(fu) && Qs > Qb && Qs < Qb + Qp && fe != fbB && DC > 0 && p > v * 1.3 && abs(fu - fb) * 3 <= fb && FC != DC"},
  },
  {
    id: 71,
    category: "工業簿記",
    topics: ["予算管理・業績評価"],
    level: "hard",
    question: "ある事業部の当期の営業利益は{P}千円、投下資本は{K}千円である。事業部長は、投資額{k}千円、年間の営業利益{p}千円が見込まれる新規投資を検討している。全社の資本コスト率は{c}％である。投資を実行した場合の事業部のROI（投下資本利益率）と、投資による残余利益の増減額を求めなさい。",
    options: ["ROI{roi1}％、残余利益{abs(ri)}千円の{?ri > 0|増加|減少}","ROI{roi1}％、残余利益{abs(ri)}千円の{?ri > 0|減少|増加}","ROI{wroi}％、残余利益{abs(ri)}千円の{?ri > 0|増加|減少}","ROI{roi1}％、残余利益{tri}千円の増加"],
    answer: 1,
    input: [{"label":"投資後のROI（小数第2位を四捨五入）","value":"{roi1}","unit":"％","tolerance":0.05},{"label":"残余利益の増減額","value":"{abs(ri)}","unit":"千円","choice":["増加","減少"],"choiceAnswer":"{if(ri > 0, 1, 2)}"}],
    explanation: "【結論】投資後のROI {roi1}％、残余利益 {abs(ri)}千円の{?ri > 0|増加|減少}\n【なぜ】ひとことで：ROIは「率」、残余利益は「額」。率で評価される事業部長は、今のROIより低い投資を嫌がるが、資本コストを上回るもうけがあるなら、会社全体にとっては得になる。\n・ROI＝営業利益÷投下資本。投資案の利益率（{pr:f1}％）が今のROI（{roi0:f1}％）より低いと、投資後のROIは下がります。\n・残余利益＝営業利益－投下資本×資本コスト率。投資案の利益が資本コスト（{k}×{c}％）を上回れば増えます。\n・だから：ROIだけで評価すると、全社にとって有利な投資が見送られるおそれがあります（部分最適）。残余利益はこの問題を避けられます。\n【手順】\n・現在のROI＝{P}÷{K}＝{roi0:f1}％、投資案の利益率＝{p}÷{k}＝{pr:f1}％\n・投資後のROI＝({P}＋{p})÷({K}＋{k})＝{roi1}％\n・残余利益の増減＝{p}－{k}×{c}％＝{ri:▲}千円（{?ri > 0|増加|減少}）\n【つまずき】{wroi}％は投資額を分母に足し忘れた誤り、{tri}千円は投資後の残余利益の総額で、増減額ではありません。\n【実務】部門ごとの投資の要求で、率（ROI）だけで判断すると全体最適を損なうことを説明する場面で効きます。",
    vary: {"vars":{"P":[18000,5000,50000,100],"K":[100000,30000,300000,1000],"p":[1500,300,8000,100],"k":[10000,3000,50000,1000],"c":[12,6,15,1]},"calc":{"roi0":"P / K * 100","rawr":"(P + p) / (K + k) * 1000","roi1":"round((P + p) / (K + k) * 1000) / 10","pr":"p / k * 100","ri":"p - k * c / 100","wroi":"round((P + p) / K * 1000) / 10","tri":"P + p - (K + k) * c / 100"},"when":"isInt(k * c / 100) && isInt((K + k) * c / 100) && p * K < P * k && p * 100 > k * c && ri != 0 && abs(rawr - floor(rawr) - 0.5) > 0.01 && abs((P + p) / K * 1000 - floor((P + p) / K * 1000) - 0.5) > 0.01 && tri > 0 && P * 100 > K * c && roi1 != wroi","decimals":1},
  },

    explanation: "【結論】管理可能残余利益 {ri1:▲}千円、事業部の残余利益 {ri2:▲}千円\n【なぜ】ひとことで：「人（事業部長）」を評価するときは、その人が決められるものだけで測る。「事業部そのもの」を評価するときは、事業部のために発生したものを全部含める。\n・事業部長の評価：管理できる固定費と、管理できる投資額だけを使います（管理可能性の原則）。本社が決めた設備の費用まで負わせると、本人の努力と関係のない理由で評価が下がります。\n・事業部の評価：事業部に個別に発生する費用・投資はすべて含めます。事業部を続けるべきかどうかを判断するためです。\n・本社費の配賦額：どちらにも含めません。事業部があってもなくても発生する費用だからです。\n図：区分｜事業部長の評価：限界利益、管理可能固定費、管理可能投資額｜事業部の評価：上記＋管理不能な個別固定費、本社が決めた投資額｜どちらにも含めない：*本社費の配賦額\n【手順】\n・限界利益＝{S}×(1－{vr}％)＝{cm}千円\n・管理可能利益＝{cm}－{Fc}＝{cp}千円 → 管理可能残余利益＝{cp}－{Ic}×{c}％＝{ri1:▲}千円\n・事業部貢献利益＝{cp}－{Fn}＝{dp}千円 → 事業部の残余利益＝{dp}－({Ic}＋{In})×{c}％＝{ri2:▲}千円\n【つまずき】{abs(wri)}千円は本社費の配賦額まで差し引いた誤り、管理可能残余利益{abs(xri)}千円は本社が決めた投資額まで資本コストに含めた誤りです。\n【実務】診療科長の評価と、診療科そのものの存続判断で、使う利益の範囲を分ける場面で効きます。",

    explanation: "【結論】①変動予算による予算差異 {abs(bvf)}円（{?bvf > 0|有利差異|不利差異}）、②固定予算による予算差異 {abs(bvx)}円（{?bvx > 0|有利差異|不利差異}）\n【なぜ】ひとことで：変動予算は「実際の操業度なら、本来いくらで済むはずか」に予算を直してから比べる。固定予算は、操業度が変わっても予算を直さない。\n・たとえ：患者が予定より多ければ、診療材料費が増えるのは当然です。増えた分まで「使いすぎ」と評価するのは不公平です。\n・変動予算：変動費の予算を実際の操業度に合わせるので、純粋な使いすぎ・節約だけが差異に出ます。\n・固定予算：操業度が増えた（減った）ことによる変動費の増減まで、差異に混ざります。\n図：帯｜変動予算（実際{Ha}時間）：変動費={v * Ha:raw}@a、固定費={F:raw}@b｜固定予算（基準{H}時間）：変動費={v * H:raw}@a、固定費={F:raw}@b\n【手順】\n・①予算許容額＝@{v}×{Ha}時間＋{F}＝{flex}円 → 予算差異＝{flex}－{A}＝{bvf:▲}円\n・②固定予算の予算額＝@{v}×{H}時間＋{F}＝{fix}円 → 差異＝{fix}－{A}＝{bvx:▲}円\n同じ実績でも、固定予算では{?bvx > 0|有利|不利}、変動予算では{?bvf > 0|有利|不利}と評価が逆になります。\n【つまずき】①と②を取り違えないようにします。操業度が{?dH > 0|基準より多い|基準より少ない}ので、固定予算では変動費の{?dH > 0|増加|減少}分{abs(v * dH)}円がそのまま差異に混ざります。\n【実務】患者数が予算と大きく違った月に、経費の「使いすぎ」を公平に評価するため、実績の件数に合わせて予算を組み直す場面で効きます。根拠：原価計算基準 四六。",

    options: ["{?d > 0|自製|購入}が{abs(d)}円有利","{?d > 0|購入|自製}が{abs(d)}円有利","{?d > 0|自製|購入}が{BT}円有利","両者同額"],
    answer: 1,
    input: [{"label":"有利な案と、その差額","value":"{abs(d)}","unit":"円","choice":["自製","購入"],"choiceAnswer":"{if(d > 0, 1, 2)}"}],
    explanation: "【結論】{?d > 0|自製|購入}が{abs(d)}円有利\n【なぜ】ひとことで：遊休設備で作れて、追加の固定費もかからないなら、自製で増えるのは変動費だけ。購入価格と変動費を比べればよい。\n・固定費（設備の減価償却費など）は、自製しても購入しても同じだけ発生するので、判断には関係ありません。\n・注意：設備がフル稼働のときや、自製に追加の固定費がかかるときは、その分も比べる必要があります。\n図：帯｜購入：購入代価={BT:raw}@b｜自製：変動製造原価={MT:raw}@a\n【手順】\n・購入案の原価＝@{bp}円×{N}個＝{BT}円\n・自製案の原価＝@{mk}円×{N}個＝{MT}円\n・差額＝{BT}－{MT}＝{d:▲}円（{?d > 0|自製が有利|購入が有利}）\n【つまずき】自製の原価に、固定費の配賦額まで含めないこと。遊休設備を使うので、固定費は案によって変わりません。\n【実務】検査や給食など、院内の空き設備で内製するか外部委託するかの判断で効きます。",
    vary: {"vars":{"N":[2000,500,5000,100],"bp":[600,200,1500,10],"mk":[400,150,1600,10]},"calc":{"BT":"bp * N","MT":"mk * N","d":"(bp - mk) * N"},"when":"mk != bp && abs(bp - mk) * 10 >= bp"},
  },
  {
    id: 80,
    category: "原価計算",
    topics: ["業務的意思決定"],
    question: "中間製品を分離点で売却すると@{p1}円×{Q}個＝{S1}円である。追加加工費{C}円をかけて最終製品にすると、@{p2}円×{Q}個＝{S2}円で売却できる。追加加工を行うべきかどうか、差額利益で判断するといくらか。",
    options: ["{abs(d)}円の{?d > 0|利益増加（追加加工すべき）|損失（分離点で売るべき）}","{inc}円の利益増加","{abs(d)}円の{?d > 0|損失（分離点で売るべき）|利益増加（追加加工すべき）}","{C}円の損失"],
    answer: 1,
    input: [{"label":"差額利益","value":"{abs(d)}","unit":"円","choice":["追加加工すべき","分離点で売るべき"],"choiceAnswer":"{if(d > 0, 1, 2)}"}],
    explanation: "【結論】差額利益 {abs(d)}円 → {?d > 0|追加加工すべき|分離点で売るべき}\n【なぜ】ひとことで：追加加工するかどうかは「追加加工で増える売上」と「追加加工でかかる費用」だけで決める。分離点までにかかった原価は、どちらを選んでも変わらない（埋没原価）。\n・増える売上：最終製品の売上－分離点での売上＝{inc}円。\n・増える費用：追加加工費{C}円。\n・差がプラスなら追加加工、マイナスなら分離点で売ります。\n【手順】\n・差額収益＝{S2}－{S1}＝{inc}円\n・差額原価＝追加加工費{C}円\n・差額利益＝{inc}－{C}＝{d:▲}円\n【つまずき】分離点までの原価（連結原価）を差し引かないこと。どちらを選んでもすでに発生しています。\n【実務】根拠：原価計算基準 二九（連産品の追加加工）。半製品のまま外部に売るか、さらに加工するかの判断で効きます。",
    vary: {"vars":{"p1":[500,200,1000,10],"p2":[700,300,1500,10],"Q":[1000,500,3000,100],"C":[150000,20000,1000000,10000]},"calc":{"S1":"p1 * Q","S2":"p2 * Q","inc":"(p2 - p1) * Q","d":"(p2 - p1) * Q - C"},"when":"p2 > p1 && d != 0 && abs(d) * 20 >= C"},

  {
    id: 81,
    category: "原価計算",
    topics: ["業務的意思決定"],
    level: "hard",
    question: "製品Pと製品Qを生産・販売している。1個あたりの限界利益と必要な直接作業時間は、製品Pが@{cP}円・{hP}時間、製品Qが@{cQ}円・{hQ}時間である。来月の需要の上限は、製品P{dP}個、製品Q{dQ}個である。来月の直接作業時間は{H}時間が上限で、これが唯一の制約条件である。限界利益の合計を最大にする製品Pの生産量と、そのときの限界利益の合計を求めなさい。",
    options: ["製品P{xP}個、限界利益{tot}円","製品P{wxP}個、限界利益{wtot}円","製品P{xP}個、限界利益{xtot}円","製品P{dP}個、限界利益{cP * dP + cQ * dQ}円"],
    answer: 1,
    input: [{"label":"製品Pの生産量","value":"{xP}","unit":"個"},{"label":"限界利益の合計","value":"{tot}","unit":"円"}],
    explanation: "【結論】製品Pの生産量 {xP}個、限界利益の合計 {tot}円\n【なぜ】ひとことで：足りないもの（作業時間）が1つだけなら、その「足りないもの1単位あたり」で一番もうかる製品から作る。1個あたりのもうけで比べると間違える。\n・たとえ：限られた時間で稼ぐなら、時給の高い仕事から入れるのと同じです。1件あたりの報酬が高くても、時間がかかりすぎる仕事は後回しです。\n・作業時間1時間あたりの限界利益は、Qのほうが大きいので、Qを需要の上限まで作り、残りの時間でPを作ります。\n図：帯｜作業時間{H}時間：製品Q={dQ * hQ:raw}@a、製品P={H - dQ * hQ:raw}@b\n【手順】\n・作業時間1時間あたりの限界利益：P＝{cP}÷{hP}＝@{rP:f1}円、Q＝{cQ}÷{hQ}＝@{rQ:f1}円 → 製品Qを優先\n・製品Q：需要の上限{dQ}個×{hQ}時間＝{dQ * hQ}時間を使う\n・残り{H - dQ * hQ}時間で製品P＝{H - dQ * hQ}÷{hP}＝{xP}個（需要{dP}個の範囲内）\n・限界利益＝{cQ}×{dQ}＋{cP}×{xP}＝{tot}円\n【つまずき】1個あたりの限界利益が大きい製品Pを優先すると、製品P{wxP}個・限界利益{wtot}円となり、合計が小さくなります。{xtot}円は製品Qの分を足し忘れています。全部の需要を満たす計算は、作業時間の上限を超えています。\n【実務】手術室・医師の時間が限られるとき、1時間あたりの限界利益で手術・検査の枠を配分する場面で効きます。",
    vary: {"vars":{"cP":[3000,1000,6000,100],"hP":[3,1,6,1],"cQ":[2400,800,5000,100],"hQ":[2,1,6,1],"dP":[2000,500,5000,100],"dQ":[1500,500,5000,100],"H":[6000,2000,20000,100]},"calc":{"rP":"cP / hP","rQ":"cQ / hQ","xP":"(H - dQ * hQ) / hP","tot":"cQ * dQ + cP * (H - dQ * hQ) / hP","wxP":"min(dP, floor(H / hP))","wtot":"cP * min(dP, floor(H / hP)) + cQ * min(dQ, floor((H - hP * min(dP, floor(H / hP))) / hQ))","xtot":"cP * (H - dQ * hQ) / hP"},"when":"cQ * hP > cP * hQ && cP > cQ && dQ * hQ < H && (H - dQ * hQ) / hP < dP && isInt((H - dQ * hQ) / hP) && (H - dQ * hQ) / hP > 0 && wtot != tot && wxP != xP"},
  },
  {
    id: 82,
    category: "原価計算",
    topics: ["直接原価計算・CVP分析"],
    level: "hard",
    question: "当期の売上高は{S}円、変動費率は{vr}％、固定費は{F}円である。安全余裕率と、来期に販売価格・変動費率・固定費が変わらず、売上高だけが{g}％増加した場合の営業利益を求めなさい。",
    options: ["安全余裕率{ms}％、来期の営業利益{newOI}円","安全余裕率{100 - ms}％、来期の営業利益{newOI}円","安全余裕率{ms}％、来期の営業利益{wnew}円","安全余裕率{ms}％、来期の営業利益{xnew}円"],
    answer: 1,
    input: [{"label":"安全余裕率","value":"{ms}","unit":"％"},{"label":"来期の営業利益","value":"{newOI}","unit":"円"}],
    explanation: "【結論】安全余裕率 {ms}％、来期の営業利益 {newOI}円\n【なぜ】ひとことで：安全余裕率は「今の売上が、あと何％減ったら赤字になるか」。損益分岐点からどれだけ離れているかを表す。\n・売上が増えると、増えた分の限界利益（増加額×限界利益率）がそのまま利益に上乗せされます。固定費は増えないからです。\n・経営レバレッジ：利益の伸び率は、売上の伸び率の「1÷安全余裕率」倍になります。損益分岐点に近い（安全余裕率が小さい）ほど、売上の増減で利益が大きく振れます。\n図：帯｜当期の売上高：損益分岐点売上高={F * 100 / (100 - vr):raw}@b、安全余裕={S - F * 100 / (100 - vr):raw}@c\n【手順】\n・限界利益＝{S}×(1－{vr}％)＝{CM}円、営業利益＝{CM}－{F}＝{OI}円\n・損益分岐点売上高＝{F}÷{100 - vr}％＝{F * 100 / (100 - vr)}円 → 安全余裕率＝{ms}％\n・来期の営業利益＝{OI}＋売上増加{S * g / 100}×限界利益率{100 - vr}％＝{newOI}円（経営レバレッジ係数{dol:f2}倍 → 利益は{g * 100 / ms:f1}％増）\n【つまずき】{100 - ms}％は損益分岐点比率です。{wnew}円は営業利益を売上高と同じ率で増やした誤り、{xnew}円は売上高の増加額をそのまま利益に足した誤りです。\n【実務】患者数の増減が利益に何倍で効くか（固定費の重い病院ほど大きい）を説明する場面で効きます。",
    vary: {"vars":{"S":[10000000,3000000,50000000,100000],"vr":[60,40,75,5],"ms":[25,10,45,5],"g":[10,5,20,5]},"calc":{"CM":"S * (100 - vr) / 100","F":"S * (100 - vr) / 100 * (100 - ms) / 100","OI":"S * (100 - vr) / 100 * ms / 100","dol":"100 / ms","newOI":"S * (100 - vr) / 100 * ms / 100 + S * (100 - vr) / 100 * g / 100","wnew":"S * (100 - vr) / 100 * ms / 100 * (100 + g) / 100","xnew":"S * (100 - vr) / 100 * ms / 100 + S * g / 100"},"when":"isInt(F) && isInt(OI) && isInt(CM * g / 100) && isInt(wnew) && isInt(xnew) && ms != 50"},
  },
  {
    id: 83,
    category: "原価計算",
    topics: ["直接原価計算・CVP分析"],
    question: "販売単価@{P}円、単位あたり変動費@{V}円、固定費{F}円である。目標営業利益率（売上高に対する比率）{t}％を達成する売上高はいくらか。",
    options: ["{S}円","{bep}円","{w3}円","{w4}円"],
    answer: 1,
    input: [{"value":"{S}","unit":"円"}],
    explanation: "【結論】目標営業利益率{t}％を達成する売上高 {S}円\n【なぜ】ひとことで：目標の利益が「売上高の{t}％」と決まっているなら、売上高の1円ごとに「限界利益率から目標利益率を引いた分」だけが固定費の回収に回る。\n・売上高×限界利益率－固定費＝売上高×目標利益率、を売上高について解きます。\n・言い換えると、1円売るごとに{cmr:%}％のもうけが出て、そのうち{t}％は目標の利益として残すので、固定費の回収に使えるのは差の分だけです。\n・だから：売上高＝固定費÷(限界利益率－目標利益率)。\n【手順】\n・限界利益率＝({P}円－{V}円)÷{P}円＝{cmr:%}％\n・売上高×限界利益率－固定費＝売上高×目標営業利益率\n・売上高×({cmr:%}％－{t}％)＝{F}円 → 売上高×{cmr * 100 - t}％＝{F}円 → 売上高＝{S}円\n・検算：{S}円×{cmr:%}％－{F}円＝{op}円（営業利益）、{op}円÷{S}円＝{t}％で一致\n【つまずき】{bep}円は、目標利益を考えない損益分岐点売上高（{F}円÷{cmr:%}％）です。目標利益率が売上高に対する比率で示されている点に注意しましょう。",
    vary: {"vars":{"P":[1000,500,3000,100],"V":[600,100,2500,50],"F":[900000,300000,3000000,10000],"t":[15,5,20,5]},"calc":{"cmr":"(P - V) / P","S":"F / ((P - V) / P - t / 100)","bep":"F / ((P - V) / P)","op":"F / ((P - V) / P - t / 100) * t / 100","w3":"F * (1 + t / 100) / ((P - V) / P)","w4":"F * 100 / t"},"when":"isInt(cmr * 100) && cmr - t / 100 >= 0.1 && isInt(S) && isInt(bep) && isInt(op) && isInt(w3) && isInt(w4)"},
  },
  {
    id: 84,
    category: "原価計算",
    topics: ["直接原価計算・CVP分析"],
    level: "hard",
    question: "過去4か月の機械稼働時間と製造間接費の実績は次のとおりである。正常操業圏は{Lo}〜{Hh}時間で、正常操業圏外の月のデータは使わない。\n・4月：{Hm}時間、{Cm}円　・5月：{Ho}時間、{Co}円　・6月：{Hl}時間、{Cl}円　・7月：{Hh}時間、{Ch}円\n高低点法により製造間接費を固定費と変動費に分解し、月間の固定費と、来月の予定機械稼働時間{Hp}時間における製造間接費の見積額を求めなさい。",
    options: ["固定費{F}円、見積額{est}円","固定費{wF}円、見積額{west}円","固定費{F}円、見積額{v * Hp}円","固定費{F + nm}円、見積額{est + nm}円"],
    answer: 1,
    input: [{"label":"月間の固定費","value":"{F}","unit":"円"},{"label":"来月の見積額","value":"{est}","unit":"円"}],
    explanation: "【結論】月間の固定費 {F}円、来月の見積額 {est}円\n【なぜ】ひとことで：高低点法は「操業度がいちばん高い月と低い月の2点を直線で結び、傾きを変動費率、切片を固定費とみなす」方法。\n・2点の差：操業度が増えた分だけ費用が増えたと考えると、増えた費用÷増えた操業度＝1時間あたりの変動費です。\n・正常操業圏外の月を除く理由：異常に忙しい（暇な）月は、残業代や特別な費用が混ざり、ふつうの費用の動きを表しません。それを使うと、直線がゆがみます。\n・固定費：最高点の費用から、変動費（変動費率×操業度）を引いた残りです。\n【手順】\n・5月の{Ho}時間は正常操業圏（〜{Hh}時間）の外なので除外 → 最高点は7月、最低点は6月\n・変動費率＝({Ch}－{Cl})÷({Hh}－{Hl})＝@{v}円\n・固定費＝{Ch}－@{v}×{Hh}＝{F}円\n・来月の見積額＝@{v}×{Hp}＋{F}＝{est}円\n【つまずき】5月を最高点に使うと、変動費率@{wv:f1}円・固定費{wF}円となり、見積額は{west}円になります。4月は最高点・最低点ではないので使いません。\n【実務】光熱費・委託費などの準変動費を、件数（操業度）から予算化する場面で効きます。根拠：原価計算基準（固定費・変動費の分解）。",
    vary: {"vars":{"v":[800,300,2000,10],"F":[260000,50000,1000000,1000],"Hh":[900,600,1500,10],"Hl":[450,200,590,10],"Hm":[700,300,1400,10],"nm":[3000,-8000,8000,1000],"dx":[50,20,200,10],"bo":[60000,10000,200000,1000],"Hp":[800,300,1400,10]},"calc":{"Ch":"v * Hh + F","Cl":"v * Hl + F","Cm":"v * Hm + F + nm","Ho":"Hh + dx","Co":"v * (Hh + dx) + F + bo","Lo":"Hl - 50","est":"v * Hp + F","wv":"(v * (Hh + dx) + F + bo - v * Hl - F) / (Hh + dx - Hl)","wF":"round(v * Hl + F - (v * (Hh + dx) + bo - v * Hl) / (Hh + dx - Hl) * Hl)","west":"round((v * (Hh + dx) + bo - v * Hl) / (Hh + dx - Hl) * Hp + v * Hl + F - (v * (Hh + dx) + bo - v * Hl) / (Hh + dx - Hl) * Hl)"},"when":"Hm > Hl && Hm < Hh && Hp > Hl && Hp < Hh && Hp != Hm && Hh - Hl >= 200 && Lo >= 100 && wF != F && west != est && nm != 0"},
  },
  {
    id: 85,
    category: "原価計算",
    topics: ["業務的意思決定"],
    level: "hard",
    question: "連産品Aは、分離点で@{s1}円で販売できる（数量{Q}個）。分離後に追加加工すれば@{s2}円で販売できるが、追加加工には1個あたり@{a}円の変動費と、専用設備の賃借料{Fp}円がかかり、加工中に投入数量の{y}％が減損する。なお、分離点までの連結原価のうちAへの配分額は{Ja}円である。追加加工すべきかどうかを、利益の差額とともに答えなさい。",
    options: ["{abs(d)}円の差で{?d > 0|追加加工すべき|分離点で販売すべき}","{abs(wd)}円の差で{?wd > 0|追加加工すべき|分離点で販売すべき}","{abs(xd)}円の差で{?xd > 0|追加加工すべき|分離点で販売すべき}","{abs(jd)}円の差で{?jd > 0|追加加工すべき|分離点で販売すべき}"],
    answer: 1,
    input: [{"label":"利益の差額","value":"{abs(d)}","unit":"円","choice":["追加加工すべき","分離点で販売すべき"],"choiceAnswer":"{if(d > 0, 1, 2)}"}],
    explanation: "【結論】利益の差額 {abs(d)}円 → {?d > 0|追加加工すべき|分離点で販売すべき}\n【なぜ】ひとことで：追加加工の判断は「追加加工で増える収益」と「追加加工で増える原価」の比較。連結原価は、どちらを選んでもすでに発生しているので関係ない（埋没原価）。\n・増える収益：追加加工後の売上から、分離点で売ったときの売上（あきらめる分）を引きます。\n・減損に注意：加工中に{y}％減るので、売れる数量は{Q2}個になります。\n・増える原価：1個あたりの変動費と、専用設備の賃借料です。\n図：区分｜判断に入れる（関連原価）：案によって変わる収益・原価、*機会原価（あきらめる利益）｜判断に入れない：埋没原価（発生済み）、固定費の配賦額（総額が変わらない）\n【手順】\n・追加加工後の販売数量＝{Q}×(1－{y}％)＝{Q2}個 → 収益＝{Q2}×@{s2}＝{Q2 * s2}円\n・分離点で販売した場合の収益＝{Q}×@{s1}＝{Q * s1}円（追加加工すると失う）\n・追加加工費＝{Q}×@{a}＋{Fp}＝{Q * a + Fp}円\n・差額＝{Q2 * s2}－{Q * s1}－{Q * a + Fp}＝{d:▲}円 → {?d > 0|追加加工すべき|分離点で販売すべき}\n【つまずき】減損を忘れると{wd:▲}円、専用設備の賃借料を忘れると{xd:▲}円になります。{jd:▲}円は、連結原価を差し引き、分離点での販売収益を差し引かなかった誤りです。\n【実務】院内で作る製剤や給食の半製品を、そのまま使うか追加加工するかの判断で、すでに発生した原価を判断に入れない場面で効きます。",

    topics: ["設備投資の意思決定"],

    question: "設備投資案（初期投資額{I}千円）の各年度の税引後キャッシュ・フローは、1年目{c1}千円、2年目{c2}千円、3年目{c3}千円、4年目{c4}千円と見込まれる。資本コスト5％の現価係数は、1年0.9524、2年0.9070、3年0.8638、4年0.8227である。単純回収期間法と割引回収期間法による回収期間を求めなさい（年の端数は、その年度のキャッシュ・フロー〔割引回収期間法では現在価値〕で按分し、小数第2位を四捨五入する）。",

    answer: 1,

    explanation: "【結論】単純回収期間 {spr}年、割引回収期間 {dpr}年\n【なぜ】ひとことで：回収期間法は「何年で元が取れるか」。割引回収期間法は、将来のお金を今の価値に直してから数えるので、そのぶん元を取るのに時間がかかる。\n・単純回収期間：毎年のキャッシュ・フローをそのまま累計し、投資額に届く年を探します。\n・割引回収期間：毎年のキャッシュ・フローに現価係数を掛けて（今の価値に直して）から累計します。将来のお金ほど小さくなるので、回収期間は長くなります。\n・端数の年：その年のキャッシュ・フロー（現在価値）のうち、何割で回収し終わるかで按分します。\n【手順】\n・累計（単純）：1年目{c1}、2年目{c1 + c2}、3年目{c1 + c2 + c3}、4年目{c1 + c2 + c3 + c4} → 単純回収期間＝{sp:f2}… → {spr}年\n・現在価値：1年目{p1:f1}、2年目{p2:f1}、3年目{p3:f1}、4年目{p4:f1} → 累計{p1:f1}、{p1 + p2:f1}、{p1 + p2 + p3:f1}、{p1 + p2 + p3 + p4:f1} → 割引回収期間＝{dp:f2}… → {dpr}年\n【つまずき】{avr}年は、4年間の平均キャッシュ・フローで初期投資額を割った誤りです（毎年のキャッシュ・フローが違うときは累計で考えます）。\n【実務】医療機器の更新で「何年で元が取れるか」を、時間価値も含めて説明する場面で効きます。",
    vary: {"vars":{"I":[10000,5000,30000,1000],"k1":[40,20,50,5],"k2":[40,20,50,5],"k3":[35,20,50,5],"k4":[25,20,50,5]},"calc":{"c1":"I * k1 / 100","c2":"I * k2 / 100","c3":"I * k3 / 100","c4":"I * k4 / 100","p1":"I * k1 / 100 * 0.9524","p2":"I * k2 / 100 * 0.907","p3":"I * k3 / 100 * 0.8638","p4":"I * k4 / 100 * 0.8227","sp":"if(c1 >= I, I / c1, if(c1 + c2 >= I, 1 + (I - c1) / c2, if(c1 + c2 + c3 >= I, 2 + (I - c1 - c2) / c3, 3 + (I - c1 - c2 - c3) / c4)))","dp":"if(p1 >= I, I / p1, if(p1 + p2 >= I, 1 + (I - p1) / p2, if(p1 + p2 + p3 >= I, 2 + (I - p1 - p2) / p3, 3 + (I - p1 - p2 - p3) / p4)))","spr":"round(sp * 10) / 10","dpr":"round(dp * 10) / 10","avr":"round(I * 4 / (c1 + c2 + c3 + c4) * 10) / 10"},"when":"c1 + c2 + c3 + c4 > I && p1 + p2 + p3 + p4 >= I && c1 < I && abs(sp - round(sp)) > 0.05 && abs(dp - round(dp)) > 0.05 && abs(sp * 10 - floor(sp * 10) - 0.5) > 0.01 && abs(dp * 10 - floor(dp * 10) - 0.5) > 0.01 && abs(I * 40 / (c1 + c2 + c3 + c4) - floor(I * 40 / (c1 + c2 + c3 + c4)) - 0.5) > 0.01 && spr != dpr && avr != spr && avr != dpr","decimals":1},

  {

    explanation: "【結論】正味現在価値 {npv:▲}円 → {?npv > 0|採用する|採用しない}\n【なぜ】ひとことで：運転資本（在庫や売掛金に寝かせるお金）は、最後に全額戻ってくる。それでも、今出ていくお金と3年後に戻るお金では価値が違うので、NPVを押し下げる。\n・最初に出ていく：設備の代金と運転資本。\n・毎年入る：税引後のキャッシュ・フロー。\n・最後に戻る：運転資本の回収と、設備の売却収入。3年後のお金なので、現価係数0.7938を掛けます。\n図：時間｜今=-{I + W:raw}｜1年後={CF:raw}｜2年後={CF:raw}｜3年後={CF + W + R:raw}\n【手順】\n・年々のCFの現在価値＝{CF}×(0.9259＋0.8573＋0.7938＝2.5770)＝{CF * 2.577}円\n・3年後の回収（運転資本＋売却）＝({W}＋{R})×0.7938＝{(W + R) * 0.7938:f1}円\n・支出＝初期投資{I}＋運転資本{W}＝{I + W}円\n・正味現在価値＝{raw:f1} → {npv:▲}円（{?npv > 0|プラスなので採用する|マイナスなので採用しない}）\n【つまずき】運転資本の回収を忘れると{w1:▲}円、運転資本を考えないと{w2:▲}円、回収だけ入れて投入を忘れると{w3:▲}円になります。\n【実務】新しい診療サービスを始めるとき、診療材料の在庫や未収金として寝かせる資金まで含めて採算を見る場面で効きます。",
    vary: {"vars":{"I":[3000000,1000000,10000000,10000],"CF":[1200000,300000,4000000,10000],"W":[500000,100000,2000000,10000],"R":[300000,10000,1000000,10000]},"calc":{"raw":"CF * 2.577 + (W + R) * 0.7938 - I - W","npv":"round(CF * 2.577 + (W + R) * 0.7938 - I - W)","w1":"round(CF * 2.577 + R * 0.7938 - I - W)","w2":"round(CF * 2.577 + R * 0.7938 - I)","w3":"round(CF * 2.577 + (W + R) * 0.7938 - I)"},"when":"abs(raw - floor(raw) - 0.5) > 0.01 && npv != 0 && w1 != npv && w2 != npv && w3 != npv && w1 != w2 && w2 != w3 && w1 != w3 && abs(npv) * 5 <= I && w1 != 0 && w2 != 0 && w3 != 0"},

    explanation: "【結論】案Bの正味現在価値 {npvB}千円、案Aの収益性指数 {piA}\n【なぜ】ひとことで：NPVは「いくら得するか（額）」、収益性指数は「投資1円あたり、いくらになるか（効率）」。規模の違う案では、両者で順位が逆になることがある。\n・NPV：現在価値の合計－初期投資額。会社の価値がいくら増えるかを表します。\n・収益性指数（PI）：現在価値の合計÷初期投資額。1を超えればNPVはプラスです。\n・どちらで選ぶか：どちらか一方しか選べないなら、会社の価値を多く増やすNPVの大きい案。予算に上限があり、複数の案を組み合わせるなら、PIの高い順に並べるのが目安になります。\n図：帯｜案A：初期投資額={Ia:raw}@b、NPV={npvA:raw}@c｜案B：初期投資額={Ib:raw}@b、NPV={npvB:raw}@c\n【手順】\n・案A：現在価値＝{ca}×4.3295＝{rA:f2} → NPV＝{npvA}千円、PI＝{rA:f2}÷{Ia}＝{piA}\n・案B：現在価値＝{cb}×4.3295＝{rB:f2} → NPV＝{npvB}千円、PI＝{piB}\n・NPVでは案B（{npvB}＞{npvA}）、PIでは案A（{piA}＞{piB}）が上位。どちらか一方しか選べない（相互排他的な）案なら、企業価値を多く増やすNPVの大きい案Bを選びます。資金に制約があり複数の案を組み合わせるときは、PIが判断の助けになります\n【つまずき】NPV{wnpvB}千円は割り引かずに計算した誤り、{pvB}千円は現在価値の合計で、初期投資額を差し引いていません。PI{wpiA}は、NPVを投資額で割った誤りです。\n【実務】予算に上限がある中で、規模の違う医療機器の投資案に優先順位をつける場面で効きます。",

  {

    explanation: "【結論】売却時の税引後キャッシュ・インフロー {cf0}千円、毎年の税引後キャッシュ・フローの増加額 {ncf}千円\n【なぜ】ひとことで：税金はキャッシュ・フローに効く。旧設備を帳簿価額より安く売ると税金が減り、高く売ると税金が増える。減価償却費が増えれば、その分の税金も減る。\n・売却時：売却{?g > 0|益|損}{abs(g)}千円に税率を掛けた分だけ、税金が{?g > 0|増える（手取りが減る）|減る（手取りが増える）}。\n・毎年：現金支出の節約は、利益が増えて税金も増えるので、税引後の分だけがキャッシュ・フローの増加です。\n・減価償却費：お金は出ていきませんが、費用なので税金を減らします（タックス・シールド）。旧設備を使い続けても旧設備の償却費は発生するので、増える分（{dn}－{dO}）だけを数えます。\n【手順】\n・売却{?g > 0|益|損}＝{s}－{bv}＝{g:▲}千円 → 税金が{abs(g) * t / 100}千円{?g > 0|増える|減る} → 売却時の税引後CF＝{s}{?g > 0|－|＋}{abs(g) * t / 100}＝{cf0}千円\n・毎年の増加額＝節約{sv}×(1－{t}％)＋償却費の増加({dn}－{dO})×{t}％＝{sv * (100 - t) / 100}＋{(dn - dO) * t / 100}＝{ncf}千円\n【つまずき】売却時{s}千円は売却損益の税金への影響を忘れた誤り、毎年{wncf}千円は旧設備の償却費を差し引かずに新設備の償却費全額の節税を数えた誤りです。\n【実務】古い医療機器を下取りに出して更新するとき、帳簿価額との差が税金を通じてキャッシュに効く場面で効きます。",

    input: [{"label":"WACC（％）","value":"{w}","unit":"％"},{"label":"企業価値（万円未満四捨五入）","value":"{V}","unit":"万円"}],
    explanation: "【結論】WACC {w}％、企業価値 {V}万円\n【なぜ】ひとことで：WACCは「会社がお金を集めるのにかかる、平均の年利」。借入れと株主からのお金を、それぞれの割合（時価）で混ぜて計算する。\n・負債コスト：支払利息は費用になって税金を減らすので、実際の負担は税引後（{rd}％×(1－{t}％)）です。\n・株主資本コスト：株主が期待するリターンです。配当や値上がりで返す必要があります。\n・企業価値：毎年同じ額のキャッシュ・フローが永遠に続くなら、その現在価値は「毎年の額÷割引率」になります。\n図：帯｜資金の調達（時価）：負債={D:raw}@b、自己資本={E:raw}@a\n【手順】\n・税引後の負債コスト＝{rd}％×(1－{t}％)＝{rdt}％\n・WACC＝{rdt}％×{D}/({D}＋{E})＋{re}％×{E}/({D}＋{E})＝{w}％\n・企業価値＝{FCF}÷{w}％＝{rawV:f1} → {V}万円\n【つまずき】負債コストを税引前のまま使うとWACCは{ww}％、企業価値は{wV}万円になります。{xw}％は構成比を考えずに単純平均した誤り、{eV}万円は株主資本コストだけで割り引いた誤りです。\n【実務】設備投資の判断に使う割引率（ハードルレート）を決める場面や、M&Aで相手先の価値を見積もる場面で効きます。",
    vary: {"vars":{"d":[40,20,60,10],"T":[10000,3000,30000,1000],"rd":[3,1,6,0.5],"t":[30,25,40,5],"re":[9,5,15,0.5],"FCF":[624,100,3000,1]},"calc":{"D":"T * d / 100","E":"T * (100 - d) / 100","rdt":"rd * (100 - t) / 100","w":"(d * rd * (100 - t) / 100 + (100 - d) * re) / 100","ww":"(d * rd + (100 - d) * re) / 100","xw":"(rd * (100 - t) / 100 + re) / 2","V":"round(FCF / ((d * rd * (100 - t) / 100 + (100 - d) * re) / 100) * 100)","wV":"round(FCF / ((d * rd + (100 - d) * re) / 100) * 100)","xV":"round(FCF / ((rd * (100 - t) / 100 + re) / 2) * 100)","eV":"round(FCF / re * 100)","rawV":"FCF / ((d * rd * (100 - t) / 100 + (100 - d) * re) / 100) * 100"},"when":"isInt(w * 100) && isInt(ww * 100) && isInt(xw * 100) && re >= rd + 2 && abs(rawV - floor(rawV) - 0.5) > 0.01 && xw != w && wV != V && xV != V && eV != V","decimals":2},

  {

    vary: {"vars":{"N":[500,100,1500,50],"a":[300,100,800,10],"b":[250,100,800,10]},"calc":{"opp":"a * N","gain":"b * N","d":"(b - a) * N"},"when":"a != b && abs(a - b) * 20 >= a"},

  {

    explanation: "【結論】全社の営業利益は{abs(delta)}円{?delta > 0|増加する（廃止すべき）|減少する（継続すべき）}\n【なぜ】ひとことで：赤字の製品をやめても、共通固定費の配賦額は消えない。やめて「なくなる費用」と「失う限界利益」を比べる。\n・失うもの：Xの限界利益と、Xと一緒に買われるYの限界利益の減少分。\n・なくなるもの：個別固定費のうち、廃止で発生しなくなる{a}％だけ。\n・共通固定費：Xがなくなっても総額は変わらず、残った製品に配り直されるだけです。セグメント損益の赤字が、そのまま消えるわけではありません。\n図：帯｜廃止で失う：Xの限界利益={cm:raw}@d、Yの限界利益の減少={ly:raw}@d｜廃止でなくなる：個別固定費（回避可能分）={av:raw}@c\n【手順】\n・失うXの限界利益＝{S}×(1－{vr}％)＝{cm}円\n・回避できる個別固定費＝{F1}×{a}％＝{av}円\n・Yの限界利益の減少＝{CMy}×{d}％＝{ly}円\n・全社の営業利益の増減＝－{cm}＋{av}－{ly}＝{delta:▲}円 → {?delta > 0|廃止すべき|継続すべき}\n【つまずき】セグメント損益の赤字{abs(seg)}円がなくなると考えるのは誤りです（共通固定費は残ります）。Yへの影響を忘れると{w1:▲}円、個別固定費が全額なくなるとみなすと{w2:▲}円になります。\n【実務】赤字の診療科や事業の撤退を検討するとき、紹介患者の減少など他部門への波及まで含めて比べる場面で効きます。",
    vary: {"vars":{"S":[5000000,2000000,20000000,100000],"vr":[70,50,80,5],"F1":[1200000,300000,5000000,100000],"a":[80,50,100,10],"Fc":[600000,100000,3000000,100000],"CMy":[8000000,2000000,30000000,100000],"d":[5,2,10,1]},"calc":{"cm":"S * (100 - vr) / 100","av":"F1 * a / 100","ly":"CMy * d / 100","delta":"-S * (100 - vr) / 100 + F1 * a / 100 - CMy * d / 100","w1":"-S * (100 - vr) / 100 + F1 * a / 100","w2":"-S * (100 - vr) / 100 + F1 - CMy * d / 100","seg":"S * (100 - vr) / 100 - F1 - Fc"},"when":"delta != 0 && seg < 0 && w1 != delta && w2 != delta && w1 != 0 && w2 != 0 && abs(w1) != abs(delta) && abs(w2) != abs(delta) && abs(seg) != abs(delta) && a < 100 && S * (100 - vr) / 100 > F1 * a / 100 * 0.5"},

    options: ["市価基準","全部原価基準","差額原価基準（限界費用基準）","振替価格を設定せず、無償で振り替える"],
    answer: 1,
    explanation: "【結論】市価基準が最も適切である。\n【なぜ】ひとことで：フル操業なら、社内に1個回すと、外部に1個売れなくなる。だから社内向けの値段も、外部に売ったときと同じ「市価」にするのが公平。\n・供給事業部：外に売っても社内に回しても同じ利益なので、どちらでも構いません。\n・受入事業部：外から買うのと同じ値段なので、社内から買うか外から買うかを、全社にとって正しく判断できます。\n・遊休能力があるときは：社内に回しても外部販売は減らないので、変動費（差額原価）で振り替えるのが全社的に望ましいとされます。\n図：区分｜フル操業・外部市場あり：*市価基準｜遊休能力あり：差額原価基準（限界費用基準）｜注：供給事業部の状況で、望ましい振替価格が変わる\n【実務】院内の検査部門・給食部門が外部の受託もしている場合、院内向けの料金を外部向けと同じにするか、原価にするかで、部門の損益が変わる理由を説明する場面で効きます。",

    answer: 1,
    input: [{"label":"販売価格差異","value":"{abs(pv)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(pv > 0, 1, 2)}"},{"label":"販売数量差異","value":"{abs(vv)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(vv > 0, 1, 2)}"}],
    explanation: "【結論】販売価格差異 {abs(pv)}円（{?pv > 0|有利差異|不利差異}）、販売数量差異 {abs(vv)}円（{?vv > 0|有利差異|不利差異}）\n【なぜ】ひとことで：利益の差異を「単価の違い」と「数量の違い」に分ける。数量が1個増えても、利益が増えるのは売上高ではなく限界利益の分だけ。\n・販売価格差異：単価の差×実際の数量。実際に売った数量のすべてで、単価の違いが効きます。\n・販売数量差異：数量の差×予算の1個あたり限界利益。1個多く売れば、変動費もかかるので、増える利益は限界利益の分です。\n・標準原価計算の「価格差異は実際数量、数量差異は標準価格」と同じ組み合わせです。\n【手順】\n・販売価格差異＝(@{ap}－@{pp})×実際{Qa}個＝{pv:▲}円（{?pv > 0|有利差異|不利差異}）\n・販売数量差異＝(実際{Qa}－予算{Qb})個×予算の限界利益@{pp - v}円＝{vv:▲}円（{?vv > 0|有利差異|不利差異}）\n【つまずき】販売数量差異{abs(wvv)}円は売上高（販売価格）で計算した誤りで、営業利益の差異の説明にはなりません。販売価格差異{abs(wpv)}円は予算の数量を使った誤りです。\n【実務】収益の予算と実績の差を、単価の変化（診療単価）と件数の変化（患者数）に分けて利益への影響を説明する場面で効きます。",

    options: ["{abs(tot)}円の{?tot > 0|有利差異|不利差異}","{abs(vy)}円の{?vy > 0|有利差異|不利差異}","{abs(vx)}円の{?vx > 0|有利差異|不利差異}","{abs(tot)}円の{?tot > 0|不利差異|有利差異}"],
    answer: 1,
    input: [{"value":"{abs(tot)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(tot > 0, 1, 2)}"}],
    explanation: "【結論】配合差異の合計 {abs(tot)}円（{?tot > 0|有利差異|不利差異}）\n【なぜ】ひとことで：配合差異は「混ぜる割合が標準と違ったこと」による差。投入した総量は実際のままにして、標準の割合で混ぜていたら各原料をどれだけ使ったか、と比べる。\n・標準配合の数量：実際の総投入量{T}kgを、標準の割合（{x}：{100 - x}）で分け直します。\n・各原料の差×標準単価：高い原料を標準より多く使えば不利、安い原料を多く使えば有利になります。\n・総量そのものが標準と違ったことによる差は、歩留差異で別に測ります。\n図：区分｜数量差異の分解：*配合差異（混ぜる割合の違い）、歩留差異（製品になる割合の違い）\n【手順】\n・標準配合での按分：X＝{T}kg×{x}％＝{Xs}kg、Y＝{T}kg×{100 - x}％＝{Ys}kg\n・X の配合差異＝({Xs}kg－{Xa}kg)×@{px}円＝{?vx < 0|△|＋}{abs(vx)}円（実際投入が{?vx > 0|少ないため有利|多いため不利}）\n・Y の配合差異＝({Ys}kg－{Ya}kg)×@{py}円＝{?vy < 0|△|＋}{abs(vy)}円（実際投入が{?vy > 0|少ないため有利|多いため不利}）\n・配合差異の合計＝{vx:▲}円{?vy < 0|－|＋}{abs(vy)}円＝{abs(tot)}円の{?tot > 0|有利差異|不利差異}\n【つまずき】{?vx > 0 && vy < 0 && px > py|安価な原料Yを標準より多く使い、高価な原料Xを標準より少なく使ったため、原料費全体としては有利差異（節約）になっています。|どの原料を標準より多く（少なく）使ったかと、その原料の単価の高低によって、原料費全体としての有利・不利が決まります。}歩留差異（総投入量が標準と違うことによる差異）とあわせて出題されることが多いので、両者の違いを整理しておきましょう。",

    answer: 1,
    input: [{"label":"製品Bへの配賦額","value":"{B}","unit":"円"},{"label":"未利用キャパシティの原価","value":"{un}","unit":"円"}],
    explanation: "【結論】製品Bへの配賦額 {B}円、未利用キャパシティの原価 {un}円\n【なぜ】ひとことで：段取りのための設備や人員は「年{cap}回できる能力」を持つために費用がかかっている。実際に使った回数分だけを製品に配り、使わなかった能力の費用は「未利用キャパシティ」として別に見せる。\n・活動ドライバー単価：能力いっぱいの回数（実際的生産能力）で割ります。実際の回数で割ると、使わなかった分の費用まで製品に上乗せされます。\n・困ること：上乗せすると、製品が売れない年ほど1個あたりの原価が高く見え、さらに値上げして売れなくなる悪循環が起きます。\n図：帯｜段取活動の原価：製品A={aB:raw}@a、製品B={B:raw}@b、未利用キャパシティ={un:raw}@d\n【手順】\n・活動ドライバー単価＝{C}÷{cap}回＝@{rate}円\n・製品Bへの配賦額＝@{rate}×{nb}回＝{B}円（製品Aは{aB}円）\n・未利用キャパシティ＝@{rate}×({cap}－{na}－{nb})回＝{un}円\n【つまずき】{wB}円は、実際の段取回数の合計（{na + nb}回）で割って全額を製品に配賦した誤りで、遊休の原価まで製品が負担することになります。\n【実務】手術室・検査機器の稼働率が低いときに、空き枠のコストを診療科に押しつけず、未利用分として把握する場面で効きます。",
    vary: {"vars":{"C":[1080000,300000,3000000,10000],"cap":[120,50,300,10],"na":[50,10,150,5],"nb":[40,10,150,5]},"calc":{"rate":"C / cap","B":"C / cap * nb","un":"C / cap * (cap - na - nb)","wB":"C * nb / (na + nb)","aB":"C / cap * na"},"when":"isInt(rate) && isInt(wB) && na + nb < cap && (na + nb) * 10 >= cap * 6 && na != nb && wB != B"},

  {

    question: "材料の年間需要量は{Dm}個、1回あたりの発注費用は{S}円、1個あたりの年間保管費用は@{H}円である。経済的発注量（EOQ）を求めなさい。また、仕入先から「1回に{Q2}個ずつ発注すれば、購入単価を1個あたり{dsc}円値引く」と提案された。{Q2}個ずつ発注した場合、EOQで発注する場合と比べて、年間の総費用（発注費用＋保管費用＋購入代価）はいくら増減するか。",

    explanation: "【結論】経済的発注量 {q}個、総費用は{abs(net)}円{?net > 0|増加（提案を断る）|減少（提案を受ける）}\n【なぜ】ひとことで：1回にたくさん発注すると、発注回数が減って発注費用は下がるが、在庫が増えて保管費用が上がる。この2つの合計が一番小さくなる量が、経済的発注量（EOQ）。\n・EOQでは、発注費用と保管費用がちょうど等しくなります。\n・数量割引の判断：EOQより多く発注すると、発注費用と保管費用の合計は増えますが、購入代価は値引きで減ります。どちらが大きいかで決めます。\n図：帯｜EOQで発注：発注費用={Dm / q * S:raw}@a、保管費用={q / 2 * H:raw}@b｜{Q2}個ずつ発注：発注費用={Dm / Q2 * S:raw}@a、保管費用={Q2 / 2 * H:raw}@b\n【手順】\n・EOQ＝√(2×{Dm}×{S}÷{H})＝{q}個 → 発注費用{Dm / q}回×{S}＝{Dm / q * S}円、保管費用{q}÷2×{H}＝{q / 2 * H}円、合計{c1}円\n・{Q2}個ずつ：発注費用{Dm / Q2}回×{S}＝{Dm / Q2 * S}円、保管費用{Q2}÷2×{H}＝{Q2 / 2 * H}円、合計{c2}円（{c2 - c1}円の増加）\n・値引き＝{Dm}個×{dsc}円＝{sav}円の減少\n・総費用の増減＝{c2 - c1}－{sav}＝{net:▲}円 → {?net > 0|増加するので提案を断る|減少するので提案を受ける}\n【つまずき】値引きを考えないと{wnet}円の増加になります。EOQ{hq}個は、公式の「2×」を忘れた誤りです。\n【実務】診療材料・医薬品の発注単位を、まとめ買いの値引きと在庫を持つコストの両方で決める場面で効きます。",

    explanation: "【結論】品質管理に関する従業員教育の実施費用が、予防コストである。\n【なぜ】ひとことで：予防コストは「不良をそもそも作らないため」の費用。検査（見つける）や手直し（直す）とは違う。\n・予防コスト：教育訓練、工程の改善、設計の見直し。\n・評価コスト：受入検査、完成品検査。不良を見つけるための費用です。\n・内部失敗コスト：出荷前に見つかった不良の手直し・再加工。\n・外部失敗コスト：出荷後の返品・クレーム対応。\n図：区分｜適合原価（自分から使う）：予防原価（教育・設計改善）、評価原価（検査）｜不適合原価（不良の結果）：内部失敗原価（出荷前の手直し）、外部失敗原価（返品・クレーム）｜注：予防・評価に使うほど、失敗原価は減る傾向がある\n【実務】医療安全の研修（予防）、ダブルチェック（評価）、インシデント後の再処置（失敗）を、同じ枠組みで整理できます。",

    question: "製品の販売価格は@{p}円、変動費率は{vr}％、年間の固定費は{F}円、法人税等の税率は30％である（営業外損益はない）。税引後の当期純利益{T}円を達成するために必要な販売数量と、そのときの安全余裕率を求めなさい。",
    options: ["販売数量{Q}個、安全余裕率{ms}％","販売数量{wQ}個、安全余裕率{ms}％","販売数量{Q}個、安全余裕率{100 - ms}％","販売数量{bQ}個、安全余裕率{ms}％"],

    vary: {"vars":{"p":[2000,1000,5000,100],"vr":[60,40,75,5],"Qb":[3000,500,10000,100],"ms":[20,5,30,5]},"calc":{"F":"Qb * p * (100 - vr) / 100","Q":"Qb * 100 / (100 - ms)","pre":"(Qb * 100 / (100 - ms) - Qb) * p * (100 - vr) / 100","T":"(Qb * 100 / (100 - ms) - Qb) * p * (100 - vr) / 100 * 0.7","S":"Qb * 100 / (100 - ms) * p","bep":"Qb * p","wQ":"round((Qb * p * (100 - vr) / 100 + (Qb * 100 / (100 - ms) - Qb) * p * (100 - vr) / 100 * 0.7) / (p * (100 - vr) / 100))","bQ":"Qb"},"when":"isInt(Q) && isInt(F) && isInt(pre) && isInt(T) && wQ != Q && T >= 10000"},

  {

    category: "会計学",
    topics: ["税効果会計"],
    question: "将来減算一時差異が{D}円ある（法定実効税率{t}％）。このうち{N}円については、将来の税務上の益金が不足する見込みが高く、税金の減額効果を見込めない（回収可能性がない）と判断された。貸借対照表に計上すべき繰延税金資産（評価性引当額控除後）はいくらか。",

    answer: 1,
    input: [{"value":"{ans}","unit":"円"}],
    explanation: "【結論】繰延税金資産 {ans}円（評価性引当額{va}円を控除した後）\n【なぜ】ひとことで：繰延税金資産は「将来、税金が安くなる」から資産になる。将来もうけ（課税所得）が足りず、税金が安くならない分は、資産にできない。\n・たとえ：割引券も、使う機会がなければ価値はゼロです。将来、税金を払うほどもうからないなら、「税金が減る」効果は使えません。\n・困ること：回収できない分まで資産にすると、ないはずの資産が貸借対照表に残り、あとで一気に取り崩すことになります。\n・だから：回収できない分を「評価性引当額」として差し引き、残りだけを繰延税金資産にします。\n図：帯｜一時差異に対応する繰延税金資産：計上する={ans:raw}@c、評価性引当額（回収できない）={va:raw}@d\n【手順】\n・一時差異全体に対応する繰延税金資産＝{D}円×{t}％＝{all}円\n・評価性引当額＝{N}円（回収見込みなしの一時差異）×{t}％＝{va}円\n・貸借対照表計上額＝{all}円－{va}円＝{ans}円\n【つまずき】一時差異の総額に税率を掛けただけの{all}円で止まるのは、回収可能性の検討（評価性引当額の控除）が抜けています。\n【実務】赤字が続く部門や法人で、繰延税金資産をどこまで計上できるかを判断する場面（監査で必ず問われる論点）で効きます。根拠：税効果会計に係る会計基準、繰延税金資産の回収可能性に関する適用指針（企業会計基準適用指針第26号）。",
    vary: {"vars":{"D":[1000000,300000,5000000,100000],"t":[30,25,40,1],"N":[400000,100000,2000000,100000]},"calc":{"all":"D * t / 100","va":"N * t / 100","ans":"D * t / 100 - N * t / 100"},"when":"N * 2 <= D && N * 5 >= D && isInt(all) && isInt(va)"},
  },
  {

    answer: 1,
    input: [{"label":"評価性引当額","value":"{va}","unit":"千円"},{"label":"法人税等調整額","value":"{abs(adj)}","unit":"千円","choice":["法人税等を減らす（貸方）","法人税等を増やす（借方）"],"choiceAnswer":"{if(adj > 0, 1, 2)}"}],
    explanation: "【結論】評価性引当額 {va}千円、法人税等調整額 {abs(adj)}千円（{?adj > 0|法人税等を減らす（貸方）|法人税等を増やす（借方）}）\n【なぜ】ひとことで：貸借対照表に載せる繰延税金資産は「回収できる分」だけ。法人税等調整額は、その「載せる額」が前期末からいくら動いたか。\n・回収できるかは、将来の課税所得を見積もって（スケジューリング）判断します。回収できない分が評価性引当額です。\n・困ること：評価性引当額を引く前の金額で法人税等調整額を計算すると、資産にしていない分まで税金費用を減らしてしまいます。\n・だから：控除後の繰延税金資産（{net}千円）と、前期末の控除後の残高（{O}千円）の差を、法人税等調整額にします。\n図：帯｜当期末（控除前{gross}千円）：繰延税金資産（計上）={net:raw}@c、評価性引当額={va:raw}@d｜前期末：繰延税金資産（計上）={O:raw}@b\n【手順】\n・繰延税金資産（控除前）＝{D}×{t}％＝{gross}千円\n・評価性引当額＝({D}－{R})×{t}％＝{va}千円 → 控除後＝{net}千円\n・法人税等調整額＝{net}－前期末{O}＝{adj:▲}千円（{?adj > 0|法人税等を減らす（貸方）|法人税等を増やす（借方）}）\n【つまずき】{net}千円は控除後の繰延税金資産で、評価性引当額ではありません。{abs(wadj)}千円は、回収可能性を考えずに全額を計上した誤りです。\n【実務】赤字が続く法人で、繰延税金資産をどこまで計上できるか（会社分類）を判断する場面で効きます。根拠：税効果会計に係る会計基準、繰延税金資産の回収可能性に関する適用指針（企業会計基準適用指針第26号）。",
    vary: {"vars":{"D":[10000,3000,30000,100],"R":[7000,1000,30000,100],"t":[30,25,40,5],"O":[2700,500,10000,100]},"calc":{"gross":"D * t / 100","va":"(D - R) * t / 100","net":"R * t / 100","adj":"R * t / 100 - O","wadj":"D * t / 100 - O"},"when":"R < D && R * 10 >= D * 4 && isInt(gross) && isInt(va) && adj != 0 && wadj != adj && O < gross && abs(adj) * 3 <= O"},

    explanation: "【結論】A等級品の完成品総合原価 {ans}千円\n【なぜ】ひとことで：等級品は「同じ種類だが、大きさや品質が違う」製品。手間の違いを等価係数で表し、数量×等価係数（積数）の比で原価を分ける。\n・たとえ：同じ生地で作るMサイズとLサイズのシャツなら、Lのほうが生地を多く使います。Lの等価係数を大きくして、多めに原価を負担させます。\n・困ること：数量の比だけで分けると、手間のかかる等級品の原価が安く計算されます。\n【手順】\n・A等級品の積数＝{qA}個×{eA:f1}＝{pA}\n・B等級品の積数＝{qB}個×1.0＝{pB}\n・A等級品の完成品総合原価＝{T}千円×({pA}／({pA}＋{pB}))＝{ans}千円\n【つまずき】{byQ}千円は、等価係数を無視して完成品数量の比（{qA}：{qB}）だけで按分した誤りです。等級別総合原価計算では、必ず等価係数を掛けた「積数」で比較します。",

    explanation: "【結論】（借）繰越利益剰余金 {div + room}／（貸）未払配当金 {div}・利益準備金 {room}\n【なぜ】ひとことで：配当で会社のお金が外に出るとき、債権者を守るために「少しだけ社内に積み立てて残す」決まりがある。ただし、積み立てには上限がある。\n・たとえ：お小遣い（配当）を渡すたびに、その1割を貯金箱（準備金）にも入れる。ただし、貯金箱が資本金の4分の1まで貯まったら、それ以上は入れなくてよい、というルールです。\n・だから：積立額は「配当の10分の1」と「資本金の4分の1までの残り」の小さい方です。\n・配当は株主総会で決まった時点で支払義務になるので、未払配当金（負債）にします。財源の繰越利益剰余金からは、配当と積立ての両方の分が減ります。\n図：帯｜繰越利益剰余金の減少：未払配当金={div:raw}@d、利益準備金={room:raw}@a\n【手順】\n①配当額の10分の1＝{div}千円×1/10＝{a}千円\n②資本金の4分の1から、すでにある準備金（資本準備金＋利益準備金）を引いた額＝{cap}×1/4－({CR}＋{RR})＝{room}千円\nよって、積立額は{room}千円です（その他利益剰余金からの配当なので、利益準備金として積み立てます）。\n【つまずき】{a}千円は、②の上限を確認しなかった誤りです。準備金の合計が資本金の4分の1に近いときは、上限に達してしまう点に注意します。",
    vary: {"vars":{"div":[1000,300,5000,100],"cap":[10000,4000,40000,1000],"CR":[1600,500,8000,10],"RR":[850,200,3000,10]},"calc":{"a":"div / 10","room":"cap / 4 - CR - RR"},"when":"isInt(cap / 4) && room > 0 && room < div / 10 && isInt(a)"},

    input: [{"label":"期末の繰延税金資産","value":"{dta}","unit":"千円"},{"label":"法人税等調整額","value":"{abs(adj)}","unit":"千円","choice":["法人税等を減らす","法人税等を増やす"],"choiceAnswer":"{if(adj > 0, 1, 2)}"}],
    explanation: "【結論】繰延税金資産 {dta}千円、法人税等調整額 {abs(adj)}千円（{?adj > 0|法人税等を減らす|法人税等を増やす}）\n【なぜ】ひとことで：未実現利益にかかった税金は「売った会社」が払っている。だから税効果は、売った会社の税率で計算する。\n・たとえ：P社がS社に利益を付けて売ると、P社はその利益に自分の税率で税金を払います。連結でその利益を消すなら、P社が払った税金の分が「前払いの税金」になります。\n・だから：P社→S社の分はP社の税率{t1}％、S社→P社の分はS社の税率{t2}％で、繰延税金資産を計算します。\n・期首の分：前期に消した利益は、当期に商品が外部へ売れて実現するので、繰延税金資産を取り崩します。法人税等調整額は、期末と期首の差です。\n【手順】\n・P社→S社（P社の税率{t1}％）：期首{U0}千円、期末{U1}千円\n・S社→P社（S社の税率{t2}％）：期末{U2}千円\n・期末の繰延税金資産＝{U1}×{t1}％＋{U2}×{t2}％＝{dta}千円\n・法人税等調整額＝{dta}－期首{U0 * t1 / 100}＝{adj:▲}千円 → {?adj > 0|法人税等を減らす|法人税等を増やす}\n【つまずき】{wdta}千円は親会社の税率で、{xdta}千円は子会社（購入側を含む）の税率で統一した誤りです。税率は「売却元」で決まります。\n【実務】税率の異なる会社（中小法人・海外子会社など）を含むグループの連結で、税効果の税率を取り違えない場面で効きます。根拠：連結財務諸表における税効果会計に関する適用指針。",
    vary: {"vars":{"m":[25,10,50,5],"T0":[125000,30000,500000,1000],"T1":[250000,30000,500000,1000],"t1":[30,25,35,1],"T2":[120000,30000,500000,1000],"m2":[20,10,50,5],"t2":[40,25,45,1]},"calc":{"U0":"T0 * m / (100 + m)","U1":"T1 * m / (100 + m)","U2":"T2 * m2 / (100 + m2)","dta":"T1 * m / (100 + m) * t1 / 100 + T2 * m2 / (100 + m2) * t2 / 100","adj":"T1 * m / (100 + m) * t1 / 100 + T2 * m2 / (100 + m2) * t2 / 100 - T0 * m / (100 + m) * t1 / 100","wdta":"(T1 * m / (100 + m) + T2 * m2 / (100 + m2)) * t1 / 100","wadj":"(T1 * m / (100 + m) + T2 * m2 / (100 + m2) - T0 * m / (100 + m)) * t1 / 100","xdta":"(T1 * m / (100 + m) + T2 * m2 / (100 + m2)) * t2 / 100","xadj":"(T1 * m / (100 + m) + T2 * m2 / (100 + m2) - T0 * m / (100 + m)) * t2 / 100"},"when":"isInt(U0) && isInt(U1) && isInt(U2) && isInt(U1 * t1 / 100) && isInt(U2 * t2 / 100) && isInt(U0 * t1 / 100) && isInt(wdta) && isInt(xdta) && isInt(wadj) && isInt(xadj) && t1 != t2 && abs(t1 - t2) >= 3 && adj != 0 && U0 != U1"},

    explanation: "【結論】法人税等調整額 {abs(adj)}千円（{?adj > 0|法人税等を減らす|法人税等を増やす}）、非支配株主に帰属する当期純利益 {abs(nci)}千円の{?nci > 0|減少|増加}\n【なぜ】ひとことで：期末の未実現利益は消し、期首の分（前期に消したもの）は当期に実現したとして戻す。子会社が付けた利益なら、その増減を非支配株主にも負担させる。\n・期末：グループ内に残っている商品の利益は、まだ外部に売れていないので消します（利益が減る）。\n・期首：前期に消した利益は、当期に商品が外部へ売れたので実現します（利益が増える）。\n・税金：どちらも、その利益にかかる税金の分を繰延税金資産で調整します。\n・非支配株主：S社（子会社）が付けた利益（アップストリーム）の分だけ、税効果後の金額を非支配株主にも負担させます。P社が付けた利益（ダウンストリーム）は、P社だけの負担です。\n【手順】\n・ダウン（P社→S社）の期末：{T1}×{m1}/(100＋{m1})＝{U1}千円\n・アップ（S社→P社）の期末：{T2}×{m2}/(100＋{m2})＝{U2}千円、期首（実現）：{T0}×{m2}/(100＋{m2})＝{U0}千円\n・法人税等調整額＝({U1}＋{U2}－{U0})×{t}％＝{adj:▲}千円 → {?adj > 0|法人税等を減らす|法人税等を増やす}\n・非支配株主＝アップの純額({U2}－{U0})×(1－{t}％)×{100 - p}％＝{nci:▲}千円 → 非支配株主に帰属する当期純利益の{?nci > 0|減少|増加}\n【つまずき】期首分の実現を忘れると{abs(wadj)}千円・{abs(wnci)}千円になります。{abs(xnci)}千円はダウンストリームまで非支配株主に負担させた誤り、{abs(ynci)}千円は税効果を考えずに按分した誤りです。\n【実務】グループ内で物品を相互に販売している医療・介護グループの連結で、未実現利益の開始仕訳と当期仕訳を組み立てる場面で効きます。根拠：連結財務諸表に関する会計基準（企業会計基準第22号）、税効果会計に係る会計基準。",
    vary: {"vars":{"p":[80,60,90,10],"t":[30,25,35,5],"T1":[130000,30000,500000,1000],"m1":[30,10,50,5],"T2":[240000,30000,500000,1000],"m2":[20,10,50,5],"T0":[180000,30000,500000,1000]},"calc":{"U1":"T1 * m1 / (100 + m1)","U2":"T2 * m2 / (100 + m2)","U0":"T0 * m2 / (100 + m2)","adj":"(T1 * m1 / (100 + m1) + T2 * m2 / (100 + m2) - T0 * m2 / (100 + m2)) * t / 100","nci":"(T2 * m2 / (100 + m2) - T0 * m2 / (100 + m2)) * (100 - t) / 100 * (100 - p) / 100","wadj":"(T1 * m1 / (100 + m1) + T2 * m2 / (100 + m2)) * t / 100","wnci":"T2 * m2 / (100 + m2) * (100 - t) / 100 * (100 - p) / 100","xnci":"(T1 * m1 / (100 + m1) + T2 * m2 / (100 + m2) - T0 * m2 / (100 + m2)) * (100 - t) / 100 * (100 - p) / 100","ynci":"(T2 * m2 / (100 + m2) - T0 * m2 / (100 + m2)) * (100 - p) / 100"},"when":"isInt(U1) && isInt(U2) && isInt(U0) && isInt(adj) && isInt(nci) && isInt(wadj) && isInt(wnci) && isInt(xnci) && isInt(ynci) && U2 != U0 && adj != 0 && nci != 0 && abs(xnci) != abs(nci) && abs(wnci) != abs(nci)"},

  {

    level: "hard",
    question: "P社は当期首にA社株式の{o}％を{C}千円で取得し（ほかに仲介手数料{ex}千円を支払った）、A社を持分法適用関連会社とした。取得時のA社の純資産（帳簿価額）は{B0}千円で、A社の土地に{Lv}千円の評価益がある（税効果{t}％）。のれん相当額は10年で均等償却する。当期のA社の当期純利益は{NI}千円、配当金は{Dv}千円である。連結財務諸表における持分法による投資損益と、期末の投資有価証券（A社株式）の金額を求めなさい。",

    answer: 1,
    input: [{"label":"持分法による投資利益","value":"{inc}","unit":"千円"},{"label":"期末のA社株式","value":"{end}","unit":"千円"}],
    explanation: "【結論】持分法による投資利益 {inc}千円、A社株式 {end}千円\n【なぜ】ひとことで：持分法は、関連会社の株を「会社の持分」として持ち、関連会社がもうけたら持分の分だけ株の金額を増やし、配当をもらったら減らす方法。\n・たとえ：共同で経営するお店の30％の持ち主なら、お店が100もうけたら自分の財産は30増えたと考えます。配当を受け取ると、お店に残っていた自分の分が手元に移るだけなので、持分は減ります。\n・取得時：払った額（手数料を含む）と、関連会社の時価の純資産のうち自分の持分との差を、のれん相当額として償却します。\n・だから：期末のA社株式＝取得原価＋利益の持分－のれん相当額の償却－受け取った配当 です。\n図：帯｜取得原価（手数料を含む）：時価の純資産の持分={net * o / 100:raw}@c、のれん相当額={gw:raw}@a\n【手順】\n・取得原価＝{C}＋手数料{ex}＝{C + ex}千円（持分法適用会社の株式の付随費用は、連結上も取得原価に含める）\n・時価純資産＝{B0}＋{Lv}×(1－{t}％)＝{net}千円 → 持分{net * o / 100}千円\n・のれん相当額＝{C + ex}－{net * o / 100}＝{gw}千円 → 償却{gw / 10}千円\n・持分法による投資利益＝{NI}×{o}％－{gw / 10}＝{inc}千円\n・期末のA社株式＝{C + ex}＋{inc}－配当{Dv}×{o}％（{Dv * o / 100}千円）＝{end}千円\n【つまずき】手数料を費用処理すると投資利益{winc}千円・A社株式{wend}千円、配当の受取りで投資を減らし忘れると{xend}千円になります。\n【実務】関連会社への出資を連結に取り込むとき、投資勘定の残高を毎期積み上げる計算そのものです。根拠：持分法に関する会計基準（企業会計基準第16号）、持分法会計に関する実務指針。",

    explanation: "【結論】（借）現金 {P}／（貸）売上 {goods}・契約負債 {P - goods}\n【なぜ】ひとことで：ポイントは「次回の値引きの約束」なので、代金の一部をポイントの分として残し、使われたときに売上にする。\n・たとえ：{P}円の買い物で{pts}円分のポイントがもらえるなら、お客さんは「商品」と「次回の値引き券」をまとめて買ったことになります。\n・分け方：ポイントの値段は、実際に使われそうな分（{u}％）で見積もって{ps}円とし、代金{P}円を「商品{P}円：ポイント{ps}円」の比で分けます。\n・だから：商品の分は今の売上に、ポイントの分はまだ約束を果たしていないので「契約負債」にします。以前の「ポイント引当金」（費用を見積もって引き当てる方法）は使いません。\n図：帯｜代金の配分：売上（商品）={goods:raw}@c、契約負債（ポイント）={P - goods:raw}@d\n【手順】\n・ポイントの独立販売価格＝{pts}ポイント×1円×{u}％＝{ps}円\n・商品への配分＝{P}円×{P}/({P}＋{ps})＝{goods}円（ポイントへの配分{P - goods}円は契約負債）\n【つまずき】{P - ps}円は、ポイントの見積額をそのまま差し引いた誤り、{P - pts}円は付与ポイントの額面を差し引いた誤りです。取引価格は「比率で配分」します。\n【実務】病院の売店・カフェのポイントカードや、健診のリピーター割引券の会計処理で効きます。",

    explanation: "【結論】完成品総合原価 {ans}円\n【なぜ】ひとことで：度外視法は「仕損がなかったことにして」計算する方法。仕損の数量を計算に入れずに良品だけで単価を出すと、仕損の原価は自然に良品全体に広がる。\n・誰が負担するか：仕損は工程の{s}％で発生し、月末仕掛品は{pe}％まで進んでいます。月末仕掛品も発生点を通過しているので、完成品と月末仕掛品の両方が負担します。\n・だから：分母から仕損の数量を除き、完成品と月末仕掛品だけで単価を出します。\n図：区分｜完成品のみ負担：月末仕掛品が発生点を通過していない、発生点が終点｜両者負担：*月末仕掛品が発生点を通過している｜注：月末仕掛品の進捗度と、仕損・減損の発生点を比べて決める\n【手順】\n・原料費単価＝{Mt}円÷({F}＋{E})個＝{m}円 → 月末{E}個×{m}円＝{wipM}円\n・加工費単価＝{Cv}円÷({F}＋{E}×{pe}％)個＝{Cv}円÷{F + eqE}個＝{c}円 → 月末{eqE}個×{c}円＝{wipC}円\n・完成品総合原価＝({Mt}＋{Cv})－({wipM}＋{wipC})＝{ans}円\n【つまずき】{w2}円は、仕損数量を分母に含めて（完成品のみ負担のときの計算で）月末仕掛品を評価した誤りです。{w4}円は、月末仕掛品の加工費に進捗度を掛け忘れた誤りです。",

    explanation: "【結論】事業部長の業績評価には管理可能利益を、事業部そのものの収益性の評価には事業部貢献利益を用いる。\n【なぜ】ひとことで：「人」と「事業」は分けて評価する。人は自分で決められることだけで、事業は事業のためにかかったもの全部で。\n・事業部長の評価：事業部長が決められない費用（本社が決めた設備の減価償却費など）を含めると、本人の努力と関係ない理由で評価が下がります。管理可能利益を使います。\n・事業部の評価：事業部を続けるかどうかの判断には、事業部に固有の費用をすべて差し引いた事業部貢献利益を使います。\n・本社費の配賦額：どちらの評価にも含めません。事業部がなくなっても総額は変わらないからです。\n図：区分｜事業部長の評価：*管理可能利益｜事業部の評価：*事業部貢献利益｜どちらにも使わない：本社費配賦後の利益\n【つまずき】本社費の配賦額は、事業部長にも事業部にも管理できないことが多く、評価に含めると判断をゆがめます。\n【実務】診療科長の評価と、診療科の存続の判断で、使う利益の範囲を分ける場面で効きます。",

  // ===================== 追加分（id 161〜208）：論点別の問題数を10問以上にそろえるための追加。すべてClaudeが新規に作問 =====================

  {

    question: "商品の当期の資料は次のとおり。払出単価は総平均法で計算する。\n・期首：{B}個（@{pb}円）　・仕入①：{P1}個（@{p1}円）　・仕入②：{P2}個（@{p2}円）　・販売：{out}個\n・期末の実地棚卸数量：{Qa}個　・期末の正味売却価額：@{nv}円\n棚卸減耗損と商品評価損を求めなさい。",

    explanation: "【結論】棚卸減耗損 {loss}円、商品評価損 {ev}円\n【なぜ】ひとことで：まず「1個いくらか（総平均の単価）」を決め、数の不足は原価で、値下がりは実際にある数で計算する。\n・総平均法：期首の商品と仕入れた商品をまとめて、平均の単価@{avg}円を1個の原価とします。\n・数の不足（棚卸減耗）：帳簿では{Qb}個のはずが実際は{Qa}個。足りない{s}個×@{avg}円が棚卸減耗損です。\n・値下がり（収益性の低下）：今売ると@{nv}円にしかならないので、実際にある{Qa}個について、原価との差を商品評価損にします。\n図：帯｜帳簿の在庫（原価）：貸借対照表の商品={Qa * nv:raw}@c、商品評価損={ev:raw}@d、棚卸減耗損={loss:raw}@d\n【手順】\n・総平均単価＝({B * pb}＋{P1 * p1}＋{P2 * p2})÷{tot}個＝@{avg}円\n・帳簿数量＝{tot}－{out}＝{Qb}個、実地{Qa}個 → 減耗{s}個×@{avg}＝{loss}円\n・商品評価損＝実地{Qa}個×(@{avg}－@{nv})＝{ev}円（貸借対照表の商品は{Qa * nv}円）\n【つまずき】{wev}円は帳簿数量で評価損を計算した誤り（減耗した商品は実在しません）、{wloss}円は減耗損を正味売却価額で計算した誤りです。\n【実務】薬剤・診療材料の期末棚卸で、紛失・破損（減耗）と期限切れ間近・相場下落（評価損）を分けて処理する場面で効きます。根拠：棚卸資産の評価に関する会計基準（企業会計基準第9号）。",
    vary: {"vars":{"B":[200,100,500,50],"pb":[500,300,1000,10],"P1":[400,200,1000,100],"p1":[520,300,1100,10],"P2":[400,200,1000,100],"p2":[530,300,1100,10],"out":[700,300,2000,50],"s":[10,2,30,1],"dn":[40,10,100,5]},"calc":{"tot":"B + P1 + P2","avg":"(B * pb + P1 * p1 + P2 * p2) / (B + P1 + P2)","Qb":"B + P1 + P2 - out","Qa":"B + P1 + P2 - out - s","nv":"(B * pb + P1 * p1 + P2 * p2) / (B + P1 + P2) - dn","loss":"s * (B * pb + P1 * p1 + P2 * p2) / (B + P1 + P2)","ev":"(B + P1 + P2 - out - s) * dn","wev":"(B + P1 + P2 - out) * dn","wloss":"s * ((B * pb + P1 * p1 + P2 * p2) / (B + P1 + P2) - dn)"},"when":"isInt(avg) && out < B + P1 + P2 && Qb > s * 10 && abs(p1 - pb) * 10 <= pb && abs(p2 - p1) * 10 <= p1 && dn * 5 <= avg && wloss != loss"},

    options: ["前期末に切り下げた額を翌期首に戻し入れ、改めて取得原価と期末の正味売却価額を比較する方法","切り下げた後の帳簿価額を、翌期以降の取得原価とみなす方法","簿価切下げを行わず、注記だけで開示する方法","正味売却価額が取得原価を上回ったときに、評価益を計上する方法"],
    answer: 1,
    explanation: "【結論】洗替法は、前期末に切り下げた額を翌期首に戻し入れ、改めて取得原価と期末の正味売却価額を比べる方法である。\n【なぜ】ひとことで：洗替法は「毎期、取得原価から測り直す」。切放法は「下げた値段を新しい取得原価にする」。\n・洗替法：前期の切下額を翌期首に戻すので、帳簿価額はいったん取得原価に戻ります。期末にまた取得原価と比べます。値段が回復していれば、切り下げは小さくなります。\n・切放法：切り下げた後の帳簿価額を新しい取得原価とみなし、戻しません。\n・どちらの方法でも、取得原価を超える評価益は計上しません。\n図：区分｜洗替法：翌期首に戻し入れる、取得原価と比べ直す｜切放法：戻し入れない、*切り下げ後を新しい取得原価とみなす\n【つまずき】「切り下げた後の帳簿価額を、翌期以降の取得原価とみなす」のは切放法の説明です。どちらを採るかは、棚卸資産の種類ごとに選び、継続して適用します。\n【実務】根拠：棚卸資産の評価に関する会計基準（企業会計基準第9号）14項。",

  {

    category: "商業簿記",
    topics: ["有価証券"],
    level: "hard",
    question: "売買目的でC社株式を、1回目に{n1}株（@{p1}円）、2回目に{n2}株（@{p2}円）購入した。その後、{s}株を@{sp}円で売却した（払出単価は移動平均法）。期末の時価は@{m}円である。有価証券売却損益と、期末の有価証券評価損益を求めなさい。",

    answer: 1,
    input: [{"label":"有価証券売却損益","value":"{abs(g)}","unit":"円","choice":["売却益","売却損"],"choiceAnswer":"{if(g > 0, 1, 2)}"},{"label":"有価証券評価損益","value":"{abs(ev)}","unit":"円","choice":["評価益","評価損"],"choiceAnswer":"{if(ev > 0, 1, 2)}"}],
    explanation: "【結論】売却{?g > 0|益|損} {abs(g)}円、評価{?ev > 0|益|損} {abs(ev)}円\n【なぜ】ひとことで：同じ株を何回かに分けて買ったら、1株の値段は「その時点の平均」。売った株も残った株も、この平均の単価で考える。\n・移動平均法：買うたびに、持っている株全体の平均単価を計算し直します。売るときは、その時点の平均単価で払い出します。\n・売買目的有価証券：すぐ売るつもりで持つ株なので、期末の時価との差（評価損益）も、そのまま当期の損益にします。\n図：帯｜購入した株（{n1 + n2}株）：売却した分（{s}株）={s * avg:raw}@b、残った分（{rem}株）={rem * avg:raw}@a｜注：どちらも平均単価@{avg}円で計算する\n【手順】\n・平均単価＝({n1 * p1}＋{n2 * p2})÷({n1}＋{n2})株＝@{avg}円\n・売却損益＝{s}株×(@{sp}－@{avg})＝{g:▲}円 → 売却{?g > 0|益|損}\n・残り{rem}株の評価損益＝{rem}株×(@{m}－@{avg})＝{ev:▲}円 → 評価{?ev > 0|益|損}\n【つまずき】売却{?wg > 0|益|損}{abs(wg)}円は1回目の単価で払い出した（先入先出法の）誤り、評価{?wev > 0|益|損}{abs(wev)}円は2回目の単価で評価した誤りです。\n【実務】短期運用の株式を複数回に分けて売買したときの、損益計算と期末評価で効きます。根拠：金融商品に関する会計基準（企業会計基準第10号）。",
    vary: {"vars":{"n1":[300,100,1000,50],"p1":[1200,500,3000,10],"n2":[200,100,1000,50],"p2":[1350,500,3000,10],"s":[250,50,800,50],"sp":[1400,500,3500,10],"m":[1250,500,3500,10]},"calc":{"avg":"(n1 * p1 + n2 * p2) / (n1 + n2)","g":"s * (sp - (n1 * p1 + n2 * p2) / (n1 + n2))","rem":"n1 + n2 - s","ev":"(n1 + n2 - s) * (m - (n1 * p1 + n2 * p2) / (n1 + n2))","wg":"s * (sp - p1)","wev":"(n1 + n2 - s) * (m - p2)"},"when":"isInt(avg) && s < n1 + n2 && g != 0 && ev != 0 && p1 != p2 && wg != g && wev != ev && abs(sp - avg) * 5 <= avg && abs(m - avg) * 5 <= avg && abs(p2 - p1) * 5 <= p1"},
  },
  {

    explanation: "【結論】投資有価証券評価損 {imp}円、評価差額金 {abs(oci)}円の{?oci > 0|貸方（プラス）|借方（マイナス）}\n【なぜ】ひとことで：「戻る見込みのない大きな値下がり」だけは損失にし、それ以外の値動きは純資産でまとめて待たせる。\n・X社株式：時価が大きく下がり、回復の見込みもないので、本当に価値が減ったと考え、当期の損失（投資有価証券評価損）にします。評価差額金には入れません。\n・Y社・Z社株式：普通の値動きなので、取得原価との差を純資産（その他有価証券評価差額金）に入れます。値上がりと値下がりは、合計して1つの金額にします。\n図：区分｜損益計算書に出る：*X社株式の減損｜純資産に入る：Y社株式の評価差額、Z社株式の評価差額\n【手順】\n・X社株式：{Cx}－{Mx}＝{imp}円を投資有価証券評価損（下落率{100 - kx}％。評価差額金には含めない）\n・Y社株式：{My}－{Cy}＝{dy:▲}円、Z社株式：{Mz}－{Cz}＝{dz:▲}円\n・評価差額金＝{dy:▲}＋{dz:▲}＝{oci:▲}円 → {?oci > 0|貸方（プラス）|借方（マイナス）}\n【つまずき】X社株式の下落まで評価差額金に入れると、{abs(woci)}円になります。Z社株式（またはY社株式）の評価益と評価損は相殺して計上します。\n【実務】持ち合い株式などの時価が大きく下がった決算で、減損と評価差額を分けて処理する場面で効きます。根拠：金融商品に関する会計基準（企業会計基準第10号）、金融商品会計に関する実務指針。",

  {

    question: "当期の2月{d}日に、額面{F}円の国債（年利率{r}％、利払日は6月末と12月末）を購入し、端数利息を支払った。決算日は3月31日で、決算時に経過利息を未収計上する。端数利息・経過利息は、1年を365日とする日割計算（前の利払日の翌日から購入日・決算日までの日数で、両端を含む）による。\n問1 購入時に支払った端数利息を求めなさい。\n問2 決算時に経過利息を未収計上する仕訳をしなさい。\n問3 当期の有価証券利息（純額）を求めなさい。",
    options: ["端数利息{frac}円、有価証券利息{int}円","端数利息{wfrac}円、有価証券利息{acc - wfrac}円","端数利息{frac}円、有価証券利息{acc}円","端数利息{frac}円、有価証券利息{acc + frac}円"],

    input: [{"label":"問1 端数利息","value":"{frac}","unit":"円"},{"label":"問3 当期の有価証券利息","value":"{int}","unit":"円"}],
    explanation: "【結論】問1 端数利息 {frac}円　問2（借）未収有価証券利息 {acc}／（貸）有価証券利息 {acc}　問3 有価証券利息 {int}円\n【なぜ】ひとことで：債券の利息は「持っていた日数分」だけが自分の利息。途中で買ったら、前の持ち主の分を先に払っておき、利払日に全額を受け取って精算する。\n・たとえ：月の途中に入居した部屋の家賃を日割りで払うのと同じです。利払日に半年分の利息が全部入ってくるので、買う時点で、前の持ち主が持っていた日数分（端数利息）を払っておきます。\n・決算時：まだ利払日が来ていなくても、決算日までの利息は当期に稼いだ分なので、未収として計上します（経過利息）。\n・当期の利息：決算日までの経過利息から、購入時に払った端数利息を差し引いた額が、自分が持っていた日数分の利息です。\n図：帯｜1月1日〜3月31日の利息：前の持ち主の分（端数利息）={frac:raw}@d、自分の分（当期の利息）={int:raw}@c\n【手順】\n・1日あたりの利息＝{F}×{r}％÷365＝{day}円\n・端数利息：1月1日〜2月{d}日＝31＋{d}＝{days}日 → {day}×{days}＝{frac}円\n・経過利息（未収）：1月1日〜3月31日＝31＋28＋31＝90日 → {day}×90＝{acc}円\n・当期の有価証券利息＝{acc}－{frac}＝{int}円（2月{d + 1}日〜3月31日の{90 - days}日分）\n【つまずき】{wfrac}円は、日数を片落とし（1日少なく）で数えた誤りです。端数利息を差し引かないと、有価証券利息は{acc}円になります。\n【実務】資金運用で、利払日の途中に債券を購入したときの利息の精算と、期末の未収計上で効きます。",
    vary: {"vars":{"Fm":[1,1,5,1],"k":[5,2,6,1],"d":[10,1,28,1]},"calc":{"F":"Fm * 1000000","r":"0.73 * k","day":"Fm * 20 * k","days":"31 + d","frac":"Fm * 20 * k * (31 + d)","acc":"Fm * 20 * k * 90","int":"Fm * 20 * k * 90 - Fm * 20 * k * (31 + d)","wfrac":"Fm * 20 * k * (30 + d)"}},

    explanation: "【結論】為替{?g < 0|差損|差益} {abs(g)}円\n【なぜ】ひとことで：お金で受け取る外貨建ての債権は、決算日の相場で円に直す。円で受け取れる額が変わったからだ。\n・たとえ：{X}ドル受け取る権利は、円高になれば円に替えたときの額が減り、円安になれば増えます。\n・だから：売掛金のように、将来お金で受け払いするもの（貨幣項目）は、決算日の相場で換算し直し、増減を為替差損益にします。\n・向き：外貨建ての債権を持つ側は円高で損、円安で得です。負債（買掛金）なら逆になります。\n【手順】\n・帳簿価額＝{X}ドル×@{HR}円＝{BV}円\n・期末換算額＝{X}ドル×@{CR}円＝{EV}円\n・債権が{abs(g)}円{?g < 0|減ったので、為替差損|増えたので、為替差益}{abs(g)}円\n【つまずき】売掛金は貨幣項目なので、取引時の相場のまま据え置くことはできません。{EV}円は期末換算額そのものです。{?g < 0|円高（{HR}円→{CR}円）は、外貨建の債権を持つ側には損です。負債（買掛金）なら逆に差益になります。|円安（{HR}円→{CR}円）は、外貨建の債権を持つ側には得です。負債（買掛金）なら逆に差損になります。}",

    explanation: "【結論】外貨建の前払金・前受金は、取引時の為替相場で換算した額のまま据え置き、換算替えしない。\n【なぜ】ひとことで：前払金・前受金は、将来「お金」ではなく「モノやサービス」で決済される。為替が動いても、受け取るモノの量は変わらないので、換算替えしない。\n・たとえ：ドルで前払いして商品を10個受け取る約束なら、為替が動いても、受け取るのは10個のままです。\n・貨幣項目（売掛金・買掛金・借入金など）は、将来ドルのお金で決済されるので、決算日の相場で換算替えします。\n図：区分｜決算日の相場で換算替え（貨幣項目）：外国通貨、売掛金、買掛金、借入金｜取引時の相場のまま（非貨幣項目）：*前払金、*前受金、棚卸資産、有形固定資産\n【つまずき】売掛金・買掛金などの貨幣項目は決算日の相場で換算替えしますが、前払金・前受金は換算替えしない点を区別します。\n【実務】根拠：外貨建取引等会計処理基準 一・2、外貨建取引等の会計処理に関する実務指針。海外から医療機器を前払いで輸入するときの決算処理で効きます。",

    explanation: "【結論】交際費の損金不算入額は、一時差異ではなく永久差異なので、税効果会計の対象にならない。\n【なぜ】ひとことで：税効果会計は「今は会計と税金がずれているが、将来もとに戻るずれ」だけを調整する。ずっと戻らないずれ（永久差異）は対象外。\n・たとえ：減価償却の超過額は、今は税金で費用と認められなくても、将来、資産を売ったり捨てたりしたときに認められます。ずれは「先送り」なだけです。\n・交際費は、将来になっても費用とは認められません。もとに戻らないので、将来の税金を減らす効果もありません。\n・だから：判断の基準は「将来、解消するかどうか」。その他有価証券の評価差額は、損益には出ませんが、売れば解消するので一時差異です。\n図：区分｜一時差異（将来解消する）：減価償却の超過額、貸倒引当金の超過額、その他有価証券の評価差額｜永久差異（解消しない）：*交際費の損金不算入、受取配当金の益金不算入｜注：税効果会計の対象は一時差異だけ\n【つまずき】一時差異か永久差異かは、「将来、解消するかどうか」で判断します。\n【実務】決算で、法人税等の負担率が法定実効税率とずれる理由（交際費などの永久差異）を、注記の「税率差異」で説明する場面で効きます。",

    explanation: "【結論】正しい。継続性の原則は、正当な理由があれば会計処理の変更を認めている（変更したときは注記する）。\n【なぜ】ひとことで：処理を毎年変えられると、利益の操作に使えるし、去年と比べられない。だから原則は「続ける」。ただし、続けるほうがおかしくなる正当な理由があれば変えてよい。\n・継続を求める理由：①利益操作の防止、②期間比較ができるようにする。\n・正当な理由の例：会計基準や法令の改正、経営環境の大きな変化など。\n・変更したら：その旨、理由、影響額などを注記し、原則として過去の期間にさかのぼって新しい方法を適用します（遡及適用）。\n【つまずき】「いかなる理由があっても変更できない」は言い過ぎで誤りです。変えたときは注記が必要です。\n【実務】根拠：企業会計原則 第一・五（継続性の原則）、注解3。会計上の変更及び誤謬の訂正に関する会計基準（企業会計基準第24号）。",

    explanation: "【結論】費用配分の原則は、資産の取得原価を、資産の種類に応じた方法で各事業年度に配分しなければならないとする原則である。\n【なぜ】ひとことで：資産は「将来の費用のかたまり」。買ったときの値段（取得原価）を、使った期ごとに費用として分けていく。\n・たとえ：10年使う機械の代金を、買った年に全部費用にすると、その年だけ大赤字に見えます。使う10年に分ければ、各年の成績が正しく見えます。\n・代表例：有形固定資産の減価償却、棚卸資産の売上原価と期末棚卸高への配分。\n図：区分｜取得原価：当期の費用（減価償却費・売上原価）、*次期以降に繰り越す分（資産）\n【つまずき】「総額で表示」は総額主義の原則、「支出した時点で計上」は現金主義の考え方です。費用と収益を対応させずに計上する原則はありません。\n【実務】根拠：企業会計原則 貸借対照表原則五。病院の医療機器の減価償却も、この原則による取得原価の期間配分です。",

    explanation: "【結論】過去の誤謬は、過去の財務諸表を修正して表示し直す（修正再表示）。\n【なぜ】ひとことで：前期の数字が「間違っていた」なら、前期の数字そのものを直す。当期でまとめて調整すると、当期の成績まで間違って見える。\n・会計上の変更との違い：\n・会計方針の変更：前期も正しかったが、方法を変える → 過去にさかのぼって新しい方法を当てはめる（遡及適用）。\n・見積りの変更：前期の見積りはそのときは正しかった → 変更した期以降で処理（さかのぼらない）。\n・誤謬：前期が間違っていた → 過去を直す（修正再表示）。\n図：区分｜過去にさかのぼる：会計方針の変更（遡及適用）、*誤謬の訂正（修正再表示）｜さかのぼらない：会計上の見積りの変更\n【つまずき】「将来の期間にわたって配分する」のは「会計上の見積りの変更」の扱いです。誤謬の訂正は、見積りの変更とは異なり、過去にさかのぼって修正します。\n【実務】根拠：会計上の変更及び誤謬の訂正に関する会計基準（企業会計基準第24号）21項。病院の決算でも、前期の計上漏れが見つかったときの扱いの考え方になります。",

    question: "新製品の予定販売価格は{P}円、目標売上高利益率は{m}％である。現在の技術で見込まれる部品別の成行原価は、部品A{a}円、部品B{b}円、部品C{c}円である。許容原価を、各部品の機能評価係数（A{wa}％、B{wb}％、C{wc}％）で割り当てて部品別の目標原価とする。許容原価と、部品Aの原価低減目標額（成行原価－目標原価）を求めなさい。",

    options: ["変動費予算差異{abs(dvv)}円の{?dvv > 0|有利差異|不利差異}、固定費予算差異{abs(dff)}円の{?dff > 0|有利差異|不利差異}","変動費予算差異{abs(wv)}円の{?wv > 0|有利差異|不利差異}、固定費予算差異{abs(dff)}円の{?dff > 0|有利差異|不利差異}","変動費予算差異{abs(tot)}円の{?tot > 0|有利差異|不利差異}、固定費予算差異0円","変動費予算差異{abs(dvv)}円の{?dvv > 0|不利差異|有利差異}、固定費予算差異{abs(dff)}円の{?dff > 0|不利差異|有利差異}"],
    answer: 1,
    input: [{"label":"変動費予算差異","value":"{abs(dvv)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(dvv > 0, 1, 2)}"},{"label":"固定費予算差異","value":"{abs(dff)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(dff > 0, 1, 2)}"}],
    explanation: "【結論】変動費予算差異 {abs(dvv)}円（{?dvv > 0|有利差異|不利差異}）、固定費予算差異 {abs(dff)}円（{?dff > 0|有利差異|不利差異}）\n【なぜ】ひとことで：予算差異を変動費と固定費に分けると、「どちらで使いすぎたか」が見える。合計だけだと、片方の節約と片方の使いすぎが打ち消し合って見えなくなる。\n・変動費予算差異：実際の操業度なら本来いくらの変動費で済んだか（@{v}×{Ha}時間）と、実際の変動費を比べます。\n・固定費予算差異：固定費は操業度に関係なく一定なので、固定費予算額と実際の固定費を比べます。\n図：帯｜予算許容額（実際{Ha}時間）：変動費={v * Ha:raw}@a、固定費={F:raw}@b｜実際発生額：変動費={Av:raw}@a、固定費={Af:raw}@b\n【手順】\n・変動費予算差異＝@{v}×{Ha}時間（{v * Ha}円）－実際{Av}＝{dvv:▲}円（{?dvv > 0|有利差異|不利差異}）\n・固定費予算差異＝{F}－実際{Af}＝{dff:▲}円（{?dff > 0|有利差異|不利差異}）\n・予算差異（合計）＝{tot:▲}円\n【つまずき】変動費予算差異{abs(wv)}円は、基準操業度{Hn}時間で予算額を計算した誤りです。合計だけを見ると、変動費の{?dvv > 0|節約|使いすぎ}と固定費の{?dff > 0|節約|使いすぎ}が打ち消し合って見えにくくなります。\n【実務】経費の予算差異を、件数に連動する費用（材料・委託）と固定的な費用（人件費・賃借料）に分けて原因を説明する場面で効きます。根拠：原価計算基準 四六。",
    vary: {"vars":{"v":[400,200,800,10],"F":[600000,200000,2000000,10000],"Hn":[1000,500,3000,100],"dH":[-20,-150,150,10],"dvv":[-3000,-20000,20000,1000],"dff":[8000,-20000,20000,1000]},"calc":{"Ha":"Hn + dH","Av":"v * (Hn + dH) - dvv","Af":"F - dff","A":"v * (Hn + dH) - dvv + F - dff","tot":"dvv + dff","wv":"v * Hn - (v * (Hn + dH) - dvv)"},"when":"dH != 0 && dvv != 0 && dff != 0 && (dvv > 0) != (dff > 0) && tot != 0 && wv != dvv && wv != 0 && abs(tot) != abs(dvv) && abs(tot) != abs(dff)"},

  {
    id: 207,
    category: "工業簿記",
    topics: ["標準原価計算"],
    question: "製品は原料X（標準配合{x}％、標準単価@{px}円）と原料Y（標準配合{100 - x}％、標準単価@{py}円）から作り、原料の投入量100kgから製品{y}kgができる（標準歩留率{y}％）。当月の製品の生産量は{Q}kg、原料の実際投入量の合計は{AI}kgであった。歩留差異はいくらか。",
    options: ["{abs(v)}円の{?v < 0|不利差異|有利差異}","{abs(v)}円の{?v < 0|有利差異|不利差異}","{abs(vx)}円の{?v < 0|不利差異|有利差異}","{abs(vy)}円の{?v < 0|不利差異|有利差異}"],
    answer: 1,
    input: [{"value":"{abs(v)}","unit":"円","choice":["有利差異","不利差異"],"choiceAnswer":"{if(v < 0, 2, 1)}"}],
    explanation: "【結論】歩留差異 {abs(v)}円（{?v < 0|不利差異|有利差異}）\n【なぜ】ひとことで：歩留差異は「原料を投入したのに、製品になった割合が標準より悪かった（良かった）」ことによる差。\n・標準投入量：製品{Q}kgを作るのに、標準の歩留率{y}％なら本来{SI}kgの原料で済むはずです。\n・実際は{AI}kg投入したので、その差が歩留まりのロス（または節約）です。\n・単価：原料はXとYを混ぜて使うので、標準の配合割合で混ぜたときの1kgあたりの単価（標準配合単価）を掛けます。配合の違いによる差は、別の配合差異で測ります。\n図：区分｜数量差異の分解：配合差異（混ぜる割合の違い）、*歩留差異（製品になる割合の違い）\n【手順】\n・標準投入量＝{Q}kg÷{y}％＝{SI}kg\n・標準配合単価＝@{px}×{x}％＋@{py}×{100 - x}％＝@{up}円\n・歩留差異＝({SI}kg－{AI}kg)×@{up}円＝{?v < 0|△|＋}{abs(v)}円（投入が{?v < 0|多すぎたので不利差異|少なく済んだので有利差異}）\n【つまずき】{abs(vx)}円は原料Xの単価だけ、{abs(vy)}円は原料Yの単価だけを使った誤りです。配合差異と組み合わせて出題されることが多い論点です。",
    vary: {"vars":{"x":[60,30,70,10],"px":[100,50,200,10],"py":[80,40,200,10],"y":[80,60,90,5],"Q":[800,200,2000,40],"dI":[50,-100,150,10]},"calc":{"SI":"Q * 100 / y","AI":"Q * 100 / y + dI","up":"px * x / 100 + py * (100 - x) / 100","v":"-dI * (px * x / 100 + py * (100 - x) / 100)","vx":"-dI * px","vy":"-dI * py"},"when":"dI != 0 && px != py && isInt(SI) && isInt(up * 10) && isInt(v) && abs(dI) * 10 <= SI"},

  // ---- 業務的意思決定 ----
  {
    id: 208,
    category: "原価計算",
    topics: ["業務的意思決定"],
    question: "機械稼働時間（年間{K}時間）が唯一の制約条件である。製品P（限界利益@{cP}円、機械{hP}時間/個、需要の上限{dP}個）と製品Q（限界利益@{cQ}円、機械{hQ}時間/個、需要の上限{dQ}個）を生産する。限界利益の合計が最大になるように生産したときの、限界利益の合計はいくらか。",
    options: ["{ans}円","{wrong}円","{onlyF}円","{K * max(rP, rQ)}円"],
    answer: 1,
    input: [{"value":"{ans}","unit":"円"}],
    explanation: "【結論】限界利益の合計 {ans}円\n【なぜ】ひとことで：機械の時間が足りないなら、「機械1時間あたり」の限界利益が大きい製品から、需要の上限まで作る。\n・1個あたりの限界利益で比べると、機械を長く使う製品を優先してしまい、時間あたりのもうけが下がります。\n・優先する製品を需要の上限まで作り、残った時間でもう一方を作ります。需要の上限を超えて作っても売れないので、上限で止めます。\n【手順】\n・機械1時間あたり：P＝{cP}÷{hP}＝@{rP}円、Q＝{cQ}÷{hQ}＝@{rQ}円 → {?rP > rQ|P|Q}を優先\n・{?rP > rQ|P：{dP}個（{dP * hP}時間）→ 残り{K - dP * hP}時間でQ：{fQ}個|Q：{dQ}個（{dQ * hQ}時間）→ 残り{K - dQ * hQ}時間でP：{fP}個}\n・限界利益の合計＝{fP}×{cP}＋{fQ}×{cQ}＝{ans}円\n【つまずき】{wrong}円は、1個あたりの限界利益が大きい{?cP > cQ|P|Q}を優先した誤りです。{onlyF}円は優先する製品だけで止めた金額、{K * max(rP, rQ)}円は需要の上限を無視して、すべての機械稼働時間を優先する製品に使った金額です。\n【実務】CTやMRIの検査枠など、限られた機器の時間を、どの検査に優先して使うかを考える場面で効きます。",
    vary: {"vars":{"K":[3000,1000,6000,100],"cP":[800,300,1500,50],"hP":[2,1,4,0.5],"dP":[1000,200,2000,100],"cQ":[900,300,1500,50],"hQ":[2.5,1,4,0.5],"dQ":[800,200,2000,100]},"calc":{"rP":"cP / hP","rQ":"cQ / hQ","fP":"if(cP / hP > cQ / hQ, min(dP, floor(K / hP)), min(dP, floor((K - min(dQ, floor(K / hQ)) * hQ) / hP)))","fQ":"if(cP / hP > cQ / hQ, min(dQ, floor((K - min(dP, floor(K / hP)) * hP) / hQ)), min(dQ, floor(K / hQ)))","ans":"cP * if(cP / hP > cQ / hQ, min(dP, floor(K / hP)), min(dP, floor((K - min(dQ, floor(K / hQ)) * hQ) / hP))) + cQ * if(cP / hP > cQ / hQ, min(dQ, floor((K - min(dP, floor(K / hP)) * hP) / hQ)), min(dQ, floor(K / hQ)))","gP":"if(cP / hP > cQ / hQ, min(dQ, floor(K / hQ)), min(dP, floor((K - min(dQ, floor(K / hQ)) * hQ) / hP)))","wrong":"if(cP / hP > cQ / hQ, cQ * min(dQ, floor(K / hQ)) + cP * min(dP, floor((K - min(dQ, floor(K / hQ)) * hQ) / hP)), cP * min(dP, floor(K / hP)) + cQ * min(dQ, floor((K - min(dP, floor(K / hP)) * hP) / hQ)))","onlyF":"if(cP / hP > cQ / hQ, cP * min(dP, floor(K / hP)), cQ * min(dQ, floor(K / hQ)))","over":"if(cP / hP > cQ / hQ, cP * dP + cQ * floor((K - dP * hP) / hQ), cQ * dQ + cP * floor((K - dQ * hQ) / hP))"},"when":"rP != rQ && (cP > cQ) != (rP > rQ) && dP * hP < K && dQ * hQ < K && dP * hP + dQ * hQ > K && isInt((K - dP * hP) / hQ) && isInt((K - dQ * hQ) / hP) && wrong != ans && onlyF != ans && isInt(K / hQ) && isInt(K / hP) && K * max(rP, rQ) != ans && K * max(rP, rQ) != wrong"},
  },

  {

    topics: ["純資産・株式"],
    question: "自己株式{n}株（1株あたり帳簿価額@{b}円）を保有している。このうち{m}株を@{p}円で処分し、代金は当座預金に払い込まれた（募集株式の発行等の手続による）。処分時の仕訳をしなさい。",
    options: ["（貸）自己株式{bvm}・その他資本剰余金{d}","（貸）自己株式{cash}","（貸）自己株式{bvm}・自己株式処分益{d}","（貸）資本金{cash}"],

    explanation: "【結論】（借）当座預金 {cash}／（貸）自己株式 {bvm}・その他資本剰余金 {d}\n【なぜ】ひとことで：自己株式の売り買いは、株主との「出資のやり取り」。もうけ（差益）が出ても、損益ではなく資本（その他資本剰余金）を増やす。\n・たとえ：会社が自分の株を買い戻すのは、株主に出資金を返すのと同じです。それを再び売るのは、新しく出資を受けるのと同じです。出資のやり取りで利益が出ることはありません。\n・だから：自己株式を帳簿の金額{bvm}円で減らし、受け取った代金との差{d}円は、その他資本剰余金にします。\n・差損のとき：代金が帳簿の金額より少なければ、差はその他資本剰余金を減らします。\n【手順】\n・処分した自己株式の帳簿価額＝{m}株×@{b}円＝{bvm}円\n・処分対価＝{m}株×@{p}円＝{cash}円\n・その他資本剰余金＝{cash}－{bvm}＝{abs(d)}円の{?d > 0|増加|減少}\n【つまずき】差額を「自己株式処分益」として損益計算書に入れるのは誤りです。処分していない株まで含めて、保有株式全体（{n}株）で計算するのも誤りです。\n【実務】自己株式の売却・ストックオプションへの交付などで、純資産の内訳が動く場面で効きます。根拠：自己株式及び準備金の額の減少等に関する会計基準（企業会計基準第1号）。",
    vary: {"vars":{"n":[1000,500,3000,100],"b":[800,300,2000,10],"m":[600,100,2500,100],"p":[900,250,2200,10]},"calc":{"d":"m * (p - b)","cash":"m * p","bvm":"m * b","wn":"n * (p - b)"},"when":"m < n && p > b && (p - b) * 10 <= b * 3 && (p - b) * 20 >= b"},
  },
  {

    explanation: "【結論】問1（借）株式報酬費用 {y1}／（貸）新株予約権 {y1}　問2（借）株式報酬費用 {y2}／（貸）新株予約権 {y2}\n【なぜ】ひとことで：ストック・オプションは「働いてもらう代わりに渡す報酬」。報酬の価値（評価単価×個数）を、働いてもらう期間（2年）に分けて費用にする。\n・相手の勘定が新株予約権（純資産）なのは、お金を払うのではなく、将来、株を渡す約束をしたからです。\n・退職者の見込みが変わったら：「2年目末までに、累計でいくら費用にしておくべきか」を、見直し後の人数で計算し直します。すでに1年目に計上した分を差し引いた残りが、2年目の費用です。\n図：帯｜2年目末までの累計（{Np - L2}人分）：1年目={y1:raw}@b、2年目={y2:raw}@a｜注：累計を見直し後の人数で決め、1年目の分を差し引く\n【手順】\n・問1：({Np}－{L1})人×{k}個×{u}円×1/2＝{y1}円\n・2年目末の累計＝({Np}－{L2})人×{k}個×{u}円×2/2＝{tot}円\n・問2：{tot}－{y1}＝{y2}円（新株予約権の残高は{tot}円）\n【つまずき】2年目も{w2}円とするのは見込みの変更を反映しない誤り、{x2}円は累計の差額ではなく、見直し後の数で1年分だけ計算した誤りです。\n【実務】役職員へのインセンティブ報酬の費用計上で、退職者の見込みが変わった期の処理で効きます。根拠：ストック・オプション等に関する会計基準（企業会計基準第8号）。",

    explanation: "【結論】商品の仕入れによる支出 {pur}千円、人件費の支出 {per}千円\n【なぜ】ひとことで：直接法は「実際に払った額」を書く。費用（発生した額）から、まだ払っていない分・先に払った分を直す。\n・仕入れ：売上原価に商品の増減を足し引きすると、当期の仕入高になります。買掛金が増えた分はまだ払っていないので引き、前払金が増えた分は先に払ったので足します。\n・賞与：期末の引当金（当期の繰入額）は、まだ払っていません。実際に払ったのは、期首の引当金の分です。\n図：T｜賞与引当金｜借：当期の支払額={B0:raw}、期末残高={B1:raw}｜貸：期首残高={B0:raw}、当期の繰入額={B1:raw}｜注：お金が出たのは借方の「支払額」だけ\n【手順】\n・仕入高＝売上原価{CG}＋商品の増減{dI:▲}＝{CG + dI}千円\n・仕入れによる支出＝{CG + dI}－買掛金の増減{dP:▲}＋前払金の増減{dV:▲}＝{pur}千円\n・人件費の支出＝給料{W}－未払給料の増減{dW:▲}＋賞与の支払{B0}＝{per}千円\n【つまずき】{wpur}千円は前払金の増減を忘れた誤りです。人件費{wper}千円・{xper}千円は、賞与の支払額ではなく当期の引当金（繰入額）を使った誤りです。\n【実務】病院の資金繰り表で、材料費・人件費の「発生」と「支払」のずれを説明する場面で効きます。根拠：連結キャッシュ・フロー計算書等の作成基準。",
    vary: {"vars":{"CG":[300000,100000,1000000,1000],"dI":[8000,-20000,20000,1000],"dP":[5000,-15000,15000,1000],"dV":[2000,-5000,5000,1000],"W":[80000,30000,300000,1000],"dW":[1000,-3000,3000,500],"B0":[6000,2000,20000,1000],"B1":[7000,2000,20000,1000]},"calc":{"pur":"CG + dI - dP + dV","per":"W - dW + B0","wpur":"CG + dI - dP","wper":"W - dW + B1","xper":"W + B1"},"when":"dI != 0 && dP != 0 && dV != 0 && dW != 0 && B0 != B1 && wpur != pur && wper != per && xper != per && abs(dI) * 10 <= CG"},

    vary: {"vars":{"C0":[50000,20000,200000,1000],"dC":[6000,-10000,20000,1000],"Cs":[8000,2000,30000,1000],"A0":[20000,5000,80000,1000],"D":[5000,1000,20000,1000],"dA":[-1000,-10000,10000,1000],"g":[1000,100,3000,100]},"calc":{"C1":"C0 + dC","buy":"dC + Cs","A1":"A0 + dA","As":"D - dA","proc":"Cs - (D - dA) + g","wproc":"Cs - D + g","wbuy":"dC"},"when":"dC > 0 && buy > 0 && D - dA > 0 && D - dA < Cs && proc > 0 && g != 0 && wproc != proc && wproc > 0 && Cs - D + g != Cs - (D - dA) - g && C0 + dC > 0 && A0 + dA > 0 && A0 + dA < C0 + dC"},

    category: "原価計算",

    question: "品質原価計算（PAFアプローチ）により、当期の品質関連原価を分類する。資料は次のとおり（単位：千円）。\n・製品の設計改善費{pv}、品質教育訓練費{ed}\n・受入材料の検査費{ap}\n・工場内で発見された仕損の補修費{i}\n・販売後のクレーム対応・返品の費用{e}\n適合原価（予防原価＋評価原価）の合計はいくらか。",
    options: ["{fail}千円","{conf}千円","{tot}千円","{prev}千円"],
    answer: 2,
    input: [{"value":"{conf}","unit":"千円"}],
    explanation: "【結論】適合原価の合計 {conf}千円\n【なぜ】ひとことで：品質原価を「不良を出さないために自分から使ったお金（適合原価）」と「不良が出たために払うことになったお金（不適合原価）」に分ける。\n・予防原価：設計改善、品質教育。不良をそもそも作らないための費用です。\n・評価原価：受入検査など。不良を見つけるための費用です。\n・失敗原価：工場内の補修（内部失敗）、販売後のクレーム・返品（外部失敗）。\n図：区分｜適合原価（自分から使う）：予防原価（教育・設計改善）、評価原価（検査）｜不適合原価（不良の結果）：内部失敗原価（出荷前の手直し）、外部失敗原価（返品・クレーム）｜注：予防・評価に使うほど、失敗原価は減る傾向がある\n【手順】\n・予防原価＝設計改善費{pv}＋品質教育訓練費{ed}＝{prev}千円\n・評価原価＝受入検査費{ap}千円\n・適合原価＝{prev}＋{ap}＝{conf}千円\n（失敗原価＝内部失敗{i}＋外部失敗{e}＝{fail}千円）\n【つまずき】{fail}千円は失敗原価、{prev}千円は予防原価だけ、{tot}千円は品質原価の総額です。予防・評価に多く投じるほど失敗原価が減る、というトレードオフを見るための分類です。\n【実務】医療の質改善（予防的な取組みと、再手術・クレーム対応のコスト）の整理にも通じる考え方です。",
    vary: {"vars":{"pv":[300,100,800,10],"ap":[500,100,1000,10],"i":[700,100,1500,10],"e":[900,100,2000,10],"ed":[100,20,300,10]},"calc":{"prev":"pv + ed","conf":"pv + ed + ap","fail":"i + e","tot":"pv + ed + ap + i + e"},"when":"conf != fail && prev != ap"},

    question: "A事業部は部品を生産し、外部に{qe}個、社内のB事業部に{q}個を供給している。部品の変動費は@{v}円、A事業部の固定費は年間{F}円、外部への販売価格（市価）は@{m}円である。B事業部への振替価格を、①市価基準とする場合と、②全部原価基準（変動費＋生産量にもとづく固定費の配賦額。利益は加算しない）とする場合の、A事業部の営業利益をそれぞれ求めなさい。",
    options: ["①{pm}円、②{pf}円","①{pm}円、②{wpf}円","①{pf}円、②{pm}円","①{pm}円、②{pm}円"],
    answer: 1,
    input: [{"label":"①市価基準のA事業部の営業利益","value":"{pm}","unit":"円"},{"label":"②全部原価基準のA事業部の営業利益","value":"{pf}","unit":"円"}],
    explanation: "【結論】①市価基準のA事業部の営業利益 {pm}円、②全部原価基準のA事業部の営業利益 {pf}円\n【なぜ】ひとことで：振替価格は「社内の利益をどちらの事業部に置くか」を決めるだけ。会社全体の利益は変わらない。\n・市価基準：社内に回した分にも外部と同じ利益が乗るので、A事業部の利益が大きくなります。\n・全部原価基準（利益加算なし）：社内に回した分は、変動費と固定費の配賦額を回収するだけで、利益は出ません。A事業部の利益は外部販売の分だけになります。\n・差額{pm - pf}円は、②ではB事業部の利益に移ります。\n図：区分｜フル操業・外部市場あり：*市価基準｜遊休能力あり：差額原価基準（限界費用基準）｜注：供給事業部の状況で、望ましい振替価格が変わる\n【手順】\n・全部原価＝@{v}＋{F}÷{q + qe}個（@{fu}円）＝@{fc}円\n・①市価基準：({m}－{v})×{q + qe}個－{F}＝{pm}円\n・②全部原価基準：外部分({m}－{v})×{qe}個＋内部分({fc}－{v})×{q}個－{F}＝{pf}円（内部分は固定費を回収するだけ）\n・差額{pm - pf}円は、②の場合にB事業部の利益に移ります\n【つまずき】{wpf}円は、内部への供給分の振替価格に含まれる固定費の回収（{(fc - v) * q}円）を忘れた誤りです。\n【実務】中央検査部門・給食部門などの院内サービスの振替価格をどう決めるかで、部門の業績評価が変わる理由を説明する場面で効きます。",

    explanation: "【結論】問1（借）リース債務 {L - int}・支払利息 {int}／（貸）現金 {L}　問2 リース債務 {ans}円\n【なぜ】ひとことで：ファイナンス・リースは「お金を借りて機械を買った」のと同じ。リース料の支払いは、借金の返済（元本）と利息に分ける。\n・たとえ：ローンで機械を買って、毎年同じ額を返していくのと同じです。最初は借金の残りが多いので、利息の割合が大きくなります。\n・だから：期首のリース債務×利子率を支払利息とし、リース料の残りでリース債務（元本）を減らします（利息法）。「支払リース料」という費用にはしません。\n図：帯｜リース料の支払額：支払利息={int:raw}@a、元本の返済={L - int:raw}@c\n【手順】\n・支払利息＝{PV}円×{r}％＝{int}円\n・元本の返済額＝{L}－{int}＝{L - int}円\n・期末のリース債務＝{PV}－{L - int}＝{ans}円\n【つまずき】{w3}円は、リース料の全額を元本の返済とした（利息を考えない）誤りです。{int}円は支払利息そのものです。\n【実務】医療機器のリースで、リース資産・リース債務の残高と支払利息を毎期計算する場面です。根拠：リース取引に関する会計基準（企業会計基準第13号）。",

    answer: 1,
    input: [{"label":"当期の減価償却費","value":"{dep}","unit":"円"},{"label":"当期末の帳簿価額","value":"{BV1}","unit":"円"}],
    explanation: "【結論】当期の減価償却費 {dep}円、当期末の帳簿価額 {BV1}円\n【なぜ】ひとことで：見積りを見直しても、過去の計算はやり直さない。「今残っている価値」を「これから走る距離」で配り直す。\n・たとえ：あと何年使えるかの見込みが変わっても、これまでの減価償却は、その時点で一番もっともらしい見積りで行った正しい処理です。間違いではないので、さかのぼって直しません。\n・だから：当期首の帳簿価額{BV0}円から残存価額を引いた額を、見直し後の残りの走行距離（{T1}－{Q1}＝{T1 - Q1}km）で割って、1kmあたりの償却額を決め直します。\n【手順】\n・前期末までの償却累計額＝({C}－{res})×{Q1}/{T0}＝{acc}円 → 当期首の帳簿価額＝{BV0}円\n・残りの見積走行距離＝{T1}－{Q1}＝{T1 - Q1}km\n・当期の減価償却費＝({BV0}－{res})×{q}/{T1 - Q1}＝{dep}円\n・当期末の帳簿価額＝{BV0}－{dep}＝{BV1}円\n【つまずき】{w1}円は見直し前の見積りのまま、{w2}円は見直し後の総走行距離で最初から計算した（過去に遡及した）誤りです。\n【実務】救急車・送迎車両など走行距離で償却する資産の、耐用見積りの見直しで効きます。根拠：会計方針の開示、会計上の変更及び誤謬の訂正に関する会計基準（企業会計基準第24号）。",
    vary: {"vars":{"C":[3000000,1000000,8000000,100000],"R":[10,0,10,10],"T0":[150000,80000,300000,10000],"Q1":[30000,10000,100000,1000],"T1":[120000,60000,300000,10000],"q":[18000,5000,40000,1000]},"calc":{"res":"C * R / 100","acc":"(C - C * R / 100) * Q1 / T0","BV0":"C - (C - C * R / 100) * Q1 / T0","dep":"(C - (C - C * R / 100) * Q1 / T0 - C * R / 100) * q / (T1 - Q1)","BV1":"C - (C - C * R / 100) * Q1 / T0 - (C - (C - C * R / 100) * Q1 / T0 - C * R / 100) * q / (T1 - Q1)","w1":"(C - C * R / 100) * q / T0","w2":"(C - C * R / 100) * q / T1"},"when":"isInt(acc) && isInt(dep) && isInt(w1) && isInt(w2) && T1 != T0 && Q1 + q < T1 && Q1 * 10 <= T1 * 5 && abs(T1 - T0) * 10 <= T0 * 3 && dep != w1 && dep != w2"},

    explanation: "【結論】問1（借）仕入 {pur}／（貸）前払金 {X * H1}・買掛金 {ap}　問2 為替{?fx > 0|差損|差益} {abs(fx)}円\n【なぜ】ひとことで：前払金は「もう払い終わったお金」なので、払った日の相場のまま。これから払う買掛金だけが、相場で金額が変わる。\n・たとえ：先に払った代金は、あとで円高・円安になっても、払った円の額は変わりません。一方、まだ払っていない代金は、払う日の相場で円の額が変わります。\n・仕入高：前払金の円の金額（払った日の相場）＋残りの買掛金（到着日の相場）です。\n・決算日：お金で払う義務である買掛金だけを、決算日の相場で換算し直します。前払金は「商品を受け取る権利」だったので、換算し直しません。\n図：帯｜仕入高：前払金の分（2月1日の相場）={X * H1:raw}@b、買掛金の分（3月1日の相場）={ap:raw}@a\n【手順】\n・仕入高＝前払金{X}ドル×@{H1}円＋買掛金{T - X}ドル×@{H2}円＝{pur}円\n・買掛金の換算替え＝{T - X}ドル×(@{C}－@{H2})＝{fx:▲}円 → 負債が{?fx > 0|増えるので為替差損|減るので為替差益}\n【つまずき】{wpur}円は、前払金の分まで到着時の相場で換算した誤り、為替{?wfx > 0|差損|差益}{abs(wfx)}円は前払金の分まで換算替えした誤りです。\n【実務】海外から医療機器・材料を前払いで輸入する取引の、仕入計上と決算の換算で効きます。根拠：外貨建取引等会計処理基準。",

    journal: {"accounts":["契約資産","売掛金","工事収益","契約負債","工事原価"],"entries":[{"label":"問1 第2期の工事収益","dr":[["契約資産","{R2}"]],"cr":[["工事収益","{R2}"]]}]},

    explanation: "【結論】問1（借）契約資産 {R2}／（貸）工事収益 {R2}　問2 工事利益 {G2}千円\n【なぜ】ひとことで：原価比例法は「全体の原価のうち、どこまで使ったか」で進み具合を測る。全体の原価の見積りが変わったら、その時点の累計の進み具合を計算し直し、過去の分は直さずに、当期でまとめて調整する。\n・たとえ：全体で{E1}千円かかる予定が{E2}千円に増えると、同じだけ原価を使っていても、進み具合は小さく見直されます。\n・過去は直さない：前期の見積りは、その時点では正しい見積りでした。見積りの変更は、変更した期以降で処理します。\n・相手の勘定：工事が進んだ分は、まだ請求していないので売掛金ではなく契約資産です（請求して無条件の権利になったら売掛金に振り替える）。\n図：帯｜工事収益総額：第1期={R1:raw}@b、第2期={R2:raw}@a、残り={P - RC:raw}@d\n【手順】\n・第1期の収益＝{P}×({A1}÷{E1}＝{p1}％)＝{R1}千円\n・第2期末の累計進捗度＝{A2}÷{E2}＝{p2}％ → 累計の収益＝{P}×{p2}％＝{RC}千円\n・問1：第2期の工事収益＝{RC}－{R1}＝{R2}千円\n・問2：第2期の工事利益＝{R2}－当期の原価{C2}＝{G2}千円\n【つまずき】{wR}千円は、見直し前の見積額{E1}千円のまま進捗度を計算した誤りです。{RC}千円・{cumG}千円は、累計の収益・利益をそのまま当期分とした誤りです。\n【実務】病院の増改築工事を請け負う側の会計ですが、見積りの変更を「変更した期以降で処理する」考え方は、引当金や耐用年数の見直しにも共通します。根拠：収益認識に関する会計基準（企業会計基準第29号）、会計上の変更及び誤謬の訂正に関する会計基準（企業会計基準第24号）。",
    vary: {"vars":{"P":[50000,20000,100000,1000],"k1":[80,60,90,1],"p1":[25,10,40,5],"e2":[5,1,10,1],"p2":[70,50,90,5]},"calc":{"E1":"P * k1 / 100","A1":"E1 * p1 / 100","E2":"E1 * (100 + e2) / 100","A2":"E2 * p2 / 100","R1":"P * p1 / 100","RC":"P * p2 / 100","R2":"RC - R1","C2":"A2 - A1","G2":"R2 - C2","wR":"P * A2 / E1 - R1","wG":"P * A2 / E1 - R1 - (A2 - A1)","cumG":"RC - A2"},"when":"isInt(E1) && isInt(A1) && isInt(E2) && isInt(A2) && isInt(R1) && isInt(RC) && isInt(wR) && E2 < P && G2 > 0 && p2 >= p1 + 20 && wR != R2 && cumG != G2 && wG != G2"},
