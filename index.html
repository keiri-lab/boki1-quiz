<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e2570a">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17130f">
<title>日商簿記1級 ランダム小テスト</title>
<script>
  // ライト/ダークの手動選択を、CSSより先に反映させる（切り替え直後に一瞬もとの配色がちらつくのを防ぐため）
  try {
    var __t = localStorage.getItem("boki1_quiz_theme");
    if (__t === "light" || __t === "dark") document.documentElement.setAttribute("data-theme", __t);
  } catch (e) {}
</script>

<!--
  日商簿記1級 ランダム小テスト（公開版 v2.0 / 2026-09-21・全100問）
  すべてClaudeが新規に作問した問題のみで構成しています（著作権上の懸念はありません）。
  問題を追加する場合は、市販の教材・テキスト・他のAIの出力をそのまま/要約して転記せず、
  会計基準の趣旨から新しい数値設定で自作してください（詳しくは手順書§8）。
  全100問版（私用・非公開）は、同じフォルダの boki1_quiz_私用版.html です。そちらは公開しないでください。

  【このファイルの構成】3つのスクリプトブロックに分かれています。
    1. id="quiz-data"  ← ★ここだけ編集する（設定 CONFIG と 問題 QUESTIONS）
    2. id="quiz-core"  ← 出題・採点・データ検証のロジック（原則さわらない）
    3. id="quiz-ui"    ← 画面の描画（原則さわらない）

  【問題を追加する】
    QUESTIONS の最後（閉じ括弧 ] の直前）に、既存の1問を丸ごとコピーして貼り、
    id を「次に使えるID」にして、中身を書き換えます。
    次に使えるIDは、check_quiz.js を実行すると表示されます（無ければ、QUESTIONS内の
    最大の id に1を足した数）。公開ページには表示していません。
    ・answer は「正解が何番目の選択肢か」（1始まり）
    ・〇×問題は options: OX とし、answer は 1（〇）か 2（×）
    ・計算問題を記述式（数値入力）にするときは、input: [{ value: 正解の数値, unit: "円" }] を足す（手順書§3）
    ・出題のたびに数字を変えるときは vary を、〇×の言い換えを足すときは alt を書く（手順書§3.1・§3.2）
    ・各問の終わりの「,」、文字列を囲む「"」や「`」の閉じ忘れに注意

  【書き間違いの確認】ブラウザで開くと、スタート画面に指摘が表示されます。
  詳しい手順は「boki1_quiz_手順書.md」、自動チェックは「check_quiz.js」を参照してください。
  問題文と選択肢の間に電卓（GT・メモリー・√・00・小数点・一桁取り消し）があります。設定は CONFIG.calculator。
  外部への通信は一切ありません（オフラインで動作します）。
-->

<script>
  // 読み込み時のエラーを控えておく（問題データの書き間違いをスタート画面で知らせるため）
  window.__loadErrors = [];
  window.addEventListener("error", function (e) {
    window.__loadErrors.push((e.message || "不明なエラー") + (e.lineno ? "（" + e.lineno + "行目付近）" : ""));
  });
</script>

<style>
  /* 配色は既定値です。変えたいときは CONFIG.theme（quiz-data ブロック）で上書きできます（ライトモードのみ）。
     ライト/ダークは、右上の切り替えボタンで手動選択できます（選んだ結果は端末に保存され、次回も覚えています）。
     何も選んでいないときは、端末・ブラウザのダークモード設定に自動で追従します。
     スコアボード（結果画面の正解数表示）は、ライト・ダークどちらでも同じ配色で固定しています
     （実際のスタジアムの得点掲示板が、昼夜を問わず同じ見た目なのと同じ考え方です）。 */
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1c1712;
    --muted: #746b60;
    --rule: #e3ded5;
    --primary: #e2570a;
    --primary-text: #ffffff;
    --primary-bg: #fdede2;
    --primary-ink: #c24a08;
    --correct: #1b7a4b;
    --correct-bg: #e7f5ed;
    --wrong: #c2372b;
    --wrong-bg: #fbeceb;
    --grid: rgba(116, 107, 96, 0.16);
    --board-bg: #1a1512;
    --board-text: #ffb74d;
  }
  /* ダーク配色：システムがダークのとき（ただし手動で「ライト」を選んでいる間は除く）に加えて、
     手動で「ダーク」を選んだときは、システム設定に関わらず適用する */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f;
      --card: #221c16;
      --text: #f3ece2;
      --muted: #b0a594;
      --rule: #3a3128;
      --primary: #ff7a29;
      --primary-text: #1a1209;
      --primary-bg: #3a2211;
      --primary-ink: #ff7a29;
      --correct: #4caf7d;
      --correct-bg: #16281f;
      --wrong: #e8695c;
      --wrong-bg: #2e1613;
      --grid: rgba(243, 236, 226, 0.09);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f;
    --card: #221c16;
    --text: #f3ece2;
    --muted: #b0a594;
    --rule: #3a3128;
    --primary: #ff7a29;
    --primary-text: #1a1209;
    --primary-bg: #3a2211;
    --primary-ink: #ff7a29;
    --correct: #4caf7d;
    --correct-bg: #16281f;
    --wrong: #e8695c;
    --wrong-bg: #2e1613;
    --grid: rgba(243, 236, 226, 0.09);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: calc(100vh - 6px);  /* 6px は画面最上部の色帯の分（これがないと常に6pxだけスクロールが出る） */
    min-height: calc(100dvh - 6px);
    display: flex;
    flex-direction: column;
  }
  .brand-stripe { height: 6px; background: var(--primary); }
  .main { flex: 1; padding: 6px 16px 16px; }
  .main.center {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding-top: calc(24px + env(safe-area-inset-top));
  }

  /* ---- 上部：第n問と進捗（1問=1マス。回答済みのマスは正誤で色が付く） ---- */
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .top-row .count { flex: 1; min-width: 0; }
  .home-btn {
    flex: none; min-height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--card); color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  .count { font-weight: 700; font-variant-numeric: tabular-nums; }
  .steps { display: flex; gap: 4px; }
  .step { flex: 1; height: 9px; border-radius: 1px; background: var(--rule); }
  .step.ok { background: var(--correct); }
  .step.ng { background: var(--wrong); }
  .step.now { background: var(--primary); }
  .badge {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1.7;
    color: #fff;
    background: var(--muted);
    white-space: nowrap;
  }

  /* ---- カードと問題文 ---- */
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 20px 18px; }
  .q { margin: 0 0 18px; font-size: 1.02rem; line-height: 1.75; white-space: pre-line; word-break: break-word; }

  /* ---- 選択肢 ---- */
  .options { display: grid; gap: 10px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    padding: 12px 14px;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--rule);
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .opt .mark {
    flex: none;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 3px;
    font-size: 0.85rem;
    font-weight: 700;
    background: var(--bg);
    color: var(--muted);
  }
  .opt-text { flex: 1; line-height: 1.55; }
  .opt[aria-checked="true"] { border-color: var(--primary); background: var(--primary-bg); }
  .opt[aria-checked="true"] .mark { background: var(--primary); color: var(--primary-text); }
  .locked .opt { cursor: default; }
  .locked .opt:not(.is-correct):not(.is-wrong) { opacity: 0.55; }
  .opt.is-correct { border-color: var(--correct); background: var(--correct-bg); }
  .opt.is-correct .mark { background: var(--correct); color: #fff; }
  .opt.is-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.is-wrong .mark { background: var(--wrong); color: #fff; }
  .tag { flex: none; padding: 0 8px; border-radius: 3px; font-size: 0.72rem; font-weight: 700; color: #fff; }
  .is-correct .tag { background: var(--correct); }
  .is-wrong .tag { background: var(--wrong); }
  /* 〇×（短い2択）は横並びの大きなボタン */
  .options.ox { grid-template-columns: 1fr 1fr; }
  .ox .opt-text { flex: none; }
  .ox .opt { flex-direction: column; justify-content: center; gap: 6px; min-height: 76px; text-align: center; font-size: 1.05rem; font-weight: 700; }

  /* ---- 正誤と解説 ---- */
  .slot { scroll-margin-top: 84px; }
  .verdict { margin: 16px 0 0; padding: 12px 14px; border-radius: 4px; font-weight: 700; }
  .verdict.ok { background: var(--correct-bg); color: var(--correct); }
  .verdict.ng { background: var(--wrong-bg); color: var(--wrong); }
  .explain {
    margin-top: 12px;
    padding: 14px 16px;
    border-left: 4px solid var(--primary);
    border-radius: 0 4px 4px 0;
    background: var(--bg);
    font-size: 0.95rem;
  }
  .explain h3 { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
  .explain .line { margin: 0 0 0.4em; }
  .explain .gap { height: 0.4em; }
  .explain strong { color: var(--primary); }

  /* ---- 下部の操作ボタン ---- */
  .actions {
    position: sticky;
    bottom: 0;
    z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    box-shadow: 0 -1px 0 var(--rule);
  }
  .btn {
    display: block;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: 6px;
    background: var(--primary);
    color: var(--primary-text);
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:disabled { background: var(--rule); color: var(--muted); cursor: not-allowed; }
  .btn.secondary { min-height: 48px; border: 2px solid var(--primary); background: var(--card); color: var(--primary); font-size: 1rem; }
  .actions .btn + .btn { margin-top: 10px; }

  /* ---- スタート画面：帳簿風の区分別一覧（合計行は二重線） ---- */
  .title { margin: 0 0 4px; font-size: 1.4rem; font-weight: 800; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
  .lead { margin: 0 0 16px; color: var(--muted); }
  .ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .ledger th { padding: 0 0 6px; border-bottom: 1px solid var(--text); font-size: 0.78rem; font-weight: 600; color: var(--muted); text-align: left; }
  .ledger td { padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .ledger th:last-child, .ledger td:last-child { text-align: right; }
  .ledger tfoot td { padding-top: 10px; border-top: 3px double var(--text); border-bottom: 0; font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 1px; background: var(--muted); border: 1px solid rgba(128,128,128,0.35); }
  .hint { margin: 12px 0 0; font-size: 0.82rem; color: var(--muted); }
  .footer-link { margin: 8px 0 0; padding: 0 4px; font-size: 0.78rem; text-align: center; color: var(--muted); }

  /* ---- スタート画面 ---- */
  .main.start { padding-top: calc(28px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .hero .eyebrow { margin: 0; font-size: 0.82rem; font-weight: 700; color: var(--primary-ink); letter-spacing: 0.04em; }
  .hero .title { margin: 2px 0 6px; font-size: 1.75rem; }
  .hero .tagline { margin: 0 0 20px; color: var(--muted); }
  .hero .btn { min-height: 58px; font-size: 1.1rem; }
  .hero .lead { margin: 8px 0 0; font-size: 0.82rem; text-align: center; }
  .topics { margin: 30px 0 0; }
  .topics-title { margin: 0 0 4px; font-size: 1.05rem; }
  .topic-group { margin-top: 12px; }
  .topic-group-title { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .topic-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  .kind-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 4px; }
  .kind-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    min-height: 54px; padding: 6px 8px; border: 1px solid var(--primary); border-radius: 4px;
    background: var(--card); color: var(--primary); font: inherit; cursor: pointer; touch-action: manipulation;
  }
  .kind-btn:active { background: var(--primary-bg); }
  .kind-btn:disabled { opacity: 0.4; cursor: default; }
  .kind-name { font-weight: 700; font-size: 0.98rem; }
  .kind-n { font-size: 0.74rem; color: var(--muted); }
  .topic-btn {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
    min-height: 54px; padding: 8px 10px; text-align: left;
    border: 1px solid var(--rule); border-radius: 4px; background: var(--card); color: var(--text);
    font: inherit; cursor: pointer; touch-action: manipulation;
  }
  .topic-btn:active { border-color: var(--primary); }
  .topic-name { font-size: 0.86rem; font-weight: 700; line-height: 1.35; }
  .topic-n { font-size: 0.72rem; color: var(--muted); }
  .count-topic { display: block; font-size: 0.75rem; font-weight: 700; color: var(--primary-ink); }
  .features { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; }
  .features li { padding-left: 12px; border-left: 3px solid var(--primary); }
  .features strong { display: block; font-size: 0.98rem; }
  .features li span { display: block; font-size: 0.84rem; color: var(--muted); line-height: 1.6; }
  .cats { margin: 28px 0 0; padding-top: 10px; border-top: 2px solid var(--text); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 20px; font-variant-numeric: tabular-nums; }
  .cat { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 0.9rem; }
  .cat-n { font-weight: 700; }
  .start-foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--rule); text-align: center; }
  .foot-note { margin: 12px 0 0; font-size: 0.78rem; color: var(--muted); }
  .version { margin: 14px 0 0; font-size: 0.74rem; color: var(--muted); }
  .version summary { display: inline-block; cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 2px; }
  .version summary::-webkit-details-marker { display: none; }
  .changelog { margin: 10px 0 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 6px; }
  .changelog li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 8px; line-height: 1.5; }
  .cl-date { font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; font-size: 0.82rem; }
  .seg-label { display: flex; align-items: center; padding: 0 12px; color: var(--muted); border-right: 1px solid var(--rule); }
  .seg-btn { min-height: 38px; padding: 0 14px; border: 0; background: var(--card); color: var(--text); font: inherit; cursor: pointer; touch-action: manipulation; }
  .prefs { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 10px 14px; }
  .seg-wrap { display: flex; flex-direction: column; align-items: center; }
  .seg-note { margin: 4px 0 0; font-size: 0.7rem; color: var(--muted); }
  .seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
  .seg-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); font-weight: 700; }
  /* 区分の見た目（試験の時間割で2種類） */
  .badge.solid { background: var(--text); color: var(--bg); }
  /* 難問の印（level: "hard"） */
  .badge.hard { background: var(--wrong); color: #fff; padding: 1px 7px; }
  .badges { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .badge.outline { background: transparent; color: var(--primary-ink); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .dot.solid { background: var(--text); border-color: transparent; }
  .dot.outline { background: transparent; border: 1.5px solid var(--primary); }
  .footer-link a { color: inherit; text-decoration: underline; }

  /* ---- 結果画面（正解数は、実際の得点掲示板を模した固定の配色パネルに。ライト/ダーク共通） ---- */
  .scoreboard {
    margin: -20px -18px 16px;
    padding: 18px 18px 16px;
    border-radius: 4px 4px 0 0;
    background: var(--board-bg);
  }
  .result-line { margin: 0; color: #cabfae; font-size: 0.85rem; }
  .result-num { margin: 0; font-size: 1.1rem; color: #f3ece2; }
  .total { display: inline-block; margin-right: 0.2em; padding: 0 0.1em; border-bottom: 5px double var(--board-text); font-size: 3rem; font-weight: 800; line-height: 1.25; color: var(--board-text); }
  .score { margin: 12px 0 4px; font-size: 1.1rem; font-weight: 700; }
  .grade { margin: 16px 0 4px; font-size: 1.3rem; }
  .grade-msg { margin: 0; color: var(--muted); }

  .review h2 { margin: 4px 0 8px; font-size: 1rem; }
  details.rev { margin-bottom: 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); }
  details.rev summary { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
  details.rev summary::-webkit-details-marker { display: none; }
  details.rev summary::after { content: "開く"; flex: none; font-size: 0.75rem; color: var(--muted); }
  details.rev[open] summary::after { content: "閉じる"; }
  .sum-text {
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  details.rev summary .badge { flex: none; min-width: 4.8em; text-align: center; }
  .rev-body { padding: 0 14px 14px; }
  .rev-body .q { margin-bottom: 10px; font-size: 0.95rem; }
  .ans { margin: 0 0 4px; font-size: 0.92rem; font-weight: 700; }
  .ans.ng { color: var(--wrong); }
  .ans.ok { color: var(--correct); }

  /* ---- データチェックの指摘 ---- */
  .diag { padding: 12px 14px; border: 1px solid var(--primary); border-radius: 4px; background: var(--primary-bg); font-size: 0.88rem; }
  .diag.err { border-color: var(--wrong); background: var(--wrong-bg); }
  .diag ul { margin: 6px 0 0; padding-left: 1.2em; }
  .diag p { margin: 6px 0 0; }

  /* ---- 電卓（問題文と選択肢の間。開閉式） ---- */
  .calc-wrap { margin: 0 0 16px; }
  .calc-toggle, .scratch-toggle {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--bg);
    color: var(--primary);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .calc { margin-top: 10px; padding: 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); scroll-margin-top: 84px; scroll-margin-bottom: 96px; }
  .calc[hidden] { display: none; }
  .tool-toggles { display: grid; gap: 8px; }

        if (typeof p.choiceAnswer === "string") c.choiceAnswer = evalExpr(p.choiceAnswer.replace(/^\{|\}$/g, ""), env);

    r.varyEnv = env;
    return r;

  const ok = (env, r) => (!vary.when || evalExpr(vary.when, env)) &&
    new Set(r.options).size === r.options.length &&
    (!r.input || r.input.every((p) => Number.isFinite(p.value) && p.value >= 0));
  if (rng) {
    for (let t = 0; t < 300; t++) {
      const env = pickVars(false);
      let r;
      try { r = build(env); } catch (e) { continue; }
      if (ok(env, r)) return r;

}
// vary の書き方の点検（基準の数字で作れるか、式が読めるか、範囲の指定が正しいか）
function varyProblems(q) {
  const msgs = [];
  const v = q.vary;
  if (!v || typeof v !== "object" || !v.vars || typeof v.vars !== "object") return ["vary の書き方が正しくありません（vars が必要です）"];
  Object.keys(v.vars).forEach((n) => {
    const d = v.vars[n];
    if (!Array.isArray(d) || d.length !== 4 || !d.every((x) => typeof x === "number" && Number.isFinite(x)) || d[3] <= 0 || d[1] > d[2] || d[0] < d[1] || d[0] > d[2]) {
      msgs.push("vary.vars." + n + " は [基準, 最小, 最大, 刻み] の数字4つにしてください（基準は最小〜最大の間）");
    }
  });
  if (msgs.length) return msgs;
  try {
    const b = instantiate(q, null);
    if (v.when && !evalExpr(v.when, b.varyEnv)) msgs.push("基準の数字が vary.when の条件を満たしていません");
  } catch (e) {
    msgs.push("vary の式を計算できません：" + e.message);
  }
  return msgs;
}

function validateQuestions(list, knownCategories, knownTopics) {
  const valid = [];
  const problems = [];
  const warnings = [];
  if (!Array.isArray(list)) {
    problems.push({ label: "QUESTIONS", messages: ["問題データが配列（[ ... ]）になっていません"] });
    return { valid, problems, warnings, maxId: 0 };
  }

  const idCount = new Map();
  list.forEach((q) => {
    if (q && Number.isInteger(q.id)) idCount.set(q.id, (idCount.get(q.id) || 0) + 1);
  });

  let maxId = 0;
  list.forEach((orig, i) => {
    const label = orig && orig.id !== undefined ? "id=" + orig.id : i + 1 + "番目の問題";
    if (!orig || typeof orig !== "object") {
      problems.push({ label, messages: ["{ ... } の形式になっていません"] });
      return;
    }
    const msgs = [];
    // 数字が変わる問題は、基準の数字で作った問題を点検する
    let q = orig;
    if (orig.vary !== undefined) {
      const vm = varyProblems(orig);
      if (vm.length) { problems.push({ label, messages: vm }); return; }
      q = instantiate(orig, null);
    }

    if (!Number.isInteger(q.id) || q.id < 1) {
      msgs.push("id は1以上の整数にしてください");
    } else {
      maxId = Math.max(maxId, q.id);
      if (idCount.get(q.id) > 1) msgs.push("id が他の問題と重複しています");
    }

    if (!isText(q.category)) {
      msgs.push("category（区分）が空です");
    } else if (knownCategories && knownCategories.length && !knownCategories.includes(q.category)) {
      warnings.push(label + "：区分「" + q.category + "」は CONFIG.categoryColors にありません（表記ゆれの可能性）");
    }

    // 論点（topics）：CONFIG.topics を使っているときは、1つ以上、一覧にある名前で付ける
    if (knownTopics && knownTopics.length) {
      if (!Array.isArray(q.topics) || q.topics.length === 0) {
        warnings.push(label + "：論点（topics）がありません（論点別テストに出題されません）");
      } else {
        q.topics.filter((t) => !knownTopics.includes(t)).forEach((t) =>
          warnings.push(label + "：論点「" + t + "」は CONFIG.topics にありません（表記ゆれの可能性）"));
      }
    }

    if (!isText(q.question)) msgs.push("question（問題文）が空です");

    let optionsOk = false;
    if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 6) {
      msgs.push("options は2〜6個の配列にしてください（4択は4個、〇×は OX）");
    } else if (!q.options.every(isText)) {
      msgs.push("options に空の選択肢があります");
    } else if (new Set(q.options).size !== q.options.length) {
      msgs.push("options に同じ文言の選択肢があります");
    } else {
      optionsOk = true;
    }

    if (!Number.isInteger(q.answer)) {
      msgs.push("answer は整数（正解が何番目の選択肢か。1始まり）にしてください");
    } else if (optionsOk && (q.answer < 1 || q.answer > q.options.length)) {
      msgs.push("answer が範囲外です（1〜" + q.options.length + " の間）");
    }

    if (!isText(q.explanation)) msgs.push("explanation（解説）が空です");
    if (q.input !== undefined) inputProblems(q).forEach((m) => msgs.push(m));
    if (q.alt !== undefined) {
      if (!Array.isArray(q.alt)) msgs.push("alt は配列（[ { question, answer, explanation }, … ]）にしてください");
      else q.alt.forEach((a, k) => {
        const at = "alt の" + (k + 1) + "番目：";
        if (!a || typeof a !== "object") { msgs.push(at + "{ … } の形式になっていません"); return; }
        if (!isText(a.question)) msgs.push(at + "question が空です");
        if (!isText(a.explanation)) msgs.push(at + "explanation が空です");
        if (!Number.isInteger(a.answer) || !Array.isArray(q.options) || a.answer < 1 || a.answer > q.options.length) msgs.push(at + "answer が範囲外です");
        if ([a.question, a.explanation].some((t) => typeof t === "string" && CROSS_REFERENCE.test(t))) warnings.push(label + "：" + at + "他の問題を参照しているようです");
      });
    }

    // 難しさの印（level）。今は "hard"（難問。画面に「難」の印）だけ
    if (q.level !== undefined && q.level !== "hard") {
      warnings.push(label + "：level には \"hard\"（難問）だけを書けます。書かなければふつうの問題です");
    }
    // 他のAIなどから貼り付けた問題の名残を検出（警告のみ。出題は続けます）
    const texts = [q.question, q.explanation].concat(Array.isArray(q.options) ? q.options : []);
    if (texts.some((t) => typeof t === "string" && CITATION_MARK.test(t))) {
      warnings.push(label + "：引用番号らしき [数字] が残っています（貼り付け元の名残では？）");
    }
    if ([q.question, q.explanation].some((t) => typeof t === "string" && OPTION_NUMBER_REF.test(t))) {
      warnings.push(label + "：解説などで選択肢を番号で指しています（「選択肢2は〜」など）。選択肢は毎回並べ替え、〇×に変えて出すこともあるので番号がずれます。選択肢の中身を「」で引用して書いてください");
    }
    if (texts.some((t) => typeof t === "string" && CROSS_REFERENCE.test(t))) {
      warnings.push(label + "：他の問題（問題番号やid）を参照しているようです（出題順がランダムで、問題番号も画面に出ないので成立しません。条件や説明をその問題の中に書いてください）");
    }

    if (msgs.length) problems.push({ label, messages: msgs });
    else valid.push(orig);
  });

  return { valid, problems, warnings, maxId };
}

// フィッシャー–イェーツのシャッフル（元の配列は変更しない）
function shuffle(array, rng) {
  const r = rng || Math.random;
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(r() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// プールから n 問を無作為に抽出。excludeIds（直前の出題）に無い問題を優先し、足りない分だけ埋め戻す。
// 一巡するまで同じ問題を出さない「山札」方式。
//   deck：{ order: [問題idの並び], pos: 次に配る位置 }（端末に保存しておく。無ければ null）
//   ids ：今出題できる問題のid、n：配る枚数
//   ・山札にない新しい問題は、まだ配っていない部分のランダムな位置に差し込む（追加した問題も一巡の中で出る）
//   ・なくなった問題は山札から取り除く
//   ・山札の残りが足りないときは、残りを配ったうえで新しい山札を作り、今回配った問題以外から補う
function dealFromDeck(deck, ids, n, rng) {
  const r = rng || Math.random;
  const valid = new Set(ids);
  let order = deck && Array.isArray(deck.order) ? deck.order.filter((id) => valid.has(id)) : [];
  let pos = deck && Number.isInteger(deck.pos) ? deck.pos : 0;
  if (!deck || !Array.isArray(deck.order)) { order = shuffle(ids, r); pos = 0; }
  else {
    // pos は「取り除く前の並び」での位置なので、取り除いた分を詰める
    const removedBefore = deck.order.slice(0, pos).filter((id) => !valid.has(id)).length;
    pos = Math.max(0, Math.min(order.length, pos - removedBefore));
    const known = new Set(order);
    ids.filter((id) => !known.has(id)).forEach((id) => {
      const at = pos + Math.floor(r() * (order.length - pos + 1));
      order.splice(at, 0, id);
    });
  }
  const size = Math.min(n, ids.length);
  const out = order.slice(pos, pos + size);
  pos += out.length;
  if (out.length < size) {
    const taken = new Set(out);
    order = shuffle(ids.filter((id) => !taken.has(id)), r).concat(out); // 今回配った分は新しい山札の最後へ
    pos = 0;
    const more = order.slice(0, size - out.length);
    out.push(...more);
    pos = more.length;
  }
  return { ids: out, deck: { order, pos } };
}

function pickQuestions(pool, n, excludeIds, rng) {
  const exclude = new Set(excludeIds || []);
  const size = Math.min(n, pool.length);
  const fresh = shuffle(pool.filter((q) => !exclude.has(q.id)), rng);
  const stale = shuffle(pool.filter((q) => exclude.has(q.id)), rng);
  const picked = fresh.slice(0, size);
  if (picked.length < size) picked.push(...stale.slice(0, size - picked.length));
  return shuffle(picked, rng); // 出題順もランダムにする
}

// 1問ぶんの出題データを作る。order[表示位置] = 元の選択肢の番号（0始まり）
// ---------------------------------------------------------------------------
// 理論問題の言い換え（答えを覚えてしまわないように、出題のたびに形を変える）
//   ・alt：〇×問題の別の言い方（正誤を入れ替えた版など）。{ question, answer, explanation } の配列。元の問題とどちらかを出す
//   ・4択の理論問題は、opts.oxRate の割合で「4つの選択肢のうち1つを示し、問いの答えとして当てはまるかを〇×で答える」形にする
// ---------------------------------------------------------------------------
const OX_FIT = ["〇（当てはまる）", "×（当てはまらない）"];
function pickAlt(q, rng) {
  if (!Array.isArray(q.alt) || q.alt.length === 0) return q;
  const k = Math.floor(rng() * (q.alt.length + 1)); // 0 なら元の問題
  if (k === 0) return q;
  return Object.assign({}, q, q.alt[k - 1], { altOf: q.id });
}
function toOxVariant(q, rng) {
  const right = q.answer - 1;

  let k = right;
  if (rng() >= 0.5) { const wrong = q.options.map((_, i) => i).filter((i) => i !== right); k = wrong[Math.floor(rng() * wrong.length)]; }
  const fits = k === right;
  return Object.assign({}, q, {
    question: "【〇×】次の問いに対して、下の記述は答えとして当てはまるか。\n問い：" + q.question + "\n記述：「" + q.options[k] + "」",
    options: OX_FIT,
    answer: fits ? 1 : 2,
    explanation: "【判定】" + (fits ? "当てはまります（〇）。" : "当てはまりません（×）。答えとして当てはまるのは「" + q.options[right] + "」です。") + "\n" + q.explanation,
    oxOf: q.id,

function buildItem(tq, shuffleOptions, rng, opts) {
  const r0 = rng || Math.random;
  let q = instantiate(tq, r0); // 数字が変わる問題は、ここで数字を選ぶ
  q = pickAlt(q, r0);
  const oxRate = opts && typeof opts.oxRate === "number" ? opts.oxRate : 0;
  if (!Array.isArray(q.input) && q.options.length === 4 && q.oxVariant !== false && oxRate > 0 && r0() < oxRate) q = toOxVariant(q, r0);
  const idx = q.options.map((_, i) => i);
  const order = shuffleOptions && q.options.length > 2 ? shuffle(idx, rng) : idx;
  return { q, order, correctPos: order.indexOf(q.answer - 1) };
}

// ---------------------------------------------------------------------------
// 記述式（数値入力）の問題
//   input: [{ label?, value, unit?, tolerance?, choice?: [2つ], choiceAnswer?: 1|2 }, ...]
//   選択肢 options と answer は、誤答パターンの判定と、正解値の照合（check_quiz.js）に使うため残す
// ---------------------------------------------------------------------------

// 記述式の設定の点検
function inputProblems(q) {
  const msgs = [];
  if (!Array.isArray(q.input) || q.input.length < 1 || q.input.length > 3) {
    return ["input は1〜3個の配列にしてください"];
  }
  q.input.forEach((p, i) => {
    const at = q.input.length > 1 ? "input の" + (i + 1) + "番目：" : "input：";
    if (!p || typeof p !== "object") { msgs.push(at + "{ value: … } の形式になっていません"); return; }
    if (typeof p.value !== "number" || !Number.isFinite(p.value)) msgs.push(at + "value は数値にしてください");
    if (p.unit !== undefined && typeof p.unit !== "string") msgs.push(at + "unit は文字列にしてください");
    if (p.tolerance !== undefined && !(typeof p.tolerance === "number" && p.tolerance >= 0)) msgs.push(at + "tolerance は0以上の数値にしてください");
    if (p.choice !== undefined) {
      if (!Array.isArray(p.choice) || p.choice.length !== 2 || !p.choice.every(isText)) msgs.push(at + "choice は文字列2つの配列にしてください");
      else if (p.choiceAnswer !== 1 && p.choiceAnswer !== 2) msgs.push(at + "choiceAnswer は 1 か 2 にしてください");
    } else if (p.choiceAnswer !== undefined) {
      msgs.push(at + "choice が無いのに choiceAnswer があります");
    }
  });
  return msgs;
}

// 入力された文字列を数値にする（全角数字・カンマ・空白・単位の文字は無視）。数値として読めなければ null
function parseAnswerNumber(raw) {
  if (typeof raw !== "string") return null;
  let t = raw.replace(/[０-９．，－ー−]/g, (c) => ({ "．": ".", "，": ",", "－": "-", "ー": "-", "−": "-" }[c] || String.fromCharCode(c.charCodeAt(0) - 0xfee0)));
  t = t.replace(/[,\s]/g, "").replace(/[^0-9.\-+]/g, "");
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

// 文章中の数値をすべて取り出す（"1,218,000円" → [1218000]、"約9.7％。…10％" → [9.7, 10]）
function numbersIn(text) {
  const out = [];
  String(text).replace(/\d{1,3}(?:,\d{3})+(?:\.\d+)?|\d+(?:\.\d+)?/g, (m) => { out.push(Number(m.replace(/,/g, ""))); return m; });
  return out;
}

// 数値を、桁区切り付きの表示用文字列にする
// 記述式の入力欄で、入力中に3桁ごとのカンマを自動で入れる。
//   value：入力欄の文字列、caret：カーソル位置、prev：直前の文字列、backspace：BackSpaceで消したか
//   ・全角数字は半角に、数字・小数点・先頭のマイナス以外の文字（単位など）は取り除く
//   ・BackSpaceでカンマだけを消したときは、その左の数字を消す（カンマが戻ってきて消せない、を防ぐ）
//   ・カーソルは「左にある数字の個数」が変わらない位置に戻す
function formatAmountTyping(value, caret, prev, backspace) {
  const toHalf = (t) => t.replace(/[０-９．－ー−]/g, (c) => ({ "．": ".", "－": "-", "ー": "-", "−": "-" }[c] || String.fromCharCode(c.charCodeAt(0) - 0xfee0)));
  const sig = (t) => toHalf(t).replace(/[^0-9.\-]/g, "");
  let v = String(value);
  let pos = Math.max(0, Math.min(caret == null ? v.length : caret, v.length));
  if (backspace && prev != null && sig(v) === sig(prev) && v.length < String(prev).length) {
    // カンマだけが消えた → カーソルの左にある数字を1つ消す
    let i = pos - 1;
    while (i >= 0 && !/[0-9０-９]/.test(v[i])) i--;
    if (i >= 0) { v = v.slice(0, i) + v.slice(i + 1); pos = i; }
  }
  let keep = sig(v.slice(0, pos)).length; // カーソルの左にある有効な文字の数
  const raw = sig(v);
  const neg = raw.startsWith("-");
  let body = raw.replace(/-/g, "");
  const dot = body.indexOf(".");
  let intPart = dot === -1 ? body : body.slice(0, dot);
  const decPart = dot === -1 ? null : body.slice(dot + 1).replace(/\./g, "");
  const before = intPart.length;
  intPart = intPart.replace(/^0+(?=\d)/, ""); // 先頭の余分な0（007→7）
  keep -= Math.min(before - intPart.length, Math.max(0, keep - (neg ? 1 : 0)));
  const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const out = (neg ? "-" : "") + grouped + (decPart === null ? "" : "." + decPart);
  // 整形後の文字列で、有効な文字を keep 個数えた位置にカーソルを置く
  let c = 0, n = 0;
  while (c < out.length && n < keep) { if (out[c] !== ",") n++; c++; }
  return { value: out, caret: c };
}

function formatNumber(v) {
  const [i, d] = String(v).split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (d ? "." + d : "");
}

function numberMatches(n, p) {
  return n !== null && Math.abs(n - p.value) <= (p.tolerance || 0) + 1e-9;
}

// 採点。responses: [{ raw: 入力文字列, choice: 選んだ番号(1|2|null) }, ...]
function gradeInput(q, responses) {
  const parts = q.input.map((p, i) => {
    const r = responses[i] || {};
    const n = parseAnswerNumber(r.raw);
    const numOk = numberMatches(n, p);
    const choiceOk = p.choice ? r.choice === p.choiceAnswer : true;
    return { n, numOk, choiceOk };
  });
  const correct = parts.every((x) => x.numOk && x.choiceOk);
  // 誤答パターン：入力した数値が、誤答の選択肢に含まれる数値と一致するか（1つ目の入力欄で判定）
  let pattern = null;
  if (!correct && parts[0] && parts[0].n !== null && !parts[0].numOk && Array.isArray(q.options)) {
    pattern = q.options.find((o, i) => i !== q.answer - 1 && numbersIn(o).some((x) => Math.abs(x - Math.abs(parts[0].n)) < 1e-9)) || null;
  }
  const numbersRightChoiceWrong = !correct && parts.every((x) => x.numOk) && parts.some((x) => !x.choiceOk);
  return { correct, parts, pattern, numbersRightChoiceWrong };
}

// 正解・回答を、表示用の文字列にする
function inputAnswerText(q) {
  return q.input.map((p) => (p.label ? p.label + "：" : "") + formatNumber(p.value) + (p.unit || "") + (p.choice ? "（" + p.choice[p.choiceAnswer - 1] + "）" : "")).join("／");
}
function inputResponseText(q, responses) {
  return q.input.map((p, i) => {
    const r = responses[i] || {};
    const n = parseAnswerNumber(r.raw);
    const num = n === null ? "（未入力）" : formatNumber(n) + (p.unit || "");
    return (p.label ? p.label + "：" : "") + num + (p.choice ? "（" + (r.choice ? p.choice[r.choice - 1] : "未選択") + "）" : "");
  }).join("／");
}

function calcScore(correct, total) {
  return total > 0 ? Math.round((correct * 100) / total) : 0;
}

// grades は min の大きい順に並べてある前提
function findGrade(grades, score) {
  return grades.find((g) => score >= g.min) || grades[grades.length - 1];
}

// ---------------------------------------------------------------------------
// 電卓のロジック（画面の電卓）。事務用の電卓と同じ「入力順に計算」方式です（2＋3×4＝20）。
// 内部は15桁で計算し、表示は12桁に丸めます（1÷3×3＝1 になる、一般的な電卓と同じ挙動）。
// キー名：0〜9 / 00 / . / + - * / / = / sqrt / back / C / GT / MC MR M+ M-
// ---------------------------------------------------------------------------
const CALC_DIGITS = 12; // 入力・表示できる最大桁数

// 浮動小数点のノイズ（0.1+0.2=0.30000000000000004 など）を除く
function calcClean(v) {
  return Number(v.toPrecision(15));
}

// 12桁に丸めたとき、桁あふれ（1兆以上）または数値でなくなるか
function calcOverflow(v) {
  return !Number.isFinite(v) || Math.abs(Number(v.toPrecision(CALC_DIGITS))) >= 1e12;
}

// 12桁に丸めた、指数表記なしの文字列
function calcPlain(v) {
  const r = Number(v.toPrecision(CALC_DIGITS));
  let s = String(r);
  if (/e/i.test(s)) {
    s = r.toFixed(CALC_DIGITS + 2);
    if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  }
  return s;
}

// 整数部を3桁区切りにする（"-1234567.89" → "-1,234,567.89"）
function calcGroup(str) {
  const m = str.match(/^(-?)(\d+)(\.\d*)?$/);
  if (!m) return str;
  return m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (m[3] || "");
}

function createCalculator(options) {
  // GTに「+ −」の結果も加えるか。false なら「× ÷」の結果だけ（機種によって異なります）
  const gtIncludesAddSub = !(options && options.gtIncludesAddSub === false);
  // 税込・税抜キーの税率（既定10％）。CONFIG.calculator.taxRate で変更できる
  const taxRate = options && typeof options.taxRate === "number" && options.taxRate >= 0 ? options.taxRate : 0.1;
  const s = {
    entry: "0",       // 入力中の数字（文字列）。計算結果を表示しているときは null
    value: 0,         // 計算結果などの表示値（entry が null のとき）
    acc: null,        // 演算子の左側の数
    op: null,         // 待機中の演算子
    ready: false,     // 演算子の右側の数が用意できているか
    justEq: false,    // 直前の操作が「=」か
    lastOp: null,     // 「=」連打（同じ計算の繰り返し）用
    lastOperand: 0,
    memory: 0,
    gt: 0,
    showGT: false,    // 表示中の数がGTか
    error: false,
    ceDone: false,    // 直前の操作が C・CE の1回目（入力中の数字だけ消した状態）か
  };

  const current = () => {
    if (s.entry === null) return s.value;
    const n = Number(s.entry);
    return Number.isFinite(n) ? n : 0;
  };

  function calculate(a, op, b) {
    if (op === "+") return a + b;
    if (op === "-") return a - b;
    if (op === "*") return a * b;
    return b === 0 ? NaN : a / b; // 0で割るとエラー
  }

  function setResult(v) {
    if (calcOverflow(v)) { s.error = true; return false; }
    s.value = calcClean(v);
    s.entry = null;
    return true;
  }

  function addGT(op) {
    if (!gtIncludesAddSub && op !== "*" && op !== "/") return;
    const g = s.gt + s.value;
    if (calcOverflow(g)) { s.error = true; return; }
    s.gt = calcClean(g);
  }

  // 「=」のあとに数字を打ったら、新しい計算を始める
  function startFreshAfterEquals() {
    if (s.justEq) { s.acc = null; s.op = null; s.lastOp = null; s.justEq = false; }
  }

  function digit(d) {
    startFreshAfterEquals();
    let e = s.entry === null ? "" : s.entry;
    if (e === "0") e = "";
    if (e === "-0") e = "-";
    const room = CALC_DIGITS - e.replace(".", "").replace("-", "").length;
    let add = d;
    if ((e === "" || e === "-") && /^0+$/.test(add)) add = "0"; // 先頭の 0 / 00 は 0 ひとつ
    else add = add.slice(0, Math.max(0, room));   // 00 は入る分だけ
    e += add;
    s.entry = e === "" ? "0" : e;
    s.ready = true;
    s.showGT = false;
  }

  function dot() {
    startFreshAfterEquals();
    if (s.entry === null) s.entry = "0.";
    else if (!s.entry.includes(".") && s.entry.length < CALC_DIGITS) s.entry += ".";
    s.ready = true;
    s.showGT = false;
  }

  // 一桁取り消し（入力中の数字だけ。計算結果には効かない）
  function back() {
    if (s.entry === null) return;
    const e = s.entry.slice(0, -1);
    s.entry = e === "" || e === "-" ? "0" : e;
  }

  function operator(o) {
    const v = current();
    if (s.op !== null && !s.ready) { s.op = o; return; } // 演算子の打ち直し
    if (s.op !== null) {                                   // 連続計算：ここまでを計算して続ける
      if (!setResult(calculate(s.acc, s.op, v))) return;
      s.acc = s.value;
    } else {
      s.acc = v;
    }
    s.op = o;
    s.entry = null;
    s.value = s.acc;
    s.ready = false;
    s.justEq = false;
    s.showGT = false;
  }

  function equals() {
    if (s.op !== null) {
      const b = current(); // 2つ目の数が未入力なら、表示中の数を使う（5 × = → 25）
      if (!setResult(calculate(s.acc, s.op, b))) return;
      s.lastOp = s.op;
      s.lastOperand = b;
      s.op = null;
      s.acc = null;
      addGT(s.lastOp);
    } else if (s.justEq && s.lastOp !== null) {            // = の連打：直前の計算を繰り返す（1.05 × = = = で累乗）
      if (!setResult(calculate(current(), s.lastOp, s.lastOperand))) return;
      addGT(s.lastOp);
    } else {
      return;
    }
    s.justEq = true;
    s.ready = false;
    s.showGT = false;
  }

  function sqrt() {
    const v = current();
    if (v < 0) { s.error = true; return; }
    if (!setResult(Math.sqrt(v))) return;
    s.ready = true;
    s.justEq = false;
    s.showGT = false;
  }

  function memoryRecall() {
    s.entry = null;
    s.value = s.memory;
    s.ready = true;
    s.justEq = false;
    s.showGT = false;
  }

  // M+ / M-：計算の途中なら、いったん「=」相当で確定してからメモリーに加減する
  function memoryAdd(sign) {
    if (s.op !== null) {
      if (!setResult(calculate(s.acc, s.op, current()))) return;
      s.op = null;
      s.acc = null;
    }
    const v = current();
    const m = s.memory + sign * v;
    if (calcOverflow(m)) { s.error = true; return; }
    s.memory = calcClean(m);
    s.value = v;
    s.entry = null;
    s.ready = false;
    s.justEq = false;
    s.showGT = false;
    s.lastOp = null;
  }

  function grandTotal() {
    s.entry = null;
    s.value = s.gt;
    s.ready = true;
    s.justEq = false;
    s.showGT = true;
  }

  // C：入力中の数と計算途中をクリア（メモリーとGTは残す）。GTを表示しているときは、GTもクリア
  function clear() {
    if (s.showGT) s.gt = 0;
    s.entry = "0";
    s.value = 0;
    s.acc = null;
    s.op = null;
    s.ready = false;
    s.justEq = false;
    s.lastOp = null;
    s.showGT = false;
    s.error = false;
  }

  // C・CE：数字を入力している途中なら、1回目はその数字だけを消す（CE）。
  // それ以外のとき（または続けてもう1回押したとき）は、計算途中もクリアする（C。メモリーとGTは残す）
  function clearEntryOrAll() {
    if (!s.error && s.entry !== null && !s.ceDone) {
      s.entry = "0";
      s.ceDone = true;
      return;
    }
    clear();
  }

  // CA：メモリー以外をすべてクリア（GTも消す）
  function allClear() {
    clear();
    s.gt = 0;
  }

  // %：シャープ方式。200×10% → 20、200＋10% → 220（割増）、200−10% → 180（割引）、20÷50% → 40
  function percent() {
    const v = current();
    const op = s.op;
    let r;
    if (op === "*") r = (s.acc * v) / 100;
    else if (op === "/") r = v === 0 ? NaN : s.acc / (v / 100);
    else if (op === "+") r = s.acc + (s.acc * v) / 100;
    else if (op === "-") r = s.acc - (s.acc * v) / 100;
    else r = v / 100;
    if (!setResult(r)) return;
    s.op = null;
    s.acc = null;
    s.lastOp = null;
    s.justEq = true;
    s.ready = false;
    s.showGT = false;
    if (op) addGT(op);
  }

  // +/−：表示中の数の符号を反転
  function negate() {
    if (s.entry !== null) {
      if (Number(s.entry) === 0) return;
      s.entry = s.entry.startsWith("-") ? s.entry.slice(1) : "-" + s.entry;
    } else {
      s.value = calcClean(-s.value);
      s.ready = true;
    }
    s.showGT = false;
  }

  // 税込・税抜：表示中の数に (1＋税率) を掛ける・割る
  function tax(include) {
    const v = current();
    if (!setResult(include ? v * (1 + taxRate) : v / (1 + taxRate))) return;
    s.ready = true;
    s.justEq = false;
    s.showGT = false;
  }

  function press(key) {
    const isClear = key === "C" || key === "CCE" || key === "CA";
    if (s.error && !isClear) return; // エラー中は C・CE と CA 以外を受け付けない
    const wasCe = s.ceDone;
    s.ceDone = false;
    if (/^(\d|00)$/.test(key)) digit(key);
    else if (key === ".") dot();
    else if (key === "+" || key === "-" || key === "*" || key === "/") operator(key);
    else if (key === "=") equals();
    else if (key === "sqrt") sqrt();
    else if (key === "back") back();
    else if (key === "C" || key === "CCE") { s.ceDone = wasCe; clearEntryOrAll(); }
    else if (key === "CA") allClear();
    else if (key === "%") percent();
    else if (key === "neg") negate();
    else if (key === "taxin") tax(true);
    else if (key === "taxout") tax(false);
    else if (key === "GT") grandTotal();
    else if (key === "MC" || key === "CM") s.memory = 0;
    else if (key === "MR" || key === "RM") memoryRecall();
    else if (key === "M+") memoryAdd(1);
    else if (key === "M-") memoryAdd(-1);
  }

  function view() {
    let text;
    if (s.error) text = "E";
    else if (s.entry !== null) text = calcGroup(s.entry);
    else text = calcGroup(calcPlain(s.value));
    return { text, error: s.error, memory: s.memory !== 0, gt: s.gt !== 0, op: s.op };
  }

  return { press, view, taxRate };
}
</script>

<script id="quiz-ui">
// ============================================================================
// 画面の描画。原則さわらないでください（見た目の色は CONFIG.theme、文言は CONFIG で変えられます）。
// ============================================================================
(() => {
  "use strict";

  const app = document.getElementById("app");
  const LETTERS = ["ア", "イ", "ウ", "エ", "オ", "カ"];
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 画面を切り替えたときに、いちばん上へ戻す。
  // iPad・iPhoneのSafariでは、解説へのなめらかなスクロールや指で弾いたスクロールの「惰性」が残っていると、
  // 1回の window.scrollTo(0, 0) が打ち消されて、次の問題がスクロールされた位置から始まることがある。
  // そこで、すぐに1回、描画の直後と少し後にも念のため戻す（その間に受験者が画面を触ったら、それ以上は戻さない）
  let scrollResetTimers = [];
  function scrollTopNow() {
    const el = document.scrollingElement || document.documentElement;
    el.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
    window.scrollTo(0, 0);
  }
  function resetScroll() {
    scrollResetTimers.forEach(clearTimeout);
    let touched = false;
    const stop = () => { touched = true; };
    const opts = { passive: true, capture: true };
    const kinds = ["touchstart", "wheel", "keydown", "pointerdown"];
    scrollTopNow();
    kinds.forEach((t) => window.addEventListener(t, stop, opts));
    const again = () => { if (!touched && (window.scrollY || 0) !== 0) scrollTopNow(); };
    requestAnimationFrame(again);
    scrollResetTimers = [120, 350, 700].map((ms) => setTimeout(again, ms));
    scrollResetTimers.push(setTimeout(() => kinds.forEach((t) => window.removeEventListener(t, stop, opts)), 750));
  }
  const loadErrors = window.__loadErrors || [];

  // 小さなDOM生成ヘルパ。文字は必ず textNode 経由なので、問題文にHTMLが混じっても実行されません。
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of children.flat()) {
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  // ---- 起動：データの読み込み確認 ----
  if (typeof CONFIG === "undefined" || typeof QUESTIONS === "undefined") {
    app.replaceChildren(
      h("main", { class: "main center" },
        h("section", { class: "diag err" },
          h("strong", null, "問題データを読み込めませんでした"),
          h("ul", null,
            h("li", null, "id=\"quiz-data\" のブロックで、カンマ「,」・引用符「\"」「`」・括弧の閉じ忘れがないか確認してください。"),
            loadErrors.map((m) => h("li", null, "エラー内容：" + m))))));
    return;
  }

  const checked = checkConfig(CONFIG);
  const cfg = checked.config;
  const data = validateQuestions(QUESTIONS, Object.keys(cfg.categoryColors), cfg.topics.map((t) => t.name));
  const pool = data.valid;

  document.title = cfg.appTitle;
  // CONFIG.theme はライトモードだけに適用する（ダーク時は CSS の @media (prefers-color-scheme: dark) を優先させるため、
  // documentElement に直接 style を当てず、ライトモード限定の <style> を挿入する）
  const themeKeys = Object.keys(cfg.theme);
  if (themeKeys.length) {
    const cssVars = themeKeys.map((k) => "--" + k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase()) + ":" + cfg.theme[k] + ";").join("");
    const themeStyle = document.createElement("style");
    // 「システムがライトのとき」に加えて「手動でライトを選んだとき」にも適用する（手動でダークを選んでいる間は除く）
    themeStyle.textContent =
      "@media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) { :root:not([data-theme=\"dark\"]) {" + cssVars + "} }" +
      " :root[data-theme=\"light\"] {" + cssVars + "}";
    document.head.appendChild(themeStyle);
  }

  const state = { screen: "start", items: [], index: 0, selected: null, answered: false, records: [], prevIds: [], calcOpen: cfg.calculator.startOpen, scratchOpen: false, topic: null, kind: null, topicPrev: {} };
  // 自動試験（tests/ui_test.js）用：表示中の問題（数字を選んだ後・言い換えた後の形）を読み出せるようにする。画面の動作には使わない
  window.__quizDebug = { current: () => { const it = state.items[state.index]; return it ? it.q : null; } };
  let view = null; // 出題画面の要素への参照

  // ---- 表示用の小さな関数 ----
  // 区分のバッジ：CONFIG.categoryColors の "solid"／"outline" をクラスに、色コードなら地の色にする
  function badgeKind(category) {
    const c = cfg.categoryColors[category];
    return c === "solid" || c === "outline" ? c : "";
  }
  function badgeStyle(category) {
    const c = cfg.categoryColors[category];
    return typeof c === "string" && c.startsWith("#") ? "background:" + c + ";color:#fff" : null;
  }

  // 短い2択（〇×）は横並びの大きなボタンにする
  function isCompact(item) {
    return item.order.length === 2 && item.order.every((i) => item.q.options[i].length <= 12);
  }

  function optionLabel(item, pos) {
    const text = item.q.options[item.order[pos]];
    return isCompact(item) ? text : LETTERS[pos] + "　" + text;
  }

  // 解説：行頭の【…】を太字にし、空行は小さな余白にする
  function rich(text) {
    return text.split("\n").map((line) => {
      if (line.trim() === "") return h("div", { class: "gap" });
      const m = line.match(/^(【[^】]*】)(.*)$/);
      return m ? h("p", { class: "line" }, h("strong", null, m[1]), m[2]) : h("p", { class: "line" }, line);
    });
  }

  // ---- スタート画面 ----
  function diagnostics() {
    const errs = [];
    loadErrors.forEach((m) => errs.push("読み込みエラー：" + m));
    checked.problems.forEach((m) => errs.push("設定：" + m));
    data.problems.forEach((p) => errs.push(p.label + "：" + p.messages.join(" / ")));
    const lines = errs.concat(data.warnings.map((w) => "注意：" + w));
    if (!lines.length) return null;
    console.warn("[quiz] データチェックの指摘\n" + lines.join("\n"));
    const shown = lines.slice(0, 8);
    return h("section", { class: "diag" + (errs.length ? " err" : "") },
      h("strong", null, errs.length ? "データチェック：" + errs.length + "件の不備があります（不備のある問題は出題されません）" : "データチェック：確認してください"),
      h("ul", null, shown.map((t) => h("li", null, t))),
      lines.length > shown.length ? h("p", null, "…ほか" + (lines.length - shown.length) + "件（全件はブラウザのコンソールに出力しています）") : null);
  }

  // ---- 表示（自動・ライト・ダーク）：選んだ結果は端末に保存。「自動」は端末の設定に合わせる ----
  const THEME_KEY = "boki1_quiz_theme";
  function currentThemeMode() {
    const t = document.documentElement.getAttribute("data-theme");
    return t === "light" || t === "dark" ? t : "auto";
  }
  function setThemeMode(mode) {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    try { if (mode === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, mode); } catch (e) { /* 保存できない環境では、その場の切り替えだけ */ }
  }
  function themeSwitch() {
    const modes = [["auto", "自動"], ["light", "ライト"], ["dark", "ダーク"]];
    const btns = modes.map(([m, label]) => h("button", { type: "button", class: "seg-btn", "aria-pressed": String(currentThemeMode() === m), onclick: () => {
      setThemeMode(m);
      btns.forEach((b, i) => b.setAttribute("aria-pressed", String(modes[i][0] === m)));
    } }, label));
    return h("div", { class: "seg", role: "group", "aria-label": "表示（ライト・ダーク）" }, h("span", { class: "seg-label" }, "表示"), btns);
  }

  // ---- テンキーの位置（右・左）：選んだ結果は端末に保存 ----
  const NUMPAD_SIDE_KEY = "boki1_quiz_numpad_side";
  function numpadSide() {
    try { const v = localStorage.getItem(NUMPAD_SIDE_KEY); if (v === "left" || v === "right") return v; } catch (e) { /* 読めない環境では設定値 */ }
    return cfg.numpadSide;
  }
  function numpadSideSwitch() {
    if (!numpadWanted()) return null; // テンキーを出さない端末（PCなど）では選択肢も出さない
    const sides = [["left", "左"], ["right", "右"]];
    const btns = sides.map(([v, label]) => h("button", { type: "button", class: "seg-btn", "aria-pressed": String(numpadSide() === v), onclick: () => {
      try { localStorage.setItem(NUMPAD_SIDE_KEY, v); } catch (e) { /* 保存できない環境では何もしない */ }
      btns.forEach((b, i) => b.setAttribute("aria-pressed", String(sides[i][0] === v)));
    } }, label));
    return h("div", { class: "seg-wrap" },
      h("div", { class: "seg", role: "group", "aria-label": "テンキーの位置" }, h("span", { class: "seg-label" }, "テンキー"), btns),
      h("p", { class: "seg-note" }, "回答欄の横に出す位置"));
  }

  // 論点別テストの一覧（CONFIG.topics の group ごとに並べる。問題が1問もない論点は出さない）
  function topicSection() {
    const list = cfg.topics.map((t) => ({ ...t, n: topicPool(t.name).length })).filter((t) => t.n > 0);
    if (list.length === 0) return null;
    const groups = [...new Set(list.map((t) => t.group || ""))];
    return h("section", { class: "topics", "aria-label": "論点別テスト" },
      h("h2", { class: "topics-title" }, "論点別に" + cfg.topicQuizSize + "問"),
      groups.map((g) => h("div", { class: "topic-group" },
        g ? h("h3", { class: "topic-group-title" }, g) : null,
        h("div", { class: "topic-grid" }, list.filter((t) => (t.group || "") === g).map((t) =>
          h("button", { type: "button", class: "topic-btn", onclick: () => startQuiz(t.name) },
            h("span", { class: "topic-name" }, t.name), h("span", { class: "topic-n" }, t.n + "問")))))));
  }

  // バージョン表示と更新履歴（押すと開く）
  function versionInfo() {
    if (!cfg.version) return null;
    const ymd = (d) => { const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日" : d; };
    const label = "バージョン " + cfg.version + (cfg.updated ? "（" + ymd(cfg.updated) + "更新）" : "");
    if (!cfg.changelog.length) return h("p", { class: "version" }, label);
    return h("details", { class: "version" },
      h("summary", null, label),
      h("ul", { class: "changelog" }, cfg.changelog.map(([d, text]) => h("li", null, h("span", { class: "cl-date" }, ymd(d)), text))));
  }

  function renderStart() {
    state.screen = "start";
    const counts = new Map();
    pool.forEach((q) => counts.set(q.category, (counts.get(q.category) || 0) + 1));
    const size = Math.min(cfg.quizSize, pool.length);
    const ss = cfg.startScreen;

    const cats = pool.length === 0 ? null : h("div", { class: "cats", "aria-label": "区分別の問題数" },

  // ---- 電卓（問題文と選択肢の間。開閉できる。計算の状態は問題ごとにリセット） ----
  // [キー名, 表示, 種類]。5列×5行。左の列と上の行が機能キー
  // [キー名, 表示, 種類]。SHARP EL-VN83 の配置に合わせた5列×7段。null は空き（実機のスイッチ類の位置）。
  // ＋は2段分の縦長キー（6段目と7段目の4列目）
  const CALC_KEYS = [
    ["GT", "GT", "fn"], null, null, null, null,
    ["taxin", "税込", "fn"], ["taxout", "税抜", "fn"], ["sqrt", "√", "fn"], ["back", "→", "fn"], ["CA", "CA", "clr"],
    ["CM", "CM", "fn"], ["RM", "RM", "fn"], ["M-", "M−", "fn"], ["M+", "M+", "fn"], ["CCE", "C·CE", "clr"],
    ["7", "7", "num"], ["8", "8", "num"], ["9", "9", "num"], ["%", "%", "op"], ["neg", "+/−", "op"],
    ["4", "4", "num"], ["5", "5", "num"], ["6", "6", "num"], ["*", "×", "op"], ["/", "÷", "op"],
    ["1", "1", "num"], ["2", "2", "num"], ["3", "3", "num"], ["+", "+", "op tall"], ["-", "−", "op"],
    ["0", "0", "num"], ["00", "00", "num"], [".", "・", "num"], ["=", "=", "eq"],
  ];
  const CALC_LABELS = {
    "CM": "メモリークリア", "RM": "メモリー呼び出し", "M-": "メモリー減算", "M+": "メモリー加算",
    "GT": "グランドトータル（累計）", "sqrt": "平方根", "back": "一桁取り消し",
    "CCE": "クリア（1回目は入力中の数字、2回目は計算全体）", "CA": "オールクリア（メモリー以外）",
    "taxin": "税込（税率を掛ける）", "taxout": "税抜（税率で割る）", "%": "パーセント", "neg": "符号反転",
    "/": "割る", "*": "掛ける", "-": "引く", "+": "足す", "=": "イコール", ".": "小数点", "00": "ゼロゼロ",
  };
  const CALC_OP_MARK = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  const CALC_KEYBOARD = {
    "+": "+", "-": "-", "*": "*", "/": "/", ".": ".", "Enter": "=", "=": "=",
    "Backspace": "back", "Delete": "CCE", "Escape": "CCE", "c": "CCE", "C": "CCE", "%": "%",
  };

  // キーの反応（電卓とテンキーで共通）：click ではなく pointer イベントで受け付ける。
  //   ・前のキーから指を離す前に次のキーを押しても、どちらも確実に入力される（iPhoneでは click が取りこぼされることがある）
  //   ・押した瞬間に見た目を変え、指を離した時点で入力する（指を滑らせてスクロールしたときは入力しない）
  //   ・キーボードで Enter／スペースを押したとき（click だけが届く）も入力できるよう、click も受ける
  //   ・iPadなど幅600px以上の画面（指・ペン）では、触れた瞬間に入力する。キーの上ではスクロールしない（CSSの touch-action: none）ので、
  //     指がわずかに動いてスクロールと判定され入力が消える、ということが起きない。スマホでは電卓の上でもスクロールできるよう、従来どおり離した時点で入力する
  const pressOnDown = (e) => e.pointerType !== "mouse" && !!window.matchMedia && window.matchMedia("(min-width: 600px)").matches;
  function bindPress(btn, fn) {
    const downs = new Map(); // pointerId → 押した位置（触れた瞬間に入力した場合は null）
    let lastPointerPress = 0;
    const release = (id) => { downs.delete(id); if (downs.size === 0) btn.classList.remove("pressing"); };
    btn.addEventListener("pointerdown", (e) => {
      if (e.button > 0) return;
      btn.classList.add("pressing");
      if (pressOnDown(e)) {
        if (e.cancelable) e.preventDefault();
        downs.set(e.pointerId, null);
        lastPointerPress = Date.now();
        fn();
        return;
      }
      downs.set(e.pointerId, [e.clientX, e.clientY]);
    });
    btn.addEventListener("pointerup", (e) => {
      const at = downs.get(e.pointerId);
      release(e.pointerId);
      if (!at) return;
      const r = btn.getBoundingClientRect();
      const inside = e.clientX >= r.left - 8 && e.clientX <= r.right + 8 && e.clientY >= r.top - 8 && e.clientY <= r.bottom + 8;
      if (!inside || Math.hypot(e.clientX - at[0], e.clientY - at[1]) > 24) return; // 指を大きく滑らせたときは入力しない
      lastPointerPress = Date.now();
      fn();
    });
    btn.addEventListener("pointercancel", (e) => release(e.pointerId)); // スクロールが始まったときなど
    btn.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") release(e.pointerId); });
    btn.addEventListener("click", () => {
      if (Date.now() - lastPointerPress < 700) return; // すでに pointer で入力済み（同じ操作の click は無視）
      fn();
    });
    btn.addEventListener("contextmenu", (e) => e.preventDefault()); // 長押しでメニューを出さない
  }

  // ---- 記述式の画面内テンキー ----
  // iPadには数字だけのキーボードがなく、inputmode="decimal" でも通常のキーボードが出て画面の半分を覆う。
  // そこで端末のキーボードは出さず（inputmode="none"）、回答欄の下に数字キーを出す。外付けキーボードからの入力はそのまま使える。
  // キーを押すと入力欄の文字を書き換えて input イベントを送るので、カンマの自動挿入など入力欄の処理はキーボード入力と同じものが動く。
  const numpadWanted = () => cfg.numpad === "always" ||
    (cfg.numpad === "touch" && ((navigator.maxTouchPoints || 0) > 0 || (!!window.matchMedia && window.matchMedia("(any-pointer: coarse)").matches)));
  // ---- 回答欄への入力（テンキーと電卓の「回答入力」「回答欄へ」で共通） ----
  // 「どの入力欄に入れるか」とカーソル位置を覚えておき、キー1つ分ずつ入力欄の文字を書き換える
  let answerTarget = null; // 表示中の記述式の問題の入力先（4択・〇×では null）
  function createAnswerTarget(fields) {
    let active = 0;
    const sel = fields.map(() => null); // 入力欄から離れたときのカーソル位置
    let setActive = (i) => {
      active = i;
      fields.forEach((f, k) => f.inp.classList.toggle("np-target", k === i));
    };
    fields.forEach((f, i) => {
      f.inp.addEventListener("focus", () => {
        setActive(i);
        // 欄を触って選んだときは、カーソルを末尾に置く（右寄せの欄の左側を触ると先頭に入ってしまうため）。選んだ後に触り直せば途中にも置ける
        setTimeout(() => { if (document.activeElement === f.inp) { const n = f.inp.value.length; try { f.inp.setSelectionRange(n, n); } catch (e) { /* 無視 */ } } }, 0);
      });
      f.inp.addEventListener("blur", () => { sel[i] = [f.inp.selectionStart, f.inp.selectionEnd]; });
    });
    function type(key) {
      if (state.answered) return;
      const inp = fields[active].inp;
      if (key === "next") {
        setActive((active + 1) % fields.length);
        fields[active].inp.focus({ preventScroll: true });
        return;
      }
      const v = inp.value;
      let a = v.length, b = v.length;
      const saved = document.activeElement === inp ? [inp.selectionStart, inp.selectionEnd] : sel[active];
      if (saved && saved[0] !== null && saved[1] !== null) { a = Math.min(saved[0], v.length); b = Math.min(saved[1], v.length); }
      let nv, caret;
      if (key === "bs") {
        if (a === b) { if (a === 0) return; a -= 1; }
        nv = v.slice(0, a) + v.slice(b); caret = a;
      } else if (key === "clr") {
        if (!v) return;
        nv = ""; caret = 0;
      } else {
        nv = v.slice(0, a) + key + v.slice(b); caret = a + key.length;
      }
      inp.value = nv;
      try { inp.setSelectionRange(caret, caret); } catch (e) { /* 対応していない環境では無視 */ }
      inp.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: key === "bs" || key === "clr" ? "deleteContentBackward" : "insertText" }));
      sel[active] = [inp.selectionStart, inp.selectionEnd];
    }
    // 欄の中身をまるごと置き換える（電卓の「回答欄へ」）
    function set(value) {
      if (state.answered) return false;
      const inp = fields[active].inp;
      inp.value = value;
      try { inp.setSelectionRange(value.length, value.length); } catch (e) { /* 無視 */ }
      inp.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText" }));
      sel[active] = [inp.selectionStart, inp.selectionEnd];
      inp.classList.remove("flash"); void inp.offsetWidth; inp.classList.add("flash"); // 入ったことが分かるよう一瞬光らせる
      return true;
    }
    // 入力欄の中身や選んでいる欄が変わったことを、電卓（回答入力モードの表示）に知らせる
    const listeners = [];
    fields.forEach((f) => f.inp.addEventListener("input", () => listeners.forEach((fn) => fn())));
    const baseSetActive = setActive;
    setActive = (i) => { baseSetActive(i); listeners.forEach((fn) => fn()); };
    setActive(0);
    return {
      type, set, multi: fields.length > 1,
      value: () => fields[active].inp.value,
      label: () => fields.length > 1 ? (fields[active].label || "欄" + (active + 1)) : "",
      onChange: (fn) => listeners.push(fn),
    };
  }

  function buildNumpad(target) {
    const type = target.type;
    const multi = target.multi;
    // キーの並びは CSS の grid-template-areas で決める（画面の幅で4列・3列を切り替えるため）。area はキーの置き場所の名前
    const defs = [["7"], ["8"], ["9"], ["4"], ["5"], ["6"], ["1"], ["2"], ["3"], ["0"], ["00"], [".", "．", "", "小数点", "dot"],
      ["bs", "⌫", "fn", "1文字消す", "bs"], ["clr", "クリア", "fn", "この欄を全部消す", "clr"],
      ...(multi ? [["next", "次の欄", "fn", "次の入力欄へ", "nx"]] : [])];
    const keys = defs.map(([key, label, kind, aria, area]) => {
      const btn = h("button", { type: "button", class: "nk " + (kind || ""), "aria-label": aria || key, tabindex: "-1", style: "grid-area:" + (area || "k" + key) }, label || key);
      btn.addEventListener("mousedown", (e) => e.preventDefault()); // 押しても入力欄からカーソルが外れないように
      bindPress(btn, () => type(key));
      return btn;
    });
    return h("div", { class: "numpad " + (multi ? "multi" : "single"), role: "group", "aria-label": "テンキー" }, keys);
  }

  function buildCalculator() {
    const calc = createCalculator(cfg.calculator);
    const flagM = h("span", { class: "flag" }, "M");
    const flagGT = h("span", { class: "flag" }, "GT");
    const flagOp = h("span", { class: "flag" }, "");
    const screen = h("div", { class: "calc-num" }, "0");

    function sync() {
      const v = calc.view();
      screen.textContent = v.text;
      screen.classList.toggle("long", v.text.length > 13);
      screen.classList.toggle("err", v.error);
      flagM.classList.toggle("on", v.memory);
      flagGT.classList.toggle("on", v.gt);
      flagOp.textContent = v.op ? CALC_OP_MARK[v.op] : "";
    }
    // 記述式の問題では、電卓を2通りに使える（GTの右の空き段にボタンを置く）
    //   ・「電卓」モード … ふつうの電卓
    //   ・「回答入力」モード … 数字・00・小数点・→（1文字消す）・C·CE／CA（欄を消す）のキーで、回答欄に入力する。計算のキーは使えない
    //   ・「回答欄へ」… 電卓に表示中の数字を、選んでいる回答欄にそのまま入れる（転記）
    const target = answerTarget;
    let mode = "calc";
    const INPUT_KEYS = { back: "bs", CCE: "clr", CA: "clr" };
    function press(key) {
      if (mode === "input" && target) {
        const k = /^[0-9]$/.test(key) || key === "00" || key === "." ? key : INPUT_KEYS[key];
        if (k) target.type(k);
        return;
      }
      calc.press(key);
      sync();
    }
    function transfer() {
      if (!target) return;
      const v = calc.view();
      if (v.error) return;
      target.set(v.text.replace(/,/g, ""));
    }

    const keys = CALC_KEYS.map((def) => {
      if (def === null) return h("span", { class: "ck-gap", "aria-hidden": "true" });
      const [key, label, kind] = def;
      const usable = /^[0-9]$/.test(key) || key === "00" || key === "." || key in INPUT_KEYS;
      const btn = h("button", {
        type: "button", class: "ck " + kind + (usable ? " inp-ok" : ""), "aria-label": CALC_LABELS[key] || label, title: CALC_LABELS[key] || null,
      }, label);
      bindPress(btn, () => press(key));
      return btn;
    });
    let modeBtns = null;
    const flagMode = h("span", { class: "flag mode-flag" }, "");
    // 回答入力モードの間は、表示部に「回答欄の中身」を出す（スマホでは回答欄が電卓の下に隠れるため）。電卓に戻すと計算中の数字が戻る
    function showMode() {
      if (mode !== "input") { sync(); return; }
      const t = target.value();
      screen.textContent = t || "0";
      screen.classList.toggle("long", t.length > 13);
      screen.classList.remove("err");
      const lb = target.label();
      flagMode.textContent = "回答入力中" + (lb ? "：" + lb : "");
    }
    function setMode(m) {
      mode = m;
      panel.classList.toggle("input-mode", m === "input");
      modeBtns.forEach(([v, b]) => b.setAttribute("aria-pressed", String(v === m)));

      modeBtns = [["calc", "電卓", "電卓として使う"], ["input", "入力", "電卓のキーで回答欄に入力する"]].map(([v, label, aria]) => {
        const b = h("button", { type: "button", class: "mode-btn", "aria-pressed": String(v === "calc"), "aria-label": aria }, label);
        bindPress(b, () => setMode(v));
        return [v, b];
      });
      const seg = h("div", { class: "ck-mode", role: "group", "aria-label": "電卓の使い方" }, modeBtns.map(([, b]) => b));
      const xfer = h("button", { type: "button", class: "ck fn xfer", "aria-label": "表示中の数字を回答欄へ入れる" }, "回答欄へ");
      bindPress(xfer, transfer);
      target.onChange(() => { if (mode === "input") showMode(); });
      keys.splice(1, 4, seg, xfer); // GTの右の空き4マスを、モード切替（2マス）と「回答欄へ」（2マス）に使う
    }

    const panel = h("div", { class: "calc", tabindex: "-1", role: "group", "aria-label": "電卓", hidden: !state.calcOpen },
      h("div", { class: "calc-display" }, h("div", { class: "calc-flags" }, flagM, flagGT, flagMode, flagOp), screen),
      h("div", { class: "calc-keys" }, keys),
      h("p", { class: "calc-hint" }, "PC：数字・+ − * /・%・Enter（＝）・Backspace（一桁取消）・Delete（C・CE）が使えます。"));

    panel.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const key = /^[0-9]$/.test(e.key) ? e.key : CALC_KEYBOARD[e.key];
      if (!key) return;

    const toggle = h("button", { type: "button", class: "calc-toggle", "aria-expanded": String(state.calcOpen) });
    function paintToggle() {
      toggle.textContent = state.calcOpen ? "電卓を閉じる　▴" : "電卓を開く　▾";
      toggle.setAttribute("aria-expanded", String(state.calcOpen));
      panel.hidden = !state.calcOpen;
    }
    toggle.addEventListener("click", () => {
      state.calcOpen = !state.calcOpen;
      paintToggle();
      if (state.calcOpen) {
        panel.focus({ preventScroll: true }); // PCでは、そのまま数字キーで入力できる
        panel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
      }

    sync();
    return { toggle, panel };
  }

  // ---- 下書き欄（手書き。ペン・消しゴム・1つ戻す・全消去。問題ごとに白紙に戻る） ----
  // 線は「点の列」として覚えておき、ライト/ダークの切り替えや画面サイズの変更のたびに描き直す
  let activeScratch = null; // 表示中の下書き欄（描き直し用）
  function buildScratch() {
    const strokes = [];
    let mode = "pen", cur = null, penSeen = false;
    // 2本指で動かす（フリーボードのように）。view は「書いた内容を画面上でどれだけずらして見せているか」（CSSピクセル）
    const view = { x: 0, y: 0 };
    const touches = new Map(); // 画面に触れている指（pointerId → [x, y]）
    let pan = null;            // 2本指で動かしている最中の情報
    let panLock = false;       // 動かし終わって指が残っている間は、線を引かない
    let dpr = 1;
    const canvas = h("canvas", { class: "scratch-canvas", role: "img", "aria-label": "下書き欄（指やペンで書けます）" });
    const g = canvas.getContext("2d");
    const ink = () => getComputedStyle(document.documentElement).getPropertyValue("--text").trim() || "#1c1712";

    function setup(st) {
      g.globalCompositeOperation = st.mode === "eraser" ? "destination-out" : "source-over";
      g.strokeStyle = g.fillStyle = ink();
      g.lineWidth = st.w;
      g.lineCap = "round";
      g.lineJoin = "round";
    }
    function drawDot(st, pt) { setup(st); g.beginPath(); g.arc(pt[0], pt[1], st.w / 2, 0, Math.PI * 2); g.fill(); }
    function drawSeg(st, a, b) { setup(st); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    function drawStroke(st) {
      drawDot(st, st.pts[0]);
      for (let i = 1; i < st.pts.length; i++) drawSeg(st, st.pts[i - 1], st.pts[i]);
    }
    // 画面の解像度とずらし量を、描画の座標変換にまとめて反映する（方眼も同じだけずらす）
    function applyView() {
      g.setTransform(dpr, 0, 0, dpr, view.x * dpr, view.y * dpr);
      canvas.style.backgroundPosition = view.x + "px " + view.y + "px";
      homeBtn.hidden = !view.x && !view.y;
    }
    function redraw() {
      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, canvas.width, canvas.height);
      g.restore();
      applyView();
      strokes.forEach(drawStroke);
      g.globalCompositeOperation = "source-over";
    }
    // キャンバスの画素数を、表示サイズ×画面の解像度に合わせる（Retinaでも線がにじまないように）
    function fit() {
      dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth, ht = canvas.clientHeight;
      if (!w || !ht) return;
      const W = Math.round(w * dpr), H = Math.round(ht * dpr);
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
