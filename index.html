<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e2570a">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17130f">
<title>日商簿記1級 ランダム小テスト</title>
<script>
  // ライト/ダークの手動選択を、CSSより先に反映させる（切り替え直後に一瞬もとの配色がちらつくのを防ぐため）
  try {
    var __t = localStorage.getItem("boki1_quiz_theme");
    if (__t === "light" || __t === "dark") document.documentElement.setAttribute("data-theme", __t);
  } catch (e) {}
</script>

<!--
  日商簿記1級 ランダム小テスト（公開版 v2.0 / 2026-09-21・全100問）
  すべてClaudeが新規に作問した問題のみで構成しています（著作権上の懸念はありません）。
  問題を追加する場合は、市販の教材・テキスト・他のAIの出力をそのまま/要約して転記せず、
  会計基準の趣旨から新しい数値設定で自作してください（詳しくは手順書§8）。
  全100問版（私用・非公開）は、同じフォルダの boki1_quiz_私用版.html です。そちらは公開しないでください。

  【このファイルの構成】3つのスクリプトブロックに分かれています。
    1. id="quiz-data"  ← ★ここだけ編集する（設定 CONFIG と 問題 QUESTIONS）
    2. id="quiz-core"  ← 出題・採点・データ検証のロジック（原則さわらない）
    3. id="quiz-ui"    ← 画面の描画（原則さわらない）

  【問題を追加する】
    QUESTIONS の最後（閉じ括弧 ] の直前）に、既存の1問を丸ごとコピーして貼り、
    id を「次に使えるID」にして、中身を書き換えます。
    次に使えるIDは、check_quiz.js を実行すると表示されます（無ければ、QUESTIONS内の
    最大の id に1を足した数）。公開ページには表示していません。
    ・answer は「正解が何番目の選択肢か」（1始まり）
    ・〇×問題は options: OX とし、answer は 1（〇）か 2（×）
    ・計算問題を記述式（数値入力）にするときは、input: [{ value: 正解の数値, unit: "円" }] を足す（手順書§3）
    ・出題のたびに数字を変えるときは vary を、〇×の言い換えを足すときは alt を書く（手順書§3.1・§3.2）
    ・各問の終わりの「,」、文字列を囲む「"」や「`」の閉じ忘れに注意

  【書き間違いの確認】ブラウザで開くと、スタート画面に指摘が表示されます。
  詳しい手順は「boki1_quiz_手順書.md」、自動チェックは「check_quiz.js」を参照してください。
  問題文と選択肢の間に電卓（GT・メモリー・√・00・小数点・一桁取り消し）があります。設定は CONFIG.calculator。
  外部への通信は一切ありません（オフラインで動作します）。
-->

<script>
  // 読み込み時のエラーを控えておく（問題データの書き間違いをスタート画面で知らせるため）
  window.__loadErrors = [];
  window.addEventListener("error", function (e) {
    window.__loadErrors.push((e.message || "不明なエラー") + (e.lineno ? "（" + e.lineno + "行目付近）" : ""));
  });
</script>

<style>
  /* 配色は既定値です。変えたいときは CONFIG.theme（quiz-data ブロック）で上書きできます（ライトモードのみ）。
     ライト/ダークは、右上の切り替えボタンで手動選択できます（選んだ結果は端末に保存され、次回も覚えています）。
     何も選んでいないときは、端末・ブラウザのダークモード設定に自動で追従します。
     スコアボード（結果画面の正解数表示）は、ライト・ダークどちらでも同じ配色で固定しています
     （実際のスタジアムの得点掲示板が、昼夜を問わず同じ見た目なのと同じ考え方です）。 */
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1c1712;
    --muted: #746b60;
    --rule: #e3ded5;
    --primary: #e2570a;
    --primary-text: #ffffff;
    --primary-bg: #fdede2;
    --primary-ink: #c24a08;
    --correct: #1b7a4b;
    --correct-bg: #e7f5ed;
    --wrong: #c2372b;
    --wrong-bg: #fbeceb;
    --grid: rgba(116, 107, 96, 0.16);
    --board-bg: #1a1512;
    --board-text: #ffb74d;
  }
  /* ダーク配色：システムがダークのとき（ただし手動で「ライト」を選んでいる間は除く）に加えて、
     手動で「ダーク」を選んだときは、システム設定に関わらず適用する */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17130f;
      --card: #221c16;
      --text: #f3ece2;
      --muted: #b0a594;
      --rule: #3a3128;
      --primary: #ff7a29;
      --primary-text: #1a1209;
      --primary-bg: #3a2211;
      --primary-ink: #ff7a29;
      --correct: #4caf7d;
      --correct-bg: #16281f;
      --wrong: #e8695c;
      --wrong-bg: #2e1613;
      --grid: rgba(243, 236, 226, 0.09);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17130f;
    --card: #221c16;
    --text: #f3ece2;
    --muted: #b0a594;
    --rule: #3a3128;
    --primary: #ff7a29;
    --primary-text: #1a1209;
    --primary-bg: #3a2211;
    --primary-ink: #ff7a29;
    --correct: #4caf7d;
    --correct-bg: #16281f;
    --wrong: #e8695c;
    --wrong-bg: #2e1613;
    --grid: rgba(243, 236, 226, 0.09);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: calc(100vh - 6px);  /* 6px は画面最上部の色帯の分（これがないと常に6pxだけスクロールが出る） */
    min-height: calc(100dvh - 6px);
    display: flex;
    flex-direction: column;
  }
  .brand-stripe { height: 6px; background: var(--primary); }
  .main { flex: 1; padding: 6px 16px 16px; }
  .main.center {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding-top: calc(24px + env(safe-area-inset-top));
  }

  /* ---- 上部：第n問と進捗（1問=1マス。回答済みのマスは正誤で色が付く） ---- */
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top)) 16px 10px;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .top-row .count { flex: 1; min-width: 0; }
  .home-btn {
    flex: none; min-height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--card); color: var(--text); font: inherit; font-size: 0.82rem; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  .count { font-weight: 700; font-variant-numeric: tabular-nums; }
  .steps { display: flex; gap: 4px; }
  .step { flex: 1; height: 9px; border-radius: 1px; background: var(--rule); }
  .step.ok { background: var(--correct); }
  .step.ng { background: var(--wrong); }
  .step.now { background: var(--primary); }
  .badge {
    display: inline-block;
    padding: 1px 9px;
    border-radius: 3px;
    font-size: 0.78rem;
    font-weight: 700;
    line-height: 1.7;
    color: #fff;
    background: var(--muted);
    white-space: nowrap;
  }

  /* ---- カードと問題文 ---- */
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 20px 18px; }
  .q { margin: 0 0 18px; font-size: 1.02rem; line-height: 1.75; white-space: pre-line; word-break: break-word; }

  /* ---- 選択肢 ---- */
  .options { display: grid; gap: 10px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    padding: 12px 14px;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--rule);
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .opt .mark {
    flex: none;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 3px;
    font-size: 0.85rem;
    font-weight: 700;
    background: var(--bg);
    color: var(--muted);
  }
  .opt-text { flex: 1; line-height: 1.55; }
  .opt[aria-checked="true"] { border-color: var(--primary); background: var(--primary-bg); }
  .opt[aria-checked="true"] .mark { background: var(--primary); color: var(--primary-text); }
  .locked .opt { cursor: default; }
  .locked .opt:not(.is-correct):not(.is-wrong) { opacity: 0.55; }
  .opt.is-correct { border-color: var(--correct); background: var(--correct-bg); }
  .opt.is-correct .mark { background: var(--correct); color: #fff; }
  .opt.is-wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .opt.is-wrong .mark { background: var(--wrong); color: #fff; }
  .tag { flex: none; padding: 0 8px; border-radius: 3px; font-size: 0.72rem; font-weight: 700; color: #fff; }
  .is-correct .tag { background: var(--correct); }
  .is-wrong .tag { background: var(--wrong); }
  /* 〇×（短い2択）は横並びの大きなボタン */
  .options.ox { grid-template-columns: 1fr 1fr; }
  .ox .opt-text { flex: none; }
  .ox .opt { flex-direction: column; justify-content: center; gap: 6px; min-height: 76px; text-align: center; font-size: 1.05rem; font-weight: 700; }

  /* ---- 正誤と解説 ---- */
  .slot { scroll-margin-top: 84px; }
  .verdict { margin: 16px 0 0; padding: 12px 14px; border-radius: 4px; font-weight: 700; }
  .verdict.ok { background: var(--correct-bg); color: var(--correct); }
  .verdict.ng { background: var(--wrong-bg); color: var(--wrong); }
  .explain {
    margin-top: 12px;
    padding: 14px 16px;
    border-left: 4px solid var(--primary);
    border-radius: 0 4px 4px 0;
    background: var(--bg);
    font-size: 0.95rem;
  }
  .explain h3 { margin: 0 0 6px; font-size: 0.85rem; color: var(--muted); }
  .explain .line { margin: 0 0 0.4em; }
  .explain .gap { height: 0.4em; }
  .explain strong { color: var(--primary); }

  /* ---- 下部の操作ボタン ---- */
  .actions {
    position: sticky;
    bottom: 0;
    z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    box-shadow: 0 -1px 0 var(--rule);
  }
  .btn {
    display: block;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: 6px;
    background: var(--primary);
    color: var(--primary-text);
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn:disabled { background: var(--rule); color: var(--muted); cursor: not-allowed; }
  .btn.secondary { min-height: 48px; border: 2px solid var(--primary); background: var(--card); color: var(--primary); font-size: 1rem; }
  .actions .btn + .btn { margin-top: 10px; }

  /* ---- スタート画面：帳簿風の区分別一覧（合計行は二重線） ---- */
  .title { margin: 0 0 4px; font-size: 1.4rem; font-weight: 800; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; text-wrap: balance; }
  .lead { margin: 0 0 16px; color: var(--muted); }
  .ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .ledger th { padding: 0 0 6px; border-bottom: 1px solid var(--text); font-size: 0.78rem; font-weight: 600; color: var(--muted); text-align: left; }
  .ledger td { padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .ledger th:last-child, .ledger td:last-child { text-align: right; }
  .ledger tfoot td { padding-top: 10px; border-top: 3px double var(--text); border-bottom: 0; font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 1px; background: var(--muted); border: 1px solid rgba(128,128,128,0.35); }
  .hint { margin: 12px 0 0; font-size: 0.82rem; color: var(--muted); }
  .footer-link { margin: 8px 0 0; padding: 0 4px; font-size: 0.78rem; text-align: center; color: var(--muted); }

  /* ---- スタート画面 ---- */
  .main.start { padding-top: calc(28px + env(safe-area-inset-top)); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .hero .eyebrow { margin: 0; font-size: 0.82rem; font-weight: 700; color: var(--primary-ink); letter-spacing: 0.04em; }
  .hero .title { margin: 2px 0 6px; font-size: 1.75rem; }
  .hero .tagline { margin: 0 0 20px; color: var(--muted); }
  .hero .btn { min-height: 58px; font-size: 1.1rem; }
  .hero .lead { margin: 8px 0 0; font-size: 0.82rem; text-align: center; }
  .topics { margin: 30px 0 0; }
  .topics-title { margin: 0 0 4px; font-size: 1.05rem; }
  .topic-group { margin-top: 12px; }
  .topic-group-title { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; color: var(--muted); }
  .topic-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
  .kind-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 4px; }
  .kind-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    min-height: 54px; padding: 6px 8px; border: 1px solid var(--primary); border-radius: 4px;
    background: var(--card); color: var(--primary); font: inherit; cursor: pointer; touch-action: manipulation;
  }
  .kind-btn:active { background: var(--primary-bg); }
  .kind-btn:disabled { opacity: 0.4; cursor: default; }
  .kind-name { font-weight: 700; font-size: 0.98rem; }
  .kind-n { font-size: 0.74rem; color: var(--muted); }
  .topic-btn {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
    min-height: 54px; padding: 8px 10px; text-align: left;
    border: 1px solid var(--rule); border-radius: 4px; background: var(--card); color: var(--text);
    font: inherit; cursor: pointer; touch-action: manipulation;
  }
  .topic-btn:active { border-color: var(--primary); }
  .topic-name { font-size: 0.86rem; font-weight: 700; line-height: 1.35; }
  .topic-n { font-size: 0.72rem; color: var(--muted); }
  .count-topic { display: block; font-size: 0.75rem; font-weight: 700; color: var(--primary-ink); }
  .features { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; }
  .features li { padding-left: 12px; border-left: 3px solid var(--primary); }
  .features strong { display: block; font-size: 0.98rem; }
  .features li span { display: block; font-size: 0.84rem; color: var(--muted); line-height: 1.6; }
  .cats { margin: 28px 0 0; padding-top: 10px; border-top: 2px solid var(--text); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 20px; font-variant-numeric: tabular-nums; }
  .cat { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 0.9rem; }
  .cat-n { font-weight: 700; }
  .start-foot { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--rule); text-align: center; }
  .foot-note { margin: 12px 0 0; font-size: 0.78rem; color: var(--muted); }
  .version { margin: 14px 0 0; font-size: 0.74rem; color: var(--muted); }
  .version summary { display: inline-block; cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 2px; }
  .version summary::-webkit-details-marker { display: none; }
  .changelog { margin: 10px 0 0; padding: 0; list-style: none; text-align: left; display: grid; gap: 6px; }
  .changelog li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 8px; line-height: 1.5; }
  .cl-date { font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; font-size: 0.82rem; }
  .seg-label { display: flex; align-items: center; padding: 0 12px; color: var(--muted); border-right: 1px solid var(--rule); }
  .seg-btn { min-height: 38px; padding: 0 14px; border: 0; background: var(--card); color: var(--text); font: inherit; cursor: pointer; touch-action: manipulation; }
  .prefs { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 10px 14px; }
  .seg-wrap { display: flex; flex-direction: column; align-items: center; }
  .seg-note { margin: 4px 0 0; font-size: 0.7rem; color: var(--muted); }
  .seg-btn + .seg-btn { border-left: 1px solid var(--rule); }
  .seg-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-text); font-weight: 700; }
  /* 区分の見た目（試験の時間割で2種類） */
  .badge.solid { background: var(--text); color: var(--bg); }
  .badge.outline { background: transparent; color: var(--primary-ink); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .dot.solid { background: var(--text); border-color: transparent; }
  .dot.outline { background: transparent; border: 1.5px solid var(--primary); }
  .footer-link a { color: inherit; text-decoration: underline; }

  /* ---- 結果画面（正解数は、実際の得点掲示板を模した固定の配色パネルに。ライト/ダーク共通） ---- */
  .scoreboard {
    margin: -20px -18px 16px;
    padding: 18px 18px 16px;
    border-radius: 4px 4px 0 0;
    background: var(--board-bg);
  }
  .result-line { margin: 0; color: #cabfae; font-size: 0.85rem; }
  .result-num { margin: 0; font-size: 1.1rem; color: #f3ece2; }
  .total { display: inline-block; margin-right: 0.2em; padding: 0 0.1em; border-bottom: 5px double var(--board-text); font-size: 3rem; font-weight: 800; line-height: 1.25; color: var(--board-text); }
  .score { margin: 12px 0 4px; font-size: 1.1rem; font-weight: 700; }
  .grade { margin: 16px 0 4px; font-size: 1.3rem; }
  .grade-msg { margin: 0; color: var(--muted); }

  .review h2 { margin: 4px 0 8px; font-size: 1rem; }
  details.rev { margin-bottom: 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--card); }
  details.rev summary { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; list-style: none; }
  details.rev summary::-webkit-details-marker { display: none; }
  details.rev summary::after { content: "開く"; flex: none; font-size: 0.75rem; color: var(--muted); }
  details.rev[open] summary::after { content: "閉じる"; }
  .sum-text {
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  details.rev summary .badge { flex: none; min-width: 4.8em; text-align: center; }
  .rev-body { padding: 0 14px 14px; }
  .rev-body .q { margin-bottom: 10px; font-size: 0.95rem; }
  .ans { margin: 0 0 4px; font-size: 0.92rem; font-weight: 700; }
  .ans.ng { color: var(--wrong); }
  .ans.ok { color: var(--correct); }

  /* ---- データチェックの指摘 ---- */
  .diag { padding: 12px 14px; border: 1px solid var(--primary); border-radius: 4px; background: var(--primary-bg); font-size: 0.88rem; }
  .diag.err { border-color: var(--wrong); background: var(--wrong-bg); }
  .diag ul { margin: 6px 0 0; padding-left: 1.2em; }
  .diag p { margin: 6px 0 0; }

  /* ---- 電卓（問題文と選択肢の間。開閉式） ---- */
  .calc-wrap { margin: 0 0 16px; }
  .calc-toggle, .scratch-toggle {
    display: block;
    width: 100%;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--bg);
    color: var(--primary);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .calc { margin-top: 10px; padding: 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); scroll-margin-top: 84px; scroll-margin-bottom: 96px; }
  .calc[hidden] { display: none; }
  .tool-toggles { display: grid; gap: 8px; }
  /* iPadなど（幅600px以上）：下書き欄と電卓を両方開いたら横に並べる（下書き55％・電卓45％） */
  @media (min-width: 600px) {

<script id="quiz-core">

// 問題データの点検。不備のある問題は valid に入れず、problems に理由を返す。
// ---------------------------------------------------------------------------
// 数字が出題のたびに変わる問題（vary）
//   問題文・選択肢・解説・input の value などに {式} を書くと、出題のたびに選んだ数字で計算して埋め込む。
//   vary: {
//     vars: { A: [基準, 最小, 最大, 刻み], ... },   // 基準＝check_quiz.js での照合や、うまく作れなかったときに使う数字
//     calc: { 名前: "式", ... },                    // 途中の計算（上から順に計算。後の式で使える）
//     when: "式",                                  // 成り立つ組み合わせだけを使う条件（例："isInt(ans) && ans > 0"）
//     decimals: 1,                                 // 答えに小数を許す桁数（省略すると、答えは整数だけ。check_quiz.js が点検）
//   }
//   {式:%} は100倍（40％ の「40」）、{式:▲} はマイナスを▲で、{式:±} はプラスを＋・マイナスを▲で、
//   {式:raw} はカンマなし、{式:f1}・{式:f2} は小数第1位・第2位まで（0も表示）で表示。
//   {?条件|成り立つときの文|成り立たないときの文} は、条件で文を切り替える（例：{?d > 0|不利差異|有利差異}）。
//   式で使えるもの：数字、名前、+ − * / ( )、比較（< <= > >= == !=）、&& ||、
//                   round(x, 桁), floor, ceil, abs, min, max, sqrt, isInt(x), if(条件, 真のとき, 偽のとき)
// ---------------------------------------------------------------------------
const VARY_FUNCS = {
  round: (x, d) => { const k = Math.pow(10, d || 0); return Math.round(x * k + (x >= 0 ? 1e-9 : -1e-9)) / k; },
  floor: (x) => Math.floor(x + 1e-9), ceil: (x) => Math.ceil(x - 1e-9), abs: Math.abs,
  min: Math.min, max: Math.max, sqrt: Math.sqrt,
  isInt: (x) => Math.abs(x - Math.round(x)) < 1e-9,
  if: (c, a, b) => (c ? a : b),

// 式の計算（eval は使わず、四則演算・比較・関数だけを読む小さな計算機）
function evalExpr(src, env) {
  const toks = String(src).match(/\d+(?:\.\d+)?|[A-Za-z_][A-Za-z0-9_]*|<=|>=|==|!=|&&|\|\||[-+*/(),<>!]|\S/g) || [];
  let i = 0;
  const peek = () => toks[i];
  const take = (t) => { if (t !== undefined && toks[i] !== t) throw new Error("「" + t + "」が必要です：" + src); return toks[i++]; };
  function primary() {
    const t = take();
    if (t === undefined) throw new Error("式が途中で終わっています：" + src);
    if (/^\d/.test(t)) return parseFloat(t);
    if (t === "(") { const v = orExpr(); take(")"); return v; }
    if (t === "-") return -primary();
    if (t === "!") return primary() ? 0 : 1;
    if (/^[A-Za-z_]/.test(t)) {
      if (peek() === "(") {
        const fn = VARY_FUNCS[t];
        if (!fn) throw new Error("使えない関数です：" + t);
        take("(");
        const args = [];
        if (peek() !== ")") { args.push(orExpr()); while (peek() === ",") { take(","); args.push(orExpr()); } }
        take(")");
        return fn(...args);
      }
      if (!(t in env)) throw new Error("未定義の名前です：" + t);
      return env[t];
    }
    throw new Error("読めない記号です：" + t + "（" + src + "）");
  }
  function mul() { let v = primary(); while (peek() === "*" || peek() === "/") { const o = take(); const r = primary(); v = o === "*" ? v * r : v / r; } return v; }
  function add() { let v = mul(); while (peek() === "+" || peek() === "-") { const o = take(); const r = mul(); v = o === "+" ? v + r : v - r; } return v; }

    let v = add();
    while (["<", "<=", ">", ">=", "==", "!="].includes(peek())) {
      const o = take(); const r = add(); const e = 1e-9;
      v = o === "<" ? v < r - e : o === "<=" ? v <= r + e : o === ">" ? v > r + e : o === ">=" ? v >= r - e : o === "==" ? Math.abs(v - r) <= e : Math.abs(v - r) > e;
      v = v ? 1 : 0;
    }
    return v;
  }
  function andExpr() { let v = cmp(); while (peek() === "&&") { take(); const r = cmp(); v = v && r ? 1 : 0; } return v; }

  const v = orExpr();
  if (i < toks.length) throw new Error("式の後ろに余分な記号があります：" + src);
  return v;

// 数字の表示：3桁カンマ、小数は6桁まで（末尾の0は省く）
function formatVaryNumber(x, mod) {
  let v = Math.round(x * 1e6) / 1e6;
  if (mod === "%") v = Math.round(v * 100 * 1e6) / 1e6;
  const neg = v < 0;
  const a = Math.abs(v);
  const fixed = mod === "f1" ? 1 : mod === "f2" ? 2 : null;
  let [ip, fp] = (fixed !== null ? (Math.round(a * Math.pow(10, fixed) + 1e-9) / Math.pow(10, fixed)).toFixed(fixed) : (Math.round(a * 1e6) / 1e6).toString()).split(".");

  return neg ? (mod === "▲" ? "▲" : "−") + body : body;
}
// 内側の {式} から順に置き換える（{?条件|…{式}…|…} のように、切り替える文の中にも数字を書けるようにするため）
function renderVaryText(text, env) {
  let out = text;
  for (let pass = 0; pass < 4 && /\{[^{}]+\}/.test(out); pass++) out = renderVaryOnce(out, env);
  return out;
}
function renderVaryOnce(text, env) {
  return text.replace(/\{([^{}]+)\}/g, (_, body) => {
    if (body.charAt(0) === "?") {

      return evalExpr(parts[0], env) ? parts[1] : parts[2];

    const m = body.match(/^(.*?)(?::(%|▲|±|raw|f1|f2))?$/);

// vary の数字を選んで、ふつうの問題（数字の入った問題）を1つ作る。rng を渡さないと基準の数字で作る
function instantiate(q, rng) {

  const names = Object.keys(vary.vars || {});
  const pickVars = (useBase) => {
    const env = {};
    names.forEach((n) => {
      const d = vary.vars[n];
      if (useBase) { env[n] = d[0]; return; }
      const steps = Math.floor((d[2] - d[1]) / d[3] + 1e-9);
      env[n] = Math.round((d[1] + d[3] * Math.floor(rng() * (steps + 1))) * 1e6) / 1e6;

    if (Array.isArray(q.input)) {
      r.input = q.input.map((p) => {

// vary の書き方の点検（基準の数字で作れるか、式が読めるか、範囲の指定が正しいか）
function varyProblems(q) {

  Object.keys(v.vars).forEach((n) => {
    const d = v.vars[n];
    if (!Array.isArray(d) || d.length !== 4 || !d.every((x) => typeof x === "number" && Number.isFinite(x)) || d[3] <= 0 || d[1] > d[2] || d[0] < d[1] || d[0] > d[2]) {
