    else if (op === "-") r = s.acc - (s.acc * v) / 100;
    else r = v / 100;
    if (!setResult(r)) return;
    s.op = null;
    s.acc = null;
    s.lastOp = null;
    s.justEq = true;
    s.ready = false;
    s.showGT = false;
    if (op) addGT(op);
  }

  // +/−：表示中の数の符号を反転
  function negate() {
    if (s.entry !== null) {
      if (Number(s.entry) === 0) return;
      s.entry = s.entry.startsWith("-") ? s.entry.slice(1) : "-" + s.entry;
    } else {
      s.value = calcClean(-s.value);
      s.ready = true;
    }
    s.showGT = false;
  }

  // 税込・税抜：表示中の数に (1＋税率) を掛ける・割る
  function tax(include) {
    const v = current();
    if (!setResult(include ? v * (1 + taxRate) : v / (1 + taxRate))) return;
    s.ready = true;
    s.justEq = false;
    s.showGT = false;
  }

  function press(key) {
    const isClear = key === "C" || key === "CCE" || key === "CA";
    if (s.error && !isClear) return; // エラー中は C・CE と CA 以外を受け付けない
    const wasCe = s.ceDone;
    s.ceDone = false;
    if (/^(\d|00)$/.test(key)) digit(key);
    else if (key === ".") dot();
    else if (key === "+" || key === "-" || key === "*" || key === "/") operator(key);
    else if (key === "=") equals();
    else if (key === "sqrt") sqrt();
    else if (key === "back") back();
    else if (key === "C" || key === "CCE") { s.ceDone = wasCe; clearEntryOrAll(); }
    else if (key === "CA") allClear();
    else if (key === "%") percent();
    else if (key === "neg") negate();
    else if (key === "taxin") tax(true);
    else if (key === "taxout") tax(false);
    else if (key === "GT") grandTotal();
    else if (key === "MC" || key === "CM") s.memory = 0;
    else if (key === "MR" || key === "RM") memoryRecall();
    else if (key === "M+") memoryAdd(1);
    else if (key === "M-") memoryAdd(-1);
  }

  function view() {
    let text;
    if (s.error) text = "E";
    else if (s.entry !== null) text = calcGroup(s.entry);
    else text = calcGroup(calcPlain(s.value));
    return { text, error: s.error, memory: s.memory !== 0, gt: s.gt !== 0, op: s.op };
  }

  return { press, view, taxRate };
}
</script>

<script id="quiz-ui">
// ============================================================================
// 画面の描画。原則さわらないでください（見た目の色は CONFIG.theme、文言は CONFIG で変えられます）。
// ============================================================================
(() => {
  "use strict";

  const app = document.getElementById("app");
  const LETTERS = ["ア", "イ", "ウ", "エ", "オ", "カ"];
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 画面を切り替えたときに、いちばん上へ戻す。
  // iPad・iPhoneのSafariでは、解説へのなめらかなスクロールや指で弾いたスクロールの「惰性」が残っていると、
  // 1回の window.scrollTo(0, 0) が打ち消されて、次の問題がスクロールされた位置から始まることがある。
  // そこで、すぐに1回、描画の直後と少し後にも念のため戻す（その間に受験者が画面を触ったら、それ以上は戻さない）
  let scrollResetTimers = [];
  function scrollTopNow() {
    const el = document.scrollingElement || document.documentElement;
    el.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
    window.scrollTo(0, 0);
  }
  function resetScroll() {
    scrollResetTimers.forEach(clearTimeout);
    let touched = false;
    const stop = () => { touched = true; };
    const opts = { passive: true, capture: true };
    const kinds = ["touchstart", "wheel", "keydown", "pointerdown"];
    scrollTopNow();
    kinds.forEach((t) => window.addEventListener(t, stop, opts));
    const again = () => { if (!touched && (window.scrollY || 0) !== 0) scrollTopNow(); };
    requestAnimationFrame(again);
    scrollResetTimers = [120, 350, 700].map((ms) => setTimeout(again, ms));
    scrollResetTimers.push(setTimeout(() => kinds.forEach((t) => window.removeEventListener(t, stop, opts)), 750));
  }
  const loadErrors = window.__loadErrors || [];

  // 小さなDOM生成ヘルパ。文字は必ず textNode 経由なので、問題文にHTMLが混じっても実行されません。
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of children.flat(Infinity)) { // 入れ子の配列（[仕訳の欄の配列, 数値の欄の配列] など）もそのまま並べる
      if (c === null || c === undefined || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  // ---- 起動：データの読み込み確認 ----
  if (typeof CONFIG === "undefined" || typeof QUESTIONS === "undefined") {
    app.replaceChildren(
      h("main", { class: "main center" },
        h("section", { class: "diag err" },
          h("strong", null, "問題データを読み込めませんでした"),
          h("ul", null,
            h("li", null, "id=\"quiz-data\" のブロックで、カンマ「,」・引用符「\"」「`」・括弧の閉じ忘れがないか確認してください。"),
            loadErrors.map((m) => h("li", null, "エラー内容：" + m))))));
    return;
  }

  const checked = checkConfig(CONFIG);
  const cfg = checked.config;
  // 画面を横にしたとき、出題画面を横幅いっぱいまで広げる（CSSの #app.wide-scratch.on-quiz。on-quiz は出題画面の間だけ付ける）
  if (cfg.scratchpad.wideInLandscape) {
    app.classList.add("wide-scratch");
    app.style.setProperty("--wide-max", cfg.scratchpad.landscapeMaxWidth + "px");
    // 横向き（幅600px以上）か、幅 wideMinWidth 以上なら広げる。回転・ウィンドウの大きさの変更にも追従する
    const wideMQ = window.matchMedia ? ["(min-width: 600px) and (orientation: landscape)", "(min-width: " + cfg.scratchpad.wideMinWidth + "px)"].map((q) => window.matchMedia(q)) : [];
    const applyWide = () => {
      const on = wideMQ.some((m) => m.matches);
      if (app.classList.contains("wide-on") === on) return;
      app.classList.toggle("wide-on", on);
      // 下書き欄の幅が変わるので、画面の大きさの変更として扱い直す（下書き欄の画素数の合わせ直しなど。resize の後に change が届く端末があるため）
      requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
    };
    wideMQ.forEach((m) => { if (m.addEventListener) m.addEventListener("change", applyWide); else if (m.addListener) m.addListener(applyWide); });
    applyWide();
  }
  const data = validateQuestions(QUESTIONS, Object.keys(cfg.categoryColors), cfg.topics.map((t) => t.name));
  const pool = data.valid;

  document.title = cfg.appTitle;
  // CONFIG.theme はライトモードだけに適用する（ダーク時は CSS の @media (prefers-color-scheme: dark) を優先させるため、
  // documentElement に直接 style を当てず、ライトモード限定の <style> を挿入する）
  const themeKeys = Object.keys(cfg.theme);
  if (themeKeys.length) {
    const cssVars = themeKeys.map((k) => "--" + k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase()) + ":" + cfg.theme[k] + ";").join("");
    const themeStyle = document.createElement("style");
    // 「システムがライトのとき」に加えて「手動でライトを選んだとき」にも適用する（手動でダークを選んでいる間は除く）
    themeStyle.textContent =
      "@media (prefers-color-scheme: light), (prefers-color-scheme: no-preference) { :root:not([data-theme=\"dark\"]) {" + cssVars + "} }" +
      " :root[data-theme=\"light\"] {" + cssVars + "}";
    document.head.appendChild(themeStyle);
  }

  const state = { screen: "start", items: [], index: 0, selected: null, answered: false, records: [], prevIds: [], calcOpen: cfg.calculator.startOpen, scratchOpen: false, topic: null, kind: null };
  // 自動試験（tests/ui_test.js）用：表示中の問題（数字を選んだ後・言い換えた後の形）を読み出せるようにする。画面の動作には使わない
  window.__quizDebug = { current: () => { const it = state.items[state.index]; return it ? it.q : null; } };
  let view = null; // 出題画面の要素への参照

  // ---- 表示用の小さな関数 ----
  // 区分のバッジ：CONFIG.categoryColors の "solid"／"outline" をクラスに、色コードなら地の色にする
  function badgeKind(category) {
    const c = cfg.categoryColors[category];
    return c === "solid" || c === "outline" ? c : "";
  }
  function badgeStyle(category) {
    const c = cfg.categoryColors[category];
    return typeof c === "string" && c.startsWith("#") ? "background:" + c + ";color:#fff" : null;
  }

  // 短い2択（〇×）は横並びの大きなボタンにする
  function isCompact(item) {
    return item.order.length === 2 && item.order.every((i) => item.q.options[i].length <= 12);
  }

  function optionLabel(item, pos) {
    const text = item.q.options[item.order[pos]];
    return isCompact(item) ? text : LETTERS[pos] + "　" + text;
  }

  // 解説：行頭の【…】を太字にし、空行は小さな余白にする
  function rich(text) {
    return text.split("\n").map((line) => {
      if (line.trim() === "") return h("div", { class: "gap" });
      const m = line.match(/^(【[^】]*】)(.*)$/);
      return m ? h("p", { class: "line" }, h("strong", null, m[1]), m[2]) : h("p", { class: "line" }, line);
    });
  }

  // 解説の表示。新しい型（【結論】【なぜ】【手順】【つまずき】【実務】）は、【結論】を先頭に出し、残りは見出しで開閉できるようにする。
  //   【なぜ】【手順】は最初から開く。【つまずき】は間違えたときだけ開く。【実務】は閉じておく。それ以外の書き方（【考え方】など）は従来どおり
  // ---- 解説の図（SVG）。色は CSS の変数で、ライト・ダークの両方に合わせる ----
  const SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, ...children) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, String(v));
    for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    return el;
  }
  const dgW = 280; // 図の座標の幅（画面では横幅いっぱいに縮尺。スマホで文字が小さくなりすぎない幅）
  const dgFmt = (n) => (n < 0 ? "−" : "") + formatNumber(Math.round(Math.abs(n) * 100) / 100);
  const dgTextW = (t, size) => String(t).split("").reduce((w, ch) => w + (/[ -~]/.test(ch) ? 0.62 : 1) * size, 0); // 文字幅の目安（少し大きめに見積もる）
  function diagramT(d) {
    const sum = (rows) => rows.reduce((a, r) => a + r.n, 0);
    const dr = d.dr.map((r) => ({ l: r.l, n: r.n })), cr = d.cr.map((r) => ({ l: r.l, n: r.n }));
    const diff = Math.round((sum(dr) - sum(cr)) * 1e6) / 1e6;
    if (d.bal && diff !== 0) (diff > 0 ? cr : dr).push({ l: d.bal, n: Math.abs(diff), hl: true });
    const rows = Math.max(dr.length, cr.length), rh = 24, top = 34, mid = dgW / 2;
    const H = top + rows * rh + 30;
    // 科目名が長いときは、金額と重ならないよう文字を小さくする（最小9）
    const side = (list, x0) => list.map((r, i) => {
      const y = top + i * rh + 16;
      const amt = dgFmt(r.n), room = mid - 30 - dgTextW(amt, 12.5);
      const size = Math.max(9, Math.min(12, room / Math.max(1, dgTextW(r.l, 1))));
      return sv("g", { class: r.hl ? "dg-hl" : "" },
        r.hl ? sv("rect", { x: x0 + 2, y: y - 15, width: mid - 8, height: 21, rx: 3, class: "dg-hlbg" }) : null,
        sv("text", { x: x0 + 6, y, class: "dg-t", "font-size": size }, r.l),
        sv("text", { x: x0 + mid - 8, y, class: "dg-t dg-num", "text-anchor": "end" }, amt));
    });
    const total = Math.max(sum(dr), sum(cr));
    return sv("svg", { viewBox: "0 0 " + dgW + " " + H, class: "dg", role: "img", "aria-label": d.title + "勘定の図" },
      sv("text", { x: mid, y: 18, class: "dg-title", "text-anchor": "middle" }, d.title),
      sv("text", { x: 8, y: 18, class: "dg-s" }, "借方"), sv("text", { x: dgW - 8, y: 18, class: "dg-s", "text-anchor": "end" }, "貸方"),
      sv("line", { x1: 0, y1: 24, x2: dgW, y2: 24, class: "dg-line" }),
      sv("line", { x1: mid, y1: 24, x2: mid, y2: H - 6, class: "dg-line" }),
      side(dr, 0), side(cr, mid),
      d.bal ? [sv("line", { x1: 0, y1: H - 26, x2: dgW, y2: H - 26, class: "dg-thin" }),
        sv("text", { x: mid - 10, y: H - 10, class: "dg-t dg-num", "text-anchor": "end" }, dgFmt(total)),
        sv("text", { x: dgW - 10, y: H - 10, class: "dg-t dg-num", "text-anchor": "end" }, dgFmt(total))] : null);
  }
  function diagramBar(d) {
    const max = Math.max(...d.rows.map((r) => r.segs.reduce((a, g) => a + g.n, 0))) || 1;
    const bw = dgW - 4, bh = 26;
    let y = 0;
    const parts = [];
    d.rows.forEach((row) => {
      y += 16;
      parts.push(sv("text", { x: 2, y, class: "dg-s" }, row.label));
      y += 6;
      let x = 2;
      const legend = [];
      row.segs.forEach((g) => {
        const w = g.n / max * bw;
        parts.push(sv("rect", { x, y, width: Math.max(w, 1), height: bh, class: "dg-seg dg-" + (g.c || "b") }));
        const lab = g.l + " " + dgFmt(g.n);
        if (dgTextW(lab, 11.5) + 8 < w) parts.push(sv("text", { x: x + w / 2, y: y + 17, class: "dg-in", "text-anchor": "middle" }, lab));
        else legend.push(g);
        x += w;
      });
      y += bh;
      // 帯の中に書き切れない区切りは、下に凡例で
      let lx = 2;
      if (legend.length) y += 16;
      legend.forEach((g) => {
        const lab = g.l + " " + dgFmt(g.n), lw = dgTextW(lab, 11.5) + 22;
        if (lx + lw > dgW && lx > 2) { lx = 2; y += 16; }
        parts.push(sv("rect", { x: lx, y: y - 9, width: 10, height: 10, class: "dg-" + (g.c || "b") }), sv("text", { x: lx + 14, y, class: "dg-s" }, lab));
        lx += lw;
      });
      y += 6;
    });
    return sv("svg", { viewBox: "0 0 " + dgW + " " + (y + 4), class: "dg", role: "img", "aria-label": "金額の内訳の図" }, parts);
  }
  function diagramBox(d) {
    const n = d.cols.length, gap = 10, cw = (dgW - gap * (n - 1)) / n, bh = 30;
    const H = 24 + Math.max(...d.cols.map((c) => c.boxes.length)) * (bh + 4) + 4;
    return sv("svg", { viewBox: "0 0 " + dgW + " " + H, class: "dg", role: "img", "aria-label": "区分の図" },
      d.cols.map((c, i) => {
        const x = i * (cw + gap);
        return sv("g", null,
          sv("text", { x: x + cw / 2, y: 15, class: "dg-s dg-b", "text-anchor": "middle" }, c.title),
          c.boxes.map((b, k) => {
            const y = 22 + k * (bh + 4);
            const size = Math.min(12, (cw - 10) / Math.max(1, dgTextW(b.l, 1)));
            return sv("g", null,
              sv("rect", { x: x + 1, y, width: cw - 2, height: bh, rx: 4, class: b.hl ? "dg-boxhl" : "dg-box" }),
              sv("text", { x: x + cw / 2, y: y + bh / 2 + size * 0.36, class: "dg-t" + (b.hl ? " dg-b" : ""), "text-anchor": "middle", "font-size": size }, b.l));
          }));
      }));
  }
  function diagramTime(d) {
    const n = d.points.length, max = Math.max(...d.points.map((p) => Math.abs(p.n))) || 1;
    const H = 170, axis = 85, step = (dgW - 40) / (n - 1);
    return sv("svg", { viewBox: "0 0 " + dgW + " " + H, class: "dg", role: "img", "aria-label": "お金の出入りの時間軸の図" },
      sv("line", { x1: 10, y1: axis, x2: dgW - 6, y2: axis, class: "dg-line" }),
      d.points.map((p, i) => {
        const x = 20 + i * step, len = Math.max(8, Math.abs(p.n) / max * 55), up = p.n >= 0;
        const y2 = up ? axis - len : axis + len;
        return sv("g", null,
          sv("line", { x1: x, y1: axis, x2: x, y2, class: up ? "dg-arrow dg-up" : "dg-arrow dg-down" }),
          sv("path", { d: up ? `M${x - 5},${y2 + 6} L${x},${y2} L${x + 5},${y2 + 6}` : `M${x - 5},${y2 - 6} L${x},${y2} L${x + 5},${y2 - 6}`, class: up ? "dg-arrow dg-up" : "dg-arrow dg-down" }),
          sv("text", { x, y: up ? y2 - 5 : y2 + 14, class: "dg-s dg-num", "text-anchor": "middle" }, dgFmt(p.n)),
          sv("text", { x, y: up ? axis + 15 : axis - 6, class: "dg-s", "text-anchor": "middle" }, p.t));
      }));
  }
  function diagram(text) {
    try {
      const d = parseDiagram(text);
      const el = d.type === "T" ? diagramT(d) : d.type === "bar" ? diagramBar(d) : d.type === "box" ? diagramBox(d) : diagramTime(d);
      return h("figure", { class: "dg-wrap" }, el, d.caption ? h("figcaption", null, d.caption) : null);
    } catch (e) {
      return null; // 図が描けなくても、解説の文はそのまま出す
    }
  }

  // 新しい型の本文：「ひとことで：」の行は目立たせ、「・たとえ：」「・だから：」のような短い見出しは太字にする。「図：{…}」の行は図にする
  function richV2(text) {
    return text.split("\n").map((line) => {
      if (line.trim() === "") return h("div", { class: "gap" });
      const dm = line.match(DIAGRAM_LINE);
      if (dm) return diagram(dm[1]);
      let m = line.match(/^ひとことで：(.*)$/);
      if (m) return h("p", { class: "line ex-key" }, h("strong", null, "ひとことで："), m[1]);
      m = line.match(/^・([^：＝、。（]{1,10})：(.*)$/);
      if (m) return h("p", { class: "line" }, "・", h("strong", { class: "ex-label" }, m[1] + "："), m[2]);
      return h("p", { class: "line" }, line);
    });
  }
  const EXPLAIN_OPEN = { "【なぜ】": () => true, "【手順】": () => true, "【つまずき】": (wrong) => wrong, "【実務】": () => false };
  function explainSection(text, wrong) {
    if (!/^【結論】/m.test(text)) return h("section", { class: "explain" }, h("h3", null, "解説"), rich(text));
    const parts = [];
    text.split("\n").forEach((line) => {
      const m = line.match(/^(【[^】]*】)(.*)$/);
      if (m) parts.push({ head: m[1], lines: m[2].trim() ? [m[2]] : [] });
      else if (parts.length) parts[parts.length - 1].lines.push(line);
      else parts.push({ head: "", lines: [line] });
    });
    return h("section", { class: "explain v2" }, h("h3", null, "解説"),
      parts.map((p) => {
        const body = richV2(p.lines.join("\n").replace(/^\n+|\n+$/g, ""));
        if (p.head === "【結論】" || !p.head) return h("div", { class: "ex-conclusion" }, p.head ? h("strong", null, "結論　") : null, body);
        const open = EXPLAIN_OPEN[p.head] ? EXPLAIN_OPEN[p.head](wrong) : true;
        return h("details", Object.assign({ class: "ex-part" }, open ? { open: "" } : {}),
          h("summary", null, p.head.replace(/[【】]/g, "")), h("div", { class: "ex-body" }, body));
      }));
  }

  // ---- スタート画面 ----
  function diagnostics() {
    const errs = [];
    loadErrors.forEach((m) => errs.push("読み込みエラー：" + m));
    checked.problems.forEach((m) => errs.push("設定：" + m));
    data.problems.forEach((p) => errs.push(p.label + "：" + p.messages.join(" / ")));
    const lines = errs.concat(data.warnings.map((w) => "注意：" + w));
    if (!lines.length) return null;
    console.warn("[quiz] データチェックの指摘\n" + lines.join("\n"));
    const shown = lines.slice(0, 8);
    return h("section", { class: "diag" + (errs.length ? " err" : "") },
      h("strong", null, errs.length ? "データチェック：" + errs.length + "件の不備があります（不備のある問題は出題されません）" : "データチェック：確認してください"),
      h("ul", null, shown.map((t) => h("li", null, t))),
      lines.length > shown.length ? h("p", null, "…ほか" + (lines.length - shown.length) + "件（全件はブラウザのコンソールに出力しています）") : null);
  }

  // ---- 表示（自動・ライト・ダーク）：選んだ結果は端末に保存。「自動」は端末の設定に合わせる ----
  const THEME_KEY = "boki1_quiz_theme";
  function currentThemeMode() {
    const t = document.documentElement.getAttribute("data-theme");
    return t === "light" || t === "dark" ? t : "auto";
  }
  function setThemeMode(mode) {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);

  // キーの反応（電卓とテンキーで共通）：click ではなく pointer イベントで受け付ける。
  //   ・前のキーから指を離す前に次のキーを押しても、どちらも確実に入力される（iPhoneでは click が取りこぼされることがある）
  //   ・押した瞬間に見た目を変え、指を離した時点で入力する（指を滑らせてスクロールしたときは入力しない）
  //   ・キーボードで Enter／スペースを押したとき（click だけが届く）も入力できるよう、click も受ける
  //   ・iPadなど幅600px以上の画面（指・ペン）では、触れた瞬間に入力する。キーの上ではスクロールしない（CSSの touch-action: none）ので、
  //     指がわずかに動いてスクロールと判定され入力が消える、ということが起きない。スマホでは電卓の上でもスクロールできるよう、従来どおり離した時点で入力する
  const pressOnDown = (e) => e.pointerType !== "mouse" && !!window.matchMedia && window.matchMedia("(min-width: 600px)").matches;
  function bindPress(btn, fn) {
    const downs = new Map(); // pointerId → 押した位置（触れた瞬間に入力した場合は null）
    let lastPointerPress = 0;
    const release = (id) => { downs.delete(id); if (downs.size === 0) btn.classList.remove("pressing"); };
    btn.addEventListener("pointerdown", (e) => {
      if (e.button > 0) return;
      btn.classList.add("pressing");
      if (pressOnDown(e)) {
        if (e.cancelable) e.preventDefault();
        downs.set(e.pointerId, null);
        lastPointerPress = Date.now();
        fn();
        return;
      }
      downs.set(e.pointerId, [e.clientX, e.clientY]);
    });
    btn.addEventListener("pointerup", (e) => {
      const at = downs.get(e.pointerId);
      release(e.pointerId);
      if (!at) return;
      const r = btn.getBoundingClientRect();
      const inside = e.clientX >= r.left - 8 && e.clientX <= r.right + 8 && e.clientY >= r.top - 8 && e.clientY <= r.bottom + 8;
      if (!inside || Math.hypot(e.clientX - at[0], e.clientY - at[1]) > 24) return; // 指を大きく滑らせたときは入力しない
      lastPointerPress = Date.now();
      fn();
    });
    btn.addEventListener("pointercancel", (e) => release(e.pointerId)); // スクロールが始まったときなど
    btn.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") release(e.pointerId); });
    btn.addEventListener("click", () => {
      if (Date.now() - lastPointerPress < 700) return; // すでに pointer で入力済み（同じ操作の click は無視）
      fn();
    });

  }

  // Apple Pencil の「手書き入力（スクリブル）」対策：スクリブルがオンだと、回答欄の近くでペンが触れるたびに
  // 「手書きの文字か」の判定が入り、キーの素早い連続タップが取りこぼされる（iPad Pro＋Apple Pencil で確認）。
  // キーの集まり（電卓・テンキー）の上では、ペン（touchType が "stylus"）のタッチの既定の動作を止めてスクリブルに渡さない。
  // 入力そのものは pointer イベント（bindPress）で受けているので影響しない。指のタッチ（スマホでのスクロールなど）はこれまでどおり
  const isStylus = (e) => Array.prototype.some.call(e.changedTouches || [], (t) => t.touchType === "stylus");

    const stop = (e) => { if (e.cancelable && isStylus(e)) e.preventDefault(); };

  // そこで端末のキーボードは出さず（inputmode="none"）、回答欄の下に数字キーを出す。外付けキーボードからの入力はそのまま使える。
  // キーを押すと入力欄の文字を書き換えて input イベントを送るので、カンマの自動挿入など入力欄の処理はキーボード入力と同じものが動く。
  const numpadWanted = () => cfg.numpad === "always" ||
    (cfg.numpad === "touch" && ((navigator.maxTouchPoints || 0) > 0 || (!!window.matchMedia && window.matchMedia("(any-pointer: coarse)").matches)));
  // ---- 回答欄への入力（テンキーと電卓の「回答入力」「回答欄へ」で共通） ----
  // 「どの入力欄に入れるか」とカーソル位置を覚えておき、キー1つ分ずつ入力欄の文字を書き換える
  let answerTarget = null; // 表示中の記述式の問題の入力先（4択・〇×では null）
  function createAnswerTarget(fields) {
    let active = 0;
    const sel = fields.map(() => null); // 入力欄から離れたときのカーソル位置
    let setActive = (i) => {
      active = i;
      fields.forEach((f, k) => f.inp.classList.toggle("np-target", k === i));
    };
    fields.forEach((f, i) => {
      f.inp.addEventListener("focus", () => {
        setActive(i);
        // 欄を触って選んだときは、カーソルを末尾に置く（右寄せの欄の左側を触ると先頭に入ってしまうため）。選んだ後に触り直せば途中にも置ける
        setTimeout(() => { if (document.activeElement === f.inp) { const n = f.inp.value.length; try { f.inp.setSelectionRange(n, n); } catch (e) { /* 無視 */ } } }, 0);
      });
      f.inp.addEventListener("blur", () => { sel[i] = [f.inp.selectionStart, f.inp.selectionEnd]; });
    });
    function type(key) {
      if (state.answered) return;
      const inp = fields[active].inp;
      if (key === "next") {
        setActive((active + 1) % fields.length);
        fields[active].inp.focus({ preventScroll: true });
        return;
      }
      const v = inp.value;
      let a = v.length, b = v.length;
      const saved = document.activeElement === inp ? [inp.selectionStart, inp.selectionEnd] : sel[active];
      if (saved && saved[0] !== null && saved[1] !== null) { a = Math.min(saved[0], v.length); b = Math.min(saved[1], v.length); }
      let nv, caret;
      if (key === "neg" && !fields[active].signed) return; // △は符号付きの欄だけで効く（税引後CFなど、プラスで答える欄では無視）
      if (key === "neg") { // 先頭のマイナスを付ける・外す（カーソル位置は数字に対して保つ）
        if (v.charAt(0) === "-") { nv = v.slice(1); caret = Math.max(0, a - 1); }
        else { nv = "-" + v; caret = a + 1; }
      } else if (key === "bs") {
        if (a === b) { if (a === 0) return; a -= 1; }
        nv = v.slice(0, a) + v.slice(b); caret = a;
      } else if (key === "clr") {
        if (!v) return;
        nv = ""; caret = 0;
      } else {
        nv = v.slice(0, a) + key + v.slice(b); caret = a + key.length;
      }
      inp.value = nv;
      try { inp.setSelectionRange(caret, caret); } catch (e) { /* 対応していない環境では無視 */ }
      inp.dispatchEvent(new InputEvent("input", { bubbles: true, inputType: key === "bs" || key === "clr" ? "deleteContentBackward" : "insertText" }));

    function set(value) {
      if (state.answered) return false;

      inp.value = value;
      try { inp.setSelectionRange(value.length, value.length); } catch (e) { /* 無視 */ }

      inp.classList.remove("flash"); void inp.offsetWidth; inp.classList.add("flash"); // 入ったことが分かるよう一瞬光らせる
      return true;
    }

    const listeners = [];
    fields.forEach((f) => f.inp.addEventListener("input", () => listeners.forEach((fn) => fn())));
    const baseSetActive = setActive;
    setActive = (i) => { baseSetActive(i); listeners.forEach((fn) => fn()); };
    setActive(0);
    return {
      type, set, multi: fields.length > 1,
      signed: fields.some((f) => f.signed), // 符号付きの欄があればテンキーに「△」キーを出す
      value: () => fields[active].inp.value,
      label: () => fields.length > 1 ? (fields[active].label || "欄" + (active + 1)) : "",
      onChange: (fn) => listeners.push(fn),
    };
  }

  function buildNumpad(target) {
    const type = target.type;

    const defs = [["7"], ["8"], ["9"], ["4"], ["5"], ["6"], ["1"], ["2"], ["3"], ["0"], ["00"], [".", "．", "", "小数点", "dot"],
      ["bs", "⌫", "fn", "1文字消す", "bs"], ["clr", "クリア", "fn", "この欄を全部消す", "clr"],
      ...(multi ? [["next", "次の欄", "fn", "次の入力欄へ", "nx"]] : []),
      ...(target.signed ? [["neg", "△", "fn sg", "マイナス（△）を付ける・外す", "neg"]] : [])];
    const keys = defs.map(([key, label, kind, aria, area]) => {
      const btn = h("button", { type: "button", class: "nk " + (kind || ""), "aria-label": aria || key, tabindex: "-1", style: "grid-area:" + (area || "k" + key) }, label || key);
      btn.addEventListener("mousedown", (e) => e.preventDefault()); // 押しても入力欄からカーソルが外れないように
      bindPress(btn, () => type(key));
      return btn;
    });
    return blockScribble(h("div", { class: "numpad " + (multi ? "multi" : "single") + (target.signed ? " sg" : ""), role: "group", "aria-label": "テンキー" }, keys));
  }

  function buildCalculator() {
    const calc = createCalculator(cfg.calculator);
    const flagM = h("span", { class: "flag" }, "M");
    const flagGT = h("span", { class: "flag" }, "GT");
    const flagOp = h("span", { class: "flag" }, "");
    const screen = h("div", { class: "calc-num" }, "0");

    function sync() {
      const v = calc.view();
      screen.textContent = v.text;
      screen.classList.toggle("long", v.text.length > 13);
      screen.classList.toggle("err", v.error);
      flagM.classList.toggle("on", v.memory);
      flagGT.classList.toggle("on", v.gt);
      flagOp.textContent = v.op ? CALC_OP_MARK[v.op] : "";
    }
    // 記述式の問題では、電卓を2通りに使える（GTの右の空き段にボタンを置く）
    //   ・「電卓」モード … ふつうの電卓
    //   ・「回答入力」モード … 数字・00・小数点・→（1文字消す）・C·CE／CA（欄を消す）のキーで、回答欄に入力する。計算のキーは使えない
    //   ・「回答欄へ」… 電卓に表示中の数字を、選んでいる回答欄にそのまま入れる（転記）
    const target = answerTarget;
    let mode = "calc";
    const INPUT_KEYS = { back: "bs", CCE: "clr", CA: "clr", neg: "neg" };
    function press(key) {
      if (mode === "input" && target) {
        const k = /^[0-9]$/.test(key) || key === "00" || key === "." ? key : INPUT_KEYS[key];
        if (k) target.type(k);
        return;
      }
      calc.press(key);
      sync();
    }
    function transfer() {
      if (!target) return;
      const v = calc.view();
      if (v.error) return;
      target.set(v.text.replace(/,/g, ""));
    }

    const keys = CALC_KEYS.map((def) => {
      if (def === null) return h("span", { class: "ck-gap", "aria-hidden": "true" });
      const [key, label, kind] = def;
      const usable = /^[0-9]$/.test(key) || key === "00" || key === "." || key in INPUT_KEYS;
      const btn = h("button", {
        type: "button", class: "ck " + kind + (usable ? " inp-ok" : ""), "aria-label": CALC_LABELS[key] || label, title: CALC_LABELS[key] || null,
      }, label);
      bindPress(btn, () => press(key));
      return btn;
    });
    let modeBtns = null;
    const flagMode = h("span", { class: "flag mode-flag" }, "");
    // 回答入力モードの間は、表示部に「回答欄の中身」を出す（スマホでは回答欄が電卓の下に隠れるため）。電卓に戻すと計算中の数字が戻る
    function showMode() {
      if (mode !== "input") { sync(); return; }
      const t = target.value();
      screen.textContent = t || "0";
      screen.classList.toggle("long", t.length > 13);
      screen.classList.remove("err");
      const lb = target.label();
      flagMode.textContent = "回答入力中" + (lb ? "：" + lb : "");
    }
    function setMode(m) {
      mode = m;
      panel.classList.toggle("input-mode", m === "input");
      modeBtns.forEach(([v, b]) => b.setAttribute("aria-pressed", String(v === m)));
      if (m !== "input") flagMode.textContent = "";
      showMode();
    }
    if (target) {
      modeBtns = [["calc", "電卓", "電卓として使う"], ["input", "入力", "電卓のキーで回答欄に入力する"]].map(([v, label, aria]) => {
        const b = h("button", { type: "button", class: "mode-btn", "aria-pressed": String(v === "calc"), "aria-label": aria }, label);
        bindPress(b, () => setMode(v));
        return [v, b];
      });
      const seg = h("div", { class: "ck-mode", role: "group", "aria-label": "電卓の使い方" }, modeBtns.map(([, b]) => b));
      const xfer = h("button", { type: "button", class: "ck fn xfer", "aria-label": "表示中の数字を回答欄へ入れる" }, "回答欄へ");
      bindPress(xfer, transfer);
      target.onChange(() => { if (mode === "input") showMode(); });
      keys.splice(1, 4, seg, xfer); // GTの右の空き4マスを、モード切替（2マス）と「回答欄へ」（2マス）に使う
    }

    const panel = h("div", { class: "calc", tabindex: "-1", role: "group", "aria-label": "電卓", hidden: !state.calcOpen },
      h("div", { class: "calc-display" }, h("div", { class: "calc-flags" }, flagM, flagGT, flagMode, flagOp), screen),
      blockScribble(h("div", { class: "calc-keys" }, keys)),
      h("p", { class: "calc-hint" }, "PC：数字・+ − * /・%・Enter（＝）・Backspace（一桁取消）・Delete（C・CE）が使えます。"));

    panel.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const key = /^[0-9]$/.test(e.key) ? e.key : CALC_KEYBOARD[e.key];
      if (!key) return;
      e.preventDefault(); // フォーカス中のボタンが Enter で押されるのを防ぐ
      press(key);
    });

    const toggle = h("button", { type: "button", class: "calc-toggle", "aria-expanded": String(state.calcOpen) });
    function paintToggle() {
      toggle.textContent = state.calcOpen ? "電卓を閉じる　▴" : "電卓を開く　▾";
      toggle.setAttribute("aria-expanded", String(state.calcOpen));
      panel.hidden = !state.calcOpen;
    }
    toggle.addEventListener("click", () => {
      state.calcOpen = !state.calcOpen;
      paintToggle();
      if (state.calcOpen) {
        panel.focus({ preventScroll: true }); // PCでは、そのまま数字キーで入力できる
        panel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
      }
    });
    paintToggle();
    sync();
    return { toggle, panel };
  }

  // ---- 下書き欄（手書き。ペン・消しゴム・1つ戻す・全消去。問題ごとに白紙に戻る） ----
  // 線は「点の列」として覚えておき、ライト/ダークの切り替えや画面サイズの変更のたびに描き直す
  let activeScratch = null; // 表示中の下書き欄（描き直し用）
  function buildScratch() {
    const strokes = [];
    let mode = "pen", cur = null, penSeen = false;
    // 2本指で動かす（フリーボードのように）。view は「書いた内容を画面上でどれだけずらして見せているか」（CSSピクセル）
    const view = { x: 0, y: 0 };
    const touches = new Map(); // 画面に触れている指（pointerId → [x, y]）
    let pan = null;            // 2本指で動かしている最中の情報
    let panLock = false;       // 動かし終わって指が残っている間は、線を引かない
    let dpr = 1;
    const canvas = h("canvas", { class: "scratch-canvas", role: "img", "aria-label": "下書き欄（指やペンで書けます）" });
    const g = canvas.getContext("2d");
    const ink = () => getComputedStyle(document.documentElement).getPropertyValue("--text").trim() || "#1c1712";

    function setup(st) {
      g.globalCompositeOperation = st.mode === "eraser" ? "destination-out" : "source-over";
      g.strokeStyle = g.fillStyle = ink();
      g.lineWidth = st.w;
      g.lineCap = "round";
      g.lineJoin = "round";
    }
    function drawDot(st, pt) { setup(st); g.beginPath(); g.arc(pt[0], pt[1], st.w / 2, 0, Math.PI * 2); g.fill(); }
    function drawSeg(st, a, b) { setup(st); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    function drawStroke(st) {
      drawDot(st, st.pts[0]);
      for (let i = 1; i < st.pts.length; i++) drawSeg(st, st.pts[i - 1], st.pts[i]);
    }
    // 画面の解像度とずらし量を、描画の座標変換にまとめて反映する（方眼も同じだけずらす）
    function applyView() {
      g.setTransform(dpr, 0, 0, dpr, view.x * dpr, view.y * dpr);
      canvas.style.backgroundPosition = view.x + "px " + view.y + "px";
      homeBtn.hidden = !view.x && !view.y;
    }
    function redraw() {
      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, canvas.width, canvas.height);
      g.restore();
      applyView();
      strokes.forEach(drawStroke);
      g.globalCompositeOperation = "source-over";
    }
    // キャンバスの画素数を、表示サイズ×画面の解像度に合わせる（Retinaでも線がにじまないように）
    function fit() {
      dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth, ht = canvas.clientHeight;
      if (!w || !ht) return;
      const W = Math.round(w * dpr), H = Math.round(ht * dpr);
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
      redraw();
    }
    // 書いた内容の座標（ずらし量を差し引く）。線はこの座標で覚えるので、動かしても形は変わらない
    const at = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left - view.x, e.clientY - r.top - view.y]; };
    const mid = () => { const [a, b] = [...touches.values()]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };

    canvas.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch") {
        touches.set(e.pointerId, [e.clientX, e.clientY]);
        if (touches.size >= 2 || panLock) {
          e.preventDefault();
          try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 未対応のブラウザでは無視 */ }
          if (cur && cur.pen) return; // ペンで書いている最中は、手のひらが触れても動かさない
          if (touches.size === 2 && !pan) {
            // 1本目の指で線を書き始めていたら：置いてすぐなら「2本指の操作」とみなして取り消し、しばらく書いた後なら線として残す
            if (cur) {
              if (performance.now() - cur.t0 < 300) { strokes.splice(strokes.indexOf(cur), 1); }
              cur = null;
              redraw();
              paintTools();
            }
            pan = { m: mid(), x: view.x, y: view.y };
            panLock = true;
          }
          return;
        }
      }
      if (e.pointerType === "pen") penSeen = true;
      else if (e.pointerType === "touch" && penSeen) return; // ペンを使い始めたら、手のひらが触れても線を引かない
      if (e.button > 0 || cur) return;
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 未対応のブラウザでは無視 */ }
      cur = { mode, w: mode === "eraser" ? 22 : (e.pointerType === "pen" ? 2.2 : 2.6), pts: [at(e)], id: e.pointerId, pen: e.pointerType === "pen", t0: performance.now() };
      strokes.push(cur);
      drawDot(cur, cur.pts[0]);
      paintTools();
    });
    canvas.addEventListener("pointermove", (e) => {
      if (touches.has(e.pointerId)) touches.set(e.pointerId, [e.clientX, e.clientY]);
      if (pan && touches.size >= 2) {
        e.preventDefault();
        const m = mid();
        view.x = Math.round(pan.x + m[0] - pan.m[0]);
        view.y = Math.round(pan.y + m[1] - pan.m[1]);
        redraw();
        return;
      }
      if (!cur || e.pointerId !== cur.id) return;
      e.preventDefault();
      const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      list.forEach((ev) => {
        const pt = at(ev);
        drawSeg(cur, cur.pts[cur.pts.length - 1], pt);
        cur.pts.push(pt);
      });
    });
    const end = (e) => {
      if (cur && e.pointerId === cur.id) cur = null;
      touches.delete(e.pointerId);
      if (touches.size < 2) pan = null;        // 2本指の片方を離したら動かすのをやめる
      if (touches.size === 0) panLock = false; // 指が全部離れたら、また線を引けるようにする
    };
    // iPhone・iPadでは、指やペンを置いたまま止めると「長押し」と判定され、文字の選択・拡大ルーペ・メニューが出ることがある。
    // タッチ操作の既定の動作を止めて、下書き欄の上では線を書くことだけに使う
    const stopDefault = (e) => { if (e.cancelable) e.preventDefault(); };
    canvas.addEventListener("touchstart", stopDefault, { passive: false });
    canvas.addEventListener("touchmove", stopDefault, { passive: false });
    canvas.addEventListener("touchend", stopDefault, { passive: false });
    canvas.addEventListener("contextmenu", stopDefault);
    canvas.addEventListener("selectstart", stopDefault);
    canvas.addEventListener("dragstart", stopDefault);
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end);

    const toolBtn = (label, aria, onclick) => h("button", { type: "button", class: "st", "aria-label": aria, onclick }, label);
    const penBtn = toolBtn("ペン", "ペン", () => { mode = "pen"; paintTools(); });
    const eraserBtn = toolBtn("消しゴム", "消しゴム", () => { mode = "eraser"; paintTools(); });
    const undoBtn = toolBtn("戻す", "1つ戻す", () => { if (cur) return; strokes.pop(); redraw(); paintTools(); });
    const clearBtn = toolBtn("全消去", "下書きを全部消す", () => { if (cur) return; strokes.length = 0; redraw(); paintTools(); });
    const homeBtn = h("button", { type: "button", class: "scratch-home", hidden: true, onclick: () => { view.x = 0; view.y = 0; redraw(); } }, "元の位置へ");
    function paintTools() {
      penBtn.setAttribute("aria-pressed", String(mode === "pen"));
      eraserBtn.setAttribute("aria-pressed", String(mode === "eraser"));
      undoBtn.disabled = strokes.length === 0;
      clearBtn.disabled = strokes.length === 0;
    }

    const panel = h("div", { class: "scratch", role: "group", "aria-label": "下書き", hidden: !state.scratchOpen },
      h("div", { class: "scratch-tools" }, penBtn, eraserBtn, undoBtn, clearBtn),
      h("div", { class: "scratch-board" }, canvas, homeBtn),
      h("p", { class: "scratch-hint" }, "指やペンで書けます。2本指でなぞると下書き欄を動かせます。下書き欄の外を触ると画面をスクロールできます。次の問題では白紙に戻ります。"));

    const toggle = h("button", { type: "button", class: "scratch-toggle", "aria-expanded": String(state.scratchOpen) });
    function paintToggle() {
      toggle.textContent = state.scratchOpen ? "下書きを閉じる　▴" : "下書きを開く　▾";
      toggle.setAttribute("aria-expanded", String(state.scratchOpen));
      panel.hidden = !state.scratchOpen;
    }
    toggle.addEventListener("click", () => {
      state.scratchOpen = !state.scratchOpen;
      paintToggle();
      if (state.scratchOpen) {
        requestAnimationFrame(fit); // 表示されてから大きさが決まるので、次の描画タイミングで合わせる
        panel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
      }
    });
    paintToggle();
    paintTools();
    activeScratch = { fit, redraw, strokes };
    return { toggle, panel };
  }
  // 画面サイズの変更・ライト/ダークの切り替えで、表示中の下書き欄を描き直す（登録は1回だけ）
  window.addEventListener("resize", () => { if (activeScratch) activeScratch.fit(); });
  new MutationObserver(() => { if (activeScratch) activeScratch.redraw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onScheme = () => { if (activeScratch) activeScratch.redraw(); };
    if (mq.addEventListener) mq.addEventListener("change", onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }

  // ---- 出題画面 ----
  // 山札（一巡するまで同じ問題を出さない）は端末に保存する。保存できない環境では、開いている間だけ有効
  // 「計算問題だけ」「理論問題だけ」はそれぞれ別の山札（boki1_quiz_deck_calc／_theory）を持つ
  const DECK_KEY = "boki1_quiz_deck";
  const memDeck = {};
  function loadDeck(kind) {
    const key = DECK_KEY + (kind ? "_" + kind : "");
    try { const t = localStorage.getItem(key); if (t) return JSON.parse(t); } catch (e) { /* 読めなければ作り直す */ }
    return memDeck[key] || null;
  }
  function saveDeck(d, kind) {
    const key = DECK_KEY + (kind ? "_" + kind : "");
    memDeck[key] = d;
    try { localStorage.setItem(key, JSON.stringify(d)); } catch (e) { /* 保存できない環境では、開いている間だけ有効 */ }
  }
  // ---- 解答の記録（進み具合のバー）・途中の小テスト・論点別の前回分：いずれも端末に保存。保存できない環境では開いている間だけ ----
  //   boki1_quiz_history     … { v:1, q:{ 問題id: [解いた回数, 正解回数, 直近が正解なら1] } }
  //   boki1_quiz_session     … 途中の小テスト（出題した問題とそれまでの回答）。結果画面を出したら消す
  //   boki1_quiz_topic_prev  … 論点別テストで前回出した問題id（次回は避ける）
  const HISTORY_KEY = "boki1_quiz_history";
  const SESSION_KEY = "boki1_quiz_session";
  const TOPIC_PREV_KEY = "boki1_quiz_topic_prev";
  const memStore = {};
  function loadJSON(key) {
    try { const t = localStorage.getItem(key); if (t) return JSON.parse(t); if (t === null && !(key in memStore)) return null; } catch (e) { /* 読めなければ開いている間の値 */ }
    return key in memStore ? memStore[key] : null;
  }
  function saveJSON(key, v) {
    memStore[key] = v;
    try { if (v === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* 保存できない環境では、開いている間だけ */ }
  }
  function loadHistory() {
    const hs = loadJSON(HISTORY_KEY);
    return hs && hs.q && typeof hs.q === "object" ? hs : { v: 1, q: {} };
  }
  function recordAnswer(id, correct) {
    const hs = loadHistory();
    const r = Array.isArray(hs.q[id]) ? hs.q[id] : [0, 0, 0];
    r[0] += 1;
    if (correct) r[1] += 1;
    r[2] = correct ? 1 : 0;
    hs.q[id] = r;
    saveJSON(HISTORY_KEY, hs);
  }
  // 問題の集まり qs について：n＝問題数、done＝1回以上解いた問題数、ok＝そのうち直近の回答が正解の問題数
  function progressOf(qs, hs) {
    let done = 0, ok = 0;
    qs.forEach((q) => { const r = hs.q[q.id]; if (Array.isArray(r) && r[0] > 0) { done++; if (r[2] === 1) ok++; } });
    return { n: qs.length, done, ok };
  }
  function saveSession() {
    if (state.items.length === 0 || state.records.length >= state.items.length) { saveJSON(SESSION_KEY, null); return; }
    saveJSON(SESSION_KEY, {
      v: 1, topic: state.topic, kind: state.kind, items: state.items, savedAt: Date.now(),
      records: state.records.map((r) => { const o = Object.assign({}, r); delete o.item; return o; }),
    });
  }
  function loadSession() {
    const s = loadJSON(SESSION_KEY);
    if (!s || s.v !== 1 || !Array.isArray(s.items) || !Array.isArray(s.records) || s.items.length === 0 || s.records.length >= s.items.length) return null;
    const ids = new Set(pool.map((q) => q.id));
    // 問題を差し替えた版に更新した後など、今の問題集にない問題が含まれていれば使わない
    const okItem = (it) => it && it.q && ids.has(it.q.id) && Array.isArray(it.order) && Number.isInteger(it.correctPos);
    return s.items.every(okItem) ? s : null;
  }
  function resumeSession(s) {
    state.topic = typeof s.topic === "string" ? s.topic : null;
    state.kind = KINDS[s.kind] ? s.kind : null;
    state.items = s.items;
    state.records = s.records.map((r, i) => Object.assign({}, r, { item: s.items[i] }));
    state.prevIds = s.items.map((it) => it.q.id);
    state.index = state.records.length;
    renderQuiz();
  }

  const topicPool = (name) => pool.filter((q) => Array.isArray(q.topics) && q.topics.includes(name));
  // 出題の種類：計算問題＝記述式（数値を入力する問題）、理論問題＝4択・〇×
  // 出題のしぼり込み：計算問題だけ・理論問題だけ、と CONFIG.categoryGroups の区分のまとまり（商業簿記・会計学だけ など）。それぞれに山札を持つ
  const KINDS = { calc: { label: "計算問題", test: (q) => isWritten(q) }, theory: { label: "理論問題", test: (q) => !isWritten(q) } };
  cfg.categoryGroups.forEach((g) => { KINDS[g.key] = { label: g.label, test: (q) => g.categories.includes(q.category), group: true }; });
  const kindPool = (kind) => pool.filter(KINDS[kind].test);

  // topic を渡すと論点別（その論点から cfg.topicQuizSize 問）、渡さないと通常の出題（山札から cfg.quizSize 問）
  // kind（"calc"／"theory"）を渡すと、計算問題だけ・理論問題だけの山札から cfg.quizSize 問
  function startQuiz(topic, kind) {
    const prev = loadSession();
    if (prev && prev.records.length > 0 && !window.confirm("途中の小テスト（" + prev.records.length + "問解答済み）は破棄されます。新しく始めますか？")) return;
    const t = typeof topic === "string" ? topic : null;
    const k = !t && KINDS[kind] ? kind : null;
    state.topic = t;
    state.kind = k;
    let picked;
    if (k) {
      const kp = kindPool(k);
      if (kp.length === 0) return;
      const r = dealFromDeck(loadDeck(k), kp.map((q) => q.id), cfg.quizSize, Math.random);
      saveDeck(r.deck, k);
      const byId = new Map(kp.map((q) => [q.id, q]));
      picked = shuffle(r.ids.map((id) => byId.get(id)), Math.random);
    } else if (t) {
      const tp = topicPool(t);
      if (tp.length === 0) return;
      const tprev = loadJSON(TOPIC_PREV_KEY) || {};
      picked = pickQuestions(tp, cfg.topicQuizSize, Array.isArray(tprev[t]) ? tprev[t] : [], Math.random);
      tprev[t] = picked.map((q) => q.id);
      saveJSON(TOPIC_PREV_KEY, tprev);
    } else {
      if (pool.length === 0) return;
      const r = dealFromDeck(loadDeck(), pool.map((q) => q.id), cfg.quizSize, Math.random);
      saveDeck(r.deck);
      const byId = new Map(pool.map((q) => [q.id, q]));
      picked = shuffle(r.ids.map((id) => byId.get(id)), Math.random);
    }
    state.items = picked.map((q) => buildItem(q, cfg.shuffleOptions, Math.random, { oxRate: cfg.theoryOxRate }));
    state.prevIds = picked.map((q) => q.id);
    state.index = 0;
    state.records = [];
    saveSession();
    renderQuiz();
  }

  // 問題文の下に「下書き」「電卓」の開閉ボタンを横に並べ、開いたパネルをその下に出す。
  // 下書き欄は、問題文を見ながら書き写しやすいよう、電卓より上（問題文の直下）に置く
  let toolsSync = null; // 表示中の問題の「下書きと電卓の並べ方」を決め直す関数

  // 記述式で電卓を開いている間は、回答用のテンキーを隠す（電卓の「回答入力」「回答欄へ」で入力できるため。キーパッドを1つにする）
  function syncNumpad() {
    if (!view || !view.numpad) return;
    const hide = state.answered || state.calcOpen;
    view.numpad.hidden = hide;
    view.numpad.parentNode.classList.toggle("np-closed", hide);
    if (view.inputHint && !state.answered) {
      view.inputHint.textContent = state.calcOpen
        ? "電卓を「入力」に切り替えると、電卓のキーで答えを入力できます。「回答欄へ」で電卓の数字をそのまま入れることもできます"
        : view.hintText;
    }
  }

  function buildTools() {
    const calc = cfg.calculator.enabled ? buildCalculator() : null;
    const scratch = cfg.scratchpad.enabled ? buildScratch() : null;
    if (!calc && !scratch) return null;
    // 下書き欄と電卓を両方開いたときは、iPadなど幅600px以上の画面で横に並べる（CSSの .tool-panels.both）
    const panels = h("div", { class: "tool-panels" }, scratch ? scratch.panel : null, calc ? calc.panel : null);
    toolsSync = null;
    if (calc) calc.toggle.addEventListener("click", syncNumpad);
    if (scratch) {
      // both＝両方開いている（横に並べる）、solo-scratch＝下書き欄だけ開いている（横向きの画面では横幅いっぱいに広げる）
      const sync = () => {
        const sOpen = !scratch.panel.hidden, cOpen = !!calc && !calc.panel.hidden;
        const both = sOpen && cOpen, solo = sOpen && !cOpen;
        if (panels.classList.contains("both") === both && panels.classList.contains("solo-scratch") === solo) return;
        panels.classList.toggle("both", both);
        panels.classList.toggle("solo-scratch", solo);
        requestAnimationFrame(() => { if (activeScratch) activeScratch.fit(); }); // 下書き欄の幅が変わるので描き直す
      };
      toolsSync = sync;
      // 開閉ボタンの処理（各パネルの hidden の切り替え）が済んだ後に並べ方を決める
      scratch.toggle.addEventListener("click", sync);
      if (calc) calc.toggle.addEventListener("click", sync);
      sync();
    }
    return h("div", { class: "calc-wrap" },
      h("div", { class: "tool-toggles" + (calc && scratch ? " two" : "") }, scratch ? scratch.toggle : null, calc ? calc.toggle : null),
      panels);
  }

  // 出題の途中でトップに戻る。途中の状態は保存してあり、トップの「続きから解く」で再開できる
  function goHome() {
    renderStart();
  }

  function renderQuiz() {
    state.screen = "quiz";
    app.classList.add("on-quiz");
    state.selected = null;
    state.answered = false;
    state.calcOpen = cfg.calculator.startOpen; // 電卓は、各問題を「閉じた状態」で始める（前の問題で開いていても引き継がない）
    state.scratchOpen = false;                  // 下書き欄も、各問題を閉じた・白紙の状態で始める
    activeScratch = null;
    const item = state.items[state.index];
    const q = item.q;
    const total = state.items.length;
    const compact = isCompact(item);
    // 計算問題は、iPad・PCなどでは下書き欄と電卓を開いた状態で始める（CONFIG.openToolsForCalc）
    if (cfg.openToolsForCalc && Array.isArray(q.input) && window.matchMedia && window.matchMedia("(min-width: 600px)").matches) {
      state.calcOpen = true;
      state.scratchOpen = true;
    }

    const steps = state.items.map((_, i) => {
      const rec = state.records[i];
      const cls = i === state.index ? "now" : rec ? (rec.correct ? "ok" : "ng") : "";
      return h("span", { class: "step " + cls });
    });

    const isInput = Array.isArray(q.input);
    const options = isInput ? [] : item.order.map((origIdx, pos) =>
      h("button", { type: "button", class: "opt", role: "radio", "aria-checked": "false", onclick: () => selectOption(pos) },
        compact ? null : h("span", { class: "mark" }, LETTERS[pos]),
        h("span", { class: "opt-text" }, q.options[origIdx])));

    // 記述式：数値の入力欄（必要なら2択も）。単位は入力欄の右に固定表示
    let fields = [];
    let jblocks = [], jfields = [];
    const isJournal = isInput && !!q.journal;
    const useNumpad = isInput && numpadWanted();
    // 金額の入力欄（カンマの自動挿入・IME・Enter で回答）。onValue に入力中の文字列を渡す
    const numInput = (id, aria, onValue, extraClass) => {
      const inp = h("input", {
        id, type: "text", inputmode: useNumpad ? "none" : "decimal", autocomplete: "off", spellcheck: "false", class: "num-input" + (extraClass ? " " + extraClass : ""),
        "aria-label": aria,
      });
      let composing = false, prevVal = "";
      const commit = (backspace) => {
        if (cfg.autoComma) {
          const r = formatAmountTyping(inp.value, inp.selectionStart, prevVal, backspace);
          if (r.value !== inp.value) {
            inp.value = r.value;
            try { inp.setSelectionRange(r.caret, r.caret); } catch (e) { /* 対応していない環境では無視 */ }
          }
        }
        prevVal = inp.value;
        inp.classList.toggle("long", inp.value.length > 9); // 桁が多いときは文字を小さくして、欄に収める
        onValue(inp.value);
        updateReady();
      };
      inp.addEventListener("compositionstart", () => { composing = true; });
      inp.addEventListener("compositionend", () => { composing = false; commit(false); });
      inp.addEventListener("input", (e) => {
        if (composing || e.isComposing) { onValue(inp.value); updateReady(); return; }
        commit(e.inputType === "deleteContentBackward");
      });
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); if (!view.action.disabled) onAction(); }
      });
      return inp;
    };
    // 仕訳の入力欄：仕訳ごとに「借方」「貸方」の行（勘定科目の選択＋金額）。行数は正解の行数より1行多く（最低2行、最大5行）
    if (isJournal) {
      state.jres = q.journal.entries.map(() => ({ dr: [], cr: [] }));
      jblocks = q.journal.entries.map((e, k) => {
        const n = Math.min(5, Math.max(2, Math.max(e.dr.length, e.cr.length) + 1));
        const sideEl = (sd) => {
          const nm = sd === "dr" ? "借方" : "貸方";
          const rows = [];
          for (let r = 0; r < n; r++) {
            const cell = { account: "", raw: "" };
            state.jres[k][sd].push(cell);
            const sel = h("select", { class: "je-acc", "aria-label": (e.label || "仕訳" + (k + 1)) + "の" + nm + (r + 1) + "行目の勘定科目" },
              h("option", { value: "" }, "（科目）"), q.journal.accounts.map((a) => h("option", { value: a }, a)));
            sel.addEventListener("change", () => { cell.account = sel.value; updateReady(); });
            const inp = numInput("je" + k + sd + r, (e.label || "仕訳" + (k + 1)) + "の" + nm + (r + 1) + "行目の金額", (v) => { cell.raw = v; }, "je-amt");
            jfields.push({ inp, label: (e.label ? e.label.replace(/\s.*$/, "") + " " : "") + nm + (r + 1), signed: false, sel });
            rows.push(h("div", { class: "je-row" }, sel, inp));
          }
          return h("div", { class: "je-side " + sd }, h("p", { class: "je-head" }, nm), rows);
        };
        const el = h("div", { class: "field je" },
          h("p", { class: "field-label" }, e.label || (q.journal.entries.length > 1 ? "仕訳" + (k + 1) : "仕訳")),
          h("div", { class: "je-grid" }, sideEl("dr"), sideEl("cr")));
        return { el };
      });
    }
    if (isInput) {
      state.responses = q.input.map(() => ({ raw: "", choice: null }));
      fields = q.input.map((p, i) => {
        const id = "ans" + i;
        const inp = numInput(id, (p.label || "答え") + (p.unit ? "（単位：" + p.unit + "）" : ""), (v) => { state.responses[i].raw = v; });
        const chips = p.choice ? p.choice.map((c, ci) =>
          h("button", { type: "button", class: "opt", role: "radio", "aria-checked": "false", onclick: () => selectChoice(i, ci + 1) },
            h("span", { class: "opt-text" }, c))) : [];
        const el = h("div", { class: "field" },
          p.label ? h("label", { class: "field-label", for: id }, p.label) : null,
          p.signed ? h("p", { class: "field-note" }, useNumpad ? "マイナスのときは「△」キーで符号を付けます" : "マイナスのときは「-」（または△）を付けて入力します") : null,
          h("div", { class: "num-row" }, inp, p.unit ? h("span", { class: "unit" }, p.unit) : null),
          p.choice ? h("div", { class: "options ox chips", role: "radiogroup", "aria-label": (p.label || "答え") + "の判断" }, chips) : null);
        return { el, inp, chips, label: p.label || "", signed: p.signed === true };
      });
    }

    answerTarget = isInput ? createAnswerTarget(jfields.concat(fields)) : null; // 電卓（このあと作る）からも使う。仕訳の金額欄が先
    const hintText = isJournal
      ? (useNumpad ? "勘定科目を選び、金額はテンキーで入力してください（不要な行は空けたままで構いません）" : "勘定科目を選び、金額を入力してください（不要な行は空けたままで構いません）")
      : (useNumpad ? "テンキーで答えの数値を入力してください（カンマは自動で入ります）" : "答えの数値を入力してください（カンマはあってもなくても構いません）");
    let inputHint = null;
    const numpad = useNumpad ? buildNumpad(answerTarget) : null;
    const slot = h("div", { class: "slot", "aria-live": "polite" });
    const action = h("button", { type: "button", class: "btn", disabled: true, onclick: onAction }, "回答");
    const root = h("section", { class: "card" },
      h("p", { class: "q" }, q.question),
      buildTools(),
      isInput
        ? h("div", { class: "answer-input" + (isJournal ? " has-journal" : "") },
          inputHint = h("p", { class: "input-hint" }, hintText),
          numpad
            ? h("div", { class: "answer-body np-" + numpadSide() + (isJournal ? " has-journal" : "") }, h("div", { class: "answer-fields" }, jblocks.map((b) => b.el), fields.map((f) => f.el)), numpad)
            : [jblocks.map((b) => b.el), fields.map((f) => f.el)])
        : h("div", { class: "options" + (compact ? " ox" : ""), role: "radiogroup", "aria-label": "選択肢" }, options),
      slot);

    view = { root, options, slot, action, steps, fields, jblocks, jfields, isInput, isJournal, numpad, inputHint, hintText };
    syncNumpad();
    app.replaceChildren(
      h("header", { class: "top" },
        h("div", { class: "top-row" },
          h("button", { type: "button", class: "home-btn", "aria-label": "トップに戻る", onclick: goHome }, "‹ トップ"),
          h("span", { class: "count" }, state.topic || state.kind ? h("span", { class: "count-topic" }, state.topic || KINDS[state.kind].label) : null, "第" + (state.index + 1) + "問 / " + total + "問"),
          h("span", { class: "badges" },
            q.level === "hard" ? h("span", { class: "badge hard", title: "難問（2〜4段階の計算）", "aria-label": "難問" }, "難") : null,
            h("span", { class: "badge " + badgeKind(q.category), style: badgeStyle(q.category) }, q.category))),
        h("div", { class: "steps", role: "progressbar", "aria-label": "進捗", "aria-valuemin": 1, "aria-valuemax": total, "aria-valuenow": state.index + 1 }, steps)),
      h("main", { class: "main" }, root),
      h("div", { class: "actions" }, action));
    const topBar = app.querySelector(".top");
    if (topBar) document.documentElement.style.setProperty("--top-h", topBar.offsetHeight + "px");
    if (toolsSync) toolsSync(); // 画面に置いた後で、下書きと電卓の並べ方（横並びかどうか）を決め直す
    resetScroll();
    requestAnimationFrame(() => { if (activeScratch) activeScratch.fit(); }); // 最初から開いている下書き欄の大きさを合わせる
  }

  function selectOption(pos) {
    if (state.answered) return;
    state.selected = pos;
    view.options.forEach((el, i) => el.setAttribute("aria-checked", String(i === pos)));
    view.action.disabled = false;
    view.action.focus({ preventScroll: true }); // PCでは Enter でそのまま回答できる
  }

  function selectChoice(i, c) {
    if (state.answered) return;
    state.responses[i].choice = c;
    view.fields[i].chips.forEach((el, ci) => el.setAttribute("aria-checked", String(ci + 1 === c)));
    updateReady();
  }

  // すべての入力欄に数値が入り、2択も選ばれていれば「回答」を押せる
  function updateReady() {
    const q = state.items[state.index].q;
    view.action.disabled = !(q.input.every((p, i) =>
      parseAnswerNumber(state.responses[i].raw) !== null && (!p.choice || state.responses[i].choice !== null)) &&
      (!q.journal || journalReady(q, state.jres)));
  }

  function onAction() {
    if (state.answered) next();
    else if (view.isInput) submitInput();
    else submit();
  }

  function submitInput() {
    if (state.answered || view.action.disabled) return;
    const item = state.items[state.index];
    const q = item.q;
    const responses = state.responses.map((r) => ({ raw: r.raw, choice: r.choice }));
    const jres = q.journal ? state.jres.map((e) => ({ dr: e.dr.map((c) => Object.assign({}, c)), cr: e.cr.map((c) => Object.assign({}, c)) })) : undefined;
    const res = gradeInput(q, responses, jres);
    state.answered = true;
    state.records.push({ item, correct: res.correct, responses, jres, yourText: inputResponseText(q, responses, jres) });
    recordAnswer(q.id, res.correct);
    saveSession();

    view.root.classList.add("locked");
    if (view.numpad) { view.numpad.hidden = true; view.numpad.parentNode.classList.add("np-closed"); } // 回答後はテンキーを閉じ、回答欄を横いっぱいに戻す
    view.fields.forEach((f, i) => {
      f.inp.readOnly = true;
      f.inp.classList.remove("np-target");
      f.inp.classList.add(res.parts[i].numOk ? "is-correct" : "is-wrong");
      const p = q.input[i];
      f.chips.forEach((el, ci) => {
        if (ci + 1 === p.choiceAnswer) { el.classList.add("is-correct"); el.append(h("span", { class: "tag" }, "正解")); }
        else if (ci + 1 === responses[i].choice) { el.classList.add("is-wrong"); el.append(h("span", { class: "tag" }, "あなたの回答")); }
      });
    });
    view.jfields.forEach((f) => { f.inp.readOnly = true; f.inp.classList.remove("np-target"); f.sel.disabled = true; });
    view.jblocks.forEach((b, k) => b.el.classList.add(res.jparts[k].ok ? "is-correct" : "is-wrong"));
    view.steps[state.index].className = "step " + (res.correct ? "ok" : "ng");

    const notes = [];
    if (!res.correct) {
      notes.push(h("p", { class: "ans ng" }, "あなたの回答：" + inputResponseText(q, responses, jres)));
      if (res.numbersRightChoiceWrong) notes.push(h("p", { class: "hint-line" }, "数値は合っています。有利・不利や採否などの判断を確認してください。"));
      else if (res.pattern) notes.push(h("p", { class: "hint-line" }, "入力した数値は、よくある誤りの答え「" + res.pattern + "」と同じです。解説の【つまずき】を確認してください。"));
    }
    view.slot.append(
      h("p", { class: "verdict " + (res.correct ? "ok" : "ng") },
        res.correct ? "✓ 正解です" : "✗ 不正解です　正解：" + inputAnswerText(q)),
      ...notes,
      explainSection(q.explanation, !res.correct));

    view.action.textContent = state.index + 1 < state.items.length ? "次へ" : "結果を見る";
    view.action.focus({ preventScroll: true });
    view.slot.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }

  function submit() {
    if (state.answered || state.selected === null) return;
    const item = state.items[state.index];
    const pos = state.selected;
    const correct = pos === item.correctPos;
    state.answered = true;
    state.records.push({ item, pickedPos: pos, correct });
    recordAnswer(item.q.id, correct);
    saveSession();

    view.root.classList.add("locked");
    view.options.forEach((el, i) => {
      const mark = el.querySelector(".mark");
      if (i === item.correctPos) {
        el.classList.add("is-correct");
        el.append(h("span", { class: "tag" }, "正解"));
        if (mark) mark.textContent = "✓";
      } else if (i === pos) {
        el.classList.add("is-wrong");
        el.append(h("span", { class: "tag" }, "あなたの回答"));
        if (mark) mark.textContent = "✗";
      }
    });
    view.steps[state.index].className = "step " + (correct ? "ok" : "ng");

    view.slot.append(
      h("p", { class: "verdict " + (correct ? "ok" : "ng") },
        correct ? "✓ 正解です" : "✗ 不正解です　正解：" + optionLabel(item, item.correctPos)),
      explainSection(item.q.explanation, !correct));

    view.action.textContent = state.index + 1 < state.items.length ? "次へ" : "結果を見る";
    view.slot.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }

  function next() {
    if (state.index + 1 < state.items.length) {
      state.index += 1;
      renderQuiz();
    } else {
      renderResult();
    }
  }

  // ---- 結果画面 ----
  function reviewList(wrong) {
    return h("section", { class: "review" },
      h("h2", null, "復習：間違えた問題（" + wrong.length + "問）"),
      wrong.map((r) => {
        const q = r.item.q;
        return h("details", { class: "rev" },
          h("summary", null,
            h("span", { class: "badge " + badgeKind(q.category), style: badgeStyle(q.category) }, q.category),
            h("span", { class: "sum-text" }, q.level === "hard" ? h("span", { class: "badge hard", "aria-label": "難問" }, "難") : null, q.level === "hard" ? " " : null, q.question)),
          h("div", { class: "rev-body" },
            h("p", { class: "q" }, q.question),
            h("p", { class: "ans ng" }, "あなたの回答：" + (q.input ? r.yourText : optionLabel(r.item, r.pickedPos))),
            h("p", { class: "ans ok" }, "正解：" + (q.input ? inputAnswerText(q) : optionLabel(r.item, r.item.correctPos))),
            explainSection(q.explanation, true)));
      }));
  }

  function renderResult() {
    state.screen = "result";
    app.classList.remove("on-quiz");
    view = null;
    saveJSON(SESSION_KEY, null); // 最後まで解いたので、途中の小テストとしては残さない
    const total = state.records.length;
    const correct = state.records.filter((r) => r.correct).length;
    const score = calcScore(correct, total);
    const grade = findGrade(cfg.grades, score);
    const wrong = state.records.filter((r) => !r.correct);

    app.replaceChildren(
      h("main", { class: "main center" },
        h("section", { class: "card" },
          h("div", { class: "scoreboard" },
            h("p", { class: "result-line" }, "正解数"),
            h("p", { class: "result-num" }, h("span", { class: "total" }, String(correct)), "/ " + total + "問")),
          h("p", { class: "score" }, "得点 " + score + "点（100点満点）"),
          h("h2", { class: "grade" }, grade.label),
          h("p", { class: "grade-msg" }, grade.message)),
        cfg.showReview ? (wrong.length ? reviewList(wrong) : h("p", { class: "hint" }, "間違えた問題はありません。")) : null),
      h("div", { class: "actions" },
        h("button", { type: "button", class: "btn", onclick: () => startQuiz(state.topic, state.kind) },
          state.topic ? "もう一度（「" + state.topic + "」から" + total + "問）"
            : state.kind ? "もう一度（" + KINDS[state.kind].label + "から別の" + total + "問）"
            : "もう一度チャレンジ（別の" + total + "問）"),
        h("button", { type: "button", class: "btn secondary", onclick: renderStart }, "トップに戻る")));
    resetScroll();
  }

  // PC用：数字キーで選択（Enter は、選択後にフォーカスが「回答」ボタンへ移るので標準動作で足りる）
  document.addEventListener("keydown", (e) => {
    if (state.screen !== "quiz" || state.answered || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target instanceof Element && e.target.closest(".calc")) return; // 電卓の操作中は、数字キーを電卓に渡す
    if (state.items[state.index].q.input) return; // 記述式の問題では、数字キーは入力欄で使う
    const n = Number(e.key);
    if (Number.isInteger(n) && n >= 1 && n <= state.items[state.index].order.length) selectOption(n - 1);
  });

  // 途中の小テストがあれば（再読み込み・開き直し）、その続きから始める
  const startSession = loadSession();
  if (startSession) resumeSession(startSession); else renderStart();
})();
</script>
</body>
</html>
